# Chipyard is a *reference platform* (ADR-0024 D1), not a v5 delivered
# component: it carries NO patch set (ADR-0024 "Chipyard does not enter the v5
# component patch set"). Its exact baseline is the pinned commit plus the
# submodule snapshot in manifests/chipyard-submodules.lock.toml (ADR-0024 D2).
[[component]]
name = "chipyard"
enabled = true
repository = "https://github.com/ucb-bar/chipyard.git"
commit = "0acc1e1de2d3284bcd4d876956932a013ffe1949"
shallow = true
shallow_ref = "1.14.0"
# Explicit "reference-only, no patch set" flag (ADR-0024 D1): it is what lets
# the gates accept the ABSENCE of patch_dir/patch_series for this component
# only. Declaring patch_dir/patch_series alongside it is rejected (no smuggling
# patches into a component the patch-tree gate skips).
patchless = true
role = "RTL SoC simulation (Verilator/RTL reference platform)"

[[component.source]]
name = "gitclone"
url = "https://gitclone.com/github.com/ucb-bar/chipyard"

[[component.source]]
name = "ghfast"
url = "https://ghfast.top/https://github.com/ucb-bar/chipyard"

# Linux kernel source — a *reference input* for M8's Linux user-space stack
# (ADR-0025 D2: no kernel target). It supplies the syscall number table that
# SPEC-138t pins against (asm-generic/unistd.h +
# arch/riscv/include/uapi/asm/unistd.h); v5 neither builds nor patches any of
# it, so it carries NO patch set (see `patchless` below, same class as
# chipyard / ADR-0024 D1).
#
# Source form: a git baseline (user ruling 2026-10-14), so any local change can
# always be turned into a diff/patch. The signed tarball in .cache/
# (linux-7.2.10.tar.xz, sha256 2feaa70453e91f541be6a5c9078d8168e081af45a3d971
# 8054850538cff2ebf3, plus .tar.sign) is kept as a *verification artefact* only
# and must never be used as the component source (a tarball cannot produce a
# git diff).
#
# `commit` is the commit that the annotated tag object `v7.2.10` peels to
# (`git rev-parse v7.2.10^{}`); the tag object itself
# (57eee103859fa039a1f2bf343c4453ef40661be8, what `git ls-remote` reports for
# refs/tags/v7.2.10) is NOT a commit and must not be recorded here — same
# convention as qemu, whose recorded commit is likewise the peeled commit and
# not its tag object.
[[component]]
name = "linux"
enabled = true
repository = "https://mirrors.tuna.tsinghua.edu.cn/git/linux-stable.git"
commit = "7b20d05fd38de8e0be168956f6fd241d750c7d69"
shallow = true
shallow_ref = "v7.2.10"
patchless = true
role = "Linux syscall numbering-table source (reference input; no v5 patch set)"

# Primary mirror = TUNA (user ruling 2026-10-14: TUNA 主). It is listed as an
# explicit source[0] -- not just via `repository` -- because
# tools/infra/fetch.py::select_source prefers source[0] over `repository` when
# a source list is present. The URL is identical to `repository` above.
[[component.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/git/linux-stable.git"

# Backup source.
[[component.source]]
name = "kernel-org"
url = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"

# LLVM test-suite — a *benchmark/baseline suite* input for M8 (user ruling
# 2026-10-14: source github.com/llvm/llvm-test-suite, tag 23.1.3). A reference
# input, not a v5-patched component, so it carries NO patch set (`patchless`,
# same class as chipyard ADR-0024 D1 / linux).
#
# Tag form (2026-10-14, `git cat-file -t`): `llvmorg-23.1.3` is an *annotated*
# tag (type = tag, PGP-signed); its tag object is
# 7fa03005193c4cc9b882e0b70f9f43a088c52033. The `commit` below is the commit it
# peels to (`git rev-parse 'llvmorg-23.1.3^{}'`) — a tag object is NOT a commit
# and must not be recorded here (same convention as qemu / linux).
#
# Version delta note: every `llvmorg-23.1.{0,1,2,3}` tag peels to the SAME
# commit 2919e551..., so the 23.1.3 tag yields exactly the tree of the 23.1.1
# tag; our llvm-project delta (built at `llvmorg-23.1.1`) causes no test-suite
# content delta.
#
# Mirror reality (2026-10-14): ghfast.top and gitclone.com answer `ls-remote`
# but both returned HTTP 504 on the ~294 MB single-tag packfile; direct github
# timed out (curl 124). gh-proxy.com completed the shallow bare clone
# (294 MB, 252 s) and is listed first so `make fetch` stays reproducible; the
# other two stay as backups.
[[component]]
name = "llvm-test-suite"
enabled = true
repository = "https://github.com/llvm/llvm-test-suite.git"
commit = "2919e55176a572ee085cb46b291c47b7092c363e"
shallow = true
shallow_ref = "llvmorg-23.1.3"
patchless = true
role = "LLVM test-suite 23.1.3 (benchmark/baseline input; External/ = SPEC, excluded; baseline run deferred until musl static/dynamic works)"

# Primary mirror = the channel that actually completed the packfile fetch
# (see the mirror-reality note above).
[[component.source]]
name = "gh-proxy"
url = "https://gh-proxy.com/https://github.com/llvm/llvm-test-suite.git"

# Backups: answer ls-remote but returned HTTP 504 on the shallow packfile.
[[component.source]]
name = "ghfast"
url = "https://ghfast.top/https://github.com/llvm/llvm-test-suite.git"

[[component.source]]
name = "gitclone"
url = "https://gitclone.com/github.com/llvm/llvm-test-suite.git"
