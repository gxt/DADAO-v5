# Chipyard is a *reference platform* (ADR-0024 D1), not a v5 delivered
# component: it carries NO patch set (ADR-0024 "Chipyard does not enter the v5
# component patch set"). Its exact baseline is the pinned commit plus the
# submodule snapshot in manifests/chipyard-submodules.lock.toml (ADR-0024 D2).
[[component]]
name = "chipyard"
enabled = true
repository = "https://github.com/ucb-bar/chipyard.git"
commit = "0acc1e1de2d3284bcd4d876956932a013ffe1949"
shallow = true
shallow_ref = "1.14.0"
# Explicit "reference-only, no patch set" flag (ADR-0024 D1): it is what lets
# the gates accept the ABSENCE of patch_dir/patch_series for this component
# only. Declaring patch_dir/patch_series alongside it is rejected (no smuggling
# patches into a component the patch-tree gate skips).
patchless = true
role = "RTL SoC simulation (Verilator/RTL reference platform)"

[[component.source]]
name = "gitclone"
url = "https://gitclone.com/github.com/ucb-bar/chipyard"

[[component.source]]
name = "ghfast"
url = "https://ghfast.top/https://github.com/ucb-bar/chipyard"

# Linux kernel source — a *signed-tarball reference input* for M8's Linux
# user-space stack (ADR-0025 D2: no kernel target). It supplies the syscall
# number table that SPEC-138t pins against (asm-generic/unistd.h +
# arch/riscv/include/uapi/asm/unistd.h); v5 neither builds nor patches any of
# it, so it carries NO patch set. Its reproducibility identity is the tarball
# sha256, NOT a git commit: user ruling 2026-10-14 chose the signed whole-package
# route (tarball + .tar.sign over TUNA) over base+patch.
# enabled = false: this schema's `enabled` means "a fetchable Git component with
# an exact 40-hex commit" (manifest_check.py). A tarball has no such commit, so
# the entry stays disabled until the gate learns a non-Git (tarball) kind; the
# `patchless = true` marker (same class as chipyard / ADR-0024 D1) is recorded
# now so the entry is already legal in that class.
[[component]]
name = "linux-kernel"
enabled = false
repository = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.10.tar.xz"
version = "7.2.10"
sha256 = "2feaa70453e91f541be6a5c9078d8168e081af45a3d9718054850538cff2ebf3"
patchless = true
role = "Linux syscall numbering-table source (reference input; no v5 patch set)"

[[component.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/kernel/v7.x/linux-7.2.10.tar.xz"

[[component.source]]
name = "kernel-org"
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.10.tar.xz"
