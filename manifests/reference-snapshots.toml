format = 1
captured_on = "2026-11-12"
policy = "reference-only; tarball snapshot, NO git history"

# 为什么用快照而不是 `references.lock.toml` 里的 git 镜像：
# 2026-11-12 实测，GitHub 的 git 协议（clone/fetch）在本机不可用——
#   `git clone --mirror` 超时（curl 56）；`--depth 1` 触发 "less than 1000 bytes/sec"；
# 而 codeload 的 tar.gz 走普通 HTTPS 正常（~1.4 MB/s）。
# 因此这两份参考材料以 tarball 快照保存：可读、可 grep，但**不能 git log/blame/diff 历史**。
# 需要历史版本时：另找网络时段做全量克隆，或走镜像（源需用户确认）。

[[snapshot]]
id = "riscv-unified-db"
path = ".cache/refs/riscv-unified-db"
upstream = "https://github.com/riscv/riscv-unified-db"
url = "https://codeload.github.com/riscv/riscv-unified-db/tar.gz/refs/heads/main"
commit = "176fc36018be56925061566447a656b93eba0ddb"
sha256 = "bdce73757213f62b160976ee84b91c72dd8c77232398d60c282c3e966d2d1b37"
reuse = "机器可读 ISA 数据与 IDL 的形态参考（数据模型 / operation 块 / 生成器矩阵 / resolved spec）；不复制数据、不复用其 RISC-V 专属结构"
key_files = [
  "doc/idl.adoc",                     # IDL 语言定义
  "doc/idl/idlc.md",                  # 编译器内部
  "spec/std/isa/inst/I/add.yaml",     # 一条指令的完整定义形态
  "spec/schemas",                     # 数据 schema
  "backends",                         # 生成器矩阵（doc / ISS / header / sverilog）
]

