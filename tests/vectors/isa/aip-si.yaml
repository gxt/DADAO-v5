  format: riii
  input_state: {}
  expected_state: null
  expected_pc: null
  expected_fault: null
  status: active
  spec_cite: "SimRISC-05 §IP 相对寻址"
  notes: "encoding: imms18=-1（补码 bits[17:0]=0x3FFFF，**有符号**）= −1 个 4 KiB 块（<<12 = −4096 字节）；汇编层写 `aip.si rb1, -4096`（字节）。word 订正记（QEMU-061t）：原为 0x5A04FFFF，其 bits[17:0]=0x0FFFF=+65535，与 notes 声明的 −1 不符（field 派生见 oracle）。"

