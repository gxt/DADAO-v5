  notes: "encoding: imms18=1（正数，bits[17:0]=0x00001）= 1 个 4 KiB 块（<<12 = +4096 字节）；汇编层按**字节**书写 ⇒ `aip.si rb1, 4096`（`imms30` = imms18 << 12）。"

