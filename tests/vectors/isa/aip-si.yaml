  notes: "encoding: rbha=rb63（bits[23:18]=0x3F）、imms18=+131071（bits[17:0]=0x1FFFF，s18 上界）——解码范围 [23:18]/[17:0] 逐字段核对；汇编层 = `aip.si rb63, 536866816`（字节，= 131071 << 12，±512 MiB 可达上界）。word 订正记（QEMU-061t）：原为 0x5AFCFFFF，其 bits[17:0]=0x0FFFF=+65535，与 notes 声明的 +131071 不符。"

