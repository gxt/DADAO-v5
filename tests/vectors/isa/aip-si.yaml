- class: legality
  encoding:
    word: "0x5A000000"
  mnemonic: aip.si
  id: aip.si_riii_rb
  format: riii
  input_state: {}
  expected_state: null
  expected_pc: null
  expected_fault: ILLI
  status: active
  spec_cite: "SimRISC-05 §IP 相对寻址; SimRISC-00 §基址寄存器"
  notes: "legality aip.si: rbha=rb0（bits[23:18]=0）→ ILLI（dst_rb0：rb0 读出为当前指令地址、只读，任何指令以其为显式目的即非法）。"

# ── Case 6: semantic——`imms18`=0 ⇒ `rb1` = IP = 该指令自身地址（关键：非 PC+4）──
- class: semantic
  encoding:
    word: "0x5A040000"
  mnemonic: aip.si
  id: aip.si_riii_rb
  format: riii
  input_state: {}
  expected_state:
    rb:
      rb1: "0xFC0000000000"
  expected_pc: null
  expected_fault: null
  status: active
  spec_cite: "SimRISC-05 §IP 相对寻址"
  notes: "semantic（独立 oracle）：input_state 空 ⇒ loader 0 字 ⇒ 指令地址 IP = BINARY_BASE = 0xFC00_0000_0000；imms18=0 ⇒ rb1 = IP + 0 = 0xFC0000000000（**IP = 自身地址**，非下一条/无 ±4；若按 0628 的 `PC+4` 口径得 0xFC0000000004 ⇒ FAIL）。汇编层写 `aip.si rb1, 0`。"

# ── Case 7: semantic——正块偏移（`<<12`，非 `<<2`）──
- class: semantic
  encoding:
    word: "0x5A040001"
  mnemonic: aip.si
  id: aip.si_riii_rb
  format: riii
  input_state: {}
  expected_state:
    rb:
      rb1: "0xFC0000001000"
  expected_pc: null
  expected_fault: null
  status: active
  spec_cite: "SimRISC-05 §IP 相对寻址"
  notes: "semantic（独立 oracle）：IP = BINARY_BASE（loader 空）；imms18=+1 ⇒ rb1 = 0xFC0000000000 + (1 << 12) = 0xFC0000001000（**<<12 = 4 KiB 块**；若误用 <<2 得 0xFC0000000004 ⇒ FAIL）。汇编层写 `aip.si rb1, 4096`。"

