# ── Case 9: semantic——IP 基准 = 该指令自身地址（指令不在 BINARY_BASE；关键鉴别）──
- class: semantic
  encoding:
    word: "0x5A040000"
  mnemonic: aip.si
  id: aip.si_riii_rb
  format: riii
  input_state:
    rb:
      rb2: "0x1"
  expected_state:
    rb:
      rb1: "0xFC0000000004"
  expected_pc: null
  expected_fault: null
  status: active
  spec_cite: "SimRISC-05 §IP 相对寻址"
  notes: "semantic（独立 oracle）：input_state 预置 `rb2 = 0x1` ⇒ loader 段 = 1 字（`set.zw rb2, wp0, 0x1`，其余 wyde 为 0 故不生成 `or.w`）⇒ 指令地址 IP = BINARY_BASE + 4 = 0xFC0000000004；imms18=0 ⇒ rb1 = 0xFC0000000004。**关键**：固定基址（`BINARY_BASE`）或 `IP & ~0xFFF`（旧页对齐口径）都会得 …0000 ⇒ FAIL。"

