# FP 算术族（加/减/乘、融合乘加、比较、最小最大）— m12-chipyard-013。
#
# 期望值独立派生自 spec/SimRISC-07 §2/§4 与 IEEE 754-2019（经
# tools/chipyard/fp_ref.py 的精确 oracle），**不**从 QEMU 或 RTL 反推。
# rf 组无 input_state 通道：源用 `ld.o rf` 从内存装载，结果用
# `rf2rd rd5, rf4` / `rf2rd rd6, rf0` 读回（rd6 = FCSR 复位值 + 标志；
# 比较类的比较结果直接落在 rd5）。
# 覆盖：加/减（±0 符号、精确抵消、远指数差、溢出）、乘（精确/下溢/溢出）、
# 融合乘加单次舍入（含 spec §2.5 的 ft 反例与「先乘后加」对照）、
# 比较（有序/无序/±0；signaling compare 任何无序置 NV、quiet 不置）、
# 最小最大（±0 定序、单 NaN、sNaN⇒NV、双 NaN⇒
# canonical qNaN）、三条合法性（dst_rf0 / dst_rd0）。

- mnemonic: foadd
  id: foadd_orrr_rf
  format: orrr
  class: semantic
  encoding:
    word: '0x44604042'
  input_state:
    memory:
    - address: '@ENTRY+0x100000'
      value: '0x3FF0000000000000'
    - address: '@ENTRY+0x100008'
      value: '0xBFF0000000000000'
    rb:
      rb1: '@ENTRY+0x100000'
  expected_state:
    rd:
      rd5: '0x0000000000000000'
      rd6: '0x7FF800007FC00000'
  expected_pc: null
  expected_fault: null
  status: active
  spec_cite: 'SimRISC-07: foadd'
  notes: foadd rf4, rf1, rf2：1.0 + (−1.0) = +0（IEEE 754-2019 §6.3，RNE）
  sequence:
  - '0x26041000'
  - '0x26081008'
  - '0x44604042'
  - '0x40F85101'
  - '0x40F86001'
