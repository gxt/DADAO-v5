  expected_state:
    rd:
      rd5: '0x3FF8000000000000'
      rd6: '0x7FF800007FC00000'
  format: orrr
  id: fodiv_orrr_rf
  input_state:
    memory:
    - address: '@ENTRY+0x100000'
      value: '0x4008000000000000'
    - address: '@ENTRY+0x100008'
      value: '0x4000000000000000'
    rb:
      rb1: '@ENTRY+0x100000'
  mnemonic: fodiv
  notes: fodiv rf4, rf1, rf2：3.0 / 2.0 = 1.5（精确，无标志）
  sequence:
  - '0x26041000'
  - '0x26081008'
  - '0x446C4042'
  - '0x40F85101'
  - '0x40F86001'
  spec_cite: 'SimRISC-07: S2D1'
