# FP 除法 / 开方 / 取余族（fodiv/ftdiv、foroot/ftroot、forem/ftrem）— m12-chipyard-014。
#
# 期望值独立派生自 spec/SimRISC-07 §2.1/§2.2 与 IEEE 754-2019（经
# tools/chipyard/fp_ref.py 的精确 oracle：商的精确有理数、开方的整数平方根、
# 取余的精确整数余数），**不**从 QEMU 或 RTL 反推。
# rf 组无 input_state 通道：源用 `ld.o rf` 从内存装载，结果用
# `rf2rd rd5, rf4` / `rf2rd rd6, rf0` 读回（rd6 = FCSR 复位值 + 舍入方向 + 标志）。
# 覆盖：除法的精确/不精确商（RNE 与 RTZ 两档）、`DZ` 端到端（±0 除数的三种符号）、
# 0/0 与 Inf/Inf 的 NV、开方的精确根 / 无理根 / 负数（sqrt(−1) 形状）、
# `rootn(±0,2)=+0`（+0/−0 两源 × ft/fo；ft 例同时钉「只写低 32 位」）、
# 取余的三边界（±Inf 被除数、±0 除数、sNaN）与就近取偶的平局、
# qNaN/sNaN 结果的 canonical quiet NaN、以及合法性（n ≠ 2 的 root、dst_rf0）。
# 结果 NaN 的取值（含 sNaN 输入的 quiet 化）：spec/SimRISC-07 §1.4 规定「凡结果应为
# quiet NaN 的情形一律 canonical」（符号 0、payload 全零；fo 0x7FF8_0000_0000_0000、
# ft 0x7FC0_0000）——IEEE 754-2019 §6.2.3 的 payload 传播只是 *should*、§6.3 不规定
# 符号，canonical 是允许的实现选择。故本册（`check-inst` 以 QEMU 为比对对象）直接钉
# canonical 值，不再 pin「payload 传播」的旧口径（该旧 pin 即 m13-testcases-021 定位的
# 既有唯一红 `divrem.yaml[23]`，本任务按 spec 改期望收口）。

