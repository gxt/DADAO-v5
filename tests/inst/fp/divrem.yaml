# FP 除法 / 开方 / 取余族（fodiv/ftdiv、foroot/ftroot、forem/ftrem）— m12-chipyard-014。
#
# 期望值独立派生自 spec/SimRISC-07 §2.1/§2.2 与 IEEE 754-2019（经
# tools/chipyard/fp_ref.py 的精确 oracle：商的精确有理数、开方的整数平方根、
# 取余的精确整数余数），**不**从 QEMU 或 RTL 反推。
# rf 组无 input_state 通道：源用 `ld.o rf` 从内存装载，结果用
# `rf2rd rd5, rf4` / `rf2rd rd6, rf0` 读回（rd6 = FCSR 复位值 + 舍入方向 + 标志）。
# 覆盖：除法的精确/不精确商（RNE 与 RTZ 两档）、`DZ` 端到端（±0 除数的三种符号）、
# 0/0 与 Inf/Inf 的 NV、开方的精确根 / 无理根 / 负数（sqrt(−1) 形状）、
# 取余的三边界（±Inf 被除数、±0 除数、sNaN）与就近取偶的平局、qNaN 传播、
# 以及合法性（n ≠ 2 的 root、dst_rf0）。
# sNaN 的 qNaN payload：§2.1 只规定「返回 qNaN」，未定 payload —— QEMU/softfloat 保留
# quieted payload、本核取 canonical（与 hardfloat/gem5 一致）⇒ YAML（`check-inst` 以
# QEMU 为比对对象）只钉 spec 规定的 `NV`，canonical 值由 model-only 的
# `divrem_snan_*` sweep 组断言。

