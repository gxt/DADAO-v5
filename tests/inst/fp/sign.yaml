# 浮点符号位操作（`ftsgnj`/`ftsgnn`/`fosgnj`/`fosgnn`，spec/SimRISC-07 §3）— m12-chipyard-015。
#
# 期望值独立派生自 spec/SimRISC-07 §3（copySign / 符号位取反的逐位定义），由
# tools/chipyard/fp_ref.py 的 `sign_inject` 计算，**不**从 QEMU 或 RTL 反推。
# 该族是纯位操作：**不置任何标志**（连 sNaN 输入也不置 NV），因此每个用例都
# 用 rf2rd rd6, rf0 断言 rf0 仍是复位值 0x7FF800007FC00000。
# `hd = rf0` ⇒ abs / −abs；`hc == hd` ⇒ copy / negate（spec §3 的四个特例）。
