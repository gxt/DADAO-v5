# scaleB C1 —— ftsclb/fosclb 第三源为 rdHD（rd 组有符号 64 位整数指数）。
#
# 期望值独立派生自 spec/SimRISC-07 §2.1（附录 A 速查行 `ftsclb rfHB, rfHC, rdHD`）
# 与 contracts/opcodes.yaml（ftsclb_orrr_rf / fosclb_orrr_rf，第三字段 rdhd [5:0]）：
#   结果 = rfHC × 2^rdHD（IEEE 754 scaleB；舍入由 rf0 控制；rdHD=rd0 ⇒ 指数 0）。
# 数值期望由 IEEE 754 独立计算（见 .work/evidence/TESTCASES-090t-qemu/oracle_scaleb.py），
# **不**从 QEMU 运行结果反推。
#
# 为什么用 `sequence:`：rf 组无 `input_state` 通道（schema 只允许 rd/rb/ra/memory），
# 故用 ld.o rf / st.o rf 原始编码把浮点源装进 rf、把结果写回内存再用 ld.o rd 回读。
# 各 semantic/boundary 用例都刻意让 rf3 = 10.0 作**诱饵**：若第三源仍按旧的 rfHD
# 读取（即 1.5 × 2^10 = 1536.0），结果与期望不同 ⇒ 用例 FAIL。

