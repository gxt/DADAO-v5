# roundToIntegral（`ftrnd`/`fornd`，spec/SimRISC-07 §2.3）— m12-chipyard-015。
#
# 期望值独立派生自 spec/SimRISC-07 §2.3 与 IEEE 754-2019 §5.3.1：由
# tools/chipyard/fp_ref.py 的精确 oracle 计算（`rnd_exact`，与另一份独立实现
# tools/testcases/oracle_rnd.py 逐例互证），**不**从 QEMU 或 RTL 反推。
# `immu6` 是六档 one-hot 码（ADR-0050 D2）：0x01 就近取偶 / 0x02 平局远离零 /
# 0x04 向零 / 0x08 向 +∞ / 0x10 向 −∞ / 0x20 动态（读 rf0[33:32]）。
# 只有 0x20 置 NX（且仅当结果 ≠ 输入）；其余五档不置任何标志。
# 序列：内存装 rf1（源）→ [可选 set.w rf0 定方向] → 指令 → rf2rd 读回结果与
# rf0（rd6 = FCSR：模式位 + 累积标志），故「静态档不受 rf0 影响、不置 NX」可观测。
