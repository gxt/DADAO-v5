# 格式转换舍入编码三分（ADR-0050；contract-fp §2/§3/§4）。
#
# 15 条结果依赖舍入的转换：低 6 位 = 六档 one-hot（0x01 RNE / 0x02 RNA /
# 0x04 RTZ / 0x08 RUP / 0x10 RDN / 0x20 dynamic）；3 条精确转换（ft2fo /
# it2fo / ut2fo）低 6 位 SBZ = 0。期望值独立派生自 IEEE 754-2019 的方向定义
# 与 contract-fp §3/§4 的 NX/NV/OF/UF 口径，**不**从 QEMU 运行结果反推。
#
# rf 组无 input_state 通道，故用 `ld.o rf` 装载 64 位源（ft 用低 32 位）、
# 用 `st.t`/`st.o` + `ld.o rd` 读回结果（大端 8 字节装载 ⇒ f32 落在 [63:32]），用 `rf2rd {rd6}, {rf0}` 读取
# FCSR（rf0 复位值 0x7FF800007FC00000，低 5 位为累积标志）。
#
# 覆盖：RNE/RTZ/RUP/RDN 各一组（ft2it 2.7f）、f2i 越界饱和+NV（2^31）、
# fo2ft 溢出（+Inf + OF|NX）与下溢（tiny+inexact ⇒ UF|NX）、io2ft 动态 0x20
# 跟随 rf0（set.w wp2 置 RTZ）、ut2fo 精确（SBZ 0，无标志）。

- class: semantic
  encoding:
    word: '0x44C05044'
  expected_fault: null
  expected_pc: null
  expected_state:
    rd:
      rd5: '0x0000000000000002'
      rd6: '0x7FF800007FC00010'
  format: orri
  id: ft2it_orri_rf
  input_state:
    memory:
    - address: '@ENTRY+0x100000'
      value: '0x00000000402CCCCD'
    rb:
      rb1: '@ENTRY+0x100000'
  mnemonic: ft2it
  notes: 'ft2it rd5, rf1, 4（RTZ）：2.7f → 2 + NX；C cast 恒截断'
  sequence:
  - '0x26041000'
  - '0x44C05044'
  - '0x40F86001'
  spec_cite: 'SimRISC-07: ft2it'
  status: active

