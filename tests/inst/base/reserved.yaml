  notes: "reserved cfx 地址空间（addr[47:42]=6，reserved 段 6–14/16–31/35–61）上的普通 ld.ub rd1, [rb3, 0]：word=0x10043000（opc=0x10、ha=1、hb=3、imms12=0），rb3=0x180000000000 ⇒ EA=0x180000000000（imms12=0，EA 对齐；不触发 MALIGN）⇒ CFXMEM (monitor)。"

