# reserved 向量（手写，无生成器；TESTCASES-008t 方案 A，TESTCASES-089t 扩为两类）
# ① 保留编码 ⇒ UNDI（Case 0–2）：encoding.reserved: true 标记 QFC/子表空白单元格，无 id 身份
# ② 保留 cfxha（6–14、16–31、35–61）的普通 ld/st ⇒ CFXMEM（Case 3–8）：已定义编码 + 保留地址空间，
#    带 id（contracts/opcodes.yaml 身份），**不带** encoding.reserved
# 两类覆盖均登记于 inventory.md

# ── Case 0: QFC 主表 op=0x08（0000-1xxx 整行 reserved）──
- class: legality
  encoding:
    word: "0x08040001"
    reserved: true
  mnemonic: null
  id: null
  format: null
  input_state: {}
  expected_state: null
  expected_pc: null
  expected_fault: UNDI
  status: active
  spec_cite: "SimRISC-00: SimRISC QFC; contract-isa: 2.9/8.2"
  notes: "QFC 主表 op=0x08（0000-1xxx 整行 reserved，8 个单元格均空白）。word=0x08040001: op[7:0]=0x08, ha=0x01, 非全零。"

