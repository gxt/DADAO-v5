format: 1
# In-repo triage ledger (m18-linux-005).  One row per **non-PASS** verdict of the
# current baseline; `suite_checks.py` S3 fails when a non-PASS case has no row, a
# row is stale, or a row's verdict differs from the run.  `case_output` is quoted
# verbatim from the run that produced the row, so the evidence can be re-checked
# in the console log of any run.
#
# class:
#   KERNEL_BUG    the kernel's behaviour is wrong (would be fixed in the kernel)
#   TEST_ADAPT    the test encodes a wrong assumption for this machine (64 KiB
#                 pages, big endian, ...); the fix lives in patches/kselftest
#   UNSUPPORTED   a facility this port does not implement at all (recorded, not
#                 silently skipped)
#   SUITE_ENV     the environment cannot run it yet (image/loader/libc), with the
#                 dependency and the re-run condition named
#
# Resolved (row removed; a PASS case must not stay in the ledger — S3c):
#   mm-map-populate (m18-linux-014).  Was KERNEL_BUG / HOST_TIMEOUT, with
#   "WARNING: include/linux/rwsem.h:81 ... Comm: map_populate".  Root cause: the
#   port's generic fault arm ignored VM_FAULT_COMPLETED, so after
#   `fault_dirty_shared_page()` -> `maybe_unlock_mmap_for_io()` had already
#   released the mmap lock (a MAP_SHARED file page write in the test's main), the
#   handler unlocked a second time; the count underflowed, the next reader's
#   trylock "succeeded" at count 0 (the rwsem.h:81 warning) and the next writer
#   slept for ever (host idle timeout, no guest alarm).  Fixed in
#   arch/dadao/mm/fault.c: COMPLETED owns the lock release, exactly as
#   arch/riscv and arch/x86 spell it.  Re-run condition met: five consecutive
#   `run_suite.py --only mm-map-populate` runs are PASS with SUITE CASE END and
#   no rwsem warning; suite.yaml's baseline for this case is PASS again.
rows:
  - id: mm-mremap-dontunmap
    class: SUITE_ENV
    verdict: FAIL
    case_output: "Bail out! [FAIL]	mremap_dontunmap_simple_shmem:134	memfd_create:No such file or directory"
    evidence: >-
      `ok 1 mremap_dontunmap_simple` passes (mremap(MREMAP_DONTUNMAP) on an
      anonymous mapping works); the next case needs memfd_create, which the image
      cannot back because the suite kernel is built with CONFIG_TMPFS=n (no
      shmem), so memfd_create returns ENOENT and the harness bails out.
    recheck: >-
      Rerun after the suite image enables CONFIG_TMPFS (and MEMFD_CREATE) — a
      kernel-image config decision for the kernel owner, not a test change.
  - id: mm-pfnmap
    class: SUITE_ENV
    verdict: SKIP
    case_output: "1..0 # SKIP Cannot find ram target in '/proc/iomem': No such file or directory"
    evidence: >-
      The test needs a RAM region advertised in /proc/iomem; the DADAO machine
      has no /proc/iomem ram target (no firmware memory map is exported), so the
      whole case self-skips (kselftest SKIP exit code 4).
    recheck: Rerun when the kernel exports memory regions in /proc/iomem.
  - id: mm-on-fault-limit
    class: SUITE_ENV
    verdict: SKIP
    case_output: "ok 1 # SKIP The test must be run from a normal user"
    evidence: >-
      The suite runs every case as PID 1's uid (0); the test refuses to run as
      root and skips itself. It is not a kernel verdict either way.
    recheck: >-
      Rerun after the suite supervisor drops to a non-root uid for cases (needs
      ownership/setuid support in the image) — tracked as the SUITE_ENV reason.
  - id: futex-wait-timeout
    class: KERNEL_BUG
    verdict: FAIL
    case_output: "not ok 1 futex_waitv monotonic returned 22"
    evidence: >-
      Three of the four groups pass (relative futex_wait, FUTEX_WAIT_BITSET on
      CLOCK_REALTIME/MONOTONIC, FUTEX_WAIT_REQUEUE_PI, FUTEX_LOCK_PI); the
      futex_waitv syscall returns EINVAL (22) for a plain relative wait, so the
      multi-wait interface is not implemented by this port.
    recheck: >-
      Rerun `run_suite.py --only futex-wait-timeout` after futex_waitv lands; the
      row disappears when the case passes.
