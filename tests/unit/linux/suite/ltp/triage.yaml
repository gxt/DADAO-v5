# In-repo triage ledger of the LTP subset (m18-linux-006).  One row per
# **non-PASS** verdict of the current baseline; `suite_checks.py` S3 fails when
# a non-PASS case has no row, a row is stale, or a row's verdict differs from
# the run.  `case_output` quotes the run verbatim, so the evidence can be
# re-checked in the console log of any run.
#
# class:
#   KERNEL_BUG    the kernel's behaviour is wrong (recorded, fixed elsewhere)
#   TEST_ADAPT    the test encodes a wrong assumption for this machine; the fix
#                 lives in components/ltp/patches (docs/Process-01)
#   UNSUPPORTED   this port does not implement the facility at all
#   SUITE_ENV     the environment cannot run it yet (image contents), with the
#                 dependency and the re-run condition named
# A whole-boot flake (`stop_reason=idle`, random case `HOST_TIMEOUT`, no
# `handle_softirqs`/die signature -- ISS-m18-005 family) is **not** a case
# verdict: the case is rerun (<=3 per round) and the baseline is the pair of
# clean runs whose per-case verdicts agree.  ISS-m18-006 (`die=0xe4` /
# `pf-va=0x10`) is counted separately too; it was 0 in this round.
# Resolved (row removed; a PASS case must not stay in the ledger -- S3c):
#   ltp-fcntl07 (m18-linux-018).  Was SUITE_ENV / TBROK: execlp(TCID) searched
#   an empty PATH.  The supervisor now exports PATH with the case's own image
#   directory first, so the close-on-exec arm re-execs and passes.
#   ltp-mlockall02 (m18-linux-018).  Was SUITE_ENV / TBROK: getpwnam("nobody")
#   returned NULL without /etc/passwd and the NULL dereference produced the
#   `die-no-vma va=0x10` SIGSEGV.  The image now ships /etc/passwd; the test
#   reaches its three assertions and passes (ENOMEM/EPERM/EINVAL).  The old
#   die was correct SIGSEGV delivery, not a kernel defect.
