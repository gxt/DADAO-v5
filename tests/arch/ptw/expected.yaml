# tests/arch/ptw/expected.yaml — `arch-ptw-001`…`arch-ptw-015`（TLB/PTW 探针清单）
#
# 载体：`tests/arch/ptw/ptw_carrier_tlb.py`（一个驱动、15 个 case、一 ROM 一检查；
#   `m16-testcases-010` 由 `tools/testcases/arch/min_rom_probe_tlb.py` 迁入），
#   由 `tests/arch/run_arch.py --cfx 4` 经 `check_tlb.py` 逐条调用（`--only <case>`）。
#   本文件不是第二套判据：**位号与 cause 值由驱动现场从合约解析**（见下「来源」列），
#   本文件只登记「每条 case 期望的大类 + 子原因符号 + info 语义 + 来源 §」，并由
#   `ptw_carrier_tlb.py --selfcheck` 与驱动双向核对（缺项/多项/名不符即 FAIL）。
#
# 判据来源（不写魔数）：
#   * cause 值与大类归属：`.tao/contracts/contract-see.md` §6.1；
#   * 子原因位号：`.tao/contracts/contract-see.md` §6.1.1（与 `spec/DADAO-12 §3.6` 逐位核对）；
#   * TLB 行为：`.tao/contracts/contract-tlb.md`（TLB-nn）与 `spec/DADAO-12 §2.2.x/§4.5/§5.2`。
#
# 观测通道：guest 内自检（`cfx2rd` 读 `cfx_hmon` `cg5 rc2/rc4`、PTE 回读、数据标记），
#   退出码 = semihosting SYS_EXIT：`0x00` 通过，`0x01`–`0x7F` = 「该镜像内第 N 条断言失败」
#   （每个检查是独立镜像，驱动按所跑检查解码；`ADR-0004 D5.8`）。
#
# checks[].cause = 期望的**低位** cause（`none` = 该检查不得产生任何异常；`null` =
#   页表故障：`[15:0]` 为 0，只置高位位图，旧大类位不置 — ADR-0062 D1/D2）；
# checks[].subcause = `contract-see §6.1.1` 的位图符号名（`null` = 无位图位）；
# checks[].info = `cause_info` 语义（`address` = 访存地址；`pte_pa` = PTE 物理地址；
#   `inst` = 触发指令编码；`none` = 无异常）。
# checks[].signature = 已接线检查的签名流期望（每观测点一个值，16 进制；`m16-testcases-002`）。
#   数值真源仍是驱动里由合约派生的值，本清单只登记并由 `--selfcheck` 双向核对。
#   同一 case 由多个检查组成时，驱动按 checks 顺序把各检查的流**聚合**成一个
#   产物；`run_arch.py` 按本清单顺序逐槽比较（`m16-testcases-010`）。未写
#   `signature:` 的检查仍由 guest 内断言判（rc=0），跨平台比较按 0 槽空流登记。

schema: 1
cases:
- id: arch-ptw-001
  only: tlb_fill_hit
  title: 首次访问缺页步进+填充，第二次命中
  checks:
  - label: fill_hit
    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ①, TLB-08, TLB-10]

- id: arch-ptw-002
  only: tlb_hit_no_pte_reread
  title: 命中不重读 PTE（改 PPN 后仍读旧 PA）
  checks:
  - label: hit_no_reread
    cause: none
    subcause: null
    info: none
    # 签名流（m16-testcases-002）：[填充读到的值, 命中读到的值, 被改写后的叶 PTE]
    # 叶 PTE 的 HSJU = H|S|U（0xD，J 不测）：同一页在三种运行模式下都允许，
    # 所以签名流与运行模式无关（m16-testcases-019）。
    signature: [0x1122334455667788, 0x1122334455667788, 0xd00000006100ffe1]
    source: [contract-tlb §11 ②, TLB-07]

- id: arch-ptw-003
  only: tlb_invalid_va
  title: invalid + scope=VA 只删包含 start 的条目
  checks:
  - label: invalid_va
    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ③, TLB-23]

- id: arch-ptw-004
