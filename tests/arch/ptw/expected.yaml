- id: arch-ptw-011
  only: perm_denied_cfxperm
  title: HSJU（按当前运行模式取位）与 R/W/X 正交；缺位只置权限类位（CFXPERM=0）
  # `checks` = hmon 的向量（H 轴，原有用例）；S/U 轴按运行模式列出：
  # `checks_by_mode.<mode>` 覆盖 `checks`。J 不测（用户 2026-11-22 裁定）。
  checks:
  - label: nwperm
    cause: null
    subcause: NWPERM
    info: address
    source: [contract-tlb §11 ⑩, TLB-32, TLB-34, contract-see §6.1.1]
  - label: nrperm
    cause: null
    subcause: NRPERM
    info: address
    source: [contract-tlb §11 ⑩, TLB-32, TLB-34, contract-see §6.1.1]
  - label: nxperm
    cause: null
    subcause: NXPERM
    info: address
    source: [contract-tlb §11 ⑩, TLB-32, TLB-34, contract-see §6.1.1]
  - label: nhperm
    cause: null
    subcause: NHPERM
    info: address
    source: [contract-tlb §11 ⑩, TLB-34, spec/DADAO-12 §3.6]
  - label: nhperm_before_nwperm
    cause: null
    subcause: NHPERM
    info: address
    source: [spec/DADAO-12 §2.2.6 优先级（HSJU 先于 R/W/X）, TLB-34]
  checks_by_mode:
    smon:
    - label: nwperm
      cause: null
      subcause: NWPERM
      info: address
      source: [contract-tlb §11 ⑩, TLB-32, spec/DADAO-12 §2.2.5]
    - label: nrperm
      cause: null
      subcause: NRPERM
      info: address
      source: [contract-tlb §11 ⑩, TLB-32, spec/DADAO-12 §2.2.5]
    - label: nxperm
      cause: null
      subcause: NXPERM
      info: address
      source: [contract-tlb §11 ⑩, TLB-32, spec/DADAO-12 §2.2.5]
    - label: nsperm
      cause: null
      subcause: NSPERM
      info: address
      source: ["spec/DADAO-12 §2.2.5（supv 缺 S）", "contract-see §6.1.1 [34]"]
    - label: nsperm_before_nwperm
      cause: null
      subcause: NSPERM
      info: address
      source: [spec/DADAO-12 §2.2.6 优先级（HSJU 先于 R/W/X）]
    - label: s_plus_u_allowed
      cause: none
      subcause: null
      info: none
      source: [spec/DADAO-12 §2.2.5（无「S 排除 U」的隐含规则）]
    - label: s_only_allowed
      cause: none
      subcause: null
      info: none
      source: [spec/DADAO-12 §2.2.5（非 hypv 不要求 H 位）]
    umon:
    - label: nwperm
      cause: null
      subcause: NWPERM
      info: address
      source: [contract-tlb §11 ⑩, TLB-32, spec/DADAO-12 §2.2.5]
    - label: nrperm
      cause: null
      subcause: NRPERM
      info: address
      source: [contract-tlb §11 ⑩, TLB-32, spec/DADAO-12 §2.2.5]
    - label: nxperm
      cause: null
      subcause: NXPERM
      info: address
      source: [contract-tlb §11 ⑩, TLB-32, spec/DADAO-12 §2.2.5]
    - label: nuperm
      cause: null
      subcause: NUPERM
      info: address
      source: ["spec/DADAO-12 §2.2.5（user 缺 U）", "contract-see §6.1.1 [32]"]
    - label: nuperm_before_nxperm
      cause: null
      subcause: NUPERM
      info: address
      source: [spec/DADAO-12 §2.2.6 优先级（HSJU 先于 R/W/X）]
    - label: u_plus_s_allowed
