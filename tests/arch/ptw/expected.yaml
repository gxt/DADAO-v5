- id: arch-ptw-014
  only: tlb_control_stop
  title: A/D 回写失败「条目级 + 遇错即停」——失败前的条目已处理、失败条目原样保留、其后的条目不处理
  # TLB-37 固定「停在哪」但不固定遍历顺序；探针按填充顺序（X→Y→Z）构造，故「第 2 条失败」即插入序第 2 条。
  checks:
  - label: flush_stop_after
    cause: null
    subcause: ADWBFAIL
    info: pte_pa
    source: [contract-tlb TLB-37, ADR-0041 D3.2, contract-see §6.1, §6.1.1, spec/DADAO-12 §4.5]
  - label: flush_stop_kept
    cause: null
    subcause: ADWBFAIL
    info: pte_pa
    source: [contract-tlb TLB-37, ADR-0041 D3.2, contract-see §6.1.1, spec/DADAO-12 §4.5]

