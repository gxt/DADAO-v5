    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ④, TLB-23]
  - label: range_size0_cfxreg
    cause: CFXREG
    subcause: null
    info: inst
    source: [contract-tlb §11 ④, TLB-24, contract-see §6.1]
  - label: scope_reserved_cfxreg
    cause: CFXREG
    subcause: null
    info: inst
    source: [contract-tlb §11 ④, TLB-24, contract-see §6.1]
  - label: scope_all
    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ④, TLB-23]

- id: arch-ptw-005
  only: tlb_asid_g
  title: ASID_ANY=0 不碰 G 条目；ASID_ANY=1 含 G；G 跨 ASID 复用
  checks:
  - label: asid_any0_keeps_g
    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ⑤, TLB-26, TLB-05]
  - label: asid_any1_takes_g
    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ⑤, TLB-25]
  - label: g_cross_asid
    cause: none
    subcause: null
    info: none
    source: [contract-tlb §11 ⑤, TLB-05, TLB-27]

- id: arch-ptw-006
  only: tlb_clean_ad
  title: clean 原子 OR 回写 A/D 且保留条目；invalid 不回写且删除
  checks:
  - label: clean_vs_invalid
    cause: none
    subcause: null
    info: none
    # 签名流：[clean 前 PTE（A/D=0）, clean 回写后 PTE（A/D=1）, invalid 后 PTE（A/D=0）]
    signature: [0xd00000006000ffe1, 0xd00000006000ffed, 0xd00000006100ffe1]
    source: [contract-tlb §11 ⑥, TLB-15, TLB-17, TLB-14]

- id: arch-ptw-007
  only: tlb_flush_adwb_fail
  title: flush 回写 A/D 并删除；回写失败 ⇒ CFXMEM[56] + info=PTE PA 且条目不删
  checks:
  - label: flush_ok
    cause: none
    subcause: null
    info: none
    # 签名流：[flush 回写后的 PTE（A/D=1）, 条目删除后重走页表读到的值]
    signature: [0xd00000006000ffed, 0x99aabbccddeeff00]
    source: [contract-tlb §11 ⑦, TLB-17, TLB-15]
  - label: flush_adwbfail
    cause: null
    subcause: ADWBFAIL
    info: pte_pa
    # 签名流：[cause_info = ROM 叶 PTE 的 PA, 两次 flush 的失败次数]
    signature: [0xfffffffffff8, 0x2]
    source: [contract-tlb §11 ⑦, TLB-16, TLB-37, spec/DADAO-12 §4.5]

