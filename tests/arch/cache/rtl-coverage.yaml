# tests/arch/cache/rtl-coverage.yaml — cfx5 在 RTL 承载上的覆盖/缺口登记
# （m16-testcases-009）。
#
# `verdict: gap` 的条目不参与逐槽比较（`run_arch.py` 记 GAP，退出码 77，不是
# PASS）。每条 gap 必须写 `reason` 与 `close_when`。
schema: 1
cases:
  - case: arch-cache-001
    verdict: signature
    note: "与 QEMU/gem5 同一槽序（18 槽），RTL 侧另加缓存日志断言"
  - case: arch-cache-002
    verdict: signature
    note: "与 QEMU/gem5 同一槽序（12 槽），RTL 侧另加范围命令的日志断言"
  - case: arch-cache-003
    verdict: signature
    note: "与 QEMU/gem5 同一槽序（16 槽）；RTL 的 cause 来自固定 hmon 的 save-and-jump 槽"
  - case: arch-cache-004
    verdict: gap
    reason: >-
      `arch-cache-004` 是 `cache-model=off` 的机器维度（CACHE-27）。RTL 没有
      该配置开关（CACHE-27 把「各实现是否暴露该开关」留给实现），`WumingVastConfig`
      恒有 I/D cache（`cache_exist=0b11`），无法在同一 RTL 上产出 off 分支的
      寄存器值。QEMU/gem5 侧仍按 off 期望逐槽判。
    close_when: >-
      RTL 暴露可切换的 cache-model（或在测试机层面提供等价的 off 变体）并接入
      `check_cache_rtl.py`
  # `arch-cache-001/002` 的 smon/umon 在 `m16-chipyard-027` 起由 RTL 承载：
  # cfx5 开 `commonRows`（cg0-cg3 模式行 + `cg3 rc12` deleg + cg4/cg5/cg6），
  # `cache_rtl.S` 在 hypv 打开目标 cfx5 的 supv/user 行与 deleg 后经
  # `cfx_hmon` 降模式（DIV-16 已删除）。
