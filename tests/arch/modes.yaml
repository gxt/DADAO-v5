    modes: [hmon]
    reasons:
      smon: "step5 BootROM 只在 hypv 交付 body；判据依赖 cfx_hmon 的故障记录槽，supv 故障走未装载的 cfx_smon ⇒ 未迁移到 common/env-*"
      umon: "body 需读写 RAM（签名区/故障记录槽）；step5 页表 HSJU=0xC（U=0）⇒ user 不可访存；未迁移到 common/env-*"

