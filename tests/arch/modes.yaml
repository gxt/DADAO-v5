# tests/arch/modes.yaml — arch 用例的运行模式允许集（m16-testcases-015）
#
# 为什么不写在 `tests/arch.yaml`：该文件字段受 `check-tests-index` 白名单
# 约束（未知字段即红），而运行模式元数据属于「用例旁」的驱动参数。本文件与
# `tests/arch.yaml` 的 id 集合**双向**核对（缺项/多项/非法模式/缺原因 ⇒ 红），
# 由 `run_arch.py`（含 `--self-test`）现场校验。
#
# 字段：
#   cases.<id>.modes      非空列表，取值 hmon|smon|umon（每条必须显式给出，无缺省）
#   cases.<id>.reasons    被排除模式 -> 非空原因（显式标注；不得静默不可运行）
#   cases.<id>.cfx_access 可选，非空列表，取值 umon/smon/hmon/ptw/cache/hart/
#                         pmem/time/power（`run_arch.py` 的 DIR_CFX 名字）：
#                         该用例在目标模式下**需要访问**的 cfx（m16-testcases-017）。
#                         环境据此在降模式前（仍在 hypv）打开目标 cfx 的
#                         `<mode>` 行来源掩码（`DADAO-12 §3`，只清源 cfx 位），
#                         退出还原；**声明本身不放宽默认掩码**。未声明 ⇒ 保持
#                         缺省权限（访问非自身 cfx 收 `CFXPERM`）。
#                         只有 hmon 的用例不得声明（hmon 不插权限准备 ⇒ 用不到）。
#                         驱动侧交付契约见 `tests/arch/common/env-README.md`。
#
# 模式语义（hmon/smon/umon = hypv/supv/user 的当前模式监视器）与环境实现见
# `tests/arch/common/env-README.md`；迁移清单见 `common/env-MIGRATION.md`。

