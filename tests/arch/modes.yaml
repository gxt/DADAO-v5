    cfx_access: [umon]

  # fence 基础验证（m16-testcases-012）：放行面三模式各跑一次（载体的模式切换
  # 协议与 `common/env-*` 相同；不访问任何 cfx，故不声明 `cfx_access`）。
  # 签名值模式无关（0 = fence 正常执行），三模式逐槽同。
  arch-umon-012:
    modes: [hmon, smon, umon]

  # 保留面（保留 cfxha / hb≠0 ⇒ ILLI）只在 hmon：ILLI 由**当前模式监视器**
  # 处理并记录 cause（DADAO-12 §5.2）；smon/umon 下当前模式监视器不可用。
  arch-umon-013:
    modes: [hmon]
    reasons:
      smon: "supv 的同步异常进 cfx_smon，而本测试链不装载 cfx_smon（common/env-README「已知限制」）⇒ ILLI 的 cause 观测不到，镜像会中止/短流；fail-closed 排除"
      umon: "user 的同步异常进 cfx_umon 的 user 行，需把处理程序装进 U 页并单独授予执行权限（common/env-README「已知限制」）；ILLI 的 cause 取不到 ⇒ 排除"

  # cfx63 power 基础用例（m16-testcases-016）：寄存器面（cg7 BootROM 块）与
  # power→hmon 移交在 hmon/smon/umon 三模式各跑一次。移交帧在 hmon 阶段读，
  # 寄存器面在目标模式读（smon 的 cg 授权由载体在 hypv 按 DADAO-12 §3.4 打开
  # `cfx_power cg3 rc12 = 0x8` 并回读校验/还原）。
  arch-power-001:
    modes: [hmon, smon, umon]

  # 属性拒绝面（cg7 写 / power ctrl 读 / 未定义 rc 读 ⇒ CFXREG）只在 hmon：
  # 拒绝异常进「当前运行模式监视器」，载体只装 cfx_hmon 的 hypv 处理程序。
  arch-power-002:
    modes: [hmon]
    reasons:
      smon: "supv 的同步异常进 cfx_smon（本载体只装 cfx_hmon 的 hypv 处理程序）；且 supv 访问 cfx_power 的 cg 受 cg3 rc12 授权约束，拒绝面观测不到 ⇒ fail-closed 排除"
      umon: "user 的同步异常进 cfx_umon 的 user 行，需把处理程序装进 U 页并单独授予执行权限；拒绝面的 cause 取不到 ⇒ 排除"

  # cfx_time（cfx34，m16-chipyard-023）：只读时间面在三种运行模式下各跑一次；
  # 掩码/`cg3 rc12` 授权按目标 cfx 的 `<mode>` 行打开（`cfx_access`）。
  arch-time-001:
    modes: [hmon, smon, umon]
    cfx_access: [time, hart]

  # 保留 rc（rc2/rc63）与 RO 写（rc0/rc1）⇒ `CFXREG` 的拒绝面只在 hmon：
  # 本测试链在 supv/user 下没有同步异常处理程序（`common/env-README.md`
  # 「已知语义边界」），拒绝面在 S/U 会被环境按 fail-closed 中止 ⇒ 显式排除。
  arch-time-002:
    modes: [hmon]
    cfx_access: [time]
    reasons:
      smon: "supv 的同步异常进 cfx_smon，而本测试链不装载 cfx_smon（common/env-README「已知语义边界」）⇒ 四条 CFXREG 的 cause 取不到，镜像会中止；fail-closed 排除"
      umon: "user 的同步异常进 cfx_umon 的 user 行；本链不装载它（同上）⇒ CFXREG 的 cause 取不到；fail-closed 排除"

  # cfx5 cache（cfx5，m16-testcases-009）：寄存器面 + D 单行 + I 侧取指重取在
  # 三模式各跑一次；`cfx_access: [cache]` 打开目标 cfx 的三行来源掩码。
  arch-cache-001:
    modes: [hmon, smon, umon]
    cfx_access: [cache]
    cache_model: "on"

  # D 侧范围（PA 单行边界 / PA 区间 / all）同样三模式。
  arch-cache-002:
    modes: [hmon, smon, umon]
    cfx_access: [cache]
    cache_model: "on"

  # 拒绝面（读 WO / 写 RO / 保留 rc / 非法编码 ⇒ CFXREG）只在 hmon：
  # supv/user 下本测试链没有同步异常处理程序（`common/env-README.md`
  # 「已知语义边界」），cause 取不到 ⇒ fail-closed 排除。
  arch-cache-003:
    modes: [hmon]
    cfx_access: [cache]
    cache_model: "on"
    reasons:
      smon: "supv 的同步异常进 cfx_smon，而本测试链不装载 cfx_smon（common/env-README「已知语义边界」）⇒ 六条 CFXREG 的 cause 取不到；fail-closed 排除"
      umon: "user 的同步异常进 cfx_umon 的 user 行；本链不装载它（同上）⇒ CFXREG 的 cause 取不到；fail-closed 排除"

  # `cache-model=off` 的机器维度（CACHE-27）：只 hmon（故障观察同 003）；
  # 机器维度由本条的 `cache_model: off` 覆盖 `run_arch --cache-model`。
  arch-cache-004:
    modes: [hmon]
    cfx_access: [cache]
    cache_model: "off"
    reasons:
      smon: "off 分支的故障观察需要 hmon 的同步异常处理程序；supv 无 cfx_smon ⇒ fail-closed 排除"
      umon: "同上（user 的 cfx_umon user 行未装载）⇒ fail-closed 排除"
