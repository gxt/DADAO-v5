# expected.yaml — independent oracle for tests/arch/hmon/tiny_hmon.S.
#
# Every expected value is derived from spec/Machine-v5 §1.1/§2/§3/§4.4/§5 and
# spec/DADAO-12 §3/§5, never from a gem5 run:
#   * cause ids are the DADAO one-hot bit indices (§5.2(二));
#   * faulting IPs are ELF symbol values (program layout, resolved by the
#     runner through llvm-nm);
#   * cause_info follows the spec: CFXMEM/MALIGN = access address,
#     ILLI/UNDI/CFXREG = instruction encoding, IALIGN = IP,
#     CFXTRAP/CFXESC/CFXPERM = the instruction word (ciii/crrr layout);
#   * cg7 start values are `(base - (cfxha << 42))` (§3.8).
#
# The runner evaluates `ip` / `info` / `expect` as Python integer expressions
# in a namespace containing the profile constants below and the ELF symbols.
profile:
  bootrom_base: 0xFFFF_FFFF_0000
  bootrom_size: 0x1_0000
  sram_base: 0xFFFF_FF00_0000
  sram_size: 0x80_0000
  hmon_base: 0x0FFF_0000_0000
  hmon_size: 0x1_0000
  entry: 0xFFFF_FF01_0100
  reset_pc: 0xFFFF_FFFF_0000
  # spec/Machine-v5 §6.1: the image index table's boot_magic, patched by the
  # builder into the power stub's `trap cfx_hmon, <boot_magic>`.
  boot_magic: 0x30001

# The BootROM image is built from the same sources with the same builder as
# m12-chipyard-007; QEMU and gem5 boot the identical 64 KiB firmware (the
# chipyard checked-in hex is regenerated by m12-chipyard-028).
#
# m13-integ-007 (2026-11-11): the *shared* hmon handler is the minimal
# save-and-jump algorithm (m12-006 cycle design §11, second revision): code
# at hmon SRAM 0x00 with no jump, data at 0xD8--0xFF, no magic check, no IALIGN
# rewrite, no +4 policy, no park.
#
# m13-gem5-010: the gem5 case no longer carries a separate dispatch handler.
# It boots the shared firmware above, and *every* cause record below is the
# four-slot observation the application takes at its landing address:
#   0xE0 excp_cause_id / 0xE8 excp_cause_ip / 0xF0 excp_cause_info /
#   0xF8 the framework return address the handler escaped to.
# The application writes its landing address into 0xF8 before each fault, so
# a `+4` policy or an IALIGN rewrite would land at the wrong place and the
# record would not match the ELF symbols.  The hand-over record (0) reads the
# same slots: power's default return address is `boot_magic_trap + 4`.
shared_bootrom_md5: 514300876ea66ec108396334f3ef2b0f

# Not yet executable in this task:
#   * chipyard: regenerate resources/dadao/bootrom/bootrom.tiny.hex from the
#     new builder output (the checked-in hex still has the old handler);
#     tracked by m12-chipyard-028, not by this gem5 case.
pending_followups:
  - chipyard: bootrom.tiny.hex == new shared_bootrom_md5

records:
  # 0: power -> hmon handover (CFXTRAP + table boot_magic).  The shared
  # handler saved the hand-over cause registers and escaped through power's
  # return slot; the IP is the shared power stub's trap instruction and the
  # return slot is the instruction after it.
  - kind: cause
    cause: CFXTRAP
    cause_id: 0x1
    ip: boot_magic_trap
    info: (0x7F << 24) | (3 << 18) | 0x30001
    return_slot: boot_magic_trap + 4

  # 1..16: cfx2rd/cfx2rc register checks.
  - {kind: check, id: 1, expect: 3}                       # hmon cfx_id
  - {kind: check, id: 2, expect: 63}                      # power cfx_id
  - {kind: check, id: 3, expect: hmon_base}               # hmon excp_vector
  - {kind: check, id: 4, expect: 3}                       # hmon switch_run_mode
  - {kind: check, id: 5, expect: 3}                       # hmon excp_prev_run_mode
  - {kind: check, id: 6, expect: 1}                       # hmon trap_num
  - {kind: check, id: 7, expect: 0x1122334455667788}      # scratch round trip
  - {kind: check, id: 8, expect: 0x0F0F}                  # cfx_intr_mask RW
  - {kind: check, id: 9, expect: 0x3}                     # hmon cg7 desc: exists|SRAM
  - {kind: check, id: 10, expect: hmon_base - (3 << 42)}  # hmon cg7 start
  - {kind: check, id: 11, expect: 0x1_0000}               # hmon cg7 size
  - {kind: check, id: 12, expect: 0x7}                    # hmon cg7 attr R|W|X
  - {kind: check, id: 13, expect: 0x5}                    # power cg7 desc: exists|ROM
  - {kind: check, id: 14, expect: bootrom_base - (63 << 42)}  # power cg7 start
  - {kind: check, id: 15, expect: 0x1_0000}               # power cg7 size
  - {kind: check, id: 16, expect: 0x5}                    # power cg7 attr R|X
  # 41: cg3 rc10 writes ignore the low two bits (DADAO-13 §1): writing
  # hmon_base|3 lands as hmon_base, no fault, read-back is the stored value.
  - {kind: check, id: 41, expect: hmon_base}

  # 17..19: CFXMEM (1 << 1).  info = the illegal access address; the return
  # slot is the application's landing address read back from 0xF8.
  - {kind: cause, cause: CFXMEM, cause_id: 0x2, ip: f_mem0, info: 0x10_0000_0000, return_slot: land_mem0}
  - {kind: cause, cause: CFXMEM, cause_id: 0x2, ip: f_mem1, info: 0xFFFF_FF80_0000, return_slot: land_mem1}
  - {kind: cause, cause: CFXMEM, cause_id: 0x2, ip: f_mem2, info: hmon_base + 0x1_0000, return_slot: land_mem2}

  # 20..22: ILLI (1 << 8).  Reserved cfxha trap / cfx2rd / escape.
  - {kind: cause, cause: ILLI, cause_id: 0x100, ip: f_illi0, info: (0x7F << 24) | (7 << 18), return_slot: land_illi0}
  - {kind: cause, cause: ILLI, cause_id: 0x100, ip: f_illi1, info: (0x7A << 24) | (7 << 18) | 10, return_slot: land_illi1}
  - {kind: cause, cause: ILLI, cause_id: 0x100, ip: f_illi2, info: (0x7E << 24) | (7 << 18) | 1, return_slot: land_illi2}

  # 23..25: UNDI (1 << 9).  info = the reserved instruction word.
  - {kind: cause, cause: UNDI, cause_id: 0x200, ip: f_undi0, info: 0x08040001, return_slot: land_undi0}
  - {kind: cause, cause: UNDI, cause_id: 0x200, ip: f_undi1, info: 0x1B040001, return_slot: land_undi1}
  - {kind: cause, cause: UNDI, cause_id: 0x200, ip: f_undi2, info: 0x58040001, return_slot: land_undi2}

  # 26..28: MALIGN (1 << 12).  info = the misaligned effective address.
  - {kind: cause, cause: MALIGN, cause_id: 0x1000, ip: f_malign0, info: sram_base + 1, return_slot: land_malign0}
  - {kind: cause, cause: MALIGN, cause_id: 0x1000, ip: f_malign1, info: sram_base + 4, return_slot: land_malign1}
  - {kind: cause, cause: MALIGN, cause_id: 0x1000, ip: f_malign2, info: sram_base + 2, return_slot: land_malign2}

  # 29..31: IALIGN (1 << 13).  ip == info == the illegal IP (the handler does
  # not rewrite excp_cause_ip); the framework return slot selects the landing.
  - {kind: cause, cause: IALIGN, cause_id: 0x2000, ip: IALIGN_TARGET0, info: IALIGN_TARGET0, return_slot: land_ialign0}
  - {kind: cause, cause: IALIGN, cause_id: 0x2000, ip: IALIGN_TARGET1, info: IALIGN_TARGET1, return_slot: land_ialign1}
  - {kind: cause, cause: IALIGN, cause_id: 0x2000, ip: IALIGN_TARGET2, info: IALIGN_TARGET2, return_slot: land_ialign2}

  # 32: general trap (non-semihosting) into hmon (CFXTRAP).
  - {kind: cause, cause: CFXTRAP, cause_id: 0x1, ip: f_trap, info: (0x7F << 24) | (3 << 18) | 0x123, return_slot: land_trap}

  # 33: escape target error => CFXESC (1 << 3) into the current (hmon) cfx.
  - {kind: cause, cause: CFXESC, cause_id: 0x8, ip: f_esc, info: (0x7E << 24) | (63 << 18) | 1, return_slot: land_esc}

  # 34: cfxtrap mask denial => CFXPERM (1 << 7) into the current monitor.
  - {kind: cause, cause: CFXPERM, cause_id: 0x80, ip: f_perm, info: (0x7F << 24) | (63 << 18), return_slot: land_perm}

  # 35: unimplemented cfx5 register access => CFXREG (1 << 2).
  - {kind: cause, cause: CFXREG, cause_id: 0x4, ip: f_reg, info: (0x7A << 24) | (5 << 18) | 10, return_slot: land_reg}

  # 36..40: Tiny run mode is fixed at hypv (Machine-v5 §2).  The guest writes
  # switch_run_mode = user(0), then takes a CFXMEM: entry still lands in hypv,
  # so excp_prev_run_mode records the pre-entry mode (3) and the cg3
  # (hypv-only, DADAO-13 §1) read after the fault still succeeds.  The shared
  # minimal handler has no test hook, so the old in-handler cg3 probe is gone.
  - {kind: check, id: 36, expect: 3}                      # cg3 switch_run_mode read
  # 42: Machine-v5 §2 -- a write of 0 is ignored; the saved value stays 3 and
  # the immediate read-back returns the saved value (before any fault).
  - {kind: check, id: 42, expect: 3}
  - {kind: cause, cause: CFXMEM, cause_id: 0x2, ip: f_hypv, info: hmon_base + 0x1_0000, return_slot: land_hypv}
  - {kind: check, id: 38, expect: 3}                      # excp_prev_run_mode = hypv
  - {kind: check, id: 39, expect: hmon_base}              # cg3 read after the fault
  - {kind: check, id: 40, expect: 3}                      # saved value stays 3
