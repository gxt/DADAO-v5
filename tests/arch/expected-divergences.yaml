    impact: "RTL 的两轴 `cfxreg`/`cfxtrap` 强制判定只作用于 U/S 行；hypv 行不强制。"
    reason: "chipyard 的固定 BootROM（`spec/Kaiwu §6.2`）以 `cfx_power` 在 hypv 跳入测试体，规范复位掩码只允许 `cfx_hmon`（`ADR-0045 D4`）；若强制 hypv 行，测试体第一条 cfx0/cfx2（以及既有 cfx4/5）访问即 `CFXPERM`。QEMU 的 BootROM 有 hmon 阶段、测试体以 `cfx_hmon` 交付，故可全模式强制。U/S 判权与拒绝路径 `CFXPERM [39]` 不因此放宽。"
    user_ruling: "2026-11-22（任务书：U/S 下判权）；2026-11-23 reviewer 指出这是真实偏离，permanent 定性待用户确认"
    status: active
    close_when: "RTL 交付链改为 cfx_hmon 源（与 QEMU 017 对齐；另立任务）"

  - id: DIV-11
    kind: temporary
    scope: [chipyard]
    impact: "`escape` 的 frame selector（`imms18` bit1）只在实现 cfx_hart 的机器（Vast）上生效：Tiny 保留旧 SBZ 规则（`imms18[17:1] ≠ 0` ⇒ `ILLI`），故规范已定为合法的 `escape …, 8`（`imms18 = 2`，选 cg9 现场）在 Tiny 上仍报 `ILLI`；Vast 上按 cg9 帧退（帧空 ⇒ `CFXESC`）。"
    reason: "Tiny 无 cfx15（没有 cfx_hart），`m16-chipyard-024` 以「Tiny 无 cfx15 不变」为硬判据（`11-cfx`/`01-load-store` 与 020 基线逐字节相同），`WumingDecoder` 的 `withHart` 门控因此保留。spec（`DADAO-12 §5.1`：`imms18 ∈ {0,1,2}`、汇编层 `imms20 ∈ {0,4,8}`）与工具链（`m16-llvm-001`：`escape …, 8` 可汇编、`…, 12` 被拒）均已落地。`tests/inst/11-cfx/escape_ciii_cfx.S` **不受影响**：其故障例 13/20 判 `imms18 = 3` ⇒ `ILLI`、14/17/18 判 reserved cfxha（cfx6/61）⇒ `ILLI`，都不依赖 selector 的合法路径（该文件 GAP ⑤ 已写明合法 cg9 路径不在本载体断言）。"
    user_ruling: "2026-11-23（任务书：Tiny 无 cfx15 不回归）"
    status: active
    close_when: "放开 `WumingDecoder` 的无 cfx_hart 门控（Tiny 按 §5.1 接受 `imms18 = 2`，因无 cg9 帧 ⇒ `CFXESC`），并补一条 Tiny 侧编码用例；届时删除本条"

