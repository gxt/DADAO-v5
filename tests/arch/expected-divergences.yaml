    kind: temporary
    scope: [chipyard]
    impact: "cfx5 的 S/U 运行模式在 RTL 上不可达：`arch-cache-001/002` 的 smon/umon 在 RTL 承载记 GAP（`cache/rtl-coverage.yaml`），QEMU/gem5 侧仍按三模式逐槽判；hmon 的三方逐槽（`arch-cache-001/002/003`）不受影响。"
    reason: "RTL 的 cfx5 只有 cg8 寄存器面：`GewuParams` 没有给 cfx5 开 `commonRows`（`GewuFile` 的 require 只允许 cfx0–cfx3/hart/pmem/time）⇒ cfx5 的 `cg0`–`cg3`（`user/supv_cfxreg` 行与 `cg3 rc12` deleg）不存在；supv/user 访问 cfx5 ⇒ `CFXREG`。hmon 走 hypv 行（DIV-07：RTL 的 hypv 行不强制）可读 cg8，所以三方 hmon 用例可跑。"
    user_ruling: "2026-11-24（本任务发现；是否给 RTL 补 cfx5 commonRows 待用户裁定）"
    status: active
    close_when: "RTL 给 cfx5 开 `commonRows`（补齐 cg0–cg7 与 deleg）并复跑 RTL 的 smon/umon，删本条与 `rtl-coverage.yaml` 的四条 mode gap"
