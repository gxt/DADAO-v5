    scope: [qemu]
    impact: "`cfx_hart cg9 rc6`（async switch run mode）在 QEMU 上可被写 0 覆盖（读回 0），规范为固定 supv（2）。用例只读回 rc6（不写 0），写忽略行为不在三方比较面；若在 QEMU 上恢复「写 0 ⇒ 读 2」断言会红。"
