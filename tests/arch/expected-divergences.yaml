    reason: "QEMU/gem5 的页表放在只读 BootROM 镜像里，`flush` 的 A/D 回写失败可自然构造（`spec/DADAO-12 §4.5`）；RTL 的测试体经 `+loadmem` 装入 PA RAM，BootROM 只作固定启动固件（`m16-chipyard-025` 起为 4 MiB），探针无法把叶 PTE 放进只读页。RTL 的回写失败路径仍由 `ptw_tlb.S` 的 `CASE_OR` 实现层注入覆盖（`m16-chipyard-008`），不在运行期判据内。"
