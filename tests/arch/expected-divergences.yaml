# expected-divergences.yaml — 三方（QEMU/gem5/RTL）差分允许的差异清单
#
# 用户 2026-11-22 裁定：三方一致为准；有差异必须由用户裁定并登记在此。
# 每条写：kind（permanent / temporary）、scope、impact（影响面）、reason、user_ruling（裁定日期）、status。
# temporary 项在对应任务合入后删除；permanent 项长期保留。
# 可选 `slots`：机器可读的**逐槽例外**（用例的 RTL 承载按此比对，不让差异静默
# 逃过判据）——`case` + `slot`（0 基）+ `chipyard`（RTL 侧期望）；该槽在
# QEMU/gem5 侧仍按规范值判。差异被修好时该例外不再成立 ⇒ 承载判红，提示删除条目。
