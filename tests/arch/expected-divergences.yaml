    reason: "Tiny 无 cfx15（没有 cfx_hart），`m16-chipyard-021` 又以「Tiny 无 cfx15 不回归」为硬判据；`11-cfx/escape_ciii_cfx` 仍按旧编码集断言 `imms18 = 2` ⇒ `ILLI`。ADR-0060 D4 的编码集变更随工具链（`m16-llvm-001`）/spec（`m16-spec-003`）同步后统一。"
    user_ruling: "2026-11-23（任务书：Tiny 无 cfx15 不回归）"
    status: active
    close_when: "spec/工具链落地 `imms18 ∈ {0,1,2}` 并更新 `tests/inst/11-cfx/escape_ciii_cfx.S`（Tiny 侧改为 CFXESC 或显式 N/A）"

