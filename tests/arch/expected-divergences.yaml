  - id: DIV-15
    kind: permanent
    scope: [qemu]
    impact: "QEMU 的 I 侧「D 写回后未发 I 命令仍取到新码」不可判：`cache.body.S` 的 I 侧用例只断言 invalidate/flush 后取指重取（三方逐槽），不把「I|clean 是 no-op 的旧指令可见性」放进槽。"
    reason: "QEMU 是功能模型，没有 I 阵列：任何写回 RAM 的 `address_space_write` 都会经 `DIRTY_MEMORY_CODE` 的 `tb_invalidate_phys_range()` 使 TB 失效（`m16-qemu-003` 新发现①）。因此「D clean 后未发 I 命令」在 QEMU 上恒取新码，而 CACHE-19 的 `I|clean` no-op 要求在 gem5/RTL 上仍取旧码——同一槽在 QEMU 上不可能与 gem5/RTL 同值。该点的独立判据改由 RTL 缓存日志承担（`check_cache_rtl.py`：`icache` 不得出现 `op=clean`），gem5 的负例由 `m16-gem5-022` 的证据承担。"
    user_ruling: "2026-11-24（本任务；DIV-01 的同类功能模型限制）"
    status: active

