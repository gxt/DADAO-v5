  - id: DIV-11
    kind: temporary
    scope: [chipyard]
    impact: "RTL 仍按 R2 的 `escape imms18` 编码规则（Vast 接受 `imms18 ∈ {0,1,2}`、Tiny 只在实现 cfx_hart 时接受 bit1）；R3 规定 `imms18 != 0` 一律 `ILLI`，故在 `m18-chipyard-002` 前 RTL 与 QEMU/gem5/LLVM 不一致。"
    reason: "`m18-spec-007`（DADAO 0.8.0）把 `escape` 改为无偏移的 `escape cfxHA`：`imms18` 为 SBZ，非 0 ⇒ `ILLI`，旧 `+0/+4` 偏移与帧选择位作废；`m18-llvm-002` 的汇编器已拒绝第二操作数（旧 `escape …, 8` 链例不可再汇编）。gem5 由 `m18-gem5-004`、QEMU 由 `m18-qemu-008` 迁到 R3；RTL 的迁移在 `m18-chipyard-002`。"
    user_ruling: "2026-11-26（m18-spec-007 / ADR-0061 R3）"
    status: active
    close_when: "m18-chipyard-002 合入（RTL 对 `imms18 != 0` 统一 `ILLI`）"

  - id: DIV-09
    kind: temporary
    scope: [chipyard]
    impact: "U/S 访问**无 `<mode>` 行**的 cfx（Vast 上为 cfx3/cfx4；Tiny 的 legacy cfx63 亦同）一律 fail-closed ⇒ `CFXPERM`；QEMU 为每个 cfx 建有模式行，可由固件按需开放。"
    reason: "019/020 只给 cfx0/cfx2 打开模式行（cfx3 保持 legacy、cfx4 只实现 cg8/cg9/cg12）；cfx5/15/32/34 的模式行已随 027/021–023 落地。"
    user_ruling: "2026-11-22（任务书：020 仅补 cfx0/2 路由）；2026-11-25 收窄（cfx5 随 m16-chipyard-027 落地）"
    status: active
    close_when: "cfx3/cfx4（及 Tiny 的 cfx63）的 `<mode>` 行落地"

  - id: DIV-15
    kind: permanent
    scope: [qemu]
    impact: "QEMU 的 I 侧「D 写回后未发 I 命令仍取到新码」不可判：`cache.body.S` 的 I 侧用例只断言 invalidate/flush 后取指重取（三方逐槽），不把「I|clean 是 no-op 的旧指令可见性」放进槽。"
    reason: "QEMU 是功能模型，没有 I 阵列：任何写回 RAM 的 `address_space_write` 都会经 `DIRTY_MEMORY_CODE` 的 `tb_invalidate_phys_range()` 使 TB 失效（`m16-qemu-003` 新发现①）。因此「D clean 后未发 I 命令」在 QEMU 上恒取新码，而 CACHE-19 的 `I|clean` no-op 要求在 gem5/RTL 上仍取旧码——同一槽在 QEMU 上不可能与 gem5/RTL 同值。该点的独立判据改由 RTL 缓存日志承担（`check_cache_rtl.py`：`icache` 不得出现 `op=clean`），gem5 的负例由 `m16-gem5-022` 的证据承担。"
    user_ruling: "2026-11-24（本任务；DIV-01 的同类功能模型限制）"
    status: active

