# tests/inst.yaml — inst scope 根级用例清单（Process-09 §5）
#
# 字段（每条目恰好五项）：
#   id         inst-<ext>-nnn（如 inst-base-001；四份索引内全局唯一）
#   file       tests/inst/ 下的相对路径（必须存在）
#   platforms  非空列表；inst: system（user/hw 预留）
#   level      smoke | full（smoke = 由 L2 覆盖：`check-inst-smoke` 代表集或
#              `check-{rnd,minmax,fma,clmul}-probe`；full = **不在 L2 代表集**——
#              含 L3 `check-inst` 载体册、未入门控的册（rev/bitcnt）与手工探针）
#   requires   依赖项列表（可为空）
#
# 门控：make check-tests-index（L1，静态）；`TESTCASES-072t` 首次填入实际 case。
# 本清单逐文件一条（向量 YAML + 探针 C/IR 源）；条数由 `check-tests-index` 现场统计。
