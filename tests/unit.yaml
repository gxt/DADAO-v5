# tests/unit.yaml — unit scope 根级用例清单（Process-09 §5）
#
# 字段（每条目恰好五项）：
#   id         unit-<module>-nnn（如 unit-llvm-001；四份索引内全局唯一）
#   file       tests/unit/ 下的相对路径（必须存在）
#   platforms  非空列表；unit: host | toolchain
#   level      smoke | full（smoke = 由 L2 `check-unit` 覆盖；full = 不在 L2
#              代表集——lit 全量档 MC-gen、M6 执行向量（手工））
#   requires   依赖项列表（可为空）：toolchain / qemu / lli / picolibc
