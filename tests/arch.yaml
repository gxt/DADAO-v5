# tests/arch.yaml — arch scope 根级用例清单（Process-09 §5）
#
# 字段（五项必填 + 两项可选；arch 条目两项都必填）：
#   id         arch-<cfx>-nnn（如 arch-umon-001；四份索引内全局唯一）
#   file       tests/arch/ 下的相对路径（必须存在）；`kind: driver` 时指向驱动
#   platforms  非空列表；arch: system（hw 预留）
#   level      smoke | full（smoke = 由 L2 覆盖：`check-arch-smoke` 代表集）
#   requires   依赖项列表（可为空）
#   kind       可选：asm | driver（缺省 asm）；driver = `file` 是 scope 内驱动
#   machine    可选（arch 条目**必填**）：tiny | vast | user；arch 固定 vast
#
# 门控：make check-tests-index（L1，静态）；检查 machine/kind 取值与
# 「arch 条目只能 vast」。条数由 `check-tests-index` 现场统计。
# 本清单逐文件一条（`tests/arch/<cfx>/*.s` 执行向量）；驱动型条目指向
# `tests/arch/<cfx>/check_*.py`。cfx 划分按 `spec/DADAO-12 §3` 与 bootrom 行为：
# m5 向量由 SEE bootrom 装入 cfx_umon 用户向量后以 user 模式运行 ⇒ `umon`。
- id: arch-umon-001
  file: arch/umon/m5_perm_badcombo_cfxreg.S
  kind: asm
  machine: vast
  platforms:
  - system
  level: smoke
  requires:
  - bootrom
