# 驱动型 case 的骨架验证（m16-testcases-006）：`arch-ptw-002` 已带签名流
# （`tests/arch/ptw/expected.yaml` 的 `signature:`），由 `run_arch.py --cfx 4`
# 经 scope 内驱动 `arch/ptw/check_tlb.py` 调起。其余 14 条 `arch-ptw-*`
# 随 cfx4 迁移任务登记，不在本任务新增。
- id: arch-ptw-002
  file: arch/ptw/check_tlb.py
  kind: driver
  machine: vast
  platforms:
  - system
  level: full
  requires:
  - qemu
