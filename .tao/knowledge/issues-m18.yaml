- id: ISS-m18-011
  scope:
  - linux
  milestone: M18
  status: open
  closed_in: null
  resolved_by: null
  title: "【P1】`m18-linux-028` 修后残余：纯用户态忙等探针（4 线程 × 20M 次自旋，线程栈预驻留）约 **7/20**–**13/20** 次停在“某个任务的用户帧 ip 落在相邻函数体（`worker+0x10`，即该函数 prologue 之后）、SP 仍是该任务自己的用户栈、`start` 仍为 0”，无 die、无 `CFXESC`（`cfx_smon` 最后一条同步记录 CID/CFXTRAP 均正常；注：样本中另出现 1 次 `K2_FAIL_RECURSIVE` die，属 `ISS-m18-012`，不是本签名）。两子签名：① **spin**（帧 ip 落在相邻函数体、`start` 未置位）；② **sigsegv**（帧内寄存器被破坏后 `st.t done[idx]` 的基址成为野值 → user 缺页 `result=die-no-vma`/`vma=0x0-0x0`，任务被 SIGSEGV 杀死）。交付两轮 20 启样本：pass 11/7、spin 8/10、sigsegv 1/3；合计 40 启 pass 18 / spin 18 / sigsegv 4，QEMU monitor 显示 CPU 在 user 模式执行该 ip。对照：同一内核 `m18-linux-007` pthread 探针 5/5、K2 170/170、K5 285/285、K6 82/82；修前同探针 3/3 以 `CFXESC` 签名挂死（ISS-m18-009 主因，已修）。同一修复下 LTP 4 轮：3 轮 clean（PASS=14）、1 轮 `ltp-mmap01` SIGNAL 139（ISS-m18-005 族，单独计数）。现象指向“异步精确返回落在 `ret` 的 fall-through”或捕获/恢复的 RAS 与 `inner_cfx_code` 之外的第三种跨任务状态；可能是 QEMU 模型对异步精确点（`cg15 rc2` = 已提交指令之后的 rb0，“跳转即目标”）在 `ret` 上的口径与内核假设不一致。处置：另立 `m18-linux-029` 承接（先核对 QEMU 侧 `ret`/间接跳转边界的 `cg15 rc2` 取值；内核侧不改 QEMU）。"
- id: ISS-m18-012
  scope:
  - linux
  milestone: M18
  status: open
  closed_in: null
  resolved_by: null
  title: "【P1】用户缺页 supv 通道的递归保护是 **hart 全局** `dadao_trap_busy`，跨 `schedule()` 误报：一个任务在 `dadao_user_fault_from_umon()`/`dadao_do_page_fault()` 内睡眠（缺页分配/mmap 锁竞争）时该位仍为 1，另一任务的 user 缺页交接 `trap cfx_smon, DADAO_SMON_FROM_USER` 到达即 `K2_FAIL_RECURSIVE` → `dadao_die`。现场（`m18-linux-028` 20 启样本 1 次，boot 19）：`dadao: recursive supv exception cause=CFXTRAP(0x1) ip=dadao_umon_excp+0x224 info=0x7f0802f5 ptbr=0x205e0000 sp=0x2002010f800` → `dadao: die mode=2 code=0xe`；紧邻前一行是该 worker 的 `K4 umon->smon ... ip=0x22110 info=0x8eb90`（`done[]` 数据页缺页），说明其 handler 仍在睡眠。与 `ISS-m18-011` 同**类**（supv 通道状态按 hart 而非按任务）但不同变量/签名（011 是 `inner_cfx_code` 静默挂起；本条是 `dadao_trap_busy` 具名 die），与 029 的异步精确点残余**不同源**；`m18-linux-028` 未改 `dadao_trap_busy`/`dadao_user_fault_from_umon`（其 traps.c 补丁只删 FROM_ASYNC 分支），故非 028 引入。频率：028 20 启样本 1/20；reviewer 还原后 3 启样本 1/3。复现条件：≥2 任务、一方在 user 缺页通道睡眠（分配/锁竞争）时另一方 user 缺页交接。处置：递归保护改按任务（thread_info/task_struct）或在可睡眠点前清位，并与 supv 静态帧 per-task 化（011 备注）一并评估。"
