  resolved_by: m18-qemu-001（参考机复核不复现 + 新回归向量；纯 QEMU 侧无补丁变更）
  title: 【P2】`lr`/`sc` 的**窄宽度条件写会被静默丢弃**（参考机器 `qemu-dadao`/`qemu-system-dadao`，`target/dadao/translate.c` 的 `gen_sc`）：`sc.t`/`sc.o` 在「同一 TB 内先有同址窄加载（`ld.ut`）再 `lr`/`sc`，且该地址的 8 字节字里另有被写过的 `int`」时，`sc` 报成功（`rdHB=0`）、内存却保持旧值；`a_or`/`a_cas` 型 RMW 因此丢更新。最小复现：`m18-infra-001` 运行期证据的 `probe/narrow_cas_probe.c`（两次 `st.o` + `ld.ut` + `lr.t`/`sc.t` ⇒ 写丢失；去掉该 `ld.ut` 即正常），`word_cas_probe.c` 的 `lr.o`/`sc.o` 同场景正常。后果：`m18-infra-001` 前 musl `mallocng` 的 `avail_mask`/`freed_mask` 记账被破坏 ⇒ K6 `die-no-vma` 与 guest `grep` rc=139（`ISS-497`/`ISS-499`，已由 musl 侧改用字 CAS 规避）。处置：查 `gen_sc` 的 `MO_ALIGN`/窄宽度 BE 存储路径与 TCG 的 load/store 交互，补一条 `lr.t`+`sc.t` 同址 CAS 的向量（覆盖「同 TB 内前置窄加载」），修后 `ISS-497` 的窄 CAS 口径可作为回归向量。**m18-qemu-001 复核结论（当前参考机不复现）**：`gen_sc`/`lrsc_memop` 自 `m15-qemu-002` 起逐字节未改动，当前装机的 `qemu-dadao`/`qemu-system-dadao`（QEMU 11.1.1 + 本组件补丁集）在 **180 组用户态形状矩阵**（前置 `st.o`/`st.t` × 同址/邻址 `ld.ut`/`ld.o` × 宽度 `.b/.w/.t/.o` 与偏移 × CAS 环形状）与 **11 个 system 形状探针**（含 `ld.ut` 在 `lr` 前/后、`ld.o`、1/2/8 B 宽、失败路径）上全部正确：`sc` 报成功时窄写必然落地、邻居半字不变。原症状（mallocng
    `a_or` 丢更新）的**剩余成因在 musl 侧**：`m18-infra-001` 之前 `a_cas` 用 `lr.t`/`sc.t`（窄 CAS），其修复已把该原语整体替换为 8 字节字 CAS；用修前 `a_cas`（逐字复刻）重建的 musl 在 400 轮 malloc/free 压力下也不再触发。回归覆盖：新增 `tests/inst/00-isa-design/atomic_rmw.S` 第 14/15 点（同一 TB 内同址 `ld.ut` + `lr.t`/`sc.t` CAS 的正常路径与保留被抢失败路径），并以「丢弃窄写」「把条件写改无条件」两处注入证明该向量可达 FAIL。
