  title: 【P3】K1 门控的「阶段顺序」证据是**间接**的：共享 BootROM 固件的 power/hmon/smon **不打印任何东西**，而 K1 任务禁 `-d` 逐指令日志，故 `check-linux-k1` 只能用「镜像索引表（hmon<smon 各 1 条）+ 各阶段唯一产物」（boot info 15 字段 = hmon；`ptw_enable`/传入 PTBR/预建表 1 超页/`rb16+rb17` = smon）证明**三阶段都跑过**，**不能直接观测三阶段的相对顺序**（`m14-linux-005` 复核 §4 判定：够用但非直接观测、不阻断）。处置：给共享固件三阶段各加 1 行 semihosting 标记（改 `tests/shared/bootrom/**`，同时影响 `check-linux-k0` 与 `k0_boot_probe`），另立任务；补强后门控改为直接断言顺序。**m18-linux-008 复核（未落地，待另立任务）**：① 该任务硬约束的 `tests/shared/bootrom/**` **不存在**，共享固件实际在 `tests/ee-vast/{power,hmon_k0_vast,smon_k0_vast}.S`，BootROM 构建器在 `tools/qemu/k0_boot_probe.py`（`build_firmware()` 现无 power 阶段 defsym 入口，需新增 `power_defs`）；② `check-linux-k0` **不启动 QEMU**，K0 侧只能对 BootROM 镜像做静态断言（三阶段标记字符串各在自己的窗口内），运行期顺序只能由 `check-linux-k1` 判；③ 交叉影响：chipyard 侧同源 `power_vast.S`（`POWER_RTL_BODY=1`）与签入的 bootrom hex 必须逐字节不变 ⇒ 标记须用 `--defsym`（默认 0）门控，仅 K0/K1 打开。
