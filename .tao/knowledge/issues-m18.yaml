  title: '【P3】`m14-linux-028` 复核的三条非阻断 finding：R1 `TASK_UNMAPPED_BASE` 页对齐这半个修复无断言覆盖（A2 用 `mm_alloc()` 的 mm、不经 exec，只覆盖 `mmap_min_addr` 那半）⇒ 应补「exec 后 `mm->mmap_base` 页对齐」断言；R2 完成区遗留①「18 条 musl」计数/归属不准（实为 musl 8 + 其它 11），且全局 `check-patch-tree` rc=1 属在途/基线；R3 证据脚本的补丁树判据只 grep `linux: assertion`、不打印问题总数 ⇒ 补一行现场统计。处置：随下次触碰这些门控/任务书时修。**m18-linux-008 处置（2026-11-24）**：R3 已落地（证据脚本从 `check_patch_tree.py` 的输出**现场派生**问题总数与逐组件归属，并校验 `total == Σrows`、`rc==0 ⇔ total==0`，另给「一致/不一致」两路解析自检）；R2 的计数口径同源（不再手写组件归属）；**R1 未落地**：`exec` 后 `mm->mmap_base` 在用户态不可观测（本端口走 `CONFIG_MMU && !HAVE_ARCH_PICK_MMAP_LAYOUT` 的 legazy 布局，`unmapped_area()` 的上取整把 mmap_base 的非对齐掩盖掉），只能由内核侧探针打印（`components/linux` 的 `k5_pagesz_selftest`），而本任务禁改组件补丁 ⇒ 待另立任务。'
