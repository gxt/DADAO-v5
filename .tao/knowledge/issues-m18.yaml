- id: ISS-m18-009
  scope:
  - linux
  milestone: M18
  status: open
  closed_in: null
  resolved_by: null
  title: "【P1】用户态异步捕获/返回路径**丢任务**（可确定性复现）：`m18-linux-007` 的纯用户态忙等探针 **8/8** 触发，控制台末行为 `K2 async user frame_ip=…`，此后无 `PTHREAD end`、无 die/panic，任务不再推进。此前的 `ISS-m18-005`（随机 case `HOST_TIMEOUT`：`mm-pfnmap`/`mm-map-populate`/`futex-wait-timeout`/`fstat02`）疑为同族，不能再按宿主 flake 计。**主因已由 `m18-linux-028` 修复（CFXESC），残余归 `ISS-m18-011`；本 issue 保持 open**：user 异步把捕获交接 `cfx_smon` 后不 escape，`inner_cfx_code` 停在 smon；回用户态的 work loop `schedule()` 后，另一个任务恢复 umon 帧 `escape cfx_umon` 即 `CFXESC`（§5.3 step 0），且该 escape 在用户 SP 恢复后执行 ⇒ die/semihosting 都不可用，静默自旋（现场 `CFX02 CID=0x8 CFXESC CIP=umon escape CINFO=0x7e000000`）。修法：user 臂改写 hart 出口意图（rc8=supv/rc9=prev cfx/rc10=finish/rc11=继承掩码）后 `escape cfx_hart` 到 supv finish，先恢复 `inner_cfx_code` 再跑 work loop（`dadao_async_user_finish`）。修后 CFXESC 签名消失、K2/K5/K6 与 007 pthread 探针全绿；**残余**：纯忙等探针仍 ~50% 停在“任务用户帧 ip=`worker+0x10`（相邻函数体）、SP 为该任务用户栈、`start` 未置位”，无 die/CFXESC，另登 `ISS-m18-011`。"
