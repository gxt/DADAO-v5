  title: "【P3】`check_patch_tree.py` 只验「补丁 ↔ 源树一致」，不验「源树本身正确」：`m18-linux-016` 重导 gem5 补丁时，`.work/source/gem5` 自身缺 `} // namespace gem5` 闭合行，`make_patch.py gem5` 如实导出了缺行补丁，而 `check-patch-tree` **rc=0**（补丁与坏源树一致）⇒ 括号 544:543 不平衡被漏过，靠 architect 的提交前 diff 才抓到。影响：任何会话重导补丁都可能把「源树本来就坏」的尾巴固化进补丁；这类错误在编译前不可见。建议：`check_patch_tree` 对每个导出补丁加廉价自检——① C/C++ 类补丁的文件尾完整性（与上一版补丁 tail 比对或括号平衡）；② 新增文件的 namespace/brace 平衡；③ 补丁 `index` blob 与源树 `git hash-object` 一致（`check-index-blobs` 已覆盖部分）。"
