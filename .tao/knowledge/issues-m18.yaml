  title: 【P3】`m14-linux-026` 复核的三条非阻断 finding：F-a `tools/linux/k4_switch_probe.py` 的 S6 正向断言只钉调用字面量 `clockevents_config_and_register(&dadao`，删掉注册行后仍能命中注释 ⇒ 应改钉调用形态并补 `clocksource_register_hz` 同判（现 clocksource 半边无静态断言，靠 K5 探针 C1+T1 覆盖）；F-b 旧断言「未注册 clocksource/clockevent」被翻转，按 `docs/Process-07 §4a` 应补退役台账（替代 = `k5_clocksource_probe` C1+T1–T4，先例 = k3 R4）；F-c 两条 WARNING 白名单按 `file:line` 写死，本轮输出 0 条 WARNING（空转），应改按告警文本匹配。处置：随下次触碰这些门控脚本时一并修。**已修（m18-linux-008）**：F-a `clock_static()` 在注释剥离后的源码上钉调用形态（`clockevents_config_and_register(&dadao_clock_event_device,` 与 `clocksource_register_hz(&dadao_clocksource,`）；F-b 记录写入 `Process-07 §4a.4` 并由 `check-linux-k6` R 组双向机械核对（`retired-back-44` 注入可判红）；F-c 白名单改 `KNOWN_WARNINGS`（按告警文本 + 无消息 `WARN_ON` 的站点文件），并用 `check_known_warnings_static()` 把白名单锚回 `init/main.c`/`fs/sysfs/group.c` 的源码，空转即红。
