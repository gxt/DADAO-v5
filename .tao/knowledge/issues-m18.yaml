  title: 【P3】K2 两条派单口径缺「可达 FAIL」断言（`m14-linux-008` 复核实测）：① 把 `local_irq_save` 的 `flags` 截成低 32 位 ⇒ `k2_irq_probe` **95/95 全绿**；② 把 `enable` 改成全清 0（而非只清源位）⇒ **同样全绿**。两条都是本任务**明确要求**的性质，却无判据可抓 ⇒ 违反「每条断言须有可达 FAIL 路径」。处置：在 `m14-linux-009`（K2 收口门控）补两条绝对断言——`P1`：`before_smon` == `init_IRQ` 行值（高位参与比较）；`P5`：`enable` 态 == `disable` 态 `& ~DADAO_IRQ_SOURCE_BITS`。另订正 `run.sh --inject` 的「time 6 路」标签（实为 5 路）。**已修（m18-linux-008）**：`P1` 的绝对锚点在 m14-linux-009 已就位；`P5` 原仅有**相对**锚点（`enable == disable & ~bit`），实测不足以判红——`enable-write-zero` 注入下 `start_kernel` 早段的同一次全清写已把行内其余位抹掉，P5 现场变成 `disable=0x8000 / enable=0x0`，相对式比较的是 `0 == 0`；故本任务补两条**绝对**锚点（`enable == 复位全 1 只清源位`、`disable == 复位全 1`），两路注入（`flags-32`⇒P1、`enable-write-zero`⇒P5）实测判红并 `cp`+md5 还原回绿；路数标签改由 `--list` 现场派生。
