  resolved_by: m20-llvm-002（2026-11-25：AsmParser 按组文本 bank + 组内编码判 count；跨 bank 5/5 rc≠0、合法组零 diff、check-lit 184/184、encoding oracle 124/124）
  title: '【P2】LLVM 汇编器仍接受跨 bank 的文本寄存器组：`ra2rd {rd63:rf61}, {ra63:rb61}` 被接受并编码为 `0x40BBFFFF`（immu6=63，起始 63+63>64 应 ILLI），AsmParser 的 count 推导按寄存器枚举 id 差值跨了 bank，`mreg_range_overflow` 未拦住；`m20-llvm-001` 已在 MC 反汇编层拒绝该字（`<unknown>`），但汇编期仍可生成非法编码。证据：`m20-llvm-001` 复核，`llvm-mc` rc=0、`llvm-objdump` 显示 `<unknown>`。处置：AsmParser 按组文本的 bank 与起始/个数判 `mreg_zero`/`mreg_range_overflow`（不得用跨 bank 的枚举差值），补 lit 负例。'
