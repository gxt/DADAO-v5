  title: 【P2】「同组件单写者」按**组件**划分不够，实际冲突发生在**共享构建树**：非 linux 组件任务（如 `m14-qemu-006` 跑 `k2_*` 探针）同样会写 `.work/build/linux/.config` 与内核镜像 ⇒ 与 linux 任务并行时互相打红（`make_defconfig …did not survive olddefconfig`、K1 镜像混入他人的 `CONFIG_DADAO_K2_SELFTEST_UNKNOWN=y`）。`m14-linux-011` 复核实测 3 次 `--gates` 有 2 次因此红，只能等安静窗口重跑。处置：把「单写者」的粒度从组件改为**构建树**（linux 构建树 = 独占资源，凡会 `make_defconfig`/`build-linux` 的任务都必须串行或按 build-root 分目录）。
