  title: "【P3】K6 镜像没有 `/proc` 与 `mount` applet：`config.min`/应用集包含 `ps`，但 `/proc` 未挂载、镜像也不含 `mount`，`ps` 只能 `can't open '/proc'`（rc=1），K6 交互面无法观察进程。`m18-integ-001` 用一次性 `/procinit` 探针镜像（同 busybox/initramfs，加一个 mount procfs 后 exec sh 的静态 ELF）验证 `ps` 输出正常（`29 … R ps`），未改交付镜像。处置：K6 镜像若需 `ps`，在 `/init` 挂 procfs 或把 `mount` 编入 applet 集；否则从 `APPLETS`/`config.min` 移除 `ps`，避免“有 applet 不可用”。复评条件：K6 镜像挂 `/proc` 后，交互集直接用交付镜像跑 `ps` 并删本探针。"
