  title: 【P3】证据脚本「固定基线」写法的三个共性坑（`m15-spec-008` 两轮复核实测）：① 基线取「分支分叉点」时，若 `master` 不可见（新 clone 只有 `origin/master`），脚本会静默回退 `HEAD~1` ⇒ 改动面断言假红、正文比对退化为恒真；② `git diff --name-only` 输出依赖 `core.quotepath=false`，新 clone 未配则非 ASCII 路径被 C 转义 ⇒ 改动面假红；③ 任务书里的「当前即 HEAD~1」这类描述会随追加提交过时。处置建议：证据脚本统一 `_git() { git -c core.quotepath=false ...; }`；分叉点解析失败时 `origin/master` 兜底，仍失败则**报错退出**而不是回退 `HEAD~1`；基线写成变量并在输出首行打印；④ 只按 `$BASE..HEAD` 判「变更集」在交付**未提交**时假红（`m14-linux-046` 第 2 轮复核实测：契约撤回未提交 ⇒ `git diff $BASE HEAD` 非空），只按工作树判则在**提交后**假红 ⇒ 统一「未提交 ∪ `$BASE..HEAD`」，判「净效果为零」时对**工作树比 `$BASE`**（无 `HEAD`，已写入 `AGENTS.md §4`）。
