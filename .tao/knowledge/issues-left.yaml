  title: "【P2】共享 musl 静态产物在补丁集重放后未重建时无门控发现：`m18-integ-001` 在 master 上跑 kselftest 两次，`futex-wait-timeout` 稳定 FAIL rc=1（`not ok 1 futex_waitv monotonic returned 22`）；根因是 `.work/source/musl/lib/{libc.a,crt1.o}` 构建于 2026-11-24 11:13，早于 `m18-linux-016`（11-28 04:14 合入的 `__dadao_argmask` 449=0x09），`syscall()` 仍把全部实参放 RD 组 ⇒ 内核读 `nr_futexes=0` 返 EINVAL。私有重放 + `make build-musl`（14:34 重建）后同一 master 两轮 14/14 与 8/8 全绿。建议：给静态 libc.a/crt1.o 加「补丁集/源树摘要」戳，由既有 `check-musl-freshness`（或套件跑批入口）校验，落后即红而不是静默用旧库；并在合并动作的组件补丁重放清单里强制重建。"

