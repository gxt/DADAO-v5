  title: "【P3】`check-linux-k6` 不派生 `CONFIG_INITRAMFS_SOURCE`：它重建 K6 initramfs 后只应用 `CONFIG_PINS + CONFIG_DADAO_K6_SHELL=y`，镜像选择依赖构建树里的环境值；若 `.config` 仍指向别的 cpio（实测：切成 `/proc` 探针镜像后），门控会静默启动**错误的 /init**，表现为 4 条 S/C/E 失败（启动行/提示符/exit 缺失）而镜像与 busybox 检查全 PASS，误导性强。建议：K6 门控在 build_kernel 里显式 `apply_config_lines(CONFIG_INITRAMFS_SOURCE=linux_initramfs_dir()/initramfs.cpio)`，与 `run_suite.restore_default_initramfs()` 同口径。"

