  resolved_by: m19-infra-001：节点装宿主 clang 后 check-linux-toolchain PASS；宿主依赖记 nodes.md §5
  title: 【P3】`check-linux-toolchain` 的「宿主 x86 对照」行依赖宿主 `clang`，却参与报告逐字比对（`VOLATILE_RE` 只豁免「生成时间/机器指纹」）⇒ 宿主无 `clang` 的节点（`zzx-NF5280` 实测）在报告行写成「宿主 clang 不可用」后该门控恒红，与节点环境无关。临时处置：节点 `apt install clang`（18.1.3）后即 PASS。建议：把该行并入 `VOLATILE_RE`，或让比较只针对 target 侧矩阵行。
