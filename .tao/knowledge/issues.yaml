  notes: "【正式登记（源 `TESTCASES-044t`「第 1 轮 reviewer 验收」finding；architect `/complete` 收尾登记，2026-10-15）】**现象**：`TESTCASES-044t` 证据脚本把「备源通道」`direct-github`（`https://github.com/kraj/libc-test.git`）的 `ls-remote`/可达性写成**硬断言**（B3–B5）。任务规范（该任务书「§取源通道」）只要求**代理通道**可用、直连**如实记录**即可；本机 `github.com` 持续 TLS 不通 ⇒ 全量跑 **100/103**、3 条 FAIL，而**交付物本身无缺陷**（锁条目 / 裸镜像 / 工作树 / 幂等 / 可复现（reviewer 独立重建）/ L1 门控 **全绿**）。engineer 现场日志（2026-10-15）证其时直连 **rc=0**（非编造），故 `reviewer` 已复核「100/103」的最简解释 = **环境可达性差异**，非假绿亦非交付缺陷。**判据（如实）**：脚本**能失败**（`--inject 1` 3 条可达 FAIL、reviewer 另注入 `shallow` 反例亦可达 FAIL）⇒ **不假绿**；问题在**另一侧**：断言**依赖执行机网络环境** ⇒ 换机器 / 换网络即**结果漂移**（同一提交出现两种总数），违背「判据须机器可判且**不依赖环境**」。**建议**：非本任务必需通道（备源 / 旁证）一律改为 `INFO`/`SKIP` 输出并**不计入** `checks/failed`；仅对**本任务必需通道**（`source[0]`）保留硬断言。**性质 = 证据脚本口径**（非交付物缺陷、非阻断）；本任务**不改**（证据脚本在 `.work/**`、gitignored、非交付物）。**交叉引用**：同类判据 = `ISS-213`（覆盖计数**写死** ⇒ 指令集增删即**假红**）——两者同属「证据脚本断言口径」：**`ISS-213` = 期望值不现场派生；本条 = 断言不区分必需/环境依赖项**。证据指针：`.tao/tasks/testcases/TESTCASES-044t-libc-test取源与锁定.md`「第 1 轮 reviewer 验收」finding + 完成区「遗留问题」；脚本与日志在 `.work/evidence/TESTCASES-044t/`、`.work/log/testcases/`（本机留档，不入库）。"

