  notes: "【正式登记（源 = `TESTCASES-055t` 完成区「新发现/坑 ⑦⑧」+「遗留问题 ①②」，2026-10-20；architect 提交时登记）】**现状（现场数字）**：① `tripforce` 构建即 `fatal error: 'openssl/des.h' file not found`（硬依赖 `DES_fcrypt`），DADAO 无 OpenSSL 端口 ⇒ 8 基准中唯一**未构建**项（built=7）；② `hint` 可构建（`runtime=0.001`）但运行是**固定工作量**（`NSAMP=200` / `STOPTM=240` 客机秒），`qemu-dadao` 下 `timeout 300` 用满（rc=124），另测 **900 s 仍未完成**（**900 s = 142/200 采样**、**300 s = 131/200 采样**，采样已落日志；**采样点 ≠ 完成度**，完成判据 = 跑满 `NSAMP=200`）⇒ 无 oracle 且未跑完，冒烟未闭环。**待用户裁定（勿悬空）**：① `tripforce` ⇒ **已裁定「跳过」（2026-10-20 用户，依据见本 notes 末段）**；② `hint` —— 跳过 / 加长预算（900 s 仍不足，完成所需时间未知）/ 降 `NSAMP`（改运行参数，须裁定是否允许）。**等级 = P3**（两者均不阻断本册判据：7/8 构建、9 次运行、CoreMark/STREAM 自校验 PASS 已支撑「第一步走通」）。**证据指针**：`.tao/tasks/testcases/TESTCASES-055t-ansibench语料接入.md` 完成区「验收结果 · 构建/运行」「新发现/坑 ⑦⑧」「遗留问题 ①②」；`.work/evidence/TESTCASES-055t/run.sh`；`.work/log/testcases/TESTCASES-055t-*.log`。**交叉引用**：`TESTCASES-055t`（登记源）、`ADR-0033 D5`（不入门控）；与 `ISS-305` 同册。**边界**：本笔只登记 ⇒ 未引入依赖 ✗、未改语料/运行参数 ✗、未改超时预算 ✗。**【tripforce —— 已裁定跳过（2026-10-20，用户）】**源码级依据（本轮 architect 现场逐条核）：① `ansibench/tripforce/src/tripforce.c:7` `#include <openssl/des.h>`、`:495` 调用 `DES_fcrypt()` —— OpenSSL **专有「传统 DES crypt」API**，C 标准库无该符号 ⇒ 必须链 `libcrypto`（`mk/gcc/tripforce/stdflags.mk:3` `CFLAGS += -lcrypto $(mp)`）；② `tripforce/makefile:5` `mp = -fopenmp` + 源码 `:471` `#pragma omp parallel num_threads(NUM_CORES)` ⇒ 另需 **OpenMP 运行时（libomp）**，DADAO 侧亦无。**判据**：它是 8 个基准中**唯一**同时需要这两个外部依赖者 ⇒ 为其引入 **OpenSSL（新上游，须另立 ADR）+ libomp 移植**的代价与收益不符 ⇒ **不纳入 ansibench 第一步范围**；M10+ 若确需 DES 类负载再单独立册。**未采用备选**：改语料（自带 DES 实现 + 去 `omp`）属**改基准本身**，超出 `ADR-0033 D4` 授权（D4 补丁仅限 bank/UB 类 `int`↔指针失配）✗。**后果**：本册维持 `built=7/8`，`tripforce` 记为「**不支持（已裁定）**」，不计入冒烟失败；用户原话见 `TESTCASES-055t` 册末「裁定（2026-10-20）」。**【hint —— 已裁定跳过（2026-10-21，用户）】**四档实测（递增 `timeout` 重跑；采样点 = `NSAMP=200` 中已完成点数）：**300 s→131**、**900 s→142**、**3600 s→157**、**7200 s→164** ⇒ 仍未完成（完成判据 = 跑满 200 点）；**边际 ≈ 514 s/点**（7200−3600 s 换 7 点 = 7/200），外推跑满需 ≈ 10 h 量级 ⇒ **qemu TCG 放大下平台不可达**。**宿主旁证（只作量级 sanity、不作性能判据）**：同 pin 同 `-O2` 的 x86-64 宿主 **152.4 s 跑完 171 点**（受可用内存所限而止、非完成）⇒ 放大 ≥ 数十倍，与册内「量级差 ≥100×」旁证同向。**裁定 = 跳过**（与 `tripforce` 同类处置）：不纳入第一步范围、**不计入冒烟失败**；**未采用备选**：降 `NSAMP`（等于改基准工作量，未获授权）✗、加长预算（四档已证不可达）✗。**后果（覆盖口径写实）**：8 基准中 **6 个有效**（`coremark`/`dhrystone`/`linpack`/`nbench`/`stream`/`whetstone`）、**2 个有据跳过**（`tripforce`/`hint`）；原文落点 = `TESTCASES-055t` 册末「裁定（2026-10-21）」段。"

