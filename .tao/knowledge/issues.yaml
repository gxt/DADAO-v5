- id: ISS-341
  scope: [spec, qemu, testcases]
  status: closed
  resolved_by: SPEC-187t
  title: >-
    ADR-0004 D5.8 的「exit code = 0x80 | spec_cause_bit_index」与 CFXREG 码不自洽：
    CFXREG 的 cause 位是 `1<<2`，按公式应是 `0x82`，但 D5.8/`cpu.h.patch`
    （`DADAO_EXIT_CFXREG`）把 CFXREG 定为 `0x84`；只有 CFXMEM（`1<<1`→`0x81`）
    符合公式。TESTCASES-092t 的 hmon exit 策略按任务书口径**逐码写死**
    （CFXMEM 0x81 / CFXREG 0x84 / ILLI 0x88 …），未做算术推导，避免与既有
    QEMU/ADR 码表冲突；需 SPEC/ADR 任务订正 D5.8 的措辞（公式 or 显式码表）。
- id: ISS-342
  scope: [spec, qemu, testcases]
  status: closed
  resolved_by: GEM5-020t
  title: >-
    cfx 寄存器组合错误（CFXREG）与 escape/trap 的异常目标 cfx 不一致：
    `helper_cfx2rd/cfx2rc` 对「rc ≥ scratch_regs_num / 不存在的寄存器组合」用
    `cfx_raise(..., cfxha /*被访问的 cfx*/, ...)`，而不是
    `env->inner_run_mode`（当前模式 monitor）。Node 启动链把 cfx_umon 的 hypv
    向量设为 profile ENTRY（测试本体），于是这类 fault 会**回到本体开头**
    （自环，`-d cpu` 恒 PC=ENTRY；m5_perm_badcombo_cfxreg 修复前 timeout）。
    测试资产的规避方式：body 先自装 cfx_umon 的 hypv 向量为本地 `escape` stub
    （见 `tests/arch/umon/m5_perm_badcombo_cfxreg.s`）。是否应统一为
    「current-mode monitor」需 SPEC/QEMU 判定（本任务不改 QEMU）。

- id: ISS-343
  scope: [qemu]
  status: closed
  resolved_by: QEMU-084t
  title: >-
    【P3】QEMU user-mode 对 guest RLIMIT_AS/DATA/STACK 是 no-op：guest setrlimit 返回成功，
    但 getrlimit 仍返回 RLIM_INFINITY，guest brk/mmap 不受限；与原生 Linux 不一致。
    证据：TESTCASES-099t 最小探针（RLIMIT_DATA=0 后 RW mmap/malloc 仍成功；原生 Linux
    返回 ENOMEM）。修复点：linux-user do_brk()/target_mmap() 的限额记账。注意：该缺口
    不是 libc-test malloc-brk-fail dynamic 的直接原因（该次 malloc 无系统调用）；该例
    的根因是 musl dynamic loader reclaim_gaps 捐赠启动堆。

