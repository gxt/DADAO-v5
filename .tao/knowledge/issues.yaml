  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `TESTCASES-048t` 第 2 步全量两档现场，2026-10-18；engineer 登记，待 architect 立项）】**五类现场签名（两档一致，均归 `blocked`）**：① clang 前端/后端崩溃 rc=-6（宿主信号，`clang: error: clang frontend command failed due to signal`）：`MultiSource/Applications/JM/lencod`（`explicit_gop.c`）、`MultiSource/Applications/obsequi`（`negamax.c`）；② `Cannot select: t29: ch = brind t28, t27`：`SingleSource/Benchmarks/Misc/evalloop.c`（间接分支未接 ISel）；③ `fatal error: error in backend: DADAO: a varargs call with register-exhausted arguments is not supported yet`：`MultiSource/Benchmarks/Prolangs-C/plot2fig`（`arc.c`）；④ `no libcall available for flog`（f80 `long double log`）：`MultiSource/Benchmarks/DOE-ProxyApps-C/CoMD`（`random.c`）、`MultiSource/Benchmarks/MiBench/consumer-lame`（`psymodel.c`）；⑤ 参考：`undefined symbol: RUNTIME_INIT` 的 `aarch64-init-cpu-features` 属 **AArch64 专有**、上游条件构建，**不算**本 target 缺口（已在驱动 `CASE_NOTES` 说明）。**性质**：均是**显式失败**（编译/链接报错，非静默错码）；属能力缺口，非测试缺陷。**建议**：④ 与 `ISS-193(b)`（libcall 缺）同族、②③ 与 `ISS-222`（ISel 缺口）同族，可按 M7/M8 排期收口；① 需最小化复现（`clang -c` 单 TU）。**等级 = P3**（6 例、非阻断本册）。**证据指针**：`.work/log/testcases/llvm-ts-user-{static,dynamic}-{static,dynamic}.json`（逐例 `reason` + `first_error` + `compile_cmd`）、`.work/log/testcases/llvm-ts-user-both-rerun.log`。**交叉引用**：`ISS-193`（libcall/ISel 剩余面）、`ISS-222`（`rotl`/`bswap`/VLA 等 ISel 缺口）、`TESTCASES-048t`。 〔立册（2026-10-18，architect）〕②③ → `LLVM-102t`（`brind` 可执行；varargs 契约层未规定 ⇒ `BLOCKED` 待裁）；④ → `LLVM-103t`（`flog` 最小补齐，并订正「f80」表述）；① clang 崩溃 2 例未立册（留待下一批）；⑤ `RUNTIME_INIT` 维持有据。 〔追加（2026-10-18，architect 登记）〕⑥ **链接期（非后端缺口，本册备查）**：`MultiSource/Benchmarks/Prolangs-C/archie-client` 的 include 修好后停 `ld.lld: error: undefined symbol: re_comp`；现场 = musl 无 BSD `re_comp`/`re_exec`，上游 `CMakeLists.txt:4` 用 `check_function_exists(re_comp)` 守卫、`:15` 才 `llvm_multisource(archie)` ⇒ **上游在无 `re_comp` 的 libc 上本就不构建该路径**；处置 = 保留 `blocked` + 精确 reason（不 `excluded`、不造 stub，`TESTCASES-050t` ① 已落纸）。① clang 崩溃 2 例仍无册（留待下一批）。 〔进展（2026-10-18，architect）〕② `brind` **已解** ✅（`LLVM-102t` A 段：`ISD::BRIND` Custom + `LowerBRIND`（`jump [rbT, rd0, 0]`）+ `BLOCK_ADDR` 三片 `ABS48`；`evalloop` 两档 pass、上游参考 stdout/exit `matched`、lit 33/33）。④ `flog` **已解** ✅（`LLVM-103t`：`LOG_F64`/`LOG10_F64` 注册；CoMD 两档 pass）。**剩余**：③ varargs 寄存器耗尽（`LLVM-102t` B 段，`ADR-0031` 已 `Accepted` 解阻塞）、① clang 崩 2 例（待诊断册）、⑤ `RUNTIME_INIT` 1 例（aarch64 专有，有据）⇒ `status` 保持 `open` 〔追加（2026-10-18，architect）〕**musl 封装类型面**（变参封装把指针实参读成整数）⇒ `INFRA-092t` / `ISS-271`；与 ③（**编译器侧** varargs 寄存器耗尽）为**不同面**：③ 是 callee 栈溢出预算，本项是 libc 封装 `.c` 的 `va_arg` 类型。 〔追加（2026-10-18，architect）〕`LLVM-102t` **B 段完成** ✅（`ADR-0031` 七字段 `va_list` + callee 三条 `stm.o` 快照 + `va_arg` 五步 + `va_copy` + 默认 `-Werror=varargs`；`consumer-lame` 两档 pass、lit 33/33、补丁 **174→177**）⇒ ③ 的编译器侧已解；**musl 封装侧**（同一三 bank ABI 暴露的实参类型面）已由 `INFRA-092t` 处置 ✅（`fcntl` 按 `cmd` 分支 / `syscall()` 按 `__dadao_argmask` 分 bank / `getrlimit` 地址槽；`047t functional/fcntl` 两档 pass、补丁 **177→180**）。**余 `D4` caller 侧**（16 B「仅剩 1 槽」整组回退，需 CC 组分配器）**待裁**；① clang 崩溃 2 例仍无册。`status` 保持 `open`。 〔追加（2026-10-18，architect）〕`LLVM-106t` 实现完成（`long double`=binary128 全链）：前端三宏 + ABI `rf16/17` 双槽 + `f128` libcall 21 条 + builtins TF 符号 0→29（archive 21/21 有定义）；安装根复验待 `install-host`。"

- id: ISS-268
  title: "【P2】变参 ABI 未在契约层规定：`va_list` = 单 `void*` + caller 整块保存区；聚合在变参中的分类 / 寄存器耗尽 / 16 B 半字顺序均无条款 ⇒ 归 `ADR-0031`（`Accepted`，2026-10-18；spec/契约已同步）"
  status: closed
  scope: [llvm, infra]
  blocks: []
  resolved_by: ADR-0031
  notes: "【正式登记（源 = 2026-10-18 用户裁定 + `LLVM-102t` B 项停点；architect 立项）】**缺口（逐条现场）**：① `spec/DADAO-21 §3.3`（`:246-338`）现为「`va_list` 即 `void*` + caller 写整块保存区 + `va_arg` 统一 `+8`」，与三 bank 独立计数（`§3.2.1`）导致的「按声明序分流」需求不匹配；② 聚合在变参中的分类沿用 `spec §3.2.3` / `contract-abi §6.4` 的「8 槽位 / 64 B」上限，与用户 2026-10-18 裁定的「≤16 B 按类别进寄存器 / >16 B 走内存」冲突（⚠ 是否覆盖命名参数待确认）；③ 变参 + 寄存器耗尽在契约层**无条款**（`contract-abi §4` 限非变参、`§4.3` 同、`§5` 顺延 M4、`§6` 无该条）⇒ `LLVM-102t` B 项 `BLOCKED`（实现现场 = `DADAOISelLowering.cpp:740-742` 主动报错）；④ binary128 半字顺序在 `ADR-0030 D2` 写作「低位在偶号」，与大端 + `ldm.o`/`stm.o` 直通相反（用户 2026-10-18 裁定「高半在偶号」）。**载体** = `.tao/adr/adr-0031-varargs-abi.md`（`Proposed`，`D1`–`D9` 待用户逐条确认）；**确认前不改** `spec/` / `contract-abi` / 实现。**等级 = P2**（`M8` 变参面 + `LLVM-102t` B 项阻塞；非本批阻断）。**证据指针**：`ADR-0031` 附录 A（§3.3 改写提案）、`LLVM-102t` B 段（`repro_varargs`，期望 136）、`ADR-0030 D2` 修订注记。**交叉引用**：`ADR-0030`、`ADR-0018 C4`、`LLVM-101t`、`LLVM-102t`、`ISS-267 ③`。**边界**：本笔只登记；未改 `spec/` / 契约 / `components/**`、未改任务状态。**处置**：待 `ADR-0031` 逐条确认 ⇒ 按 `Process-06` 授权改册 + 另立实施任务；`LLVM-102t` B 项届时解阻塞。**〔收口（2026-10-18）〕** 用户逐条确认（原话逐字见 `ADR-0031 §逐条确认表`）⇒ `ADR-0031` 转 **`Accepted`**，并按其授权（`D9` 原话「**授权**」）落地：① `spec/DADAO-21` 改 `§2.2`（16 B 对齐）/ `§3.2.3`（16 字节值半字顺序与配对）/ `§3.2.4`（16 B 栈槽 / 整值退栈）/ `§3.3`（整节：七字段 `va_list` + callee 快照保存区 + `va_arg` 四步 + 提升表 + `float` 低 32 位）/ `§3.4`（binary128 返回 `rf8` 高 / `rf9` 低）+ 只读锁 `sha256` 同步；② `contract-abi §4.2`/`§4.3`/`§4.4`/`§5`（变参由「`Excluded from M3`→M4」改「**M8 收口，见 `ADR-0031`**」）/ `§6.3`/`§6.4` 同步；③ `ADR-0030 D2` 半字顺序就地修订（高半在偶号）；④ 实施落点 = `LLVM-102t`（B 项**解阻塞**）/ `LLVM-106t`（binary128 全链）/ `INFRA-090t`（musl `float.h`）。**口径说明**：聚合门槛按用户原话「**64B为门槛**」维持 DADAO 现行 64 B（`ADR-0031 D3` 正文的「≤16 B」为起草笔，以确认表为准）；`__int128` 传参/返回维持不支持。`resolved_by: ADR-0031`。"

- id: ISS-269
  title: "【P3】`qemu-dadao` 上 `lemon` 的**每个 fork 子进程以 guest SIGSEGV 终止**（`first_error = Error while running on: <input>`；260 次全败、无 parser 产出）⇒ 归 qemu 面诊断（guest 故障路径 / 指令语义）"
  status: open
  scope: [qemu]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `TESTCASES-050t` 两档现场，2026-10-18；architect 立项）】**现象（逐字）**：两档一致 —— `MultiSource/Applications/lemon` 的 `first_error` = `Error while running on: parse.y`（父进程对 260 个输入逐个打印 `Error while running on: <input>`），`combined.out` 无 parser 产出，oracle 不可达 ⇒ driver `klass=blocked`（**平台缺口**，不记 `fail`）。**定性（现场三条）**：① 无编译/链接错误，也无上游脚本/外部工具需求（lemon 自带 parser generator，不调 lex/yacc）；② `lemon.c:4866` 对每个输入 `fork` 一个子进程调用 `lemon_main` ⇒ **每个子进程均死于 guest `SIGSEGV`**（qemu 把 guest 故障如实回传）；③ 最小复现 = 上游最小输入 `example1.y`、`-O0` 亦可复现，而同一份源码用宿主 `cc` 构建后正常写出 parser ⇒ **排除 lemon 自身缺陷与输入问题**。**归属**：`qemu-user` guest 故障面（故障注入/信号帧/指令语义），**与 `QEMU-063t` 的宿主信号/hang、`ISS-267` 的编译·链接缺口根因不同**；按用户 2026-10-18「**同意**」的时间盒（1–2 h）并入 `QEMU-063t` 逐例诊断表（表行 7→9）。**等级 = P3**（1 例、非阻断）。**证据指针**：`tools/testcases/run_llvm_ts_user.py` 的 `PLATFORM_GAP_SIGNATURES`（已指向本号）+ `CASE_TIMEOUTS`（lemon 480 s，实测 331.43 s）；`TESTCASES-050t` 完成区「逐例前后对照」与「新发现/坑 ①」；`.work/log/testcases/llvm-ts-user-050t-*`。**交叉引用**：`QEMU-063t`（诊断落点）、`ISS-266`（同册宿主信号族）、`ISS-267`（编译/链接缺口，不同面）、`TESTCASES-050t`（登记源）。**边界**：本笔只登记；未改 qemu/驱动行为、未改语料。"

