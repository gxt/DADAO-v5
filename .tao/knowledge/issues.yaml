- id: ISS-256
  title: "【P1】两处独立 codegen/ABI 缺陷（`libc-test` 静态档 `ISS-249` 收口后余 2 例）：① 变参聚合实参两侧取法不一致（`union semun` 经 `semctl(...,IPC_STAT,arg)` ⇒ `arg.buf` 读到 0、`EFAULT`）；② `shmat()` 指针返回经 `__syscall_ret` 尾调用未落 `rb8`（`p` 为栈地址 ⇒ `shmdt` `EINVAL`）"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-101t
  notes: "【正式登记（源 = `TESTCASES-047t` 静态档第 2 轮现场，2026-10-17；architect 立项；两例合并一条 —— 同属调用/返回 ABI 面、同一验收批次）】**现象（逐字）**：① `functional/ipc_sem.c:58: semctl(semid, 0, IPC_STAT, arg) failed: Bad address`（guest exit 1；`arg.buf` 实测读到 0）；② `functional/ipc_shm.c:80: shmdt(p) failed: Invalid argument`（该例 `mode` 断言 `:57` 已过；宿主 `shmat` 返回 `0x2aaaaaaab000`，guest 侧 `p` 实测为**栈地址**）。**与 `ISS-249` 无关**：argmask 已 12→245、三载体逐项一致、门控 `make check-syscall-abi` **69/69** rc=0（`ISS-249` 已 `closed`）。**根因方向（待诊断确认，不预设修法）**：① musl `semctl` 为变参（`int semctl(int,int,int,...)`），语料以 8 B `union semun` 作可变实参 ⇒ 一侧按值放寄存器槽、另一侧 `va_arg` 按间接读（契约 = `contract-abi §6.4`：`union` 不满足 HFA/HPA ⇒ 通用聚合 ≤64 B 拆 8 B 块入 RD bank、>64 B 间接；`§5` 变参拆法不变 ⇒ **两侧必须同取法**）；② `shmat()` = `return (void *)syscall(SYS_shmat,...)`，`syscall()` → `__syscall_ret()` **尾调用**，`shmat.o` 反汇编尾调用后无 `rb8` 落值（契约 = `contract-abi §4.4`：指针返回**直接落 `rb8`**、不经 `rd8` 中转；`§4.6` `call` 的 `Defs` 含 `rb8–rb15`）。**等级 = P1**（两例为 `M8` 静态档真失败；SysV IPC 属用户态栈基础能力）。**证据指针**：`.work/log/testcases/ISS-249-static.json`（`fail` 两条 `reason`/`first_error` 逐字）+ `TESTCASES-047t` 完成区第 2 轮；最小复现随任务书自包含（原现场复现件在 `.work/evidence/ISS-249/`，**内容溯源、非执行必需**）。**落点** = `LLVM-101t`（`.tao/tasks/llvm/LLVM-101t-可变参聚合与shmat指针返回bank.md`；含诊断第一步「哪侧偏离契约 + 条款号 + 反汇编」、可达 FAIL、`install-host` 前置申报）。**边界**：本笔未改 `components/**`（只登记）。**交叉引用**：`TESTCASES-047t`、`ISS-249`（argmask 已消解）、`contract-abi §4.4`/`§6.4`/`§5`、`ADR-0018 C5`、`ADR-0025`。**处置（LLVM-101t，2026-10-17；自验，待 reviewer 独立复核）**：两处均已修 —— ① 偏离侧 = **callee 侧的 clang `DADAOABIInfo::EmitVAArg`**（它只覆写 `classifyArgumentType`，`EmitVAArg` 却继承 `DefaultABIInfo` 里调**非虚** `classifyArgumentType` 的版本、把所有聚合当间接 ⇒ 与调用点「≤64 B 按值」自相矛盾）⇒ 覆写 `EmitVAArg`：非聚合仍走 `DefaultABIInfo`，聚合按 `§6.4/§5` 分档（≤64 B 按值、>64 B 间接）用 `emitVoidPtrVAArg`（`SlotSize=8`、大端 `ForceRightAdjust`）；② 偏离侧 = **后端尾调用 lowering**（尾跳后本函数再无代码可插搬运，却把 `__syscall_ret` 的 `rd8` 原样当 `rb8` 交调用者）⇒ 尾调用资格新增「返回位置 (`LocReg`/`LocVT`/`LocInfo`) 必须与本函数自身完全一致」，不匹配则降级 `call`+`ret`（由 `LowerCallResult`→`LowerReturn` 插入 `rd2rb {rb8},{rd8}`；`musttail` 仍显式报错）。证据：`.work/evidence/LLVM-101t/run.sh`（14 项全绿，含 2 处对象级注入 ⇒ 对应 oracle `[FAIL]` ⇒ `cp`+md5 还原 ⇒ 回绿）、`047t-static.json` = **pass 303 / fail 6 / known-fail 3 / blocked 25**、原 301 条 pass 无回归（逐条比对）、`series` 仍 78（`check-patch-tree` 177→177）；补丁 = `clang/lib/CodeGen/Targets/DADAO.cpp.patch` + `llvm/lib/Target/DADAO/DADAOISelLowering.cpp.patch`。"

