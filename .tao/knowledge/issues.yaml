  notes: "【正式登记（源 = `ADR-0034` 转正笔现场 `grep` 穷尽，2026-10-21；architect 登记）】**现象**：`ADR-0034 D1` 把 `fence` 从 `000-000` 迁到 `100-000`（`0x77000000` → `0x77800000`），`D5` 又把 `000-000` 分给 **`lr.o.nn`** ⇒ 字面 `0x77000000` 的语义**已不是 `fence`**；但因 `lr.o.nn` 也是 `scope: excluded`（`decode: ILLI`），**当前行为不变**（仍 ILLI），故为 P3。**现场清单（可重跑 `grep -rn 77000000 tests/ tools/ .tao/adr/ spec/ contracts/ components/`，已排除 `.tao/archive/**`）**：① `tests/scripts/build_test_binary.py:148-153` —— `encode_fence()` docstring 写「`fence 0`（`ha=0x00`）… `0x77000000` 现为 `fence 0`」，返回 `0x77000000`（实为 `lr.o.nn`）；② `tools/qemu/min_rom_probe_{032,034,035,036,037,038,042}t.py` —— `ILLI = 0x77000000` 带 `# fence 0 -> ILLI` 注（032t 更把它命名成 `def fence()`）；③ `.tao/adr/adr-0004-test-machine.md:33`（`ADR-0012 D3.5` 注记「`fence` 移至 `000-000`（`0x77000000`）」）、`:147`（`D5.1` decision 项「其原编码字 `0x77000000` 现为 `fence`」）、`:283`/`:290-292`（ILLI 测试 pattern 示例「以 `fence` 为例…字 `0x77000000`」）。**为何必须订正（不止文案）**：`ISS-307` 的 4 册落完后 `lr.o.nn` 变**可执行**（宿主 CAS 环），届时这些「ILLI poison」会**静默变成真 `lr`** ⇒ 探针/脚本的异常路径失效（假绿），故订正须**不晚于** `ISS-307` ① 册（LLVM 后端）合入前。**修法方向**：① 高频/简单面改用**仍 excluded 且不会转正**的编码，或直接改用 `0x77800000`（新 `fence`，仍 excluded）并改名；② `encode_fence()`/`fence()` 命名与 docstring 一并订正（不得只改数值不改名）；③ 探针只改常量/注释、**不重跑语义验收**（其历史 FAIL 状态见 `SPEC-109t` 完成区，均不进门控）。**⚠️ 决策面（须用户确认，勿自行改）**：`ADR-0004` 的 `:147` 落在 **`D5.1` decision 列表**（非纯注记）⇒ 改动须按 `AGENTS.md`「已 Accepted ADR 的 decision 改动须逐条确认」经用户确认（`SPEC-109t` 先例：该项由 `ADR-0012 D3.5` 落地项授权，本次**无**等价授权原话）。**等级 = P3**（当前零行为差异；但 `ISS-307` 落地后升级为正确性风险）。**证据指针**：`contracts/opcodes.yaml`（`fence` `0x77800000` / `lr.o.nn` `0x77000000`，均 `excluded`）；`git grep -n 77000000` 现场输出（本笔）；`.tao/adr/adr-0034-atomics-encoding.md` `D1`/`D5`/`Consequences 2`。**交叉引用**：`ADR-0034`（`D1`/`D5`）、`ISS-307`（原子实现 4 册；本项须先于其 ① 册）、`ADR-0012 D3.5`/`ADR-0014`（`fence` 历史编码）、`SPEC-109t`（上一轮同类编码迁移的探针同步先例）、`lessons §2`（陈旧期望值当场修）。**边界**：本笔**只登记** ⇒ 未改 `tests/**`/`tools/qemu/**` ✗、未改 `ADR-0004` ✗（决策面待用户确认）、未重跑探针 ✗。"

- id: ISS-309
  title: "【P2】测试 harness `build_exit_section` 的 `br.nz` 偏移按 `PC+4` 计（本 ISA 是 `PC + imm*4`）⇒ 用例失败时落到 semihosting trap（宿主 SIGABRT / -6），而非干净 `exit 1`"
  status: closed
  scope: [testcases]
  blocks: []
  resolved_by: TESTCASES-061t
  notes: "【正式登记（源 = `QEMU-067t` 完成区「新发现/坑 ②」+「遗留问题 ①」，2026-10-21；architect 提交时登记）】**现象（现场）**：`tests/scripts/build_test_binary.py:520` 用 `encode_br_nz_rd(ACCUM_RD, len(pass_block))` 发失败跳转，即把 `len(pass_block)` 当作「PASS 块字数」而**隐含 `PC+4` 基准**（同函数注释 `:512-516` 的布局 `[here] br.nz` / `[here+1] PASS` / `[here+1+N] FAIL` 也是这个口径）；但 v5 分支基准 = **指令自身 PC + `imm*4`**（`SimRISC` 分支语义，`build_branch_test_binary` docstring `:536` 已写「v5 branch base = instruction's own PC」）⇒ `br.nz imm=N` 实际落到 `[here+N]`，比 FAIL 块入口 `[here+N+1]` **早一个字**。该字 = PASS 块末字 `trap(0, SEMIHOST_TAG)`（`emit_sys_exit` `:273`）⇒ 在 **`rb16` 未指向 `EXIT_BLOCK`、`rd16` 未置 `SYS_EXIT`** 的状态下打 semihosting trap，宿主侧表现为 **SIGABRT（`$?` = 134 / 内部 rc = -6）**，而**不是**设计的干净 `exit 1`（`QEMU-067t` 首轮 F1/F2 期望错例现场即此形态：18 FAIL 全 SIGABRT）。**影响**：① **失败用例的退出码语义不可靠**（期望 `1`、实得信号），逐例归因全靠人工看日志；② 门控 **仍 fail-closed**（非 0 即红，不会假绿）⇒ **不阻断任何门控判据**，属可维护性/可诊断性缺陷；③ 判据写「失败 ⇒ rc=1」的向量只能断言「非 0」。**修法方向（未实施 ✗）**：偏移改 `len(pass_block) + 1`，或按 `(fail_block 起点 − br 自身) / 4` 从 `words` 索引**现场派生**（后者对块长变化免疫，优先）；修后须补一条**必失败**向量的反例证据（期望 rc=1、实得 1，且注入改回旧偏移时必须是 SIGABRT）——按 `lessons §2`「验证脚本必须能失败」。**等级 = P2**（不阻断 `QEMU-067t` 验收：`semantics 351/351`、`smoke 90/90`、`L1` 全绿均已成立；但每次真失败都需人肉读日志）。**证据指针**：`tests/scripts/build_test_binary.py:512-520`（布局注释 + `br.nz` 发射）、`:253-274`（`emit_sys_exit` 的 trap 尾字）、`:536`（v5 分支基准说明）；`QEMU-067t` 任务书完成区「新发现/坑 ②」「遗留问题 ①」。**交叉引用**：`QEMU-067t`（登记源，**现场发现**）、`ADR-0020 D8`（semihosting SYS_EXIT 退出通道）、`ISS-308`（同册 `build_test_binary.py` 的另处陈留）。**边界**：本笔**只登记** ⇒ 未改 `tests/scripts/build_test_binary.py` ✗、未重跑任何向量 ✗；**既有缺陷、未修** ✗（`QEMU-067t` 的改动面只含 `lr/sc` 宽度映射与 `sequence:`，不含本项）。 **关闭（2026-10-23，`TESTCASES-061t`）**：`br.nz` 偏移改为 `PC + imm*4`；故意失败用例改前 rc=-6（trap）→ 改后 rc=1（FAIL 标签）。"

- id: ISS-310
  title: "【P2】clang DADAO 的 `int` 实参未按 `contract-abi §4.2` 符号扩展为 canonical 64 位（生成 `set.zw`+`or.w` 零扩展）"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `INFRA-100t` 完成区「新发现/坑 ①」+ 自审 `F7`，2026-10-21；architect 提交时登记）】**现象（现场，本笔复现）**：`int f(int x){ ext(x, -1, 5); return x; }`（`ext` 为外部声明）经安装根 clang `--target=dadao-unknown-unknown-elf -O2 -S` 得 `set.zw rd17, wp0, 0xffff` + `or.w rd17, wp1, 0xffff` ⇒ 寄存器值 `0x00000000FFFFFFFF`，而 `contract-abi §4.2`（`:181`/`:185`，「保持符号位不变」「按类型符号性扩展」）要求 `0xFFFFFFFFFFFFFFFF`。**根因方向（本笔现场取证，未修 ✗）**：① IR 侧 `declare void @ext(i32 noundef, i32 noundef, i32 noundef)` —— **无 `signext` 属性**（同函数返回 `signext i32` 有）；② clang 侧 `components/llvm-project/patches/clang/lib/CodeGen/Targets/DADAO.cpp.patch` 的 `classifyArgumentType()`（约 `:230-267`）对窄整数直接 `return DefaultABIInfo::classifyArgumentType(Ty)`，**只有 `classifyReturnType()` 走了 `ABIArgInfo::getExtend()`** ⇒ 窄实参扩展规格在**前端 ABI 分类**处缺失，后端 `ext.so`（`sext_inreg` 模式，`DADAOCodeGen.td.patch`）未被请求。**可能影响面（待核，勿当已证）**：以 64 位整寄存器参与的场景 —— 负数 `int` 作比较值（`a_cas` 类比较）、varargs（`va_arg` 按 canonical 假定取整 64 位 ⇒ 负数可能显示为大正数）、`int` 参与指针算术（负偏移）、`int`↔`long`/`size_t` 混用与 `ssize_t` 返回路径。**为何 P2 而非更高**：本轮 `4×250000` 计数精确、`047t` 19/19、libc-test 未见回归 ⇒ **尚未观测到实际错值**（`INFRA-100t` 已加 `ext.uo` 防御项，不依赖本项）；但语义与契约不一致，属真实缺陷。**修法方向**：`classifyArgumentType()` 对 `i8/i16/i32` 有符号窄类型返回带符号扩展的 `ABIArgInfo`（与 `classifyReturnType()` 同源）；修后须有 IR 级断言（`signext` 属性在场）+ 汇编级断言（`ext.so …,31` 而非 `set.zw/or.w`）+ 运行期探针（`-1`/`INT_MIN` 两路），并复跑 lit / L1。**证据指针**：`/tmp/opencode/INFRA-100t-land/abi_int.{c,s,ll}`（本笔现场产物）；`INFRA-100t` 任务书「新发现/坑 ①」+ 审阅记录 `F7`。**交叉引用**：`INFRA-100t`（登记源，**现场发现**）、`contract-abi §4.2`、`ADR-0018 C4`（caller 扩展口径）、`LLVM-121t`（原子代码生成，同批 llvm 面）。**边界**：本笔**只登记** ⇒ 未改 `components/llvm-project/**` ✗、未重建工具链 ✗、未跑 lit ✗。 〔**reviewer 独立复核（2026-10-21，`INFRA-100t` 验收）**〕现场复现：`ext(x,-1,5)` 汇编为 `set.zw`+`or.w`（零扩展）⇒ `0x00000000FFFFFFFF`，IR `declare` 无 `signext`（返回路径有），与 `contract-abi §4.2`（保持符号位 / 按符号性扩展）不符 ⇒ **确认为真缺陷**；`status` 保持 `open`、等级 P2 不变（无实测错值，`a_cas` 的 `ext.uo` 使其不依赖本项）。"

- id: ISS-311
  title: "【P3】`components/musl/README.md`「原子」段已过期（仍称机器无可用原子、`__clone` 返回 `-ENOSYS`）"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `INFRA-100t` 完成区「新发现/坑 ④」+ 自审 `F6`，2026-10-21；architect 提交时登记）】**现象（现场）**：`components/musl/README.md:18` 的「**原子**」条仍写「机器**没有**可用原子——LR-SC 与 `fence` 属 `scope: excluded`（…QEMU 侧均为 ILLI 桩）⇒ 只能给出**单线程**语义的 `a_cas`/`a_cas_p`/编译器屏障」，并附「`__clone` 由通用 `src/thread/clone.c` 返回 `-ENOSYS`（线程显式失败）；开线程前必须换真原子」。**与现状矛盾**：① `INFRA-100t` 已把 `arch/dadao/atomic_arch.h` 改成 `lr.t/lr.o` + `sc` 重试环 + `fence 975` 真原子（`4×250000` 计数精确 5/5）；② `QEMU-067t`/`LLVM-121t` 已落 `lr/sc`/`fence` 的编码与执行语义（不再是 `scope: excluded` 的 ILLI 桩）；③ `__clone` 早在 `INFRA-095t` 改为 `src/thread/dadao/clone.s` 真实现（`REPLACED_OBJS`），线程已可用（`047t` 19 例两档 19/19）。**影响**：读者按 README 会误判「无线程/无原子」，进而重复论证或错判移植边界（文档与代码单一真源背离）；**不阻断任何门控**。**修法方向（未实施 ✗）**：把该条重写为「真原子（依赖 `lr/sc`+`fence`，见 `atomic_arch.h` 文件头：粒度 8 B 字 / 按宽度对齐 / ABA 不可检）+ `__clone` 真实现（`INFRA-095t`）」，并删去 `scope: excluded`/`-ENOSYS` 的过期论证；「已知边界」段同步核对。**等级 = P3**（纯文档漂移，零行为差异）。**证据指针**：`components/musl/README.md:18`；`components/musl/patches/arch/dadao/atomic_arch.h.patch`（文件头）；`INFRA-095t`（`__clone`）；`INFRA-100t` 册「新发现/坑 ④」。**交叉引用**：`INFRA-100t`（登记源）、`INFRA-095t`、`QEMU-067t`、`LLVM-121t`。**边界**：本笔**只登记** ⇒ 未改 `components/musl/README.md` ✗（`INFRA-100t` 交付清单不含它，故未越界顺手改）；待随下次 `components/musl/**` 改动一并订正。"

- id: ISS-312
  title: "【P1】`LowerATOMIC_STORE` 取错操作数 ⇒ 共享对象的 `atomic_store`/`__atomic_store_n` 写入对象地址而非值"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-121t
  notes: "【正式登记（源 = `TESTCASES-056t` 完成区「新发现/坑 ①」+ 自审 `F7`，2026-10-21；architect 提交时登记）】**现象（现场，两档一致）**：`_Atomic` **file-scope 共享对象**做 store 时，内存里落下的是**对象自身地址**而非值 —— `gx = 0x4a920`、`gc = -80`、指针 `gp = &gp`；探针 11 条命中（c11 7 个 `store_shared` 全宽度 + builtins 4 个 `store_n` 1/2/4/8 字节），按缺陷签名判 `XFAIL`（`.work/log/testcases/TESTCASES-056t/TESTCASES-056t-driver-{static,dynamic}.log`）。**根因（现场取证，未修 ✗）**：`components/llvm-project/patches/llvm/lib/Target/DADAO/DADAOISelLowering.cpp.patch` 的 `LowerATOMIC_STORE`（≈ `+2244`）写 `SDValue Val = Op.getOperand(2);`，而 `AtomicSDNode` 对 `ATOMIC_STORE` 的操作数序是 `(chain, value, ptr)`（`getVal()` = op1、`getBasePtr()` = op2）⇒ 取到的是**指针**；现场 DAG 已是 `store t4:1, t2, t2`（value 与 ptr 同一值）。**为何此前全绿**：局部 `_Atomic` 变量被优化（SROA/寄存器化）后绕过 `ATOMIC_STORE` ⇒ 只有共享/不可优化对象才暴露；本册因此改用 file-scope 对象 + noinline 访问器。**影响**：任何共享 `_Atomic` 持久赋值（锁标志、就绪位、缓存指针、`__atomic_store_n` 写有名字的全局）都会落成垃圾地址 ⇒ 下游读到的是「指向自身的指针」，属真实静默错值（P1）。**修法方向**：改 `AN->getVal()`（`getTruncStore` 分支同步），并补「共享对象 store 值正确」用例（lit + 运行期；用 `volatile`/跨 TU/`-O0` 等确保不被优化成普通 store）。**复核判据**：`TESTCASES-056t` 的 11 条 `atomic-store-address` XFAIL 转 PASS（届时 XFAIL 表不改会报 `XPASS` 红），④ 重新验收。**证据指针**：`TESTCASES-056t` 册「新发现/坑 ①」「遗留问题 ①」、审阅记录 `F7`；`tests/atomics/c11_alltypes.c` / `tests/atomics/atomic_builtins.c`（共享单元）；`tools/testcases/run_atomics_probe.py`（签名判据）。**交叉引用**：`TESTCASES-056t`（登记源，**现场发现**）、`LLVM-121t`（**已撤回 `待返工`**，本项是其缺陷 A）、`ISS-307`（原子 4 册总账）、`ISS-313`（同册同批缺陷 B）。**边界**：本笔**只登记** ⇒ 未改 `components/llvm-project/**` ✗、未重建/`install-host` ✗；**既有缺陷、未修** ✗。 〔返工完成 2026-10-21：本项由 `TESTCASES-056t` 发现、`LLVM-121t` 返工修复（`AN->getVal()`，`getTruncStore` 分支共用同一 `Val`）、reviewer 第 3 轮复核（自造跨 TU 共享对象探针：`store atomic` 5 处确经 `ATOMIC_STORE`，`-O0`/`-O2` 各 6/6 落值正确、源≠基址；第 4 轮判据现场派生后 `Accepted`）⇒ 关闭；`TESTCASES-056t` 11 条 store 单元转 PASS（两档静态/动态 711/711、0 xfail）。〕"

- id: ISS-313
  title: "【P2】子字宽（1/2/4 B）CAS 在比较值最高位置 1 时恒失败（`lr.*` 零扩展 vs 提升 i64 符号扩展，`br.ne` 比 64 位）"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-121t
  notes: "【正式登记（源 = `TESTCASES-056t` 完成区「新发现/坑 ②」，2026-10-21；architect 提交时登记）】**现象（现场，两档一致）**：`atomic_compare_exchange` / `__atomic_*` 的 1/2/4 字节 CAS，当**比较值最高位为 1** 时**永不成功** —— `int -1`、`unsigned 0x80000000`、`uchar 200`、`ushort 40000` 实测；对照 `long -1`（8 字节）通过；expected 与实际相等却返回失败 ⇒ 调用方误判为竞争并走重试/放弃路径。探针 9 条命中（c11 6 个 `compare_exchange_edge_ok` + builtins 3 个 `compare_exchange_edge`，均 `seq_cst`，`XFAIL` + `narrow-cas-sext` 签名）。**根因（本笔据探针形态与实现推定，未修 ✗；修复者须现场复核）**：CAS 环里 `lr.{b,w,t}` 的结果按**零扩展**进入 64 位寄存器，而比较值操作数经类型合法化是**符号扩展**的 i64（`int -1` = `0xFFFF_FFFF_FFFF_FFFF`），环内 `br.ne` 比较**完整 64 位** ⇒ 最高位不等 ⇒ 恒不相等；`lr.o`（8 字节）两侧天然同宽故正确。相关实现：`DADAOISelLowering.cpp.patch` 的 `LowerATOMIC_CMP_SWAP_WITH_SUCCESS`（`SETEQ`）+ `EmitInstrWithCustomInserter` 的 `ATOMIC_CMP_SWAP_PSEUDO_{B,W,T,O}` 展开。**与 `ISS-310` 的关系**：`ISS-310` 是**实参**未按 `contract-abi §4.2` 符号扩展（前端 ABI 分类缺 `signext`），本项是**环内比较口径**不统一；修法须**同一方向**（统一到 canonical 64 位 / 按类型符号性扩展），勿各定一套，否则一处修好另一处仍错。**修法方向**：比较前把 `lr` 结果按 `MemVT` 归到与 `Cmp` 相同的扩展约定（截断到宽度再同口径扩展，或对 `Cmp` 截断后零扩展比较），`CONTINUE`/`SETEQ` 两处同步；补 i8/i16/i32 × 有/无符号的**高位置 1** 用例。**复核判据**：`TESTCASES-056t` 的 9 条 `narrow-cas-sext` XFAIL 转 PASS（不改表即 `XPASS` 红），④ 重新验收。**证据指针**：`TESTCASES-056t` 册「新发现/坑 ②」；`tests/atomics/c11_alltypes.c`（`compare_exchange_edge_ok`）/ `atomic_builtins.c`（`compare_exchange_edge`）；驱动日志同 `ISS-312`。**交叉引用**：`TESTCASES-056t`（登记源，**现场发现**）、`LLVM-121t`（**已撤回 `待返工`**，本项是其缺陷 B）、`ISS-310`（扩展口径同向）、`contract-abi §4.2`（canonical 64 位）、`ISS-307`。**边界**：本笔**只登记** ⇒ 未改 `components/llvm-project/**` ✗、未重建/`install-host` ✗；**既有缺陷、未修** ✗。 〔返工完成 2026-10-21：本项由 `TESTCASES-056t` 发现、`LLVM-121t` 返工修复（子字宽 CAS 比较口径统一到**访问宽度**：`lr` 结果按 `MemVT` 归一到与 `Cmp` 相同扩展约定，`CONTINUE`/`SETEQ` 两处共用同一规范化操作数）、reviewer 第 3 轮复核（自造 12 例含 u8 `0xFF`/s8 `0x80`/u16 `0x8000`/s16 `0x8000`/u32 `0x80000000`/s32 `INT_MIN` + u64 对照 + 2 负例，`-O0`/`-O2` 各 12/12 高位置 1 成功且落新值；第 4 轮判据现场派生后 `Accepted`）⇒ 关闭；`TESTCASES-056t` 9 条 `narrow-cas-sext` 单元转 PASS。〕"

