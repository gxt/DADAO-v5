  resolved_by: permissions deny(question) in .opencode/agents/{architect,engineer,reviewer}.md + AGENTS 规则
  title: '【P1·根因更正】子代理**可以绕过主会话直接向用户提问**，而子会话问答对父会话不可见 ⇒ 主会话只能看到任务书里一句「用户裁定（原话）」却无法溯源，误判为伪造并触发返工。 实际经过：`m13-infra-001` 的 engineer 三轮追问用户并拿到裁定「不修 ①」（事后用户 2026-11-10 又改判「删掉核验册机制」），主会话侧无记录 ⇒ 判为伪造。 修复（已落地）：`.opencode/agents/*.md` 增加 `{action: question, resource: "*", effect: deny}` （实测子代理调用返回 `Unknown tool ''question''`）；需要裁定的问题一律写进任务书并返回主会话， 由主会话统一问、统一转达、统一落盘。 教训：判「伪造」前先问「模型是否具备直接问用户的通道」；把不可见通道先关掉，再谈溯源。'
