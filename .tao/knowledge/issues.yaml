- id: ISS-265
  title: "【P3】`llvm-test-suite` 两例 `fail` 归因参考输出不可移植（`Ptrdist/ft`：musl 的 `srandom` 播种与 glibc/BSD 不同；`ClamAV`：stdout/stderr 交错）⇒ 是否扩展 `known-fail` 类别待裁定"
  status: open
  scope: [testcases]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `TESTCASES-048t` 第 2 步全量两档现场，2026-10-18；engineer 登记，**等用户/架构裁定**）】**现象**：两档均为 `fail 2`。① `MultiSource/Benchmarks/Ptrdist/ft`：`md5(output+exit)=3dd953c9…` vs 参考 `63acb35e…`（exit 0/0）；② `MultiSource/Applications/ClamAV`：两文均 38072 B，仅 `Initializing the engine (devel-20071218)`（`cli_dbgmsg`）与数据库年龄告警的相对位置不同（stdout/stderr 缓冲/交错）。**根因（① 已闭环取证）**：同源同 `RUN_OPTIONS`（`1500 100000`）用宿主 glibc 编译运行，`{output; exit 0}` 的 md5 **恰等于参考 `63acb35e…`** ⇒ 驱动哈希口径与参考均正确；差异来自 musl `src/prng/random.c` 头注释「same ... except for the seeding which was broken in the original」——musl 用 `lcg64` 播种、glibc/BSD 用 `16807` Schrage 递推 ⇒ `ft` 的图输出（第 4 行起）确定性不同。② 属上游参考对交错敏感（STEP 1 已记录）。**性质**：不是 dadao/LLVM/qemu 缺陷，也不是驱动 bug；是**参考输出的 libc 可移植性**问题。**本笔处置**：按册子「oracle 不匹配不得改标」**保持 `fail`**（不归 `known-fail`/`excluded`）。**待裁定**：是否把「参考输出依赖 glibc 语义/交错」单列为 `known-fail` 依据类（需用户裁定 + 契约扩展），或维持 `fail` 并在报告中注明。**等级 = P3**（2 例、非阻断）。**证据指针**：`.work/log/testcases/llvm-ts-user-ft-host-glibc.log`（glibc 复现 hash + musl 播种源码 + guest 首差行）、`.work/log/testcases/llvm-ts-user-{static,dynamic}-{static,dynamic}.json`。**交叉引用**：`ISS-246`（现存唯一 known-fail 依据）、`TESTCASES-048t`。 〔用户 2026-10-18 未裁归类 ⇒ 暂按有据不动处理，待收尾时确认〕  **〔用户裁定（2026-10-18，渠道 = 经主会话问答；逐字引录：「1、可以；2、M8内修」）〕归类 = `known-fail`**（回答主会话问 ①：「`ISS-265` 归 `known-fail`」）；逐例依据 = ① musl 与 glibc 的 `srandom` 播种差（宿主 glibc 可复现参考值）② ClamAV 输出交错；**归类实现归 `TESTCASES-048t` 后续复跑**；本 issue `status` 保持 `open`（实现未做）。"

