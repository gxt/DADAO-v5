- id: ISS-352
  scope: [infra]
  status: closed
  resolved_by: INFRA-135t（门控改为具体 .work 引用一律 FAIL，用户裁定 A）
  title: >-
    【P2】`check-knowledge-refs` 在本机只按「文件是否存在」判悬空，而 `.work/**` 是被 gitignore 的
    运行期目录：主控机上有文件时不报，换到新节点/fresh clone 就红。近期已因此复发三次
    （任务书/审阅记录写具体运行期路径）。建议改为按 **git 跟踪树**（或 `git archive` 临时树）判定：
    任何具体 `.work/**` 引用一律视为不可复现。属门控语义变更，需用户裁定后再动。
