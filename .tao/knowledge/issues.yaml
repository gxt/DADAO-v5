  notes: "现象：凡把比较结果**当值**使用的 C（`a==b`、`!x`、`a<b`、三目 `?:`、逻辑 `&&`/`||`）经 `clang`/`llc` 在**指令选择**阶段 SIGABRT：`fatal error: error in backend: Cannot select: t16: i64 = setcc t20, t21, seteq:ch`（clang rc=1）/ `LLVM ERROR: Cannot select: t13: i64 = setcc t2, t4, seteq:ch`（llc rc=134）。最小复现：`int f(int a,int b){return a==b;}`；或手工 `.ll`（`icmp eq`+`zext i1→i64`）`llc -march=dadao` rc=134（与 clang 无关）。**纯分支**形态 `if(a<b) return 1; return 0;`（`br(icmp)`，-O0）rc=0；-O2 因 if-conversion 又转 `select_cc` 崩溃。构造矩阵（O0/O2）：`== != < <= && ! 三元 ?: 无符号比较` 及 Embench `support/main.c:37 return(!correct)` **全部 FAIL**。根因：`DADAOTargetLowering`（`DADAOISelLowering.cpp`）仅设 `ISD::BR_CC`/`ISD::BRCOND=Custom`，**无 `ISD::SETCC` / 整数 `ISD::SELECT_CC` 的 action 或 ISel 模式**（`grep -rniE setcc` 仅命中注释）；M4/M6 向量一律用 `br(icmp)` 回避此形态故历次任务未暴露。影响：19 个 Embench 基准中 **14 个** `verify_benchmark` 直接 `return (比较)`，其余经 `main.c:37` 也必经 `setcc` ⇒ **无一基准可编译**，`TESTCASES-039t` 首验收不可达（判据未降级 = 退出码 0）。证据指针：`.work/log/testcases/TESTCASES-039t-{blocker.log,blocker_probe_result.txt,matrix_result.txt,progress.md}`；`TESTCASES-039t` 任务书完成区。归属：新任务 `LLVM-069t`（整数 `setcc`/`select_cc` lowering）。"

