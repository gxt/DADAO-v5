  title: "【P3】`ADR-0012 D9.5` 与 `tools/spec/check_scope.py` 注释称 `total 227→228`，而实测 `contracts/opcodes.yaml` 与门控期望值均为 **227**——仅 docstring/注释算术笔误、非门控缺陷"
