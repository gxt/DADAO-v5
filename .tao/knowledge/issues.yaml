  notes: "【正式登记（源 = `SPEC-145t` 第 1 轮 reviewer「证据脚本」条 + 本笔**现场复核**；architect 立项，2026-10-17）】**现象（现场复核，只读）**：`bash .work/evidence/SPEC-145t/run.sh` ⇒ **rc=1**、末行 `SPEC-145t evidence: 14 CHECK(S) FAILED (rc=1)`；现场 `grep -c '^FAIL'` = **15** 行 ⇒ **差 1 项**为第 1 节 `rela.si:记录数`：该节以 `python3 - <<PY | while read …; do check …; done` **管道**运行在**子 shell**，其 `fail()` 的计数不回流主 shell ⇒ **打印 FAIL 但不计入 rc 计数**（本笔如实并记，不改脚本）。**根因（改名后未追改：`rela` → `aip`、`PC` → `IP`）**：脚本按旧名写死断言/路径 ⇒ ① `contracts/opcodes.yaml` 查 id `rela.si_riii_rb`（现 `aip_si_riii_rb`）⇒ 记录数 0，连带第 1 节其余字段断言失去载体；② `spec/SimRISC-05` grep `| rela.si |` / `rela.si_riii_rb` ⇒ 0（现为 `aip.si`）；③ `tests/vectors/isa/rela-si.yaml`（现 `aip-si.yaml`）⇒ 第 5 节整节 python 在 `yaml.safe_load` 处 `FileNotFoundError`、**无行输出**；④ `spec/SimRISC-05` §3.4 标题断言按旧标题 `PC 相对寻址`（现 `IP` 口径）；⑤ `.tao/contracts/contract-isa.md` 的 `rela.si` 两处字面量；⑥ `spec/Toolchain-01` 的 `rela.si rbHA, imms18` 字面量；⑦ `check-instrinfo` / `check_lit_gen` 两条**「预期红」**断言（`LLVM-095t` 落地后**已绿**：现场 `missing=[] extra=[]`）；⑧ 第 4 节以 `git diff -- spec/` 现场取「所改册」⇒ 当前树干净 ⇒ 两断言空值。合计 **14 项**（脚本口径）。**真相（交付面无缺陷）**：改名后**同一批门控**均已由 reviewer 独立重跑通过 —— `validate_encoding` 235 条 rc=0、`check_qfc_coverage` 差异 0、`check_scope` m1=156/235、`validate_vectors` 156/156、`check-instrinfo` 156/156、L1 rc=0（见 `SPEC-145t` / `LLVM-095t` / `QEMU-061t` 三册第 1 轮 reviewer 块，2026-10-17）。**处置裁定（本笔）**：**历史留证不追改** ✗（与该册 reviewer 同口径）—— 理由：① 该脚本属 `.work/evidence/**`（`.gitignore`、**非门控**、不入 git）；② 其「真相面」已由**改名后的门控 + reviewer 独立重跑**覆盖；③ 追改等于**改写已验收任务的历史证据**（同仓「不擅改已验收基线」口径，先例：`LLVM-094t` 阶段 E 对 `SPEC-139t` 证据脚本的同类披露）。**等级 = 非阻断（P3）**。**建议（未实施 ✗）**：若需复活该脚本，按 `aip`/`IP` 口径重写断言，并**顺带修「子 shell 计数不回流」**使「打印的 FAIL 数」与 rc 口径一致。**边界**：本笔**未改** `.work/evidence/**` ✗、**未改** `spec/` ✗、**未改** `contracts/` ✗。证据指针：`.work/evidence/SPEC-145t/run.sh`（L92/L147–L152/L191/L222–L236/L240–L247）；`.work/log/spec/SPEC-145t-stale-recheck-architect.log`（本笔复核：15 FAIL 行 / 自报 14 / rc=1）。**交叉引用**：`SPEC-145t`（登记源；改名注记见其册头）、`ADR-0029`（`rela.si`⇒`aip.si`、`PC`⇒`IP`）、`ISS-234`（同族：历史产物口径过时）。"
