- id: ISS-263
  title: "【P2】`check-musl-freshness` 门控假红：toolchain stamp 含 `ctime`（inode 元数据）⇒ `install-host` 用 `cp -aL`+`rename(2)` 重拷同字节也判「toolchain changed」"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: INFRA-086t
  notes: "【正式登记（源 = 用户 2026-10-17 23:08 现场，紧跟 `INFRA-079t` 后的终局复跑；engineer 实现，待 reviewer 复核）】**现象（逐字）**：`make check-musl-freshness` ⇒ `[FAIL] toolchain stamp == current clang/ld.lld: expected=equal actual=different`，其余 7 项全 PASS（含 `installed libc.so == build libc.so` sha256 `d5fa2da3…` 与 source stamp 一致）。**逐项对比**：stored 与 current 的 `clang` 仅 `ctime` 不同（`1792248160137176763` → `1792249700261026265`），`size`（4294631520）/`mtime`（1792243323204212371）/版本串（`clang version 23.1.3 (…53be73f1…)`）全等；`ld.lld` 同形。**根因**：`build_musl.py::toolchain_stamp()` 把 `st_ctime_ns` 计入戳记；`ctime` 是 **inode 元数据**、不是内容属性 —— `make install-host` 用 `cp -aL` + `rename(2)` 原子重装（`Makefile::atomic-install`），**同字节重拷也会落新 inode/新 ctime**（mtime 由 `cp -a` 保留）⇒ 同内容重装被判「toolchain changed」。**判据原则（本笔固化）**：新鲜度判据只用**稳定内容属性**（`size` + `mtime` + `--version` 版本串；产物用 sha256），**不用 `ctime`**。**修法**：`toolchain_stamp()` 去掉 `ctime`（保留 `size`/`mtime`/版本串；未采用 sha256 方案的理由 = clang 4.0 GB + lld 2.0 GB，>6 GB I/O 与「无条件低成本门控」目标冲突，且真实换工具链必然改 mtime 或版本串）；`check_musl_freshness.py` 补注释固化判据；**真判据未削弱**（`libc.so`/`libc.a` 内容 sha256、source stamp、安装副本 == 构建产物全部保留）。**重建戳记**：`make build-musl-shared JOBS=8` rc=0（20.8 s，全量 clean；日志 `toolchain stamp changed` + `source stamp unchanged`）⇒ 新戳记无 `ctime`；`libc.a` sha256 `a65c3351…` / `libc.so` `d5fa2da3…` **与重建前逐字节相同**（mtime 23:10:41/42）。**双向自检（同次前台闭合；`cp -a` + md5/mtime 对账）**：真变 ① 安装根 `clang` ← `ld.lld`（内容/尺寸/版本不同）⇒ gate **rc=1** 恰报该行；② 安装 `libc.so` 追加 1 字节 ⇒ gate **rc=1**（sha256 不符）；假变 ③ `shutil.copy2` + `os.replace` 重拷 `clang`（同字节/同 size/同 mtime、**ctime 变化**）⇒ gate **rc=0**；④ 同法重拷安装 `libc.so` ⇒ gate **rc=0**；四处均还原（`cp -a`，md5/mtime 全等），末轮 gate rc=0。**等级 = P2**（门控假红：同内容重装即红，动摇「门控可信」）。**证据指针**：`.work/log/infra/ISS-263-build-musl-shared.log`、`.work/evidence/ISS-263/`（`run.sh` default/inject + 重建前后/I1–I4 日志）。**交叉引用**：`INFRA-085t`（戳记引入）、`ISS-258`（门控来源）、`INFRA-086t`（本笔落册）、`INFRA-079t`（install-host 换链）、`Makefile::atomic-install`。"

