  title: "【P2】门控切片未钉住兄弟 `CONFIG` 符号 ⇒ 探针镜像继承开发期开关、产生假红（`m14-linux-017` F30 实测）：k3 突然 227/247 红（`exit_task_stack_account+0x4`、`rb16=0x28`），真因是新加的 `CONFIG_DADAO_K4_SWITCH_SELFTEST` 在各门控切片里**未显式关闭**，pf1 镜像继承 `y` 后跑了 `rdinit=/init.musl` 覆盖。已修：`check_k0/k1/k2/k3.py` 与 `k4_fork_probe.py` 的 IMAGE 成对钉住兄弟符号。可复用判据：**任何新增的开发期 `CONFIG_*`，都必须在所有门控切片的 IMAGE 里显式设为 `n`**；否则门控会随开关漂移而假红/假绿。"
