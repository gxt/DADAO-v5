49` → `161`，独立授权项）但**未动**该处/`L37` 的「全量」措辞（其处置归本项裁定）✗。证据指针：`Makefile:508`/`Makefile:866-881`；`tests/scripts/run_qemu_smoke.py:4`/`:37`/`:40`；`.work/log/qemu/check-qemu-semantics.log`（`Results: 161 total, 161 passed`）；`.work/log/qemu/QEMU-061t-L3-semantics-verbose.log`（`grep -c 'aip-si.yaml'` = **12** ⇒ 载体命中须另起 verbose 档才可见）。**交叉引用**：`ISS-233`（**已 closed**：`aip-si.yaml` 纳入 L3 载体 —— 本项是其**同类遗留面**）、`ISS-236`（同门控默认档日志不可观测）、`docs/Process-07`（L2/L3 分层）、`QEMU-061t`（登记源）。【处置（`INFRA-097t`，2026-10-21）】**已解**：L3 载体改为**现场派生**（`tools/qemu/semantics_gate.py`：`tests/vectors/isa/*.yaml` 全量 + `rol/*` + `atomics/*`；`Makefile` 无册名字面量），结构性断言（缺册/重复 basename/symlink 错指/0 册/inventory 双向登记）齐备；`make check-qemu-semantics` 现 **897 total / 886 passed / 0 failed / 11 deferred** rc=0。外扩一次性暴露 **11 例**从未执行过的向量期望陈旧（5 条 store rd0/rb0 假 ILLI 用例删除、4 条 stm 改 `mreg_zero`、`ctrl-call` addr=0 期望 `CFXMEM`〔ADR-0020 D15〕）——已按 spec 对齐（生成器改后重生成），6 例 harness 缺陷（`ISS-098` 族）按**精确用例** `deferred` 登记且门控另有精确名单（未登记 deferred ⇒ FAIL）。"
- id: ISS-236
  title: "【P3】`check-qemu-semantics` **默认档日志仅 3 行摘要**（非 verbose）⇒ 无法从门控日志直接证明某向量的**覆盖 / 命中**；本轮取证被迫用 verbose 镜像 + 定点注入替代"
  status: closed
  scope: [qemu, infra]
  blocks: []
  resolved_by: INFRA-097t
  notes: "【正式登记（源 = `QEMU-061t` L3 载体补齐笔「新发现/坑 ①」+ 本笔**现场复核**；architect 立项，2026-10-17）】**现象（现场复核，只读；未重跑门控）**：门控默认档日志 `.work/log/qemu/check-qemu-semantics.log` 现场 `wc -l` = **3** 行（`Running batch tests from <gate dir>...` / 空行 / `Results: 161 total, 161 passed, 0 failed, 0 deferred, 0 errors`）⇒ `grep -c aip .work/log/qemu/check-qemu-semantics.log` = **0** —— **非**静默，而是该档**不逐例打印** ✗。**对比面（同门控族的自证风格）**：`check-qemu-smoke` 现场打印载体名（`源: reg-shift-extend.yaml + reg-compare.yaml + aip-si.yaml`）与源 / 代表集计数（`tests/scripts/run_qemu_smoke.py:103-107`，并注明「计数现场统计，不写死」）⇒ **同族两档留证风格不一致**。**影响**：门控默认日志是「一能力一向量」在 **L3** 层的**唯一默认留档** ⇒ 判定「某向量是否被门控消费」**不能**只看该日志，只能间接推断；本轮取证因此被迫三件套：① **计数差**（`149 → 161`，现场统计）；② **定点注入**（注入 `aip-si.yaml` case[7] 期望值 ⇒ 真门控 `make check-qemu-semantics` rc=1 / make rc=2、日志 `FAIL aip-si.yaml[7]`；`cp` 还原 + `cmp` 一致后回绿）；③ **另做 verbose 镜像**（同载体集 / 同命令 / 同安装根二进制 + `-v` ⇒ `grep -c 'aip-si.yaml'` = **12**，12/12 PASS）。**建议（评估，未实施 ✗）**：在**不改 rc 语义**的前提下让门控默认档输出**覆盖计数 / 载体清单**（最低 = 打印载体名，或「载体 N 册 × 用例 M 条（现场派生）」一句，形如 L2 的自证风格；或加 `-v` opt-in 档并在默认档注明镜像路径）⇒ 使「门控日志可自证覆盖」，免去每次另做镜像。**`status` 取 `open`（architect 判断）**：① 可观测性缺口**仍在**（默认档无法自证覆盖）；② **可复发**（每次新增载体都要另做 verbose 镜像才留证 —— `ISS-233` 一轮即如此）；③ **可机械判**（可断言默认日志含载体清单 / 计数与载体现场派生自洽）。**性质** = 门控可观测性 / 留证形态缺口（**非**功能缺陷，**亦非**假绿 —— 门控 rc 语义正确、注入态**可达 FAIL** 已证）。**边界**：本笔**只登记** —— **未改** `tests/scripts/run_qemu_test.py` ✗、**未改** `Makefile` 门控 ✗、**未改**任何日志档 ✗。证据指针：`.work/log/qemu/check-qemu-semantics.log`（3 行；`grep -c aip` = 0）；`.work/log/qemu/QEMU-061t-L3-semantics-verbose.log`（12 命中）；`.work/log/qemu/QEMU-061t-L3carrier-runsh-inject.log`（注入态 `FAIL aip-si.yaml[7]`）；`.work/evidence/QEMU-061t-L3carrier/run.sh`（C3 逐例镜像 / C4 默认档说明 / C5 注入 + `cp` 还原）。**交叉引用**：`ISS-233`（**已 closed**：载体纳入 ⇒ 本项为其取证副产物）、`ISS-235`（载体 ≠ 全量）、`lessons §2.20`（自证命中）、`docs/Process-07`（L2/L3 分层）。【处置（`INFRA-097t`，2026-10-21）】**已解**：门控默认档现打印载体清单 + 逐册用例数（含「新增/既有」）+ 载体册数 + 用例总数 + `Results: total/passed/failed/deferred/errors` + 与 `ISS-235` 旧值 161 的差值（全部现场统计），并打印 `deferred` 精确名单；`grep` 默认日志即可自证覆盖，无需 verbose 镜像。证据：`.work/log/qemu/INFRA-097t-gate.log`。"
