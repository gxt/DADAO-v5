- id: ISS-258
  title: "【P1】安装根动态 `libc.so` 早于 `ISS-249` argmask 协议变更（13:49 < 17:33）且与现行 `qemu-dadao`（18:31）不匹配 ⇒ 一切动态可执行在 musl ldso 的 RELRO `mprotect` 处 `rc=127`（`TESTCASES-046t` 动态档 38/38 blocked；`047t`/`048t` 动态档同样被挡）"
  status: closed
  scope: [infra, qemu]
  blocks: []
  resolved_by: TESTCASES-046t
  notes: "【正式登记（源 = `TESTCASES-046t` 动态档现场，2026-10-17；engineer 登记，待 architect 立项）】**现象（逐字，`.work/log/testcases/embench-user-dynamic.log`）**：38/38 例 `qemu-dadao -L <root> <b>.elf` ⇒ stderr `Error relocating /lib/ld-musl-dadao.so.1: RELRO protection failed: No error information`（再一行以被测 ELF 名同理）⇒ guest `exit 127`；无 board marker（`support/main.c` 从未执行）。**根因（现场三条，互相独立）**：① `qemu-dadao -strace` ⇒ `mprotect(NULL,<relro_start>,PROT_NONE|0x6000)`（三个位置**整体右移一位**：arg0 读到 0、arg1 = 真 start、arg2 = 真 len）；② 反汇编随包 `libc.so` 的 `reloc_all`（`llvm-readobj --symbols` = `0xD3F98`/908 B）在 `trap cfx0` 前为 `set.zw rd15,wp0,0xe2` + `set.zw rd18,wp0,0x1` + `rd2rb {rb16},{rd19}` ⇒ **旧桩布局**（5 data 槽 + 1 address 槽：`rd16=start`/`rd17=len`/`rd18=prot`/`rb16<-arg5=0`）；③ 时间序：`libc.so` mtime `2026-10-17 13:49:41` < `musl/arch/dadao/syscall_arch.h` `17:33:11`（`ISS-249` argmask 12→245，提交 `6d25629`）< `qemu-dadao` `18:31:20`（按新 argmask 重装）。**即：`ISS-249` 同时改了 musl 桩与 qemu 解码两侧，但 P2 产物 `libc.so` 未随之重建/重装**（`libc.a` 已于 18:34 重建，故静态档 38/38 正常；`QEMU-062t` 的动态验收用的是 13:49 旧 qemu，当时两侧同为旧协议）。**影响面**：所有走 `PT_INTERP`/`libc.so` 的动态可执行（`TESTCASES-046t`、`TESTCASES-047t`、`TESTCASES-048t` 的动态档）。**处置（本笔未做，越界 ✗）**：`make build-musl-shared JOBS=8`（该 target 自带 `install_ldso()`：`libc.so` + `ld-musl-dadao.so.1` 落 `paths.target_sysroot_dir()`）后复跑动态档；随后重跑 `tools/qemu/check_syscall_abi.py`（三载体对账）确认无漂移。**等级 = P1**（三套测试的动态档全被挡）。**证据指针**：`.work/evidence/TESTCASES-046t-dyn/run.sh`（default rc=0 断言本报告；根因段含 strace + 反汇编 + mtime 三证）、`.work/log/testcases/embench-user-dynamic.json`、`.work/log/testcases/embench-dyn-prereq-strace.log`。**交叉引用**：`ISS-249`（argmask 三载体）、`QEMU-062t`（`P3` 两档）、`INFRA-085t`（`P2` 产物）、`ISS-210`（安装根新鲜度）、`TESTCASES-046t`。 **处置（2026-10-17 19:5x；用户重跑 `make build-musl-shared JOBS=8` + 本册补门控）**：① `libc.so` 重建并重装（sha256 `a86a12cb…`，mtime 19:49；与 `make clean` 后同 target 全量重建**逐字节相同**，18.8 s）⇒ `TESTCASES-046t` 动态档复跑 **38/38 pass**（driver rc=0，16 s），动态特有项真观测（`AT_PHDR=0x10040`/`AT_ENTRY`=探针 `e_entry`/`AT_BASE`≠0 且页对齐/`AT_PHNUM`/`AT