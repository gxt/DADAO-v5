- id: ISS-223
  title: "【P3】musl 移植**显式排除 13 个源文件**（`arch/dadao/arch.mak`）⇒ `crypt()`/`crypt_r()`、`exec*` 族、`getcwd`、`sigdelset`、`.mo` 本地化、`getgr*`、resolver 在**链接期显式失败**（不静默）"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: INFRA-085t
  notes: "【正式登记（源 = `INFRA-082t` 阶段 A2+A3 完成区「新发现/坑 ③」+「遗留问题 ③」+ `components/musl/patches/arch/dadao/arch.mak.patch` = 现场实测；architect 提交/文件集审核时立项，2026-10-15）】**事实**：musl 端口用 **per-arch Makefile 钩子** `arch/dadao/arch.mak`（musl 的 `-include $(srcdir)/arch/$(ARCH)/arch.mak` 在 `BASE_SRCS` 之后，**上游认可位、无需改上游 `Makefile`**）以 `BASE_SRCS := $(filter-out …)` **显式排除 13 个源文件**，并每次构建 `$(info …)` 打印 ⇒ 排除**从不隐形**。**根因** = **LLVM 后端缺 ISel 能力**（`rotl`/`rotr`、`bswap`、`dynamic_stackalloc` ⇒ `Cannot select`），**非 libc 端口问题**（后端缺口见 `ISS-222`）；形态与 picolibc 端口的后端受阻源过滤**同源**（`INFRA-066t` / `ISS-193`）。**13 源（现场，按 `arch.mak` 注释的失败节点分组）**：`rotl`/`rotr` = `src/crypt/crypt_sha512.c`、`src/signal/sigdelset.c`；`bswap` = `src/locale/__mo_lookup.c`、`src/locale/dcngettext.c`、`src/passwd/getgrouplist.c`、`src/passwd/nscd_query.c`；`dynamic_stackalloc`（alloca/VLA）= `src/process/{execl,execle,execlp,execvp}.c`、`src/unistd/getcwd.c`、`src/network/res_msend.c`；**另 1 条** `src/passwd/getgr_a.c`（在过滤变量与 README 的 13 条之列，但 **`arch.mak` 注释未标注其失败节点**）。**⚠ 现场计数不一致（如实登记，非阻断）**：`arch.mak` 注释块 = **12** 条 `src/…`（`grep -c` 现场），过滤变量 `DADAO_BACKEND_BLOCKED_SRCS` = **13** 条，README 述 **13** ⇒ **注释少 1 条（`getgr_a.c`）**；影响面 = 「逐条复检/移除」时该条**无失败签名可依**（其余 12 条可据注释直接重跑核验）。**影响面（显式失败，非静默）**：这些文件**不在** `libc.a` ⇒ 用到即**链接期失败**：`crypt()`/`crypt_r()`（`crypt_r.o` 引用被排除的 `__crypt_sha512`，`nm` 实测 `U __crypt_sha512`）、`exec*` 族、`getcwd`、`sigdelset`、`.mo` 本地化（`__mo_lookup`/`dcngettext`）、`getgrouplist`/`getgr_a`、`nscd_query`、resolver（`res_msend`）。**均不可达 `P1` 静态最小集**（`write` + `exit`）⇒ **未阻塞阶段 A3**（已编出静态 ELF）。**处置建议**：① 待 `ISS-222` 的后端缺口（`rotl`/`rotr`/`bswap`/`dynamic_stackalloc` 的 ISel 选择）收口后**逐条删排除项**（注释已带失败节点，便于复检与移除；重建 + `check-patch-tree` 核对）；② **或**对确不适用者（如 resolver / `nscd_query` 在「无内核」下本无服务）**明确声明不支持**（写入 `components/musl/README.md`「已知边界」）—— **二者择一，勿悬空**；③ **建议落点 = `infra` 侧小任务**（`ISS-222` 收口后触发）。**`status` 取 `open`（architect 判断）**：① 排除面**仍在**（未补齐、未声明不支持）；② **可复发语境** = 后端补上能力后需回删该表；③ **无机械门控可判**（「源被排除」= 构建编排的显式选择，非可测断言）。证据指针：`.tao/archive/M8/infra/INFRA-082t-musl静态最小集移植.md`「完成区·阶段 A2+A3」坑③ + 遗留③ + 「## 阶段 A2+A3 遗留」；`components/musl/patches/arch/dadao/arch.mak.patch`（注释块 12 条 vs 过滤变量 13 条）；`components/musl/README.md`（§后端缺口过滤 / §已知边界）；`.work/log/musl/`（构建期 `$(info …)` 输出）。**交叉引用**：`ISS-222`（后端缺口 4 类，本条之根因）、`ISS-193`（picolibc 侧同类过滤表）、`INFRA-066t`（过滤表形态先例）。"
- id: ISS-232
  title: "【P3】`llvm-mc --show-encoding` 对低半 `%pcrel_lo`（`rbha ≥ 4`）命中上游断言 ⇒ SIGABRT（rc=134）；**仅显示模式**（`-filetype=obj` 不受影响）；修法触及被 `check_mc` A7 与契约 §2.2 钉住的 fixup 元数据表 ⇒ **须裁定**"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-132t
  notes: "【正式登记（源 = `LLVM-095t`「遗留① 修复」完成区「新发现②」+ 收尾复核块 ②；architect 提交/文件集审核时立项并**现场复现复核**，2026-10-16）】**现象（现场复现，rc=134）**：`echo 'ld.o rb4, [rb4, %pcrel_lo(.Lhi0)]' | llvm-mc --triple=dadao-unknown-elf --show-encoding` ⇒ **SIGABRT**（signal=6，**rc=134**）；文案**逐字** = `llvm-mc: …/llvm/lib/MC/MCAsmStreamer.cpp:134: void llvm::MCAsmBaseStreamer::addEncodingComment(…): Assertion `Bit == 0 && \"Encoder wrote into fixed up bit!\"' failed.`。**触发条件**：低半（`%pcrel_lo`）且目的 `rbha ≥ 4`（`clang` 默认的 `rb4` 即命中）；同文本换 `rb1`（`rbha < 4`）⇒ **rc=0** 且正常打印 `… fixup A - offset: 0, value: %pcrel_lo(.Lhi0), kind: DADAO_FK_PCREL_LO`。**只影响该显示模式** ✗：`-filetype=obj` 同内容 **rc=0**，且 `llvm-readobj -r --expand-relocs` 得**两条**记录（`R_DADAO_PCREL_HI (14)` @`0x0` + `R_DADAO_PCREL_LO (15)` @`0x4`，LO symbol = `.text` 节符号）⇒ 目标文件产出**不受影响**。**根因（现场判据）**：`MCFixupKindInfo` 的 `{Offset 0, TargetSize 12}` 与 streamer 在**大端**下的 **MSB-first** `FixupMap` 位序不符 —— 映射落到 opcode / `rbha` 位（需在已设 `Bit` 处再写 ⇒ 断言）。**修法触及被钉住的载体**：须动 `components/llvm-project/patches/…/DADAOAsmBackend.cpp` 的 fixup 元数据表，而该表被 `check_mc.py` 的 `A7`（「字段宽 18/12」）与 `.tao/contracts/contract-elf.md §2.2` 引用同时钉住 ⇒ **须架构师 / 用户裁定**（可能连带改 `A7` 断言与契约叙述），**不擅自改** ✗。**`status` 取 `open`（architect 判断）**：① 缺陷**仍在**（现场 rc=134 复现）；② **可复发**（任一 `rbha ≥ 4` 的低半 `--show-encoding`，含 `clang -S` 打印文本回流）；③ **须裁定**（修法跨 `A7` 门控 + 契约引用）。**性质** = 显示模式缺陷（**非** `LLVM-095t` 交付面缺陷 —— 其交付判据 = `%pcrel_*` 可解析 + 文本往返逐字节 + 对象两条记录，均已交付并留证；本项为**同笔发现、按裁定不修**）。**边界**：本笔**未改** `components/**`、未改 `contracts/`、未改 `.tao/contracts/**`（只登记 + 给触发条件 / 影响面 / 修法边界）。证据指针：`.tao/archive/M8/llvm/LLVM-095t-REL32与PLT内联.md`「遗留① 修复 完成记录」→「新发现/坑 ②」+「遗留问题 ②」+「收尾遗留处置 完成记录」§②；`.tao/archive/M8/qemu/QEMU-061t-rela-si解码与语义.md`「收尾遗留处置…」§④；`.work/log/llvm/QEMU-061t-show-encoding-recheck.log`（本机留档，不入库）；`tests/llvm/lit/MC/DADAO/pcrel-specifier.s` L19–24（注释明写该显示模式缺陷 + 低半改走 `-filetype=obj`）；现场工具 = `.dadao/cross-toolchain/bin/llvm-mc`（md5 `59f5b7f20780bcc0618880aaebcb0b75`）。**交叉引用**：`ISS-210`（安装根 × 构建树一致性：本项判定以**已安装根**为准）、`LLVM-095t`（发现者）、`contract-elf.md §2.2`（`14`/`15` 两行 + `imms18`/`imms12` 字段）。"
- id: ISS-247
  title: "【P2】`qemu-user`（`qemu-dadao`）无法装载按 `dadao.lds` 基址（`0xFC00_0000_0000`）链接的静态 ELF（47 位宿主 VA ⇒ `Unable to find a guest_base`）⇒ 静态/动态测试需在 lld 默认基址链接"
  status: closed
  scope: [qemu]
  blocks: []
  resolved_by: "TESTCASES-046t/TESTCASES-047t（by design：用户模式一律 lld 默认基址 0x10000；`min PT_LOAD == 0xFC00_0000_0000` 由套件守卫判 blocked）"
  notes: "【正式登记（源 = `QEMU-062t` 完成区「新发现/坑 ①」；architect 立项，2026-10-17）】**现象（现场，逐字）**：`qemu-dadao ./<静态 ELF>`（该 ELF 按 `tests/scripts/dadao.lds` 链接）⇒ `error_report` 原文 = `<image>: Unable to find a guest_base to satisfy all guest address mapping requirements`（源码 `.work/source/qemu/common-user/probe-guest-base.c:311`）⇒ `exit(EXIT_FAILURE)`，**未能进入 guest**。**根因（两层，现场）**：① `tests/scripts/dadao.lds` 的 `MEMORY { RAM (rwx) : ORIGIN = 0xFC0000000000, LENGTH = 16M }` ⇒ 首个 `PT_LOAD` 落在 `0xFC00_0000_0000`（M4 测试机 RAM 基址；该脚本属 M4 裸机 ELF 口径，见 `contract-elf.md §5`/`ADR-0004`）；② 宿主 = Linux x86-64（**47 位用户 VA**，上限 `0x7FFF_FFFF_FFFF`）⇒ 宿主 `mmap(0xFC00_0000_0000)` = `ENOMEM`，而 QEMU user-mode 的 `guest_base` 探测（`common-user/probe-guest-base.c`：`pgb_find_itree` 从 `1 GiB` 起**只向上**搜索、`pgb_find_fallback` 同样从 `skip` 递增）**不搜索负平移** ⇒ 该镜像需要的 `guest_base = 0`（identity）在宿主上不可能成立；`-B`（`pgb_fixed`）只校验对齐 + 在该基址可 `mmap`，**负偏移形态不在支持范围**。**影响面（触发面）**：**任何**用 `dadao.lds` 链接的产物（含三套测试 `embench-iot` / `libc-test` / `llvm-test-suite` 若沿用该脚本的静态/动态档）在本宿主上**全部不可装载**；`QEMU-062t` 的静态/动态验收因此改用 **P1 的 `crt1.o` + `libc.a` 在 lld 默认基址**链接的程序（**P1 产物与 `dadao.lds` 均未改** ✗）。**在役绕行（已用）**：测试程序按 lld **默认基址**链接（非 `-T dadao.lds`）⇒ 可装载、可跑（`QEMU-062t` 两档 E2E 即此口径）。**待裁定（不擅改 ✗）**：(a) `qemu-user` 侧支持「guest VA 高于宿主 VA 上限」的装载（需 `guest_base` 负平移 / `reserved_va` 类改造，属 qemu 补丁面）；(b) 测试侧统一改用默认基址（约定层，不改 `dadao.lds`）；(c) 改 `dadao.lds` 的 `RAM ORIGIN`（属 `tests/scripts/` 与 `contract-elf.md §5` 契约口径 ⇒ **须用户授权**）。**证据指针**：`.tao/archive/M8/qemu/QEMU-062t-qemu-user的dadao后端.md` 完成区「新发现/坑 ①」；`tests/scripts/dadao.lds:28`（`RAM ORIGIN`）；`.work/source/qemu/common-user/probe-guest-base.c:120-322`（向上搜索 / `pgb_fixed`）；本笔**无**落盘失败日志（该探测为 `QEMU-062t` 执行期的一次性现场，未留存）——如实标注。**交叉引用**：`QEMU-062t`（登记源）、`QEMU-061t`、`contract-elf.md §5`/`§6.1.2`、`ADR-0004`（M4 RAM 基址）、`ADR-0025 D6`（`P3` 范围）。**〔用户裁定（2026-10-17 深夜，渠道 = 经主会话问答；本笔据其原话落纸）〕** 用户原话（**逐字**）：「**ISS-260:1；ISS-247：用户模式，用0x10000**」⇒ **裁定 = 候选 (b) 的显式化**：**用户态（`qemu-user`）链接基址用 `0x10000`；`dadao.lds` 不动**（仍为 M4 裸机口径）。**落地口径**：测试脚本/驱动按 lld 默认基址（最低 `PT_LOAD=0x10000`）链接，禁 `-T dadao.lds`；`dadao.lds` 与 qemu 装载面均不改。`status` **保持 `open`**（口径已定、落实在测试脚本；本笔未改脚本）、`resolved_by` 保持 `null`。"
- id: ISS-255
  title: 【P3】`qemu-dadao` 上两条 `libc-test` 回归用例以宿主 `SIGBUS`/`SIGTRAP` 终止（`regression/flockfile-list`、`regression/setenv-oom`）⇒ 归 qemu 面诊断
  status: open
  scope:
  - qemu
  blocks: []
  resolved_by: null
  notes: '【正式登记（源 = `TESTCASES-047t` 静态档现场，2026-10-17；architect 立项）】**现象**：`regression/flockfile-list`、`regression/setenv-oom` 两例在 `qemu-dadao` 上以宿主 `SIGBUS`/`SIGTRAP` 终止（非 guest 退出码），归 `blocked`。**性质（未定根因）**：可能是 qemu-user 的 guest 栈/内存映射或 `setenv` OOM 路径的宿主侧故障；**不预设**为测试缺陷。**等级 = P3**（2 例、非阻断）。**处置**：qemu 面诊断（宿主信号来源 / guest 地址映射 / 是否 `setenv-oom` 依赖内存上限），给出「guest 可判失败」或修 qemu。**证据指针**：`TESTCASES-047t` 完成区 blocked 段。**交叉引用**：`QEMU-062t`（user-mode 后端）、`ISS-247`（装载基址）。**〔追加（2026-10-17，architect）〕** 同类 flake 另见 **`ISS-257`**（`regression/pthread_create-oom`：一次 `pass`、其后 5/5 pilot + 8/8 单跑全 `BLOCKED`；同属 guest `setrlimit(RLIMIT_AS)` 直通宿主）。 〔立册（2026-10-18，architect）〕归 `QEMU-063t`（与 `ISS-266` 同批；诊断时间盒 1–2 h，超时归因 + 保留现场）。 〔逐例归因（2026-10-19，`QEMU-063t`）〕① `regression/flockfile-list`：宿主 `SIGBUS`（`BUS_ADRALN`，si_addr `0x394fc`）由 `cpu_mmu_lookup` 的对齐检查在 `do_st8_mmu` 处触发 —— 该 8 B store 地址为 4 mod 8；根因 = 语料自带的 interpose `malloc` 从 `static unsigned char buf[1<<20]` 里按字节切块、不保证 8 B 对齐（`libc-test/src/regression/flockfile-list.c`），而 DADAO 8 B 访问要求 8 B 对齐 ⇒ **负载自身问题**，非 qemu 缺陷。② `regression/setenv-oom`：**qemu 限制**（家族同 `ISS-257`）——`setrlimit(RLIMIT_AS)` 直通宿主，随后 GLib 分配 512 B 失败并 `g_error` ⇒ `qemu-dadao: QEMU internal SIGTRAP`；需 linux-user 侧虚拟化 `RLIMIT_AS`，本册时间盒内未实现。证据：`.work/log/qemu/QEMU-063t-gdb-flockfile-list.log`、`.work/log/qemu/QEMU-063t-setenv-oom.log`、`.work/evidence/QEMU-063t/`。`status` 保持 open。 〔M8 收口核对：两例归因已完成（语料 8 B 对齐 / `RLIMIT_AS` 直通宿主）；qemu 侧虚拟化未做；不阻断 M8。〕 〔`LLVM-100t` 证据脚本复核（2026-10-20，reviewer 独立重跑）〕`run.sh --inject` **3 跑中 1 次 2 红**（`inj.expect.restored.probe.rc` actual=139 + `PROBE_OK` 缺），现场 = `qemu-dadao` **宿主 `SIGSEGV`**（脚本打印 `Segmentation fault (core dumped)`），发生于「还原探针源→重建→重跑」步；同 ELF 直跑 **20/20 rc=0**、随后再跑 `--inject` **2 次全绿** ⇒ **偶发，非脚本 / 交付物缺陷**（脚本如实报 FAIL、未掩盖 = 行为正确）。本条即该族（宿主信号）第 3 个实例；判「偶发」的重复跑证据见 `LLVM-100t` 册「证据脚本独立复核」段。'
