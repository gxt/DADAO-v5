- id: ISS-357
  scope: [gem5, testcases]
  status: open
  resolved_by: null
  title: >-
    【P2】gem5 SE 输出捕获的 stdout/stderr 顺序与参考不一致（`2>&1` 交错 vs
    fd1/fd2 分开后按 `stdout+stderr` 串接）。已确认**至少 4 例**可由
    `stderr+stdout+exit` 与参考逐字节相等：FreeBench `analyzer`/`pifft`/`mason`/`neural`
    （前两例本在第一轮 9 个 fail 内；后两例是 `gem5_only_fail` 9→11 的差值）。
    **不可全局交换顺序**：另有 1 例需 `stdout+stderr`，31 例 pass 走非逐字节比对。
    修复方向：SE 驱动层保留 fd1/fd2 写出顺序；修复前不按能力缺口计。详见
    `.tao/knowledge/refs/TESTCASES-103t-timeout-recheck.md`。

- id: ISS-358
  scope: [gem5]
  status: open
  resolved_by: null
  title: >-
    【P2】gem5 `BaseSemihosting::callWrite` 句柄越界判断写成 `handle > files.size()`（应为 `>=`）：
    未 `SYS_OPEN` 时 handle=1 会读 `files[1]` 越界，实测 segfault（`m12-chipyard-004` 探针）。
    同时 QEMU arm-compat 模式未预置 guest fd 0/1/2 ⇒ 三平台的 `SYS_WRITE` 行为不可直接比对。
    建议：gem5 修正边界判断；三平台比对的 semihosting 用例改用 `SYS_WRITE0`/`SYS_WRITEC`（不依赖句柄），
    `SYS_WRITE` 单独按引擎成像。

- id: ISS-359
  scope: [gem5, testcases]
  status: open
  resolved_by: null
  title: >-
    【P2】gem5 SE loader 拒绝字节对齐的 `.bss` 子段：`src/sim/process.cc:196` 的
    `fatal_if((seg.base & 3) != 0, ...)` 在 `p_vaddr + p_filesz` 非 4 字节对齐时直接 fatal。
    dynamic llvm-ts 有 7 例因此 blocked（QEMU 可正常装载），名单见
    `refs/INTEG-059t-se-parity-summary.json` 的 `new_findings`。
    建议：改为「按对齐要求零填到下一个对齐边界」而不是 fatal；属 gem5 实现缺口，另立任务。
