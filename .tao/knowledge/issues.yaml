  title: 【P1】**FMA `qNaN × ±Inf + ∓Inf` 错误抬 `NV`，且模型与 RTL 同错**（`m12-chipyard-013` reviewer 发现）：例 `qNaN × +Inf + (−Inf)` ⇒ core/hardfloat `1/0`；`fp_ref.fma_exact` 的 `prod_inf` 未排除 NaN 乘数 ⇒ 台架与核上对照互相印证「错误答案」，两边都绿。依据 `contract-fp §20` / `SimRISC-07 §2.5`（Inf 条前提为「±Inf × 有限非零数」，NaN 条只对 sNaN 置 NV）。修法：`WumingMulAddRecFN` 的 `infDiff`/`prodInf` 先排除 NaN 乘数，模型同步，并补「NaN×Inf」与「Inf+Inf 异号」两组区分例。**教训**：模型与被测实现共享同一前提缺失时，差分不产生信号——须有独立 oracle（reviewer 自写 IEEE oracle 14356 例才覆盖到）。
