  notes: "【正式登记（源 = `QEMU-061t` L3 载体补齐笔「新发现/坑 ③」+ 本笔**现场复核**；architect 立项，2026-10-17）】**现象（现场复核，只读；未重跑门控）**：① L3 门控 `check-qemu-semantics`（`Makefile:878`）的**载体清单** = `Makefile:881` 的 `for v in reg-shift-extend.yaml reg-compare.yaml aip-si.yaml; do`（**3 册**）；`check-full`(**L3**) = `check-qemu-semantics` + `test-m6`（`Makefile:508`）⇒ 语义执行面**只有这 3 册**。② 同处注记（`Makefile:866-867`）现称 `Runs all cases in reg-shift-extend + reg-compare + aip-si`；而 `tests/vectors/isa/` 现场 `ls *.yaml | wc -l` = **16** 册（`aip-si`/`ctrl-br`/`ctrl-call`/`ctrl-jump`/`ctrl-ret`/`mem-ra`/`mem-rb`/`mem-rd`/`misc`/`reg-arith`/`reg-compare`/`reg-cond-assign`/`reg-imm-block`/`reg-logic`/`reg-shift-extend`/`reserved`）⇒ 门控覆盖 **3/16**（现场派生）。③ 其余 **13 册**在 L1/L2/L3 **零门控消费**（逐册 `grep -n '<name>.yaml' Makefile` ⇒ **仅上述 3 册命中**；L2 `check-qemu-smoke` 的载体 `GATE_VECTORS`〔`tests/scripts/run_qemu_smoke.py:40`〕= **同样 3 册** ⇒ L2/L3 **同载体、不互补**）；这 13 册现由**生成器 / 探针 / 手跑脚本**消费（`tools/testcases/generate_*.py`、`tools/qemu/check_005t_coverage.py`、`tests/scripts/run_qemu_test.py`），**无 Makefile 门控目标**。④ **口径漂移实例（既有，非本笔引入）**：`tests/scripts/run_qemu_smoke.py:4-5` 与 `:37` 称「**全量** 161 用例」「**全量**留在 L3」「**不**把全部 ISA 向量塞进来（那是 **L3 的规模**）」⇒ 该「全量」只指**载体集内**的全量、**非** `tests/vectors/isa/` 全集 —— 后来者据门控日志 `Results: 161 total` 易推断「ISA 语义向量已全量跑过」，而 13 册（含 `ctrl-*`/`mem-*`/`misc`/`reserved`）**未进门控** ✗。**判据** = 门控自称「全量」而载体与 `tests/vectors/isa/` 全集不符 ⇒ 覆盖声明与载体脱钩。**建议（未实施 ✗；本笔刻意**不**扩张载体以免连带打红）**：二选一须裁定 —— **(甲)** 扩张 L3 载体至全集（**须先**现场验 13 册能否全绿，再改 `Makefile`；否则计数一变即可能大红）；**(乙)** 收窄措辞 + 显式登记（「全量」改为「载体集三册」，并在 `tests/vectors/inventory.md` 增「门控覆盖（L2/L3）」列，逐册标「进门控 / 未进门控」）。**`status` 取 `open`（architect 判断）**：① 偏离**仍在**（13 册未进门控）；② **可复发**（新增 ISA 向量册默认不进 L3 载体 —— `aip.si` 即先例 = `ISS-233`）；③ **有机械判据可加**（如断言「载体集 ⊇ 登记的执行面册清单」或「docstring 措辞 ↔ 载体数一致」）。**性质** = 门控覆盖口径偏离（**非** `QEMU-061t` 交付面缺陷 —— 其 L3 判据 = rc=0，已达成）。**边界**：本笔**只登记** —— **未改** `Makefile` 载体清单 ✗、**未改** `tests/vectors/**` ✗、**未改**门控代码 ✗；本笔另订正 `tests/scripts/run_qemu_smoke.py:4` 的**陈旧计数**（`1