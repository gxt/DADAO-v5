- id: ISS-266
  title: 【P3】`qemu-dadao` 在 4 个 `llvm-test-suite` 程序上以**宿主 SIGSEGV** 终止（SPASS / consumer-typeset / 8b10b / dbms）⇒ 归 qemu-user 面诊断
  status: open
