- id: ISS-216
  title: "【P2】`dadao-m1` 机体现**无 `SYS_UMON_SYSCALL` 服务方**——P1（`INFRA-082t`）的 syscall stub 在 QEMU 侧**无可执行路径**，须先定「谁提供 `umon` syscall 服务」口径"
  status: closed
  scope: [qemu, infra]
  blocks: []
  resolved_by: INFRA-082t
  notes: "【正式登记（源 = `INFRA-082t`〔原 `INFRA-081t`，2026-10-15 改号〕立项现场实测「已知事实 4」+「待确认项 ①」；architect 提交/文件集审核时立项，2026-10-15）】**现象（现场实测 ✓）**：`dadao-m1` 机器的 QEMU 实现（`components/qemu/patches/target/dadao/`）**只覆盖两条路径**：① **一般 `trap`**（`immu18[17:16] != 2'b11`）⇒ `gen_helper_cfx_trap` 进 cfx 向量（`helper.c.patch` 的 `helper_cfx_trap`，`Machine-01 §5` 流程）；② **semihosting 短路**（`immu18[17:16] == 2'b11`）⇒ 译码层 `DADAO_EXCP_SEMIHOST`、由 `do_common_semihosting()` 服务并越过 trap（**不进 cfx 向量**）。**未实现** `immu18 != 2'b11` 的 **`umon` syscall 分发服务方**（`SBI_UMON_SYSCALL`，`immu18 = 0`、`cfxha = 0`）。**影响（P1 阻断性口径缺口）**：`INFRA-082t` 的 musl **syscall stub**（`trap cfx0, 0`；号 `rd15` / 返回 `rd8` / errno = `rd8` 负值；口径真源 `.tao/contracts/contract-syscall.md`）在 **QEMU 侧无可执行路径** ⇒ P1 判据「静态可运行（`hello`/`exit` E2E）」**无法在现有 `-M dadao-m1` 上验收**，须先定「谁为 `trap cfx0,0` 提供 Linux 语义服务」。**上游已有 ABI 口径（勿重复发明）**：`SBI_UMON_SYSCALL` 号表见 `spec/DADAO-22-SBI §2` 第 0 行（`rd15 = nr` ⇒ `rd8 = result`；`umon`/`jmon` 双层模型）+ `SPEC-138t`（`contract-syscall.md`，`已验证`）已映射 Linux 号表/返回/errno。**候选对策（供后续裁定，本笔只登记、不定案）**：ⓐ **在 QEMU `dadao` 机器补 `SYS_UMON_SYSCALL` 服务**（照 `DADAO-22 SBI` 的 `umon`/`jmon` + `SPEC-138t` 号表；须另立 QEMU 侧任务，或作为 `P1` 的验证载体并入）；ⓑ **先用 semihosting 短路跑通再补**（`P1` 先以 semihosting `SYS_*` 为底座证「静态可运行」，`umon` 服务后补）；ⓒ 把补齐并入 `INFRA-082t` 范围 ✗（**不改 P1 任务书范围** ✗ —— 仅在 issue 内列候选）。**status 取 `open`（architect 判断）**：① 对策**未落地**，且属**范围/归属口径**、须**用户语义裁定**（= `INFRA-082t`「待确认项 ①」）；② 该缺口**可复发**（任何依赖 `umon` syscall 的 P1/P2 任务均撞同一路径）；③ **无机械门控可判**（QEMU 侧「缺服务方」非可测断言）。证据指针：`.tao/tasks/infra/INFRA-082t-musl静态最小集移植.md`「已知事实 4」+「待确认项 ①」；`.tao/contracts/contract-syscall.md §2`；`spec/DADAO-22-SBI-主管系统二进制接口.md §2`；QEMU 侧 `components/qemu/patches/target/dadao/helper.c.patch` + `insn_trans/trans_ctrl.c.inc.patch`（`SYS_UMON` 全仓 `grep` **0 命中**）。**【追加裁定（architect 提交/文件集审核，2026-10-15）】已由主会话 2026-10-15 裁定：在 `INFRA-082t`（P1）内先补 QEMU 侧 `SYS_UMON_SYSCALL` 服务（候选 ⓐ）；与 `INFRA-082t`「§前置结论 2」一致。`status` 保持 `open`，待实现后随 `INFRA-082t` 收尾关闭。**【关闭（2026-10-15，`INFRA-082t` `/complete` 收尾；architect）】**A1 已补 QEMU 侧 `SYS_UMON_SYSCALL` 服务：`write`(64)／`writev`(66)／`exit`(93)／`exit_group`(94) + `set_tid_address`(96)；**识别条件 = `trap cfxha=0, immu18=0` 且 user 模式**（`hypv` 模式仍走 §5 向量路径 ✓——全模式短路会毁 `bootrom` 的 `hypv→user` 交接）；未实现号 ⇒ `rd8 = -ENOSYS`（显式失败、不静默）；**阶段 B 已实跑 `hello`/`exit` 通过**（`exit` 退出码忠实传宿主 `$?` = 42）⇒ `status: closed`、`resolved_by: INFRA-082t`。证据指针：`.tao/tasks/infra/INFRA-082t-musl静态最小集移植.md` 完成区「阶段 A1」+「阶段 B」；`.work/evidence/INFRA-082t/run-a1.sh`（27/0）与 `run-b.sh`（46/0）。**"

