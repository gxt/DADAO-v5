  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `LLVM-102t` 完成区「D4 caller 侧」坑②③ + 执行期偏差行，2026-10-18；architect 登记，待用户裁定；本笔不改 `ADR`）】**①** 9–15 B 通用聚合（两块）也走「偶号起」：`ADR-0031 D6` 只对 **16 B** 强制偶号配对，但后端在 `reassignDADAOArgLocs` 只看到 `[2 x i64]` 形态、无法区分 12 B 与 16 B ⇒ 统一按偶号起；`va_arg` 侧用 `Slots==2` 同步以保持 caller/callee 一致。**影响**：不改变 16 B 语义，仅 9–15 B 值在奇数游标时可能多跳 1 槽（多耗，不错值）。**②** `f128`（及 16 B 值）**栈上**为两个连续 8 B，未做 16 B 补位：`ADR-0031 D7` 字面要求「16 B 对齐」，实际 `stack_next` 按 8 B 单位推进 ⇒ 若 `sp` 起点非 16 B 对齐，f128 在栈上可能跨 16 B 边界。**影响**：本轮探针与 lit 全绿（`p_d4` 86→0、lit 34/34、047t 两档 10/10），但与 `D7` 字面不符，属**契约口径偏差**。**处置**：两条均**待裁**（改 `ADR-0031` 注记 / 排后续任务补 16 B 补位 / 维持现状并订正 `D7` 表述）；**本笔不改 `ADR` 正文**，由主会话在册外提请用户裁定。**等级 = P2**（`M8` 收口相关、非阻断当前测试面）。**证据指针**：`.tao/tasks/llvm/LLVM-102t-brind间接分支与变参寄存器耗尽.md`「D4 caller 侧」坑②③ + 执行期偏差行；`.work/evidence/LLVM-102t-D4/run.sh`。**交叉引用**：`ADR-0031 D6`/`D7`、`LLVM-102t`、`LLVM-106t`（f128 前端/ABI 面）。**边界**：只登记；未改 `ADR`、未改后端代码、未改任务状态。"
