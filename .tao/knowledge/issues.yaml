  notes: "【正式登记（源 = `INFRA-085t` 阶段 A1 现场实测；architect 立项，2026-10-17）】**现象（现场，真实输出）**：`make build-musl-shared` ⇒ `obj/src/misc/fmtmsg.lo`（4 错）+ `obj/src/regex/regcomp.lo`（20 错，含 `-ferror-limit`），文案两类 —— `error: relocatable operand in a 1/2/4-byte data field (.byte/.short/.long) cannot carry a 48-bit DADAO address; use '.dd.o64'/'.quad' (8-byte field)` 与 `error: relocatable operand in '.dd.b08/.dd.w16/.dd.t32' is not supported (a DADAO address needs an 8-byte field; use '.dd.o64')`；触发行（`-save-temps` 现场）：`fmtmsg.s:575 .dd.t32 .L.str.6-.Lswitch.table.fmtmsg.rel`。**触发条件**：**仅 `-fPIC`**（同一源、同 `-O2`，无 `-fPIC` ⇒ `.dd.o64` 8 字节绝对项，编过）。**根因（现场读源码）**：`RelLookupTableConverter` 模块 pass（`llvm/lib/Transforms/Utils/RelLookupTableConverter.cpp`，Pipeline 内**无条件**加入：`PassBuilderPipelines.cpp:1728`）把「`static const` 指针常量表 + GEP/load」改写成**相对查找表**（表项 = `元素地址 − 表基址`，32 位）⇒ 需要**32 位 PC 相对数据**重定位；DADAO 类型集**冻结无此类**（`ADR-0019 D10`；`ADR-0029` 的 `R_DADAO_PCREL_HI/LO` 只服务**指令站点**的 `aip.si`+`ld.o` 配对）。**该 pass 的开关是 TTI**：`BasicTTIImpl::shouldBuildRelLookupTables()`（`llvm/include/llvm/CodeGen/BasicTTIImpl.h:653`；默认「PIC + 64 位 + 非 Medium/Large code model」= **true**），而 DADAO 目标**没有 `TargetTransformInfo` 覆盖**（`components/llvm-project/patches/llvm/lib/Target/DADAO/` 下无 `*TransformInfo*`）⇒ **目标侧缺一个 opt-out**（对照：**跳转表**编码 DADAO 已主动钉死 `EK_BlockAddress`，见 `DADAOTargetLowering::getJumpTableEncoding()` —— 但**不覆盖**本 pass 的相对查找表，二者是两条独立路径）。**影响**：musl **共享库**（`-fPIC` 全量对象）构建受阻；静态档不触发（非 PIC）。**建议修法（未实施 ✗）**：DADAO 增 `TargetTransformInfo` 覆盖 `shouldBuildRelLookupTables() → false`（等价于落回 8 字节绝对项）。**证据指针**：`.work/log/infra/INFRA-085t-evidence/s3-shared-build.log`（23 错 + 两个 `make[1]: *** … Error 1`）、`.work/log/infra/INFRA-085t-probe-shared-make-k.log`（`make -k` 全量：**恰 2** 个 `.lo` 因本因失败）；`.work/evidence/INFRA-085t/run.sh` 节 `S3`。**交叉引用**：`INFRA-085t`（登记源）、`ISS-222`（同族「后端缺能力被消费侧暴露」，但根因不同：本条是 pass 选择，非 ISel 缺 pattern）。"

- id: ISS-241
  title: "【P2】`-shared` 链接**拒绝** `R_DADAO_ABS48` 打**局部标签**（`-fPIC` 对象 `.rodata` 里的常量指针表，如 `.rela.rodata.catopen → .L0`）⇒ `recompile with -fPIC`（而该对象**本就是 `-fPIC`**）⇒ 真实 musl 共享库链接受阻"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-096t
  notes: "【正式登记（源 = `INFRA-085t` 阶段 A1 现场实测；architect 立项，2026-10-17）】**现象（最小复现，现场真实输出）**：`clang --target=dadao-unknown-elf -nostdlib -Wl,-shared -o x.so .work/source/musl/obj/src/locale/catopen.lo` ⇒ **rc=1**、`error: relocation R_DADAO_ABS48 cannot be used against symbol '.L0 '; recompile with -fPIC`（单对象 20 处）；**同一对象**改走静态链接（`-Wl,-e,_dlstart`）**不报该错**（只剩 `undefined symbol: strchr`）⇒ **`-shared` 独有**。对象侧现场：`.rela.rodata.catopen` 有 3 条 `R_DADAO_ABS48 .L0 0x0`（`llvm-readobj --relocations`），节名 `.rodata.catopen`（**非** `.data.rel.ro`）。**根因（两层，皆生产侧）**：`-fPIC` 下**常量指针表**（本条来自 `catopen()` 的 dense `switch` 派生表，`src/locale/catopen.c:28-60`）被 LLVM 留在**只读节**并以**绝对地址**（`ABS48`）表达；共享对象里「局部符号的绝对地址」只能在**装载期**由动态重定位（`R_DADAO_RELATIVE` 族）修正，而纠正手段要求 ①编译器把该常量放进**可写可重定位**节（`.data.rel.ro` 惯例）**或** ②链接器把局部 `ABS48` 转成 `R_DADAO_RELATIVE` 并把节置为可写 —— 现状**两者都缺**（lld 直接报错）。**影响**：真实 musl **全量对象**（`catopen`/`iconv`/`cos`/`sysconf`/`atan2`/`lgammaf_r`…）进共享库即被拒 ⇒ 与本册 `ISS-240`/`ISS-222 ④` 并列的**第三个** `libc.so` 阻塞项（`INFRA-085t` 阶段 A1 现场：即便临时排除那 3 个编不过的 `.lo`，「真对象 + `-Wl,-shared`」仍在**本因**上失败）。**建议修法（未实施 ✗）**：编译器侧按 PIC 规则把此类常量放 `.data.rel.ro`（首选，与各 arch 一致）／或链接器侧把局部 `ABS48` 降级为 `RELATIVE` + 节可写（须与 `ADR-0019 D10` 类型集一致，**不得**新增编号）。**证据指针**：`.work/log/infra/INFRA-085t-evidence/s4b-gap3-{shared,static}.log`、`.work/log/infra/INFRA-085t-evidence/s3-shared-build.log`；`.work/evidence/INFRA-085t/run.sh` 节 `S4b`（含「同对象静态链接不报该错」的对照）。**交叉引用**：`INFRA-085t`（登记源）、`ADR-0019 D10`（类型集冻结）、`ADR-0029`（`PCREL_HI/LO` 仅服务指令站点）、`ISS-240`（同属 `-fPIC` 暴露面，但机制不同：本条是**常量节/动态重定位**，非查找表编码）。 **〔关闭（2026-10-17，只读复核；architect 落账）〕**按 `LLVM-098t` 诊断（本 issue 与其同机制、`catopen` 现落 `.data.rel.ro.catopen`）做**只读现场复核**（安装根 `.dadao/cross-toolchain/bin`、23.1.3；**不复用旧对象**）：① 以 musl `-fPIC -O2` 配方**重编** `src/locale/catopen.c` ⇒ **rc=0**，节 = `.data.rel.ro.catopen`（`SHF_WRITE|SHF_ALLOC`），50 条 `R_DADAO_ABS48 .L0` 全在 `.rela.data.rel.ro.catopen`（**可写节**）；② 同一对象 `-nostdlib -Wl,-shared` ⇒ **rc=1**，但 `grep -c 'R_DADAO_ABS48 cannot be used against symbol'` = **0**（仅剩 `undefined hidden symbol: __map_file`/`___errno_location`/`__strchrnul`/`__libc` = 单对象链接的预期缺符号）⇒ **原签名已不出现**；③ **可达 FAIL 对照**：同源 `-fno-pic` ⇒ 节落 `.rodata.catopen`（仅 `SHF_ALLOC`），同 `-Wl,-shared` ⇒ **20** 处同类错误（符号 `.L.str`）⇒ 断言非恒真、差异在**节放置**；④ 构建树现对象 `obj/src/locale/catopen.lo`（2026-10-17 11:25 重建）同测 ⇒ **0** 处该签名。⇒ 编译器侧已把 PIC 常量指针表放 `.data.rel.ro`（`LLVM-096t` 落地；`LLVM-098t` 为诊断、0 补丁）⇒ `closed`、`resolved_by: LLVM-096t`。**未改** `components/**` ✗。证据指针：`.work/log/llvm/ISS-241/{catopen-fresh-compile.log,catopen-fresh.relocs.txt,gap3-fresh-shared.log,catopen-nopic-compile.log,gap3-nopic-shared.log}`。"

- id: ISS-242
  title: "【P2】musl DADAO 移植**缺 `src/thread/dadao/syscall_cp.s`**（可取消系统调用 asm）⇒ `__syscall_cp_asm` / `__cp_begin` / `__cp_end` / `__cp_cancel` **全树无定义** ⇒ 任何拉入 `pthread_cancel.o` 的链接（**共享库必拉**）失败"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: INFRA-085t
  notes: "【正式登记（源 = `INFRA-085t` 阶段 A1 现场实测；architect 立项，2026-10-17）】**现象（现场真实输出）**：共享构建/链接把**全部**对象纳入 ⇒ lld 报 `undefined hidden symbol: __cp_begin` / `__cp_end` / `__cp_cancel` / `__syscall_cp_asm`（`ld.lld: error: undefined hidden symbol …`，hidden ⇒ 运行期不可解析、**必须链接期解决**）。**根因（现场读源码）**：musl 按 arch 在 `src/thread/<arch>/syscall_cp.s` 里定义这 4 个符号（同目录另有 12+ arch 同名文件，如 `riscv64`/`x86_64`）；**DADAO 移植目录 `src/thread/dadao/` 只有 `__set_thread_area.s`**（`ls` 现场 = 1 文件），全树 `grep '^\\.global __syscall_cp_asm'` 对 `src/thread/dadao`/`arch/dadao` **0 命中**；`pthread_cancel.c:6,46` 现场引用这 4 个名字（`llvm-readobj --symbols obj/src/thread/pthread_cancel.lo` 4/4 命中）。移植口径本为「单线程、`__syscall_cp_c` = 直通 `__syscall`」（`src/thread/__syscall_cp.c` 的 `weak_alias(sccp, __syscall_cp_c)`）⇒ **静态档潜伏**（`pthread_cancel.o` 只在程序真调 `pthread_cancel` 时被拉入，`P1` 最小集不触发），**共享库必然暴露**。**性质边界**：这不是「构建接线」能绕的项（`ADR-0025 D3`：`ld.so` = musl 自带 ldso；共享库不能剔除源）。修 = **实现**可取消系统调用 asm（`__cp_begin/__cp_end/__cp_cancel` 区域标记 + PC 命中判定，属取消语义面，与 `D1`/`C1` 同族；`pthread_arch.h` 可能需要 `CANCEL_GOT` 之类承接）**或**经用户裁定**显式声明不支持取消**（须同时给 `pthread_cancel` 一个**显式失败**形态，**不得**静默桩）—— 本笔**未动** ✗（不属 A1「构建接线」范围，且是语义裁定）。**证据指针**：`.work/log/infra/INFRA-085t-evidence/s4c-undefined.log`（`llvm-readobj --symbols` 4 命中）、`.work/log/infra/INFRA-085t-probe-shared-make-k.log`（含 `__cp_*`/`__syscall_cp_asm` 的 `undefined hidden symbol` 行）；`.work/evidence/INFRA-085t/run.sh` 节 `S4c`。**交叉引用**：`INFRA-085t`（登记源）、`INFRA-082t`（移植源，`arch/dadao/**` 12 补丁 + 2 setjmp + 1 `__set_thread_area`）、`ADR-0025 D3/D5`（`ld.so`/TLS 归 musl 移植面）、`ISS-240`/`ISS-241`/`ISS-222 ④`（并列的 `libc.so` 阻塞项）。**〔关闭（2026-10-17，`INFRA-085t` 的 `ISS-242` 处置笔）〕**：取**用户裁定 (a)**（实现取消语义 asm，**不**取「显式声明不支持」；选项标签由主会话下发为「照主流 ISA 模式新增 `src/thread/dadao/syscall_cp.s`」）⇒ 新增 `src/thread/dadao/syscall_cp.s`（**154 行**；交付 = `components/musl/patches/src/thread/dadao/syscall_cp.s.patch` + `series` +1 + `changelog.md` 一条），4 个 hidden 符号**全部有定义**（现场：`ld.lld -r pthread_cancel.lo + syscall_cp.o` **rc=0**；**阴性对照** = 去掉新对象 ⇒ 同 4 个仍 `Undefined`）⇒ **符号缺口已消**（`INFRA-085t` 阶段 A1 的 4 项阻塞变 3 项）。证据指针：`INFRA-085t` 任务书「`ISS-242` 处置」节 + `.work/evidence/INFRA-085t/iss242/run.sh`（**17/17 PASS、rc=0**，含注入反例）；`check-patch-tree` **151**（原 150）。**未收口（如实）**：取消**重定向**依赖信号/ucontext 路径（`arch/dadao/bits/signal.h` 仍 `[OPEN]`）⇒ asm 可达且正确，但取消语义**当前不会真正触发**；`__syscall_cp_c()` 的 `-EINTR` 路径仍会调 `__cancel()`（可观测性随信号帧任务收口，**不夸大**为「取消已可用」）。"

- id: ISS-243
  title: "【P2】i32 窄返回值**未按 ABI `C5` 做 callee canonical 化**：clang DADAO ABI 不给 i32 返回打 `zeroext`/`signext` ⇒ `RetCC_DADAO` 的 `CCPromoteToType<i64>` 落 `AExt` ⇒ `LowerReturn` 发 `ANY_EXTEND`（空操作）⇒ `unsigned addu(unsigned,unsigned)` 以 `add.uo {rd0, rd8}` 直接 `ret`，`rd8[63:32]` 为溢出位（`contract-abi.md §4.4 C5` 违约）"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `LLVM-097t` 完成区「新发现/坑 ①」+ 本笔**现场复核**；architect 立项，2026-10-17）】**现象（最小复现，现场真实输出）**：`unsigned addu(unsigned a, unsigned b) { return a + b; }` 经 `.work/build/llvm/bin/clang --target=dadao-unknown-elf -O2 -S`（23.1.3，rc=0）⇒ 函数体 = `add.uo {rd0, rd8}, rd17, rd16` / `ret rd0, 0` —— 返回值寄存器 `rd8` 直接取 64 位加法的和/进位输出，**全函数无任何 32 位 mask 或扩展** ⇒ `addu(0xFFFFFFFF, 1)` 的 `rd8` = `0x00000001_00000000`，而 `contract-abi.md §4.4 C5` 要求「`<8B` 返回值由 **callee** 按 §4.2 符号/零扩展为 canonical 64 位后再 `ret`；**caller 不截断**」⇒ **callee 侧 canonical 化缺失**（`-O0` 同签名：`add.uo {rd0, rd8}, rd4, rd5` / `ret`）。**同批对照（证明 i32 是唯一漏点、并非「窄返回一律不扩」）**：`unsigned char` 返回 ⇒ `set.zw rd5, wp0, 0xff` + `and.o rd8, rd4, rd5`（8 位 mask ⇒ 规范）；`short` 返回 ⇒ `ext.so rd8, rd4, 15`（16 位符号扩展 ⇒ 规范）；**只有 `int`/`unsigned`（i32）无扩展**。**根因（四跳，现场读源码；`file:line` = 23.1.3 检出 / 本仓补丁）**：① clang 侧 DADAO ABI 只为 **i8/i16** 打 `zeroext`/`signext` 返回属性、**i32 不打** —— `-emit-llvm` 现场：`define … zeroext i8 @addu8` / `define … signext i16 @adds16` / **`define dso_local noundef i32 @addu`（无 ext 属性）**；② `SelectionDAGBuilder::visitRet`（`llvm/lib/CodeGen/SelectionDAG/SelectionDAGBuilder.cpp:2278-2281`）仅据该属性选 `SIGN_EXTEND`/`ZERO_EXTEND`，无属性 ⇒ `ExtendKind = ANY_EXTEND`；③ `RetCC_DADAO` 的 `CCIfType<[i8, i16, i32], CCPromoteToType<i64>>`（`components/llvm-project/patches/llvm/lib/Target/DADAO/DADAOCallingConv.td.patch:82`）⇒ 生成器按 `ArgFlags.isSExt()/isZExt()` 选 `SExt`/`ZExt`、两者皆未标则 `LocInfo = CCValAssign::AExt`（`llvm/utils/TableGen/CallingConvEmitter.cpp:274-286`）；④ `DADAOTargetLowering::LowerReturn` 的 AExt 分支发 **`ISD::ANY_EXTEND`**（`DADAOISelLowering.cpp.patch`；该处注释明写「narrow return canonicalised by the callee」但实现为空操作）⇒ i32 无 mask 直接落 `rd8`。**为何当前未表现为 miscompile（如实）**：clang 生成的**调用方** IR 带 `zext i32 %call to i64`（`caller.ll` 现场），DAG 把它 mat 成 `and.o rd8, rd8, <0xffffffff>`（`caller-O2.s` 现场）⇒ 调用方**自己补偿**了 callee 应做的事 ⇒ 纯 C 同工具链互调不报错；但 ① C5 明文「caller 不截断」⇒ **任何非 clang 消费者**（手写汇编 / `ldso` asm / 其它工具链）都**不可依赖**该返回值；② 优化器若据 ABI 认定该 `zext` 冗余即可 **miscompile**；③ `bswap32` 的脏高位（`LLVM-097t` 完成区「新发现/坑 ②」：full 值 `0x0001020304030201`）只是同一缺口的可观测投影。**建议修法（未实施 ✗，本笔只登记）**：二选一 —— (a) **clang ABI 侧**给 i32 返回补 `zeroext`/`signext`（与 i8/i16 同源；`RetCC`/`LowerReturn` 既有 SExt/ZExt 分支即刻生效，最小改动）；(b) **后端侧**在 `LowerReturn` 按位宽自行扩展（须同时解决 `CCPromoteToType` 抹掉符号性信息的问题，例如 `RetCC_DADAO` 不再用 `CCPromoteToType<i64>` 承载窄类型）。**验收口径须含**：`0xFFFFFFFF+1` 与 `0x7FFFFFFF+1` 两例反汇编（有 mask/ext）+ 与 `contract-abi.md §4.2/§4.4` 逐条对齐 + 调用方**无**补偿 mask 时仍正确。**边界**：本笔**未改** `components/**` ✗、**未改** `.tao/contracts/**` ✗、**未改** 任何任务书 ✗（属 `llvm` 面独立缺陷，是否排任务由主会话定）。**证据指针**：`.work/log/llvm/LLVM-097t-returncanon/`（`narrow.c`/`narrow3.c`/`narrow4.c`/`caller.c` + 各自 `-O2.s` + `run.log`；`-O0` 现场同目录旁证）、`LLVM-097t` 完成区「新发现/坑 ①／②」。**交叉引用**：`LLVM-097t`（登记源）、`contract-abi.md §4.2`（caller 侧扩展 = `C4`）/`§4.4`（`C5`）、`ADR-0018 C5`、`ISS-222`（同族「ABI/后端能力缺口」）、`ISS-193`。  **〔用户裁定（2026-10-18，渠道 = 经主会话问答；逐字引录：「1、可以；2、M8内修」）〕M8 内修** ⇒ 执行落点 = **`LLVM-107t`**（`待开始`）；本 issue `status` 保持 `open`，待该册验收后由主会话回填 `closed` + `resolved_by`。  **〔实现完成（2026-10-19，architect 提交笔落账）〕**：`LLVM-107t` 实现完成 ✅（`classifyReturnType` 对 <64 位整型统一 `getExtend`；契约级探针 8/8、lit 34/34、`check-patch-tree` 180 不变；musl 已同批重建、`check-musl-freshness` PASS）⇒ `status` 保持 `open`，待 reviewer 验收 + L2/L3 + 047t/048t 全量复跑后由主会话回填 `closed` + `resolved_by`。"

- id: ISS-244
  title: "【P2】`-fPIC` 对象 `.rodata.<fn>` 仍发 `R_DADAO_ABS48` 打**本对象局部标签**（`.L0`）⇒ lld 以 `recompile with -fPIC` 拒绝 ⇒ `make build-musl-shared` 失败（**第三类**：跳转表 / 相对查找表已由 `LLVM-096t` 处置；**根因未定**）"
  status: closed
