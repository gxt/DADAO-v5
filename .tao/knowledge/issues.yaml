- id: ISS-199
  title: "出界 `cd` fail-fast 在当前服务下未生效（agent frontmatter `external_directory` deny + `POST /api/location/reload` 无效）⇒ 待 `opencode service restart` 后复验"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 `INFRA-065t` 订正返工，2026-10-12；据用户更正 + canary 实测）】**现象**：`INFRA-065t` 加的 agent frontmatter `external_directory` deny（三 agent 各 `/mnt/tao/*`、`/home/ubuntu/tao/*`）**在当前服务下未生效**——越界 `cd /mnt/tao` 经子代理仍走 `ask`（`POST /api/location/reload` 执行后行为无变化）⇒ 夜跑无人应答仍会挂死。**判据更正（关键）**：`permission.rejected` 的 `message` 字面**不能**区分「真 `deny`」与「`ask` + 人工 reject」（人工 reject 同样返回 `message=\"Permission denied: external_directory\"`）⇒ **判生效唯一可靠依据 = 用户观察是否弹询问**；canary3 实为 `ask` + 用户人工 reject（用户更正），reviewer 自查拿到同一 `message` ⇒ 二者**均不作生效证据**（不采信）。**根因（当前判断）**：当前 harness/服务未吃进配置（`/api/config` 快照仍旧、`location.reload` 不够）⇒ **只能靠服务重启生效**。**待复验步骤（用户操作）**：`opencode service restart` → 起子代理跑越界 `cd /mnt/tao` → **用户观察是否弹询问**（不弹 + 命令未执行 ⇒ 生效）。**范围**：三 agent workdir 硬约束 + 权限 deny；全局层加固（`~/.config/opencode/opencode.jsonc` 加 `/mnt/*`、`/home/ubuntu/tao/*` deny，仓库外、主会话写入）**同样需服务重启生效**。**性质 = 配置生效途径缺口**（规则层已落地；权限层待复验）。**登记，不建任务**。证据：`.tao/tasks/infra/INFRA-065t-*.md`（§输出 1 纠正链 + 完成区）+ `.work/evidence/<任务ID>/run.sh`。"


