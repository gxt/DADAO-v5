- id: ISS-193
  title: "picolibc 全量构建剩余 LLVM 缺口（6 类 41 源）：SETO/SETUO/SETUNO 谓词、f32 `frint`/`flog`/`ftrunc` libcall、i64 `bswap`、截断存储 `trunc to f32`、`\"r\"` 约束不收指针、`long double` strtod libcall"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 `INFRA-066t`，2026-10-12；删 `INFRA-057t` 过滤表后逐源实测）】**性质 = 消费侧缺口的剩余面，非 `INFRA-066t` 引入**。方法：以 `.work/build/picolibc/compile_commands.json` 的**全部 1120 条**编译项逐条重编（**全量、非抽样**）⇒ `non-OK = 41`（现场统计），据此把 `meson.build` 的 DADAO 过滤表**最小化到 41 条**（原表 = 整目录 `libm/` + 20 条 libc 源；现仅 41 条、无目录级排除）。六类根因（每类给失败签名 + 代表源）：**(a) FP 谓词 `SETO`/`SETUO`/`SETUNO` 缺 lowering（30 源，最大类）**——`error in backend: DADAO: unsupported floating-point branch condition`（`libm/math/s_pow.c`、`s_hypot.c`、`s_acos.c`、`s_j0.c` 等）与 `... unsupported floating-point select/setcc condition`（`libm/common/s_fma.c`）；同根因亦解释 FP 探针 `isnan_d`/`isfinite_d`=`ERROR` 与 `test/testsuite/newlib.math/dcvt.c`=`BACKEND_OTHER`（`LLVM-079t` 已覆盖 10 个有序/无序谓词，**缺的正是 `SETO`/`SETUO`/`SETUNO`**，见 `DADAOISelLowering.cpp` 的 `default: report_fatal_error`）。**(b) f32 libcall 缺（5 源）**——`no libcall available for frint`（`libm/math/sf_scalb.c`、`sf_tgamma.c`、`common/sf_nearbyint.c`）、`ftrunc`（`srf_lgamma.c`）、`flog`（`sf_log10.c`）；与 `LLVM-080t`「P1 仅双精度」口径一致（f32 未纳入）。**(c) i64 `bswap`（1 源）**——`Cannot select: t45: i64 = bswap`（`libc/search/hash_page.c`）。**(d) 截断存储（2 源）**——`Cannot select: ... store<(store (s32) ..., trunc to f32>`（`libc/stdio/vfscanf.c`、`vfwscanf.c`）。**(e) `\"r\"` 内联汇编约束不收指针（2 源）**——`could not allocate input reg for constraint 'r'`（`libc/string/memset_explicit.c`、`memset_s.c` ⇒ `memset_s`/`memset_explicit` 不可用）。**(f) `long double` strtod libcall（1 源）**——`unsupported library call operation`（`libc/stdio/atold_engine.c`）。**影响**：`pow`/`hypot`/`j0`/`y0`/复数函数/`scanf` 族/`memset_s` 仍不可链接；**`libm` 主体（f64 三角/指数/对数/取整/fmin-fmax）已恢复**（8 符号 `nm` 全命中，见 `INFRA-066t` 完成区）。**建议**：(a) 单独立 LLVM 任务（预计一次改动即可删 30/41 条），(b)(c)(d)(e)(f) 视 M7 需要分批。**只登记**。证据指针：`.tao/tasks/infra/INFRA-066t-*.md` 完成区 + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（全量扫描 TSV 与逐源日志）。 **【picolibc test 使用量化（`TESTCASES-042t` 现场，2026-10-12）】**本 6 类缺口对应 picolibc 自带 test **blocked 85 条中的 57 条**（余 28 = 另立 issue 的 REL26 弱符号 26 + `setjmp` 桩 1 + QEMU softfloat 1）：**(a) 33**（harness 直接标记 29 + 经（a）过滤源符号 `_pow`×2 / `fma`×1 / `hypotl`×1）、**(b) 8**（直接 4 + `log10f` / `lgammaf_r` / `tgammaf` / `nearbyintf`）、**(d) 14**（`vfscanf`×11 / `vfwscanf`×3，经过滤源符号）、**(e) 2**（`memset_s` / `memset_explicit`）；**(c) `bswap` 当前无对应 test（0 条）**。计数取自 `full-report.json` 逐条 `reason` 机械分桶（`TESTCASES-042t` 完成区 blocker 溯源）。 **【收口进展（`LLVM-084t`，2026-10-12）】(a) 类已收口**——后端补 `SETUO`/`SETO`/`SETONE`/`SETUEQ` 与 6 个整型 don't-care 码 lowering（`components/llvm-project/patches/llvm/lib/Target/DADAO/**`），过滤表 **41→11**（删 30、逐条可编、未多删）。**计数更正**：上文「(a) 33」为估算 ⇒ 实测解锁 **20**（`picolibc-tests-full` pass 132→152 / blocked 85→65 / fail 0 / excluded 18），余 13 条移因其它缺口（`__muldc3` 6〔新立 `ISS-196`〕、QEMU 2-NaN 4〔`ISS-195`〕、(b) 2、REL26 1〔`ISS-194`〕）；**(b) 计数 8→10**（现直接 5 + `log10f` / `lgammaf_r`×2 / `tgammaf` / `nearbyintf`）；(d) 14 / (e) 2 不变。证据：`.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（full-after 报告逐条 reason）；`.tao/tasks/llvm/LLVM-084t-*.md`。 **【收口进展（`LLVM-086t`，2026-10-12）】(e) 类已收口**——后端补 `DADAOTargetLowering::getRegForInlineAsmConstraint`（`components/llvm-project/patches/llvm/lib/Target/DADAO/**`），**只**把单字母 `\"r\"` 映射到**数据寄存器类** `GPRD`（指针类参数经 `rb2rd` 桥接 GPRB→GPRD），其余约束回落基类；**未**新增 `\"b\"`/`\"f\"`（用户 2026-10-12 裁定 C「只解锁，不立约定」）。消费侧同步：`components/picolibc/patches/meson.build.patch` 删 (e) 两条（`memset_explicit.c`/`memset_s.c`）⇒ 过滤表 11→**9**（= (b)5+(c)1+(d)2+(f)1）。实测 `picolibc-tests-full` **pass 174→176 / blocked 39→37 / fail 0 / excluded 22**（total 235），解锁 = `test-malloc`、`test-memset_s`。**本 issue 保持 `open`**（六类未全清 ⇒ 依字段约束「open 时 `resolved_by` null」不回填），(e) 的 `resolved_by` = `LLVM-086t` 记于此；剩余 **(b)/(c)/(d)/(f) 仍开放**（architect 复核：过滤表仍 9 条、`full-after` 逐条分桶与上文一致 ⇒ 口径准确）。证据：`.tao/tasks/llvm/LLVM-086t-*.md` + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`。 **【收口进展（LLVM-087t，2026-10-12）】(b) 类 f32 取整/极值已收口**——后端 `initLibcallLoweringInfo` 补 f32 八条 `RTLIB::{FLOOR,CEIL,TRUNC,ROUND,RINT,NEARBYINT,FMIN,FMAX}_F32`（与 f64 块逐字对称；符号 `floorf`/`ceilf`/`truncf`/`roundf`/`rintf`/`nearbyintf`/`fminf`/`fmaxf`），消费侧 `components/picolibc/patches/meson.build.patch` 删 (b) 四条（`sf_nearbyint`/`sf_scalb`/`sf_tgamma`/`srf_lgamma`）⇒ 过滤表 **9→5**。实测 `picolibc-tests-full` **pass 176→182 / blocked 37→31 / fail 0 / excluded 22**（total 235；`newly_blocked=∅`），解锁 **6** = `test-ceil`/`test-floor`/`test-round`/`test-lgamma`/`test-rounding-mode`/`test-tgamma`。**(b) 计数 10→0**（6 条解锁 + 4 条移因：`test-math-funcs`/`math_test` ⇒ (d)〔`LLVM-088t`〕、`test-log10`/`test-math-errhandling` ⇒ 缺 `log10f`）。**`FLOG_F32`（`log10f`）是否纳入「f32 全族」待用户裁定**（`sf_log10.c` 调 public `logf` ⇒ `llvm.log.f32`；engineer 未擅自扩范围、正确；architect 追认/待裁落点见 `.tao/tasks/llvm/LLVM-087t-*.md`「architect 追认」+「遗留问题①」）。nm 复核：sysroot `libc.a` 8 f32 符号全 `T` 命中。**本 issue 保持 `open`**（(b) 收口、(c)/(d)/(f) 仍开放 ⇒ `resolved_by` 不回填），(b) 的 `resolved_by` = `LLVM-087t` 记于此（architect 复核：过滤表现 5 条、`full-after` 逐条分桶一致）。证据：`.tao/tasks/llvm/LLVM-087t-*.md` + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`。"

- id: ISS-194
  title: "LLD 不为指向未定义弱函数的 `R_DADAO_REL26` 生成 veneer/弱桩 ⇒ 相对 `call` 链接失败（`relocation R_DADAO_REL26 out of range`）"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-085t
  notes: "【正式登记（源 `TESTCASES-042t` 完成区「新发现/坑④」；engineer/reviewer 实测 + architect 独立复跑，2026-10-12）】**现象**：链接 picolibc 自带 test 时 26 条在 LLD 阶段失败，原始错误 = `relocation R_DADAO_REL26 out of range`（`lld/ELF/Arch/DADAO.cpp` 的 `checkInt(ctx, loc, imm, /*width=*/24, rel)`：`(S+A-P)>>2` 的 24 位字偏移越界 ⇒ 按 `contract-elf.md §3.2` / `ADR-0019 §D6` 作链接期错误，不截断、不 wrap）。**根因**：这些 test 引用**未定义弱函数**（`_user_strerror`、`gettimeofday` 等）；弱未定义符号解析为**值 0**，而 P 落在 `0xFC00_0000_0000` 段 ⇒ `S+A-P` 远超 ±32 MiB（24 位字偏移 = ±2^23 字）；LLD 现**不为 REL26 生成 veneer、也不为弱未定义函数发射本地弱桩**，故相对 `call` 链接报错。**范围**：26 条 blocked（`test-iconv` / `test-access` / `test-ftrunc` / `test-grp` / `test-dirent` / `test-pwd` / `test-rename` / `test-statvfs` 等）。**解锁条件（择一或并用）**：为 REL26→越界目标生成 veneer（trampoline），或为弱未定义函数发射本地弱桩 —— 二者均属链接器/工具链面（`patches/lld/ELF/Arch/DADAO.cpp`）。**性质 = 工具链能力缺口（非缺陷、非静默）**。**登记，不建任务**。证据：`TESTCASES-042t` 任务书完成区 + `.work/evidence/<任务ID>/full-report.json`；architect 复跑 `python3 tools/testcases/picolibc_tests.py --stage fast --only test-iconv` ⇒ `blocked  linker: R_DADAO_REL26 ...`（harness 由原始 LLD stderr 正则 `relocation R_DADAO_REL26 out of range` 映射）。 **【收口进展（`LLVM-084t`，2026-10-12）】计数更正 26→27**：删 (a) 类 FP 谓词过滤条目后对 `picolibc-tests-full` 全量重跑，本缺口 blocked 由 26 升为 **27**（新增 1 条原归 (a) 类者 `test-rand` 移因本缺口；**非 `LLVM-084t` 引入**）。根因/范围/解锁条件口径不变。证据：`.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（full-after 报告逐条 reason）。 **【收口（`LLVM-085t`，2026-10-12）】**未定义弱符号的 PC 相对分支/call 改按**本位自循环**解析（`call-iiii`→`jump-iiii`，免 RegRAS 失衡），`picolibc-tests-full` blocked 65→39、pass 152→174（22 pass + 4 self-skip + 1 移因 RASOF）；强符号越界仍严格报错。 **【REL12 未纳入（`LLVM-085t`，2026-10-12）】**`R_DADAO_REL12`（PC 相对访存）的未定义弱**未纳入**（本批 0 例），**保持严格报错**；待有实例再议。"

- id: ISS-195
  title: "DADAO QEMU `float_status` 未设 2-NaN 传播规则（`float_2nan_prop_rule == none`）⇒ 任一含 NaN 操作数的 FP 运算触发软浮点断言（`parts64_pick_nan` `g_assert_not_reached`），`test-remquo-quo` rc=-6"
  status: open
  scope: [qemu]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 `TESTCASES-042t` 完成区「新发现/坑④」；reviewer 抽验 + architect 独立复跑并 gdb 定位，2026-10-12）】**现象**：`test-remquo-quo`（`test-math`）在 QEMU 中崩溃 `rc=-6`，`ERROR:../../source/qemu/fpu/softfloat-parts.c.inc:108:parts64_pick_nan: code should not be reached`（1 条 blocked）。**根因（architect gdb 回溯实测）**：DADAO 的 `target/dadao/helper.c: fp_status_init()` 仅 `memset(st,0,sizeof(*st))` + 设 `float_rounding_mode` / `float_default_nan_pattern`，**未调用 `set_float_2nan_prop_rule`、也未启用 `default_nan_mode`** ⇒ `float_2nan_prop_rule == float_2nan_prop_none (0)`；而 softfloat 契约明示「非 default-NaN 模式下目标未设 2-NaN 规则时，一旦需传播输入 NaN 即断言」（`include/fpu/softfloat-types.h` `Float2NaNPropRule` 注释）。触发链：picolibc `remquof` 的 `return (x*y)/(x*y)`（非有限输入 idiom）⇒ `Inf*(-0)=NaN` ⇒ `float32_div(NaN,NaN)` ⇒ `soft_f32_div` → `parts64_div` → `parts64_pick_nan`，`switch(get_float_2nan_prop_rule)` 落 `default: g_assert_not_reached()`（`softfloat-parts.c.inc:108`）⇒ abort。gdb 帧：`#11 helper_fp_arith (helper.c:550)` ← `#10 float32_gen2` ← `#8 parts64_div (softfloat-parts.c.inc:826)` ← `#7 parts64_pick_nan (softfloat-parts.c.inc:108)`。**影响面注意**：非仅 `rem` —— 任何把 NaN 操作数送入 add/sub/mul/div/rem 的 guest 运算都会中止模拟器，现存测试集恰好大多避开 NaN 故仅 1 条暴露。**解锁**：在 `fp_status_init()` 设传播规则（如 `set_float_2nan_prop_s_ab`，与既有 `set_float_default_nan_pattern(0b01000000)` 搭配；**注意 f32 运算在 QEMU 内部经 `FloatParts64` 走 `parts64_*`**）。**性质 = DADAO 目标移植缺口（非上游缺陷、非静默）**。**登记，不建任务**。证据：`TESTCASES-042t` 任务书完成区 + `.work/evidence/<任务ID>/full-report.json`（`test-remquo-quo` log）；architect 复跑 `--only test-remquo-quo` ⇒ `blocked  QEMU terminated by signal 6`；`.work/log/<模块>/` 存 gdb 回溯。 **【收口进展（`LLVM-084t`，2026-10-12）】计数更正 1→5**：删 (a) 类 FP 谓词过滤条目后对 `picolibc-tests-full` 全量重跑，本缺口 blocked 由 1 升为 **5**（`test-remquo-quo` + 新增 4 条原归 (a) 类者 `test-ctan` / `test-ctanh` / `test-cpow` / `test-fma`；**非 `LLVM-084t` 引入**，根因同本 issue），印证上文「任何把 NaN 操作数送入 add/sub/mul/div/rem 的 guest 运算都会中止模拟器」——暴露面随可编源增多而扩大。证据：`.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（full-after 报告逐条 reason）。"

- id: ISS-196
  title: "DADAO 工具链未构建/安装 compiler-rt builtins ⇒ `__muldc3`/`__mulsc3` 未定义，6 条 picolibc 复数函数 test 链接失败"
  status: open
  scope: [llvm, infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 `LLVM-084t` 完成区「新发现/坑④」+ reviewer 复验，2026-10-12）】**现象**：链接 picolibc 自带 test 时 **6 条**（`test-cacos` / `test-cacosh` / `test-casin` / `test-casinh` / `test-catanh` / `test-complex-funcs`）失败，原始错误 = `ld.lld: error: undefined symbol: __muldc3`（并 `__mulsc3`），引用者 = `libm_complex_{cacosh,casin,casinh,catanh}.c.o`（在 `.dadao/dadao-unknown-elf/lib/libc.a` 内）。**根因**：`__muldc3` / `__mulsc3` 属 **compiler runtime（compiler-rt builtins / libgcc）** 提供的复数乘辅助函数；DADAO 工具链**未构建、未安装**该运行时（`Makefile` 明示 resource-dir `lib/` 的 compiler-rt builtins『has no consumer in M6 and is deliberately not installed』；`components/llvm-project/patches/` 仅 `clang`/`lld`/`llvm`，无 `compiler-rt`）⇒ 链接期缺符号。**归属**：工具链运行时面（`components/llvm-project` 的 `compiler-rt`）+ 构建/安装（infra；目标 sysroot 依 `ADR-0016` D5/D11）。**性质 = 工具链能力缺口（非缺陷、非静默降级）**。**暴露语境**：`LLVM-084t` 删 (a) 类 FP 谓词过滤条目后，这 6 条由（a）类 blocked 转为归本缺口 ⇒ **非 `LLVM-084t` 引入**（before/after 逐条对账见 `LLVM-084t` 返工表 #14）。**解锁条件（待定）**：为 `dadao-unknown-elf` 构建并安装 compiler-rt builtins（或提供等价 DADAO 复数乘运行时）。**登记，不建任务**。证据：`.tao/tasks/llvm/LLVM-084t-*.md` 完成区 + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（full-after 报告逐条 `log` 含 LLD stderr）。"


- id: ISS-197
  title: "内联汇编 `\"m\"` 约束触发后端 ISel 硬崩溃（`Could not match memory address.  Inline asm failure!` + core）——对照 `\"f\"` 为优雅失败；既有问题，非 LLVM-086t 引入"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 `LLVM-086t` reviewer 第 1 轮非阻断发现 + architect 独立复现，2026-10-12）】**现象**：内联汇编**内存操作数**约束 `\"m\"` ⇒ 后端 `SelectionDAGISel::SelectInlineAsmMemoryOperands` 落 `report_fatal_error(\"Could not match memory address.  Inline asm failure!\")` ⇒ **硬崩溃**（`llc` rc=**134**（SIGABRT / core dumped）+ stack dump；`clang -c` 驱动 rc=1 + `fatal error: error in backend` + crash dump，同一 `report_fatal_error`）。**既有问题、非 `LLVM-086t` 引入**：以变更**前** llc 快照（`getRegForInlineAsmConstraint` hook 缺席）跑**纯** `\"m\"` 用例（`\"=*m,0\"`、无 `\"r\"`）⇒ **同样 rc=134 + 同一 fatal error**（before/after 同签名 ⇒ 非本次引入）。**对照（优雅失败）**：`\"f\"` **未**在 DADAO 约束集 ⇒ `clang` frontend `error: invalid input constraint 'f' in asm`（rc=1）、`llc` 验证期 `error: unknown asm constraint 'f'`（rc=1），**无崩溃、无 core**。**性质 = 健壮性缺陷**（应显式报错或明确「暂不支持内存操作数 inline asm」，不应 `report_fatal_error` + core）。**暴露面**：DADAO 构建的 picolibc 源 **0 处**使用 `\"m\"` 约束（`\"=*m\"` 仅见 `libc/machine/{sparc,…}` 目标专属目录、未编译）⇒ 无 test 暴露（**非阻塞**）。**登记，不建任务**。证据：`.tao/tasks/llvm/LLVM-086t-*.md`（architect 复核节）+ `.work/log/<模块>/`。"
