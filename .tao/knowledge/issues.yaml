  notes: "【正式登记（源 `SPEC-142t` 阶段 B / B-a 现场，architect 提交与文件集审核时立项，2026-10-15）】**现象（实测）**：阶段 B **重建完成**（`.work/build/llvm/bin/**` 07:51、`.EXIT=0`）后，**门控 / lit 实际调用的安装根** `.dadao/cross-toolchain/bin/llvm-mc` 仍是**重建前**二进制（md5 `655d7ab…` ≠ 构建树 `750a449…`，且**不识别 `rev.o`**）；此时 `gen_isa_coverage.py` 重生成只能得回 `reject`（与阶段 B 目标不符），而 **L1 `make check` 仍全绿** —— 原因 = 「**旧工具 + 旧生成物**」**互相自洽**。**性质 = 门控覆盖缺口（构建树与安装根两段产物脱节）**，**非**本任务交付物缺陷、**非**静默错码。**对策**：把 `make install-host` 纳入「**改 MC 后**」的**必跑步骤**（建议：收尾纪律明文 + 与/或加「安装根 ↔ 构建树」一致性门控；`Makefile` 既有注释已述 `check-isa-coverage` 需先 `install-host`，但**无门控强制**）。**本次实例** = `SPEC-142t` 阶段 B（现场按 `Makefile` 既有口径补跑 `make install-host`，rc=0 / 127 s ⇒ 矩阵 `reject`→`accept ok`）。**status = open（无机械门控可判 ⇒ 留 open）**：对策**未落地**（新增 / 弱化门控须用户授权），且同类情形**可复发**。证据指针：`.tao/tasks/spec/SPEC-142t-*.md`「阶段 B-a」新发现 / 坑① + 遗留③；md5 记录见 `.work/log/llvm/SPEC-142t-Ba-*.log`。"


