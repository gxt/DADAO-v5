- id: ISS-187
  title: "窄位指令利用不足（8/16/32 位算术未用；`mul32` 用 128 位双目的 `mul.uo` 而非单目的 `mul.ut`）——M7 优化候选，非缺陷"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（用户 2026-10-10 裁定「先只登记，暂不改」；源 `.tao/knowledge/pending-registrations.md §R3`）】**M7 优化候选，非缺陷**（正确性无影响：promote + 截断/扩展语义正确）。**ISA 事实**（`contracts/opcodes.yaml`）：SimRISC 8/16/32 位指令齐全（算术 `.sb/.sw/.st` + `.ub/.uw/.ut`）；`mul.uo`/`mul.so` 为 4 操作数（128 位双目的），`mul.ut/uw/ub` 等为 3 操作数（单目的）。**实测**（`llc -march=dadao -O2`）：窄位访存**已有效利用**（`i8→ld.ub` / `i16→ld.uw` / `i32→ld.ut`）；窄位算术**未利用**（`add8/16/32/64` 全 → `add.uo` 64 位）；窄位乘除**未利用且用重形式**（`mul32` → `mul.uo {rd0, rd8}`）。**根因**：后端只注册 `MVT::i64` legal（`DADAOISelLowering.cpp:51`），i8/i16/i32 一律 promote 到 i64，指令选择只登记 64 位模式。**建议（M7）**：先量化（Embench/微基准对比 `mul.ut` vs `mul.uo`、窄 ALU vs `add.uo`），有收益才立项，收益≈0 则不做（避免过度设计）。**只登记，不建任务。**"

- id: ISS-188
  title: "FP 完备性缺口（`fcmp` 取值 / `fabs`/`frem`/`copysign` / `fma`/`fminnum`/`fmaxnum`/`floor`/`ceil`/`round`/`trunc` / `fpclass` / `f16` / `bitcast double→i64` 缺 ISel 模式）——M7"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（用户 2026-10-10 裁定「先只登记，暂不改」；源 `.tao/knowledge/pending-registrations.md §R4`）】**M7**。**实测**：`fcmp` **取值**（含 ordered `oeq`）⇒ `Cannot select setcc`；`fabs`/`frem`/`copysign` ⇒ `Cannot select bitcast`；`fma`/`fminnum`/`fmaxnum`/`floor`/`ceil`/`round`/`trunc` ⇒ `no libcall`；`fpclass` ⇒ `setcc setuo`；`f16` ⇒ `fp_to_fp16`；`bitcast double→i64`（FP↔RD）**缺 ISel 模式**（指令 `rf2rd`/`rd2rf` **已在**）。**全部显式失败、不产错码**（非静默降级）。**只登记，不建任务。** **衍生待办（`INFRA-057t`，2026-10-11）**：该缺口的**消费侧变通** = picolibc `meson.build` 显式**源过滤表**（整个 `libm/` + 20 条 libc 浮点/换字节源）以换取构建确定成功；**`LLVM-079t`/`080t` 落地后须删表恢复全量**（切 `io-float-exact=false` engine 变体后 ryu 4 条为惰性条目、随之一并删）。细节指针：`.tao/tasks/infra/INFRA-057t-*.md` 完成区「遗留问题①②③」。 **【收口进展（`LLVM-079t`，2026-10-11）】P0 五类已由 `LLVM-079t` 收口**（探针 `BACKEND_CANNOT_SELECT` **64→0**：`f32→f64 anyext 载入`/FP `setcc`/`f64↔i64 bitcast`/`f64 select_cc`/`i64 cttz`）；**剩余 P1 归 `LLVM-080t`**（取整/min-max/`fabs`/`copysign`）；**无序族 FP 谓词（`SETUO`/`isnan`）与 `dcvt.c` `BACKEND_OTHER` 仍缺**。 **【收口进展（`LLVM-080t`，2026-10-12）】P1 类已收口**（取整六项 + `fmin`/`fmax` ⇒ RTLIB libcall；`fabs`/`copysign`(f64) ⇒ ISA `fosgnj`；探针 O0/O1/O2 全 OK；`check-lit` 99/99）。 **跨任务缺口（实测）**：sysroot `libm.a` = **876 B 空壳**（仅 `empty.c.o`），根因 = `INFRA-057t` 显式源过滤表**整目录排除 `libm/`** ⇒ **恢复 `libm`（删过滤表并重建）为 `TESTCASES-042t` 前置**；恢复后须 `nm` 复核 8 符号（`floor`/`ceil`/`trunc`/`round`/`rint`/`nearbyint`/`fmin`/`fmax`）。 P0（`LLVM-079t`）/P1（`LLVM-080t`）均已收口 ⇒ **该前置可执行**；指针 = `LLVM-080t` 任务书「遗留问题」+ `.work/evidence/<任务ID>/run.sh`。 **【收口进展（`INFRA-066t`，2026-10-12）】过滤表已删/最小化，`libm` 主体已恢复**：实测**更正**上文口径——`libm.a` = **876 B 空壳是 picolibc 上游设计**（`empty-libs/meson.build` 生成 `libm.a`/`libg.a`/`libnosys.a` 空壳以兼容 `-lm`；上游 README「Picolibc version 1.7 §1」：libc 与 libm **合并为单一库**），**非**过滤表产物；真正的恢复目标是 **`libc.a`**（数学对象并入其中）。现状：`libc.a` 1,241,616 → **1,686,214 B**，8 符号（`floor`/`ceil`/`trunc`/`round`/`rint`/`nearbyint`/`fmin`/`fmax`）**全命中**；`TESTCASES-042t` 前置满足。**剩余缺口另立 `ISS-193`**（6 类 41 源：`SETO`/`SETUO`/`SETUNO` 谓词 30、f32 `frint`/`flog`/`ftrunc` 5、i64 `bswap` 1、截断存储 2、`\"r\"` 约束 2、`long double` strtod 1）⇒ **`pow`/`hypot`/`j0`/`y0`/复数/`scanf` 族仍不可链接**。证据指针：`.tao/tasks/infra/INFRA-066t-*.md` 完成区。"

