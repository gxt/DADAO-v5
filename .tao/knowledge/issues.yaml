- id: ISS-292
  title: "【M9】thread 支持链 T1–T5：musl `__clone`/TP、qemu-user 线程语义、静态/动态 TLS + `dlopen`"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = 用户 2026-10-19/20 裁定，渠道 = 经主会话问答；architect 立册 2026-10-19）】**用户原话（逐字）**：「这个任务链完成后，可以添加thread相关支持，注意：rb3应该被用起来；请针对此事做一下计划」；「T1-T5，现在有什么需要我裁定的内容」（= 范围选 **T1–T5**）。**现场（主会话已核 + architect 复核）**：`rb3` = TP 已就绪（`arch/dadao/pthread_arch.h` 的 `__get_tp()`、`src/thread/dadao/__set_thread_area.s`、`contract-abi §1.3`）；真缺口 = `musl/src/thread/clone.c:6` 返回 `-ENOSYS`、**无** `src/thread/dadao/clone.s`（arch `clone.s` 经 `Makefile` `REPLACED_OBJS` 替换通用 `clone.c`）；qemu-user 已支持 `CLONE_SETTLS`（`linux-user/syscall.c:7056/7146` + `linux-user/dadao/target_cpu.h:26`）；047t 的 **19 条** thread/`__clone` 用例为 `blocked`（`ISS-252`；静态档另有 `pthread_create-oom` = `ISS-257` flake）、`ISS-246` 3 条 TLS、`ISS-260` `dlopen` 4 例。**5 册（串行 T1→T2→T3→T4→T5）**：**T1 `INFRA-095t`**（musl `__clone` + TP，子侧写 `rb3`；最小 pthread + 探针）→ **T2 `QEMU-065t`**（qemu-user 线程：clone/TLS/futex/exit/信号；并发探针）→ **T3 `TESTCASES-052t`**（047t 19 条转 pass、逐例无回归；关 `ISS-252`）→ **T4 `LLVM-100t`**（静态 `__thread` codegen + 静态档 3 例；关 `ISS-246`）→ **T5 `LLVM-117t`**（`DTPMOD`/`DTPREL`/`TPREL` 发射 + `dlopen` 4 例；关 `ISS-260`；三面跨模块在册内披露）。**边界**：本笔只立册 + 台账；`spec/`/契约/组件实现 **零改动** ✗；`rb3` 在 T1 就真正用上；不改 `spec/`（若判需改 ⇒ 停下报告）。**等级 = P2**（跨模块、M9 线程面主线）。**证据指针**：`.tao/tasks/infra/INFRA-095t-musl-__clone与TP.md`、`.tao/tasks/qemu/QEMU-065t-qemu-user线程语义.md`、`.tao/tasks/testcases/TESTCASES-052t-pthread验证与047t线程收口.md`、`.tao/tasks/llvm/LLVM-100t-__thread用户变量TLS-codegen.md`、`.tao/tasks/llvm/LLVM-117t-动态TLS与dlopen.md`；本页「M9 线程支持链」小节。**交叉引用**：`ISS-252`（T3 关）、`ISS-246`（T4 关）、`ISS-260`（T5 关）、`ISS-257`（OOM flake，不属本链）、`ADR-0025 D5`（TLS 硬依赖）、`ADR-0019 D10`/`D12`（TLS 类型号冻结）、`contract-syscall §3/§4`、`contract-dynlink §4.3/§7/§10②`。"

- id: ISS-293
  title: "【P3】编码变更后旧 ELF 不兼容：新 `qemu-dadao` 对旧编译产物报 SIGILL（`functional/snprintf` 静态 / `functional/strtod` 动态）"
  status: closed
  scope: [qemu]
  blocks: []
  resolved_by: INFRA-096t
  notes: "【正式登记（源 = `INFRA-095t` 完成区「新发现/坑 ④」，2026-10-19；architect 提交时登记）】**现象**：新建的 `.work/build/qemu/qemu-dadao` 运行**旧** 047t ELF 时以 SIGILL（rc=132）终止——静态档 `functional/snprintf`、动态档 `functional/strtod`；同一 ELF 用 install-root 旧 `qemu-dadao` 通过（rc=0）。**定性 = 预期不兼容**：`ADR-0032` 的 `ext`/`shl` 编码已迁移（`LLVM-116t`/`QEMU-064t` 已完成，`ext` 迁 `100/101`、`shl` 迁 `010/011`），旧 ELF 仍含旧编码 ⇒ 新解码器按新表解释为非法/异义 ⇒ SIGILL；**非 qemu 缺陷、非 `INFRA-095t` musl 改动**。**处置**：① 旧编译产物**必须用新工具链重建**（不得以旧 ELF 判定新组件回归）；② 抽样/回归基线随编码变更整体刷新；③ 安装根 `qemu-dadao` 陈旧（01:47 vs 构建树 23:26）需 `make install-host` 刷新（`INFRA-095t` 遗留①，范围外）。**归 T2 `QEMU-065t` 复核**：线程语义册内以新工具链重编两档探针，确认 SIGILL 仅出现在旧产物、且新 qemu 的 clone/TLS 路径正常。**等级 = P3**（旧产物诊断噪声、非阻断）。**证据指针**：`.tao/tasks/infra/INFRA-095t-musl-__clone与TP.md` 完成区「新发现/坑 ④」与「遗留问题 ②」；`.work/log/infra/INFRA-095t-*.log`。**交叉引用**：`INFRA-095t`、`QEMU-065t`（复核）、`QEMU-064t`/`LLVM-116t`（编码迁移）、`ADR-0032`、`ISS-210`（`install-host` 陈旧）。**边界**：只登记；未改 qemu、未改旧 ELF、未跑 `install-host`。**【根因订正（2026-10-20，`INFRA-096t`）】**真根因 = **compiler-rt builtins 归档陈旧**（**非**「旧 ELF 不兼容」——旧 ELF 只是现象）：① 归档内 `extenddftf2.c.o` 仍含已废止 `shl` 编码 `40 50 51 46`×3（全归档 **40** 处），而现 clang 发 `40 40 84 11`（`shl.o`；〔笔误订正 2026-10-20，`QEMU-065t` /complete：原记为 `40 40 51 46`〕）；② 同一陈旧归档在**三个消费点**（构建树产物 / **构建树 clang 资源目录副本** / 安装根）——后两者无任何规则维护；③ `libc.so` 以 `LIBCC` + `--exclude-libs=ALL` **内嵌** builtins ⇒ 归档重建后不重链则动态档继续 SIGILL（`qemu -d in_asm` 末块停在 `40 50 41 05`，静态档不受影响）。**本笔处置**：`make build-builtins`（`-t clean` 强制走当前 clang + stage 进构建树资源目录；`install-host` 改为依赖它，`BUILTINS_ARCHIVE_SRC` 改按驱动报告的相对路径取，消除 `lib/linux` 同名陷阱）⇒ 归档旧编码计数 **0**、符号集不回退（147 成员 / 165 `T` / 357 未定义 / 780 定义，前后一致）；新门控 `check-builtins-freshness`（**L1**）断言三份副本同 sha256 + 归档与**逐成员 `.c.o`** 不旧于 clang（`--self-test` 四类注入，含「仅 mtime 变不假红」）；`build_musl.py` 增 **builtins 戳记**（归档变 ⇒ 重链 `libc.so`），`check-musl-freshness` 增第 7 项防复发。**验证**：047t `functional/snprintf`（静态）/`functional/strtod`（动态）**转 pass**，10 例两档 **10/10**、**10/10**（动态以「install-host 之后」的重链副本模拟）。**status = `closed`**（`resolved_by = INFRA-096t`）；安装根刷新与 `libc.so` 重链仍由主会话 `install-host` + `build-musl-shared` 执行（本册只准备产物 + 门控）。"

