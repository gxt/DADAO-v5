- id: ISS-155
  title: "FILEHDR PHDRS 使 ELF 头落在 RAM 下方一页 + .text 字面 sh_offset≠0；QEMU ELF 加载器/集成须对齐"
  status: closed
  scope: [qemu, integ]
  blocks: []
  resolved_by: SPEC-112t
  notes: "LLVM-056t F7：LLD allocateHeaders 把 ELF 头放在最低 section 下方一页（RAM 基址 0xffff00000000 → 头落 0xfffefffff000），首个 PT_LOAD 区间越过 RAM 下界；.text sh_offset=0x1000（file offset 0 被头占据，字面 0 不可达）。已按用户裁定用 p_offset=0/flat 口径。ADR-0004 §D2.3 规定 PT_LOAD 越出映射区域即启动报错——QEMU-042t ELF 加载器须就「text 段头部一页落在 RAM 之下」与 INTEG-016t 对齐（或允许 unmapped 部分被忽略）。[SPEC-112t 2026-10-06 结案] ADR-0003 §D5 就地修订（rev. 2026-10-06，用户逐条确认）：M4 裸机路径 dadao.lds 不使用 FILEHDR PHDRS（ELF 头/程序头表只存在于文件中、不进入 guest 内存；LLD 的 FILEHDR PHDRS 能力原样保留），并冻结 p_offset 不做要求、p_align 目标默认 64 KiB（可被 -z max-page-size 覆写）。去 FILEHDR PHDRS 后首段回到 RAM 内（0xFFFF00000000），原『头部页落在 RAM 之下』问题根除；QEMU-042t/INTEG-016t 无需再处理该页。配套文本见 contract-elf §5.3/§6.1.2、milestones.md M4 范围段；实改/重建归 LLVM-058t。"

