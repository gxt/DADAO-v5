- id: ISS-193
  title: "picolibc 全量构建剩余 LLVM 缺口（6 类 41 源）：SETO/SETUO/SETUNO 谓词、f32 `frint`/`flog`/`ftrunc` libcall、i64 `bswap`、截断存储 `trunc to f32`、`\"r\"` 约束不收指针、`long double` strtod libcall"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 `INFRA-066t`，2026-10-12；删 `INFRA-057t` 过滤表后逐源实测）】**性质 = 消费侧缺口的剩余面，非 `INFRA-066t` 引入**。方法：以 `.work/build/picolibc/compile_commands.json` 的**全部 1120 条**编译项逐条重编（**全量、非抽样**）⇒ `non-OK = 41`（现场统计），据此把 `meson.build` 的 DADAO 过滤表**最小化到 41 条**（原表 = 整目录 `libm/` + 20 条 libc 源；现仅 41 条、无目录级排除）。六类根因（每类给失败签名 + 代表源）：**(a) FP 谓词 `SETO`/`SETUO`/`SETUNO` 缺 lowering（30 源，最大类）**——`error in backend: DADAO: unsupported floating-point branch condition`（`libm/math/s_pow.c`、`s_hypot.c`、`s_acos.c`、`s_j0.c` 等）与 `... unsupported floating-point select/setcc condition`（`libm/common/s_fma.c`）；同根因亦解释 FP 探针 `isnan_d`/`isfinite_d`=`ERROR` 与 `test/testsuite/newlib.math/dcvt.c`=`BACKEND_OTHER`（`LLVM-079t` 已覆盖 10 个有序/无序谓词，**缺的正是 `SETO`/`SETUO`/`SETUNO`**，见 `DADAOISelLowering.cpp` 的 `default: report_fatal_error`）。**(b) f32 libcall 缺（5 源）**——`no libcall available for frint`（`libm/math/sf_scalb.c`、`sf_tgamma.c`、`common/sf_nearbyint.c`）、`ftrunc`（`srf_lgamma.c`）、`flog`（`sf_log10.c`）；与 `LLVM-080t`「P1 仅双精度」口径一致（f32 未纳入）。**(c) i64 `bswap`（1 源）**——`Cannot select: t45: i64 = bswap`（`libc/search/hash_page.c`）。**(d) 截断存储（2 源）**——`Cannot select: ... store<(store (s32) ..., trunc to f32>`（`libc/stdio/vfscanf.c`、`vfwscanf.c`）。**(e) `\"r\"` 内联汇编约束不收指针（2 源）**——`could not allocate input reg for constraint 'r'`（`libc/string/memset_explicit.c`、`memset_s.c` ⇒ `memset_s`/`memset_explicit` 不可用）。**(f) `long double` strtod libcall（1 源）**——`unsupported library call operation`（`libc/stdio/atold_engine.c`）。**影响**：`pow`/`hypot`/`j0`/`y0`/复数函数/`scanf` 族/`memset_s` 仍不可链接；**`libm` 主体（f64 三角/指数/对数/取整/fmin-fmax）已恢复**（8 符号 `nm` 全命中，见 `INFRA-066t` 完成区）。**建议**：(a) 单独立 LLVM 任务（预计一次改动即可删 30/41 条），(b)(c)(d)(e)(f) 视 M7 需要分批。**只登记**。证据指针：`.tao/tasks/infra/INFRA-066t-*.md` 完成区 + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（全量扫描 TSV 与逐源日志）。 **【picolibc test 使用量化（`TESTCASES-042t` 现场，2026-10-12）】**本 6 类缺口对应 picolibc 自带 test **blocked 85 条中的 57 条**（余 28 = 另立 issue 的 REL26 弱符号 26 + `setjmp` 桩 1 + QEMU softfloat 1）：**(a) 33**（harness 直接标记 29 + 经（a）过滤源符号 `_pow`×2 / `fma`×1 / `hypotl`×1）、**(b) 8**（直接 4 + `log10f` / `lgammaf_r` / `tgammaf` / `nearbyintf`）、**(d) 14**（`vfscanf`×11 / `vfwscanf`×3，经过滤源符号）、**(e) 2**（`memset_s` / `memset_explicit`）；**(c) `bswap` 当前无对应 test（0 条）**。计数取自 `full-report.json` 逐条 `reason` 机械分桶（`TESTCASES-042t` 完成区 blocker 溯源）。 **【收口进展（`LLVM-084t`，2026-10-12）】(a) 类已收口**——后端补 `SETUO`/`SETO`/`SETONE`/`SETUEQ` 与 6 个整型 don't-care 码 lowering（`components/llvm-project/patches/llvm/lib/Target/DADAO/**`），过滤表 **41→11**（删 30、逐条可编、未多删）。**计数更正**：上文「(a) 33」为估算 ⇒ 实测解锁 **20**（`picolibc-tests-full` pass 132→152 / blocked 85→65 / fail 0 / excluded 18），余 13 条移因其它缺口（`__muldc3` 6〔新立 `ISS-196`〕、QEMU 2-NaN 4〔`ISS-195`〕、(b) 2、REL26 1〔`ISS-194`〕）；**(b) 计数 8→10**（现直接 5 + `log10f` / `lgammaf_r`×2 / `tgammaf` / `nearbyintf`）；(d) 14 / (e) 2 不变。证据：`.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（full-after 报告逐条 reason）；`.tao/tasks/llvm/LLVM-084t-*.md`。 **【收口进展（`LLVM-086t`，2026-10-12）】(e) 类已收口**——后端补 `DADAOTargetLowering::getRegForInlineAsmConstraint`（`components/llvm-project/patches/llvm/lib/Target/DADAO/**`），**只**把单字母 `\"r\"` 映射到**数据寄存器类** `GPRD`（指针类参数经 `rb2rd` 桥接 GPRB→GPRD），其余约束回落基类；**未**新增 `\"b\"`/`\"f\"`（用户 2026-10-12 裁定 C「只解锁，不立约定」）。消费侧同步：`components/picolibc/patches/meson.build.patch` 删 (e) 两条（`memset_explicit.c`/`memset_s.c`）⇒ 过滤表 11→**9**（= (b)5+(c)1+(d)2+(f)1）。实测 `picolibc-tests-full` **pass 174→176 / blocked 39→37 / fail 0 / excluded 22**（total 235），解锁 = `test-malloc`、`test-memset_s`。**本 issue 保持 `open`**（六类未全清 ⇒ 依字段约束「open 时 `resolved_by` null」不回填），(e) 的 `resolved_by` = `LLVM-086t` 记于此；剩余 **(b)/(c)/(d)/(f) 仍开放**（architect 复核：过滤表仍 9 条、`full-after` 逐条分桶与上文一致 ⇒ 口径准确）。证据：`.tao/tasks/llvm/LLVM-086t-*.md` + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`。 **【收口进展（LLVM-087t，2026-10-12）】(b) 类 f32 取整/极值已收口**——后端 `initLibcallLoweringInfo` 补 f32 八条 `RTLIB::{FLOOR,CEIL,TRUNC,ROUND,RINT,NEARBYINT,FMIN,FMAX}_F32`（与 f64 块逐字对称；符号 `floorf`/`ceilf`/`truncf`/`roundf`/`rintf`/`nearbyintf`/`fminf`/`fmaxf`），消费侧 `components/picolibc/patches/meson.build.patch` 删 (b) 四条（`sf_nearbyint`/`sf_scalb`/`sf_tgamma`/`srf_lgamma`）⇒ 过滤表 **9→5**。实测 `picolibc-tests-full` **pass 176→182 / blocked 37→31 / fail 0 / excluded 22**（total 235；`newly_blocked=∅`），解锁 **6** = `test-ceil`/`test-floor`/`test-round`/`test-lgamma`/`test-rounding-mode`/`test-tgamma`。**(b) 计数 10→0**（6 条解锁 + 4 条移因：`test-math-funcs`/`math_test` ⇒ (d)〔`LLVM-088t`〕、`test-log10`/`test-math-errhandling` ⇒ 缺 `log10f`）。**`FLOG_F32`（`log10f`）是否纳入「f32 全族」待用户裁定**（`sf_log10.c` 调 public `logf` ⇒ `llvm.log.f32`；engineer 未擅自扩范围、正确；architect 追认/待裁落点见 `.tao/tasks/llvm/LLVM-087t-*.md`「architect 追认」+「遗留问题①」）。nm 复核：sysroot `libc.a` 8 f32 符号全 `T` 命中。**本 issue 保持 `open`**（(b) 收口、(c)/(d)/(f) 仍开放 ⇒ `resolved_by` 不回填），(b) 的 `resolved_by` = `LLVM-087t` 记于此（architect 复核：过滤表现 5 条、`full-after` 逐条分桶一致）。证据：`.tao/tasks/llvm/LLVM-087t-*.md` + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`。"
