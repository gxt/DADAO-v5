  title: 【P3】`m13-gem5-005` 文档级遗留：① 完成区 patch-tree 红数过时；② `--bootrom` 尺寸 fatal 用 `%zu`，gem5 fatal 不支持（显示 `<bad format>u bytes`）；③ checker 用 `-z max-page-size=0x1000` 链 app ELF，`p_align` 与 chipyard 差 2 字节；④ `e_entry == params.entry` 对 Vast 同样生效但报错文案写 "Tiny"、无门控覆盖。建议：fatal 改 `%llu`；checker 与 chipyard 用同一链接参数；报错按 profile 取名。
