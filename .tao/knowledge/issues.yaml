- id: ISS-245
  title: "【P2/P3 边界】静态 PIE（`crt/rcrt1.c` ⇒ `dlstart.c` 的 `START` 分支）的 `_DYNAMIC` 仍是**链接期绝对地址**（`rcrt1.o` 的 `.rela.text` 3×`R_DADAO_ABS48 _DYNAMIC`）⇒ 装载基址 ≠ 链接地址时自举取错；`-static-pie` 未纳入 P2/P3"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: LLVM-120t
  notes: "【正式登记（源 = `INFRA-085t` 完成区「阶段 A(C1 本体) + C + E」遗留② + 本笔现场复核；architect 立项，2026-10-17）】**源记录（逐字）**：『**静态 PIE（`crt/rcrt1.c`）的 `_DYNAMIC` 仍是链接期绝对地址**（本笔按门控保留原形态，`crt1.o` 逐字节未变）——属**既有边界、非本笔回归**，`-static-pie` 未纳入 P2/P3 范围；建议随 `P3` 或另立任务登记。』**本笔复核（现场，真实输出）**：`$TC/llvm-readobj --relocations .work/source/musl/obj/crt/rcrt1.o` ⇒ `Section (3) .rela.text` = **3 条** `R_DADAO_ABS48 _DYNAMIC 0x0`（偏移 `0x4/0x8/0xC`）；同对象 `Section (9) .rela.got` = 1×`R_DADAO_ABS48 __dls2` + 1×`R_DADAO_ABS48 main`（**可写节** ⇒ 装载期 `RELATIVE`，允许）、`Section (7) .rela.text._start_c` = 1×`R_DADAO_PCREL_HI .got`（C1 已 PC 相对化）。**根因（现场读源）**：`arch/dadao/crt_arch.h:93-96` 的 `DADAO_DYNV_ASM` 分两态 —— `#ifdef DL_DYNAMIC_FROM_LOAD_BASE` ⇒ `rd2rb {rb17},{rd0}`（运行期 dynv，**本轮 C1 落地**），否则 ⇒ `set.rb rb17, _DYNAMIC`（**链接期绝对**）；而 `ldso/dlstart.c:5` 的 `#ifndef START` 才定义 `DL_DYNAMIC_FROM_LOAD_BASE`（L19）⇒ `crt/rcrt1.c:1` 定义 `START \"_start\"` ⇒ 走**绝对地址**分支。⇒ C1 只覆盖 **ldso 自身入口（`_dlstart`）的动态自举**，**静态 PIE 的 `_start` 未改**（`crt1.o`/`rcrt1.o` 的形态差异见上）。**影响（如实，不夸大）**：`-static-pie` **不在 P2/P3 交付范围**（`ADR-0025 D6`）⇒ **当前不阻断任何在役判据**；但 `rcrt1.o` 随 crt 安装集发布 ⇒ 一旦有人用 `-static-pie` 链接，lld 对 PIC 对象里的**局部绝对地址**同样拒绝（文案与本族一致：`relocation R_DADAO_ABS48 cannot be used against symbol ...; recompile with -fPIC`，见 `ISS-241`/`ISS-244` 现场），**或**（若链接器放行）装载基址 ≠ 0 时 `rb17` 指向错误地址 ⇒ 属**静默错**面，须显式登记。**等级 = P3**（非阻断：不在 P2/P3 范围 ⇒ 不影响 `INFRA-085t` 主判据；但属真缺口）。**建议修法（未实施 ✗，本笔只登记）**：(a) 按 C1 同法把 `START` 分支也改为**运行期求** `_DYNAMIC`（static PIE 无 `AT_BASE` 时可用 `AT_PHDR & -4096`/自身 phdr 同法，`_dlstart_c` 已有该启发式）；**或** (b) 显式声明 `-static-pie` 不支持并给出**可判失败**（不得静默）—— 取 (a)/(b) 须**用户语义裁定**。**证据指针**：`.work/source/musl/obj/crt/rcrt1.o`（构建产物，`llvm-readobj --relocations` 现场）、`arch/dadao/crt_arch.h:69-96`、`ldso/dlstart.c:5/19`、`crt/rcrt1.c:1`；`INFRA-085t` 任务书「阶段 A(C1 本体) + C + E」完成区「遗留问题 ②」。**边界**：本笔**未改** `components/**` ✗、**未改** `spec/`·`contracts/`·`.tao/contracts/**` ✗、**未改** 任何任务书 `**状态**` ✗。**交叉引用**：`INFRA-085t`（登记源 + C1 落点）、`LLVM-098t`（clean 复核结论：`.rodata` 类 = 陈旧对象假红）、`ISS-241`/`ISS-244`（同文案，不同机制）、`ADR-0025 D6`（P1/P2/P3 分期）、`ADR-0026`（动态链接行为）、`contract-dynlink.md §6.2/§6.3`（`AT_BASE` 语义）。 〔LLVM-120t 收口（2026-10-20，engineer）〕**已修 ⇒ closed**。修法 = 建议 (a) 的**运行期求**（未走 (b)，无需用户裁定）：① `arch/dadao/crt_arch.h` 的 `SHARED` 档统一 `rd2rb {rb17}, {rd0}`（dynv = NULL），删除 `set.rb rb17, _DYNAMIC`；② `ldso/dlstart.c` 去掉 `DL_DYNAMIC_FROM_LOAD_BASE` 的 `#ifndef START` 门控（两入口统一编译），并在 `AT_BASE == 0` 分支用 `base = AT_PHDR - PT_PHDR.p_vaddr`、`dynv = base + PT_DYNAMIC.p_vaddr` 定位（`AT_PHDR/AT_PHNUM/AT_PHENT` ⊆ `contract-dynlink §6.2` 交付项；无 `PT_PHDR`/auxv ⇒ 返回走 `swym`，显式失败而非猜测）。真值：`rcrt1.o` `.rela.text` 由 **3 条** `R_DADAO_ABS48 _DYNAMIC` ⇒ **0**（仅剩 `0x8 R_DADAO_REL26 _start_c`）；`crt1.o` 与改前**逐字节相同**（`cmp` + 同 flag 对照编译，md5 `beec49238629a5ef28cfcf408d3e0c9e`）；静态 PIE 探针（`-pie --no-dynamic-linker` + `rcrt1.o` + `obj/**/*.lo` 的 PIC 档，`libc.a` 非 PIC 故不可直接用于 `-static-pie`）在 `base=0x555555550000`（链接期 0）跑通：`_DYNAMIC=0x55555557f4f8`、`PT_DYNAMIC.p_vaddr=0x2f4f8`、exit 7、stdout 逐字节 `PIE OK\n`；独立 oracle（自解析 ELF + auxv，11 断言）与探针值一致且**不等于链接期值**。两处可达 FAIL：回退绝对形态 ⇒ 对象级 3 条 + lld 真实拒绝 `relocation R_DADAO_ABS48 cannot be used against symbol '_DYNAMIC'; recompile with -fPIC`（×3）；漏减 `PT_PHDR.p_vaddr` ⇒ 探针 SIGSEGV(139)、oracle 红。回归：`build-musl`/`build-musl-shared`/`check-musl-freshness` rc=0、`musl_smoke_dyn.elf` exit 0（ldso `AT_BASE` 路径不变）、047t 静态抽样 5/5 pass、`check-patch-tree` 185 OK。证据：`.work/evidence/LLVM-120t/run.sh`（default + `--inject`）。**范围未变**：`-static-pie` 是否纳入 P2/P3 仍归用户（本笔只修 `rcrt1.o` 的正确性）。"

- id: ISS-246
  title: "【P2】`__thread` 用户变量不可用：clang `TLSSupported=false` + 后端无 `GlobalTLSAddress` lowering ⇒ 影响 `libc-test` TLS 用例与部分程序（**不阻塞 `P3`**）"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-100t + LLVM-117t
  notes: "【正式登记（源 = `INFRA-085t` 阶段 `B1+D1` 完成区「已知限制」+ `D1-⑤`/`D1-⑥②`；architect 收尾时立项，2026-10-17）】**现象（诊断原文，两条独立缺口）**：① 源码级（Sema）：`clang --target=dadao-unknown-elf -O1 -c …` ⇒ `error: thread-local storage is not supported for the current target`（`clang/lib/Basic/Targets/DADAO.h` 的 `TLSSupported = false`）⇒ **任何 `__thread` 声明都编不过**；② 绕过 Sema 直接给 IR（`llc`）⇒ `Cannot select: … GlobalTLSAddress`（`llvm/lib/Target/DADAO/**` **零 TLS 代码**，无 `GlobalTLSAddress` lowering）⇒ 即便放开 ① 也发不出访问序列。**已就位、不重做**（同一现场核对）：MC 接受 `.tdata`/`.tbss`（`SHF_TLS` + `STT_TLS`）、lld 在**无 scripted `PHDRS`** 时**自动**生成 `PT_TLS`（实测 `p_filesz`=8/`p_memsz`=16/`p_align`=8）、musl arch 宏已定值（`TP=rb3`〔`contract-abi §1.3`〕/`TLS_ABOVE_TP`/`GAP_ABOVE_TP=0`/`TP_OFFSET=0`/`DTP_OFFSET=0`）、重定位类型 10/11/12/13 已映射且 `lld/ELF/Arch/DADAO.cpp` 对 10/11/12 **显式 `Err`**（遇即报错、非静默）。**影响**：`libc-test` 的 TLS 用例、以及依赖 `__thread` 的程序在本 target 上**编不过**（显式诊断）；`libc.so` 自身不依赖 `__thread`（musl 线程态走 `struct pthread` 字段）⇒ 共享库与 `P2` 动态可执行**不受影响**；**不阻塞 `P3`**（`QEMU-062t` 的装载面：auxv/`PT_INTERP`/装载基址与 TLS 用户变量无耦合）。**归属**：`LLVM-100t`（`__thread` 与 TLS codegen；阶段 0 先判 `local-exec` 的 TPOFF 载体，涉新类型即按 `ADR-0019 D10`「编号冻结」停下留问）；`status` 取 `open` 的依据 = ①② 两缺口**仍在**、可确定性复发、需改 `components/llvm-project/**`（**须 `install-host`**）；`resolved_by` 保持 `null`（`check_issues.py`：`open` ⇒ `null`），**待 `LLVM-100t` 验收后**回填 `closed` + `resolved_by: LLVM-100t`。**边界**：本笔**未改** `components/**`、`spec/`、`contracts/`、`.tao/contracts/**`（只登记）。证据指针：`.tao/archive/M8/infra/INFRA-085t-动态链接musl-ldso接入.md`「已知限制（2026-10-17，阶段 B1 + D1 之后）」+ 完成区 `D1-⑤`/`D1-⑥②` +「新发现/坑 ④」；探针 `.work/evidence/INFRA-085t/b1d1/run.sh`（`D1.13`/`D1.14` = `BLOCKED`，rc=2 显式区分、不冒充绿灯）。**交叉引用**：`LLVM-100t`（承接任务）、`INFRA-085t`（登记源）、`ADR-0019 D10`/`D12`（类型号冻结）、`contract-abi §1.3`（`rb3` = `rbtp`）、`contract-dynlink §7`（TLS 口径）、`P3` = `QEMU-062t`（不受阻）。 〔`LLVM-100t` 现场（2026-10-20，T4 engineer）〕**静态面已收口、动态面分解**：① clang `TLSSupported` 改 `true`（驱动对非 PIC 编译默认 `-ftls-model=local-exec`）；② 后端 `ISD::GlobalTLSAddress` → `DADAOISD::TLS_ADDR`，展开为「ABS48 3 片（打在 `STT_TLS` 符号上，`S` = TLS 块内偏移 = `TPOFF`）+ `add.o rb, rb3, rd`」，**零 TLS 动态类型发射**；③ 真值：`thread_local.c` `-O0`/`-O2` rc=0、ET_REL 仅 `R_DADAO_ABS48`；`_Thread_local` 探针（手算 TPOFF 0/8/16、两线程互不串值）exit 0；`libc-test` 静态 `functional/{tls_align,tls_init,tls_local_exec}` **3/3 pass**。④ **动态面未做**：`-fPIC` 下后端**显式报错**（`requires the local-exec TLS model`，非静默），动态档 3 例仍 `blocked`，需 `TLS_DTPMOD/DTPREL/TPREL`（`D2`）= `LLVM-117t`。⇒ `status` **保持 `open`**、`resolved_by` 保持 `null`（本条不单独关闭）；`LLVM-117t` 收口后按「静态已由 `LLVM-100t` 验、动态由 `LLVM-117t` 验」回填 `closed` + `resolved_by`。证据：`.work/evidence/LLVM-100t/run.sh`。 〔LLVM-117t 收口（2026-10-20，T5 engineer）〕**动态面已收口 ⇒ 本条 closed**。① 发射：`.dd.o64 %tls_dtpmod/%tls_dtprel/%tls_tprel` 三个数据槽 specifier（ELF writer 落 10/11/12），`LowerGlobalTLSAddress` 按模型分派（local-exec 不变 / initial-exec = TPREL 槽 + rb3 / global-dynamic = tls_index 对 + `__tls_get_addr` / local-dynamic 显式报错）；② 消费：`lld/ELF/Arch/DADAO.cpp` 新增 `scanSection`（10/11/12 只许在可写非可执行数据槽且须 `STT_TLS`；DTPREL 恒常量、DTPMOD/TPREL 仅非 shared 常量，主程序模块 id = 1）、`relocateInSection` 写 8 字节大端补码、`getTlsTpOffset` 补 `EM_DADAO`（Variant 1 无 gap）；③ 真值：`libc-test` 动态档 `functional/{tls_align,tls_init,tls_local_exec}` **3/3 pass**（T4 时 blocked）、目标 5 例（含 4 条 dlopen）5/5 pass、全量动态档 341 例 pass 338/fail 0/known-fail 1/blocked 2（两条均既有、与本条无关）、与基线逐例 0 条 pass→非 pass；047t 10 例两档 10/10；`dlopen` DSO 内 `__thread` 初值/地址/两线程独立/主程序 TLS 不覆盖 exit 0（独立 oracle）。musl **0 改动**（通用 ldso 路径已够）。证据：`.work/evidence/LLVM-117t/run.sh`。"
