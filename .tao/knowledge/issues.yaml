  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `QEMU-062t` 完成区「新发现/坑 ①」；architect 立项，2026-10-17）】**现象（现场，逐字）**：`qemu-dadao ./<静态 ELF>`（该 ELF 按 `tests/scripts/dadao.lds` 链接）⇒ `error_report` 原文 = `<image>: Unable to find a guest_base to satisfy all guest address mapping requirements`（源码 `.work/source/qemu/common-user/probe-guest-base.c:311`）⇒ `exit(EXIT_FAILURE)`，**未能进入 guest**。**根因（两层，现场）**：① `tests/scripts/dadao.lds` 的 `MEMORY { RAM (rwx) : ORIGIN = 0xFC0000000000, LENGTH = 16M }` ⇒ 首个 `PT_LOAD` 落在 `0xFC00_0000_0000`（M4 测试机 RAM 基址；该脚本属 M4 裸机 ELF 口径，见 `contract-elf.md §5`/`ADR-0004`）；② 宿主 = Linux x86-64（**47 位用户 VA**，上限 `0x7FFF_FFFF_FFFF`）⇒ 宿主 `mmap(0xFC00_0000_0000)` = `ENOMEM`，而 QEMU user-mode 的 `guest_base` 探测（`common-user/probe-guest-base.c`：`pgb_find_itree` 从 `1 GiB` 起**只向上**搜索、`pgb_find_fallback` 同样从 `skip` 递增）**不搜索负平移** ⇒ 该镜像需要的 `guest_base = 0`（identity）在宿主上不可能成立；`-B`（`pgb_fixed`）只校验对齐 + 在该基址可 `mmap`，**负偏移形态不在支持范围**。**影响面（触发面）**：**任何**用 `dadao.lds` 链接的产物（含三套测试 `embench-iot` / `libc-test` / `llvm-test-suite` 若沿用该脚本的静态/动态档）在本宿主上**全部不可装载**；`QEMU-062t` 的静态/动态验收因此改用 **P1 的 `crt1.o` + `libc.a` 在 lld 默认基址**链接的程序（**P1 产物与 `dadao.lds` 均未改** ✗）。**在役绕行（已用）**：测试程序按 lld **默认基址**链接（非 `-T dadao.lds`）⇒ 可装载、可跑（`QEMU-062t` 两档 E2E 即此口径）。**待裁定（不擅改 ✗）**：(a) `qemu-user` 侧支持「guest VA 高于宿主 VA 上限」的装载（需 `guest_base` 负平移 / `reserved_va` 类改造，属 qemu 补丁面）；(b) 测试侧统一改用默认基址（约定层，不改 `dadao.lds`）；(c) 改 `dadao.lds` 的 `RAM ORIGIN`（属 `tests/scripts/` 与 `contract-elf.md §5` 契约口径 ⇒ **须用户授权**）。**证据指针**：`.tao/archive/M8/qemu/QEMU-062t-qemu-user的dadao后端.md` 完成区「新发现/坑 ①」；`tests/scripts/dadao.lds:28`（`RAM ORIGIN`）；`.work/source/qemu/common-user/probe-guest-base.c:120-322`（向上搜索 / `pgb_fixed`）；本笔**无**落盘失败日志（该探测为 `QEMU-062t` 执行期的一次性现场，未留存）——如实标注。**交叉引用**：`QEMU-062t`（登记源）、`QEMU-061t`、`contract-elf.md §5`/`§6.1.2`、`ADR-0004`（M4 RAM 基址）、`ADR-0025 D6`（`P3` 范围）。**〔用户裁定（2026-10-17 深夜，渠道 = 经主会话问答；本笔据其原话落纸）〕** 用户原话（**逐字**）：「**ISS-260:1；ISS-247：用户模式，用0x10000**」⇒ **裁定 = 候选 (b) 的显式化**：**用户态（`qemu-user`）链接基址用 `0x10000`；`dadao.lds` 不动**（仍为 M4 裸机口径）。**落地口径**：测试脚本/驱动按 lld 默认基址（最低 `PT_LOAD=0x10000`）链接，禁 `-T dadao.lds`；`dadao.lds` 与 qemu 装载面均不改。`status` **保持 `open`**（口径已定、落实在测试脚本；本笔未改脚本）、`resolved_by` 保持 `null`。"
- id: ISS-252
  title: "【M9】musl 端口无 `clone.s`（`src/thread/clone.c` 返回 `-ENOSYS`）⇒ 线程 / `posix_spawn` / `popen` 全不可用；`libc-test` 静态档 20 例 blocked"
  status: open
  scope: [infra, qemu]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `TESTCASES-047t` 静态档现场，2026-10-17；architect 立项）】**现象**：静态档 `blocked=25` 中 **20 例**同根因 —— 18 条线程用例 + `popen`/`spawn`（经 `posix_spawn → __clone` 得 `ENOSYS`）。**根因**：musl 端口无 `src/thread/dadao/clone.s`，`src/thread/clone.c` 直接返回 `-ENOSYS`（`INFRA-082t` 的单线程边界）。**归口 = `M9`**（线程/TLS 同批；用户 2026-10-17 已把 TLS 推到 M9，落点 `LLVM-100t`），`M8` 不要求线程。**等级 = P2**（不阻断 `M8` 判据；阻断线程面用例）。**证据指针**：`TESTCASES-047t` 完成区 blocked 段。**交叉引用**：`INFRA-082t`、`LLVM-100t`、`M9`。 〔TESTCASES-052t 现场（2026-10-20，T3；两档实跑，静态 2 次 / 动态 2 次一致）〕`__clone` 已由 `INFRA-095t` 落地；19 条线程用例 = **静态 14 pass / 4 blocked / 1 fail**、**动态 13 pass / 5 blocked / 1 fail**（不含 `pthread_create-oom`；静态档该例仍 `blocked` = `ISS-257`，动态档 `pass`）。残余非 pass 逐条根因**均非本条**：`functional/spawn`（两档）+ 动态 `functional/popen` = `__clone` 变参 `tls` 未传却无条件写 `rb3` ⇒ 子进程 TP 为垃圾（`ISS-295`）；`functional/pthread_mutex_pi` = qemu-user PI futex 返回 `ESRCH`（`ISS-296`）；`functional/pthread_robust` + `regression/pthread-robust-detach` = qemu-user `get_robust_list` 恒 `ENOSYS`（`ISS-297`）；`regression/pthread_cond_wait-cancel_ignored` = 阻塞在 futex 的线程收不到取消（`ISS-298`）。**状态保持 open**：本条验收面（20 例全 pass）未达；原「无 `clone.s`」根因已消失，标题口径宜由后续任务订正。 〔复跑（2026-10-20，`TESTCASES-052t-rerun`；前置 `c47c9b7` = `INFRA-095t` 返工按 `CLONE_SETTLS` 条件化 `rb3`）〕**最新真值**（20 例 = 19 目标 + `pthread_create-oom`，两档各 3 跑一致 + 修 `ISS-299` 后各 1 跑复核）：静态 **15 pass / 3 fail / 2 blocked**、动态 **16 pass / 3 fail / 1 blocked**；19 目标 = 两档均 **15 pass / 3 fail / 1 blocked**（blocked = `pthread_robust` 60 s 超时，非降级）。`functional/spawn`（两档）与 `functional/popen`（动态）已转 `pass`（`ISS-295` 收）。残余 4 例 = `pthread_mutex_pi`（`ISS-296`）、`pthread_robust` + `pthread-robust-detach`（`ISS-297`）、`pthread_cond_wait-cancel_ignored`（`ISS-298`），原因未变。**状态保持 open**（20 例全 pass 未达）。 〔最新真值（2026-10-20，`evidence-snapshot-fix` 现场复跑；前置 = `QEMU-066t` 修 `ISS-296` PI futex 字节序 / `ISS-297` robust_list / `ISS-298` 取消帧）〕同一 20 例（19 目标 + `pthread_create-oom`）、同一 `--filter`：**静态 19/19 目标 pass**（extra `pthread_create-oom` = `blocked`，`qemu killed by host signal 5` = `ISS-257` flake）；**动态 19/19 全 pass**（extra 亦 `pass`）；两档 `fail=0`、目标集合无 `blocked`。驱动 rc 由记录现场派生（静态 `blocked=1` ⇒ rc=1，动态 ⇒ rc=0）。`status` 仍 `open`：本条验收面为 20 例全 pass，静态 `pthread_create-oom` 仍受 `ISS-257` 阻断。证据 = `.work/evidence/TESTCASES-052t-rerun/run.sh`（default/`--inject` 均 rc=0，计数现场派生）。 〔/complete 判定（2026-10-20）〕**保持 `open`**：本条验收面 = 20 例（19 目标 + `pthread_create-oom`）全 pass，而静态档 `pthread_create-oom` 仍 `blocked`（`qemu killed by host signal 5` = `ISS-257` 宿主 `RLIMIT_AS` 直通，非线程面）⇒ 差 1 例；19 目标两档已 19/19，若 `ISS-257` 收口或用户裁定把 extra 例移出本条验收面，方可 close。"
- id: ISS-255
  title: 【P3】`qemu-dadao` 上两条 `libc-test` 回归用例以宿主 `SIGBUS`/`SIGTRAP` 终止（`regression/flockfile-list`、`regression/setenv-oom`）⇒ 归 qemu 面诊断
  status: open
  scope:
  - qemu
  blocks: []
  resolved_by: null
  notes: '【正式登记（源 = `TESTCASES-047t` 静态档现场，2026-10-17；architect 立项）】**现象**：`regression/flockfile-list`、`regression/setenv-oom` 两例在 `qemu-dadao` 上以宿主 `SIGBUS`/`SIGTRAP` 终止（非 guest 退出码），归 `blocked`。**性质（未定根因）**：可能是 qemu-user 的 guest 栈/内存映射或 `setenv` OOM 路径的宿主侧故障；**不预设**为测试缺陷。**等级 = P3**（2 例、非阻断）。**处置**：qemu 面诊断（宿主信号来源 / guest 地址映射 / 是否 `setenv-oom` 依赖内存上限），给出「guest 可判失败」或修 qemu。**证据指针**：`TESTCASES-047t` 完成区 blocked 段。**交叉引用**：`QEMU-062t`（user-mode 后端）、`ISS-247`（装载基址）。**〔追加（2026-10-17，architect）〕** 同类 flake 另见 **`ISS-257`**（`regression/pthread_create-oom`：一次 `pass`、其后 5/5 pilot + 8/8 单跑全 `BLOCKED`；同属 guest `setrlimit(RLIMIT_AS)` 直通宿主）。 〔立册（2026-10-18，architect）〕归 `QEMU-063t`（与 `ISS-266` 同批；诊断时间盒 1–2 h，超时归因 + 保留现场）。 〔逐例归因（2026-10-19，`QEMU-063t`）〕① `regression/flockfile-list`：宿主 `SIGBUS`（`BUS_ADRALN`，si_addr `0x394fc`）由 `cpu_mmu_lookup` 的对齐检查在 `do_st8_mmu` 处触发 —— 该 8 B store 地址为 4 mod 8；根因 = 语料自带的 interpose `malloc` 从 `static unsigned char buf[1<<20]` 里按字节切块、不保证 8 B 对齐（`libc-test/src/regression/flockfile-list.c`），而 DADAO 8 B 访问要求 8 B 对齐 ⇒ **负载自身问题**，非 qemu 缺陷。② `regression/setenv-oom`：**qemu 限制**（家族同 `ISS-257`）——`setrlimit(RLIMIT_AS)` 直通宿主，随后 GLib 分配 512 B 失败并 `g_error` ⇒ `qemu-dadao: QEMU internal SIGTRAP`；需 linux-user 侧虚拟化 `RLIMIT_AS`，本册时间盒内未实现。证据：`.work/log/qemu/QEMU-063t-gdb-flockfile-list.log`、`.work/log/qemu/QEMU-063t-setenv-oom.log`、`.work/evidence/QEMU-063t/`。`status` 保持 open。 〔M8 收口核对：两例归因已完成（语料 8 B 对齐 / `RLIMIT_AS` 直通宿主）；qemu 侧虚拟化未做；不阻断 M8。〕 〔`LLVM-100t` 证据脚本复核（2026-10-20，reviewer 独立重跑）〕`run.sh --inject` **3 跑中 1 次 2 红**（`inj.expect.restored.probe.rc` actual=139 + `PROBE_OK` 缺），现场 = `qemu-dadao` **宿主 `SIGSEGV`**（脚本打印 `Segmentation fault (core dumped)`），发生于「还原探针源→重建→重跑」步；同 ELF 直跑 **20/20 rc=0**、随后再跑 `--inject` **2 次全绿** ⇒ **偶发，非脚本 / 交付物缺陷**（脚本如实报 FAIL、未掩盖 = 行为正确）。本条即该族（宿主信号）第 3 个实例；判「偶发」的重复跑证据见 `LLVM-100t` 册「证据脚本独立复核」段。'
- id: ISS-257
  title: 【P3】`libc-test` 静态档 `regression/pthread_create-oom` 不稳定：一次记 `pass`、其后全 `blocked`（guest `setrlimit(RLIMIT_AS)` 直通宿主 ⇒ qemu 侧分配失败 / 宿主 `SIGTRAP`；与 `ISS-255` 同类）
  status: open
  scope:
  - qemu
  blocks: []
  resolved_by: null
  notes: '【正式登记（源 = `TESTCASES-047t` 静态档第 3/4 轮现场，2026-10-17；architect 立项）】**现象**：`regression/pthread_create-oom` 在一次全量中记 `pass`（计数 `304/24`），随后 **5/5 套件 pilot + 8/8 单跑**均 `BLOCKED` —— 落盘现场如 `.work/log/testcases/INFRA-087t-static.log:342`「`Observed: qemu killed by host signal 5`」。（那次 `pass` 的 stdout 未落盘，取自 engineer 自审记录；可复核的落盘现场均为 `BLOCKED`。）**根因方向（未定根因，不预设修法）**：该用例自身 `setrlimit(RLIMIT_AS)` 在 qemu-user 下作用于**宿主 qemu 进程**（guest rlimit 直通宿主；同因见 `regression/setenv-oom`，`INFRA-087t-static.log:361-362`）⇒ 其后 qemu 内部分配失败（pilot stderr 报 `GLib failed to allocate 512 bytes`，未落盘）⇒ 宿主 `SIGTRAP`（信号 5），用例未达判定。注意该用例在 `pthread_create → EAGAIN` 路径上**可合法 pass**（musl 端口无 `__clone`，`ISS-252`），故计数在 `303/25` 与 `304/24` 间抖动。**处置**：**不改标签**（保持 runner 实况分类，`blocked` 计入静态档 `blocked`，`fail=0` 结论不受影响）；诊断落 qemu 面（guest rlimit 是否应与宿主隔离 / 分配失败应报 guest `ENOMEM` 而非宿主信号），与 `ISS-255` 同批。**等级 = P3**（1 例、非阻断）。**证据指针**：`.work/log/testcases/INFRA-087t-static.log:342`、`TESTCASES-047t` 第 3/4 轮完成区。**交叉引用**：`ISS-255`（同类宿主信号 / RLIMIT_AS）、`ISS-252`（无 `__clone`）、`QEMU-062t`、`TESTCASES-047t`。 〔M8 收口核对：与 `ISS-255` 同族（`RLIMIT_AS` 直通），随线程面 `M9`；不阻断 M8。〕 〔TESTCASES-052t 现场（2026-10-20）〕线程子集两档各 2 次：静态档 `regression/pthread_create-oom` 2/2 `blocked`（`qemu killed by host signal 5`，现象与登记一致）；动态档 2/2 `pass`（exit 0，未见宿主信号）。按册约定不计入 19 条目标、不据此改基线。'
