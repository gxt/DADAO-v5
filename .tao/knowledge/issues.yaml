  notes: "【正式登记（源 = `TESTCASES-047t` 静态档现场，2026-10-17；architect 立项）】**现象**：`strptime` 1 例真失败；musl `src/time/strptime.c:133-139` 对 `%s` **没有任何效果**（既不解析也不写入 `tm`），语料期望 `%s` 被识别。**性质 = 语义口径分歧**（非崩溃、非静默错码）。**倾向（待用户裁定）**：按 musl 语义为准（`%s` 不支持 ⇒ 语料该例改分类/标 `excluded` 并给 reason），**不**改 musl 实现去迁就语料。**等级 = P3**（1 例、非阻断）。**证据指针**：`TESTCASES-047t` 完成区 C 组、`.work/log/testcases/libc-test-user-static.log`。**交叉引用**：`TESTCASES-047t`、`TESTCASES-044t`（语料源锁定）。**〔处置（2026-10-17，architect 立项）〕** 本 issue 执行落点 = **`INFRA-087t`**（`.tao/tasks/infra/INFRA-087t-strptime语义归属与分类.md`）：口径 = **musl 语义为准**（`ADR-0025 D7` 的对照目标亦 musl）⇒ 最小复现钉死「`%s` parse-only、不写 `tm`」，把该例 `fail` → `known-fail`（依据本 issue），并修 runner 的 `known-fail` 准入（仅 `ISS-246` → 逐例依据表，保留「无依据即 FAIL」）；**不改语料/期望、不改 musl 实现**；`status` 待 `INFRA-087t` 收尾后由主会话回填 `closed`。**〔处置（2026-10-17，engineer；`INFRA-087t` 实现完成、待验收）〕**① **诊断 = musl 语义（非端口缺陷）**：最小复现（哨兵 `tm`=1991-08-25）实测 `ret=ok tm=1991-08-25T00:00:00`（`%s` 消费数字、`tm` 未被改写）；对照 `%Y-%m-%d` 实测写为 `1999-12-31`（探针可观测写入，排除「探针看不见写」）；独立 oracle `date -u -d @683078400` = `1991-08-25T00:00:00Z`；musl `src/time/strptime.c:133-139` 注释原文保留，端口补丁序列（`HEAD~1..HEAD`）**未触碰**该文件 ⇒ 上游 1.2.6 行为；**不改 musl、不改语料/期望**。② **分类订正**：runner `known-fail` 准入由「仅 `ISS-246`」扩为**逐例依据表**（`ISS-246` = live TLS 扫描 + 诊断；`ISS-251` = musl 注释原文 + 语料 `:112` 调用点 + 该例 `%s` 诊断），并加反向校验（live `%s` 失败不得静默留 `fail`）；`functional/strptime` → `known-fail`（依据本 issue）。③ **实测（安装根）**：`047t` 静态档 `pass=303 / fail=5 / known-fail=4 / blocked=25`（对照 `303/6/3/25`：`fail 6→5`、`known-fail 3→4`、`pass` 不变）。④ **证据**：`.work/evidence/INFRA-087t/run.sh`（`--inject` rc=0；2 处注入均可达 `[FAIL]` + `cp`/md5 还原）、`.work/log/testcases/INFRA-087t-*.log`。⑤ `status` 保持 `open`，待 reviewer 验收后由主会话置 `closed`。"

