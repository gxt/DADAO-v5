  notes: "【正式登记（源 = 主会话 `QEMU-060t` `/complete` 收尾；architect 收尾时立项，2026-10-16）】**现象**：`QEMU-060t` 的 reviewer 阶段，同一 reviewer 会话**连续 2 次异常返回**——第 1 次 = `completed without a text response`（空文本）；第 2 次 = 文本被**截断**（未给出完整判决）。**处置（按 `AGENTS.md`「子代理返回异常处理」）**：连续异常后**停止重试**、不耗满次数，改由**主会话代行复核**（已**实跑**：`run.sh` rc=0、52 PASS / 0 FAIL；`check-qemu-semantics` **149/149** rc=0；`changelog` ABI 名 **0** 命中；`check-component-changelog` rc=0；`make check`(L1) rc=0；`helper.c.patch` md5 = `2b1665e99ed4736fc6579c386a3850f1`）⇒ 本册方判 `已验证`。**状态：代行结论待用户追认**（`AGENTS.md`「主会话代行须经用户同意 + reviewer 验收」）。**建议（抽象）**：① 把这类「复核 / 复验」任务拆**更小**、或**换新会话**（避免长会话上下文导致的空返回 / 截断）；② 每次异常与处置登记在案（本条即为登记）。**`status` 取 `open`（architect 判断）**：① **待用户追认**（代行复核的结论有效性未确认）；② **可复发**（长 reviewer 会话仍可能空返回 / 截断）；③ **无机械门控可判**。**性质** = 流程 / 工具可靠性缺口（**非**交付物功能缺陷）。**边界**：本笔**未改** `tools/**`、未改 `Makefile`、未改 `components/**`。证据指针：`.tao/tasks/qemu/QEMU-060t-回退dadao-m1-syscall服务.md`「第 1/2 轮 reviewer 验收」；`.work/log/qemu/QEMU-060t-complete-*.log`（本机留档，不入库）。**交叉引用**：`ISS-227`（同批登记）、`lessons §3.5`（子代理异常返回：重试 1 次后拆分）、`AGENTS.md`「子代理返回异常处理」。 **【再发（2026-10-16，`LLVM-094t` 阶段 B）】** 该次 reviewer **会话被服务商拦截**（返回 `Provider blocked the response`，与 `ISS-207` **同类**；**白跑、未落盘** —— 已核工作树 `git status --porcelain -uall` 干净）⇒ **处置** = **换新会话 + 缩小范围重试 1 次** ⇒ 成功（reviewer 判决 `Accepted`）✓（**有效对策**）。**累计**：本项目已出现 reviewer 异常 **3 次**（`ISS-207`／`ISS-228` 原次／本次）。**边界**：本次**未改** `tools/**`／`Makefile`／`components/**`（仅登记）。证据指针：`.tao/tasks/llvm/LLVM-094t-llvm-PIC与动态链接支持.md`「第 1 轮 reviewer 验收（阶段 B，缩范围重试）」；`.work/log/llvm/LLVM-094t-*`、`.work/evidence/LLVM-094t/**`（本机留档，不入库）。"

- id: ISS-229
  title: "【P3】`L2`/`L3` 并发运行会因共享安装根（`install-host`）竞争产生假 FAIL"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `QEMU-060t` `/complete` 收尾现场，主会话实跑留档；architect 提交/文件集审核时立项，2026-10-16）】**现象（假 FAIL，现场）**：`/complete` 收尾时 **`L2`（`make check-modules`）与 `L3`（`make check-full`）在同一工作树内并发运行**（留档 mtime 重叠 = `QEMU-060t-complete-L3-run1-FAIL.log` 00:12:44、`QEMU-060t-complete-L2.log` 00:13:14）⇒ `L3` 首跑 **`L3_EXIT=2`**、Embench **`Results: 37/38 passed, 1 failed`**；**现场观察**失败例 = `matmult-int (-O0)` 编译报 **`stddef.h not found`**（**口径披露**：该逐例明细**未落入留档日志** —— 留档 `QEMU-060t-complete-L3-run1-FAIL.log` 只保全量汇总行 + 末尾 5 条 PASS；`matmult-int` 明细来自现场观察、**重跑不可复现**）⇒ 判**环境竞争所致的假 FAIL**，非产品缺陷。**排除证据（与 `L2` 错开后单跑）**：单跑 `L3` ⇒ **`L3_EXIT=0`**、**`Results: 38/38 passed, 0 failed`**（`QEMU-060t-complete-L3.log`，00:16:15）⇒ 38 例逐例命中、无残留失败；同轮 `L2` 独立 **`L2_EXIT=0`**（`picolibc-tests: stage=fast total=20 pass=18 fail=0 excluded=2`）、`L1b` = `repository checks (L1): PASS`。**根因**：`L1`/`L2`/`L3` 与 `install-host` 共用同一工作树的 `.work/build/*`、安装根（`install-host` 写入 `$(HOST_TOOLCHAIN_BIN)`/`$(HOST_TOOLS_BIN)`，即 `.dadao/cross-toolchain/bin`）与 SDK 产物目录 ⇒ 并发时一方正在写入，另一方的编译**读到瞬态不完整的安装根**（缺内置头文件）⇒ 假 FAIL。**归因依据（既有文字，非本次新发现）**：`Makefile:307-311` 的 `NOTE (concurrency)` 已明写 —— 只有 `install-host` 的**写入**被做成 race-safe（`INFRA-053t`，源自 `ISS-172`）；而在一个工作树内并发跑 **gate** targets（`test-elf`/`test-semihost`/`check`/…）**仍 UNSUPPORTED**（它们共享 build trees 与 SDK artifact dirs；参见 `AGENTS.md`「并行任务上限」；**Run them serially**）⇒ **本 issue = 该 UNSUPPORTED 留白的现场命中**（`ISS-172` 修的是**写侧**竞争，本次暴露的是**读侧**竞争）。**对策（建议，不阻塞）**：明确纪律 —— **同一时间只运行一个会写 `.work/build` / 安装根（`.dadao/`）/ SDK 产物目录的门控**（`L1`/`L2`/`L3` 与 `install-host` 互斥；亦与 `AGENTS.md`「长任务一次只跑一个」一致）⇒ **落点 = 把该纪律写入门控文档**：`AGENTS.md`（「长任务」或「并行任务上限」条）**或** `docs/Process-07-门控分层规范.md`（现状仅由 `Makefile` 注释承载，不构成可执行约束）。可选强化（另议）：对该类 target 加 `flock` 互斥（可机械判）。**`status` 取 `open`（architect 判断）**：① 缺口**仍在**（纪律未入门控文档）；② **可复发**（任一并发跑门控的场景，尤其多子代理并行 ⇒ 与 `AGENTS.md`「并行任务上限 ≤8」现实叠加）；③ **部分可判**（`flock` 可机械判；文档纪律靠评审）。**性质** = 门控/流程缺口（**非**交付物功能缺陷；`QEMU-060t` 判据内已由单跑复验闭环）。**边界**：本笔**未改** `tools/**`、未改 `Makefile`、未改 `AGENTS.md`、未改 `docs/**`（只登记 + 给落点建议）。证据指针：`.work/log/qemu/QEMU-060t-complete-{L3-run1-FAIL.log,L3-run1-FAIL.EXIT,L3.log,L3.EXIT,L2.log,L2.EXIT}`、`.work/log/qemu/QEMU-060t-complete-L1b.log`（本机留档，不入库）；`Makefile:307-311`（NOTE concurrency）、`Makefile:298-305`（`atomic-install`/`ISS-172`）；`AGENTS.md`「长任务（长构建 / 长命令）」「并行任务上限」。**交叉引用**：`ISS-210`（同属「安装根 × 构建树一致性」面，但那条是**同步缺失**、本条是**并发竞争**）、`ISS-172`（已归档闭环：`install-host` **写侧**竞争；`.tao/archive/M6/issues-closed.md`）、`docs/Process-07`（建议落点）、`QEMU-060t`（现场）。 **【扩展（2026-10-16，`LLVM-094t` 阶段 A 现场）】** 同类风险**不只在共享安装根** ✗ —— **构建树**同样会被并发写坏：现场 = 手动 `make build-mc` 与 L2 内的 `install-host→build-mc` **并发** ⇒ 构建树被写坏（`clang-23` 异常膨胀 / segfault 被装机 ✓）；⇒ **对策** = 把纪律扩为「**同一时间禁止任何两个会写 `.work/build/**` 或 `.work/install/**` 的操作**」（含门控、含手动构建）✓ **【实例：主会话派单串行违规（2026-10-16，architect 照实登记）】**：2026-10-16，主会话在「`ADR-0028` 定名 `REL32` + 记录形态 (甲)」子代理**尚未返回**时，又派出**第二笔**（**同改** `.tao/adr/adr-0028-*.md`）✗ ⇒ **第二笔自行检出并发**（读到工作树已被第一笔部分改动）并**零副作用退出** ✓（临时分支已删、涉及文件 `md5` 前后一致、工作树无残留）⇒ **未造成损坏** ✓。**教训**：派单前必须**先核「上一笔是否已落地」**（以**盘上事实**判：`git log` / `git status --porcelain -uall` / 文件内容，**不以「我派过」判** ✗）；**同改共享文件的任务一律串行**（`AGENTS.md`「并行任务上限」）。**`status` 不改** ✓（本条主项 = 共享安装根 / 构建树并发缺口；本实例为**同一纪律面**的**派单侧**命中）。 **【实例②（2026-10-17，architect 照实登记）】**：主会话在上一笔（`architect` 提交 L3 载体）**通知未到**时再次派发 `L3 载体` engineer（同工作树**双写者** ✗）；该 engineer **自行检出并发后停手不写** ✓、改为独立复跑验收（L1/L2/L3 全绿 ✓），未造成损坏 ✓。**对策（可核）**：主会话今后**只在上一次派发的完成通知到达后**才派下一笔（不凭记忆判断 ✗）。**`status` 不改** ✓。"

- id: ISS-230
  title: "【P2】`ADR-0026` 的「超 ±2 KiB 用 `ABS48` 序列 + `ldm.o_rrri_rb`」在现有 ABI 下不可实现（无链接器可用 `rd`、无宽相对重定位类型）⇒ 契约与可用通道不闭合"
  status: closed
  scope: [llvm, spec]
  blocks: []
  resolved_by: LLVM-095t
  notes: "【正式登记（源 = `LLVM-094t` 阶段 C「完成区·遗留问题（阶段 C）①」+「新发现/坑（阶段 C）①②」；architect 阶段级收尾时立项，2026-10-16）】**现象（现场）**：`-shared` 走**默认布局**（不使用 `tests/scripts/dadao-dyn.lds` 的单段 RWX 布局）时链接期报 `R_DADAO_REL12 out of range: 65596 is not in [-2048, 2047]; references section '.got'`（rc=1）——即 `ADR-0026 D5` 要求的「超 ±2 KiB ⇒ `ABS48` 序列 + `ldm.o_rrri_rb` 两段式」**未实现**，现按 `D7④` **显式报错**（非静默）；architect 独立复现（只读，2026-10-16）：`gv.c -fPIC` ⇒ **65552**、`-z max-page-size=0x1000` ⇒ **4112**、`-z noseparate-code` ⇒ **65552**（均 rc=1）⇒ **任何分段布局**下单指令 GOT 访问（`ld.o [rb0, slot]`，`imms12` = ±2 KiB）均不可达。**根因（前置不可满足）**：两段式须把偏移算进一个 **`rd`**（`ldm.o {rbX}, [rbH, rdC]` 的偏移域**只能是 `rd`**；`ld.o` 只有 `imms12` 立即数形式），且**链接器无可用 `rd`** —— `spec/DADAO-21-ABI` 寄存器表：`rd0` = 零（immutable）／`rd1` = `rderrno`〔ABI 定义〕／`rd2–rd3` = 「调试/测试保留，编译器不得分配使用」／`rd4+` 归编译器（`rd4–rd7` caller-saved，函数体内可能活跃）；ISA 侧**唯一**宽范围 PC 相对通道（`REL26` 字偏移／`add.si` 的 `imms18`）**无匹配重定位类型**（`REL14/20/26` 为字偏移、`REL12`/`ABS12` 仅 `imms12`）⇒ 「契约（不固定 GOT 基址 + 超范围两段式）」与「可用通道（无链接器可用寄存器 / 无宽相对重定位类型）」**不闭合**（对照：RISC-V 靠 **`gp` 固定基址 + ±2 KiB** 才成立，而本契约**禁止**固定基址与专用寄存器）。**三候选（须用户裁定）**：**(a)** 编译器发射两段式（`ABS48` 的 `rd` 目的片作 PC 相对偏移）——**最贴 `D5` 原文**，但须改阶段 A 已验收的 `run-a.sh` `P1`/`P3` 断言，且 `ADR-0019 D7` 禁 relaxation ⇒ 单指令访问降级为「一律两段式」；**(b)** 让出**链接器临时寄存器**（或新增**宽 PC 相对重定位类型**）由链接器就地展开/合成 —— 触及 **ISA/ABI ⇒ 须 `ADR` + `spec/` 授权**；**(c)** **接受布局约束**（`.got` 保持在 ±2 KiB 内，由构建脚本 / 链接脚本负责，沿用阶段 B 的 `tests/scripts/dadao-dyn.lds` 单段 RWX 布局，由 `INFRA-085t` 消费侧承接）——**不新增 ISA**。**`status` 取 `open`（architect 判断）**：① 缺口**仍在**（默认布局不可产出动态 ELF；本轮以显式报错兜底）；② **可复发**（任一不走专用脚本的 `-shared` 链接即命中）；③ **须用户语义裁定**（三候选分属「改已验收对象形态」/「改 ISA·ABI」/「改布局义务」，**不擅自选**）。**性质** = 契约可满足性缺口（**非** `LLVM-094t` 阶段 C 交付面缺陷——②主动拒绝/③A7 重定均已交付并留证）。**边界**：本笔**未改** `spec/`、未改 `contracts/`、未改 `.tao/contracts/**`、未改 `components/**`、未改 `Makefile`（只登记 + 给候选与判据）。证据指针：`.tao/tasks/llvm/LLVM-094t-llvm-PIC与动态链接支持.md`「完成区·遗留问题（阶段 C）①」+「新发现/坑（阶段 C）①②」+「architect 阶段级收尾 / 提交 / 阻塞登记留痕（2026-10-16，阶段 C）」；`.work/evidence/LLVM-094t/run-c.sh`（第 5 节：默认布局 rc≠0 + 错误文案）；`.work/log/llvm/LLVM-094t-C-runc-final.log`（NOTE 65596 / 4156）。**交叉引用**：`ADR-0026 D5`/`D7④`、`ADR-0019 D7`/`D10`、`contract-dynlink.md` §3（GOT/PLT 与两段式）、`spec/DADAO-21-ABI`（寄存器表）、`LLVM-094t`（阶段 C）、`INFRA-085t`（消费侧布局义务）。**【用户裁定与方案（2026-10-16，源 = 主会话转达；`architect` 落盘）】** ① **用户原话（逐字引录）**：「**你不用试了，过会儿我告诉你解决方法**」⇒ 主会话**已停**技术探索 ✓。② **用户随后给出的方案（原话摘要）**：「如果我拿 **`rd3`** 作为 linker reserved 寄存器，然后把着偏移地址放入 `rd3` 中，**`ldm.o {rbHA}, [rb0, rd3]`**，应该可以满足实际需求，带来的主要问题是设置 `rd3`，不一定需要 3 条指令（`set.rd rd3, imm64`）」。③ **主会话贴盘核过的技术事实（逐条有依据）**：(a) `ldm.o {rbH*}, [rbHB, rdHC]` 偏移域是 **`rd`** ✓（`spec/SimRISC-01`）；合法性规则**无基址限制**（仅 `dst_rd0`/`dst_rb0`/`mreg_*`）⇒ `[rb0, rd3]` **合法** ✓；`rd` 64 位 ⇒ **可及性彻底解决** ✓。(b) **成本 = 4 条/次**（现状 1 条 ✗）：`spec/Toolchain-01 §6` 明文「`set.rd rd, imm64`：常量→最少指令数（≤4）；**符号/可重定位→固定 3 片 + `R_DADAO_ABS48`**」⇒ 我们是可重定位 ⇒ **固定 3 条** ✓（用户猜「不一定 3 条」对**常量**成立、对**可重定位**不成立 ✗）。(c) **重定位语义冲突**：`[rb0(PC) + rd3]` 要 **PC 相对**值，而 `ABS48` 是**绝对地址** ✗ ⇒ 需**新的 PC 相对（48 位）重定位类型** ✓（PIE 下该偏移是**链接期常量** ✓ 可行 ✓）。(d) **指令空间**：链接器**插不了指令**（重定位只改**定长指令**的立即数域）⇒ 该序列**必须 CodeGen 发射** ⇒ **属编译器改动**（非纯链接器 ✓）。(e) **`rd3` 语义**：`spec/DADAO-21` 明文 `rd2–rd3` = reserved（**调试/测试保留**，编译器不得分配）⇒ 改「链接器保留」**须改 `spec/`** ⇒ **须用户原话授权** ✓（仓库内**目前无真消费者** ✓，仅 M1 归档测试向量把它当普通寄存器用 ✓）。(f) **备选与成本**：**(A)** `rb2`(`rbgp`，ISA 现成) 当 GOT 基址 ⇒ **1 条/次**，但 GOT 须落 `rb2±2 KiB`；**(B)** 用户方案 ⇒ **4 条/次**、任意可达；**(C) 推荐**：`rb2`=GOT 基址（启动/`ldso` 设一次）+ `rd3`=**GOT 相对窄偏移**（`set.zw rd3, wp0, imm16` + `ldm.o`）⇒ **2 条/次**、**不依赖 `.text`/`.got` 链接布局** ✓（仅要求 GOT 自身 ≤ ±32 KiB ≈ 4096 槽 ✓）；**(D)** 布局约束（现状，实测默认布局 **65588 B** ✗ 不可行）。(g) **代理量测**（宿主 x86-64，**仅数量级参考** ✗）：`libc.so.6` GOT ≈ **61 槽 ≈ 488 B** ✓；我们 musl 实值待 `P2` 实测。④ **待用户裁定（未定事项）** ✗：选 **(B) 4 条/次、任意可达** 还是 **(C) 2 条/次、依赖 `rb2` 基址**（决定新重定位类型**宽度**与 `rd3` 用法）；以及 `rd3` 语义改动的 **`spec/` 授权**。⑤ `status` 保持 `open` ✓。**【用户订正 `set.rd`/`set.rb` 语义 + 「内联 `set.rd` disp 替换 PLT 数据槽」方向（2026-10-16，源 = 主会话转达；`architect` 落纸并**现场复核**·只读）】** ① **用户原话（逐字引录）**：「**1、Toolchain-01里的写法有问题，set.rb才是写地址操作数的，应是3条指令，而set.rd除了直接写立即数以外，可以用来写偏移地址，此时应该是有符号数，不限制指令数；**」② **由此已落地的规范订正**（`spec/Toolchain-01 §6.1` 保留伪指令表，**只改 `set.rd`/`set.rb` 两行**）：`set.rd rd, imm64` = 常量 → 最少指令数（≤4 条）／**偏移地址（disp）→ 有符号数、不限指令数**（按值所需片数展开，≤4 条）；原「符号/可重定位 → 固定 3 片 + `R_DADAO_ABS48`」**移入** `set.rb rb, imm64` 行（写**地址**操作数 ⇒ ≤48 位 ⇒ 3 片，与该册既有「其为地址时 MUST ≤48 位」一致）；`SimRISC-03 §3.1/§3.2` 原文与 `ADR-0019 D10` 正文**未改**（前者与订正后一致）⇒ 上面 ③(b) 引述的旧行措辞**已由本订正取代**。③ **现状 PLT 形态（依据 = `.work/source/llvm-project/lld/ELF/Arch/DADAO.cpp::writePlt`；architect 现场字节级复核）**：每条目 = 「**8 字节数据槽**（条目内 `+16`）+ `ld.o rd5,[rb0,16]` + `ldm.o {rb4},[rb0,rd5]` + `jump [rb4,rd0,0]`」（条目 24 B、`pltHeaderSize=0`、eager）；`objdump -s -j .plt/`.got.plt` 复核 `libtest.so`（`/tmp/opencode/LLVM-094t/run-c/`）：`.plt`@`0x1B0`、`ldm.o` 于 `0x1B4`、条目内嵌 8 字节常量 = **`0x134` = `0x2E8`**（`.got.plt`@`0x2D8` + 2 槽）**− `0x1B4`** ✓（`writePlt` 的 `offset = gotPltVA − (pltEntryAddr + 4)` 逐字节吻合）；源码注释**只记录「为何必须两段式」**（无 GP 寄存器 + 唯一 PC 相对访存只带 12 位立即数），**未记录「为何不用内联 `set.rd`」** ✗。④ **用户给出的方向（原话摘要）**：用**内联 `set.rd` disp** 取代条目内数据槽 ⇒ **PLT 条目 3 条 → 4 条、去槽**（dcache 友好）；**GOT 访问同法** = `set.rd rd5, disp` + `ldm.o` ⇒ **3 条/次**、**无槽**、**无需保留寄存器**，`disp` 限 **32 位有符号**（2 条形式 = 2 wyde）⇒ **±2 GiB**。⑤ **主会话核过的事实（逐条标依据）**：(a) `set.rd` 展开的**符号性**（`spec/SimRISC-03 §3.1`：`set.zw` 清其余位 / `set.ow` 置其余位为 1）⇒ **2 条形式必须按 `disp` 符号选首条**（≥0 用 `set.zw`；<0 用 `set.ow`）——**PLT 无问题**（链接器知道符号 ✓）；**编译器发射的 GOT 访问不知符号** ✗ ⇒ 需 **(i) 重定位按符号改写首条 opcode**（先例：`R_DADAO_REL26` 把 `call-iiii`(`0x74`) 改写为 `jump-iiii`(`0x70`)，`contract-elf.md §3.2`）**或 (ii) 布局保证 `disp` 恒正**（多一条布局义务）。(b) `R_DADAO_ABS48` **已有指令切片编码**（`set.zw`/`or.w`/`andn.w`，每指令 1 个 16 位 wyde、按 `wp`=hb[5:4] 选择；见 `DADAO.cpp` 文件头注释）⇒ **机制现成**，只缺 **PC 相对 + 有符号** 变体（新类型 ⇒ 动 `ADR-0019 D10` ⇒ **须逐条与用户确认** ✗）。⑥ **待用户裁定（本轮新增，未定）** ✗：GOT 路径的**符号解法** = **(i) 重定位改写首条 opcode** vs **(ii) 布局保证 `disp` 恒正**。⑦ `status` 保持 `open` ✓（与既有「三候选」并置，均待用户语义裁定）。指针：`spec/Toolchain-01`（§6.1 两行）+ `manifests/spec-readonly.lock.toml` 该册注释；`.tao/tasks/llvm/LLVM-094t-llvm-PIC与动态链接支持.md`「遗留问题（阶段 C）①」追加条。 **【设计已由 `ADR-0028` 解决（2026-10-16，architect；用户逐条确认）】**：`ADR-0028`（GOT/PLT 远距离取址）已由 `Proposed` 转 **`Accepted`**（用户 2026-10-16 逐条确认：`D1`–`D10` 逐条、`D6` = **导出项**）；**设计定案** = 新增**静态**重定位类型 **`R_DADAO_REL32`（编号 `14`，PC 相对 32 位有符号字节偏移、2 指令配对）**、**`R_DADAO_NUM` `14 → 15`**；**GOT 访问 = 3 条/次**（`set.zw`/`or.w` 或 `set.ow`/`andn.w` + `ldm.o`）、**取消「`.got` 贴 ±2 KiB」布局义务**（可达 ±2 GiB）；**PLT 内联去 8 字节数据槽**（`pltEntrySize` 24 → 16、链接器合成、无 opcode 改写）。**落纸** = `ADR-0019` 就地新增 **`D11`** + `ADR-0026` 就地修订 **`D5`/`D7`** + 契约同步（`.tao/contracts/contract-elf.md §2.2`/`§3.1`/`§3.2`、`.tao/contracts/contract-dynlink.md §2.2`/`§3`/`§4.3`/`§4.4`/`§10④`）。**⇒ 本条原「三候选待裁」的语义裁定已完成**（选「**只动发射形态**」：既**不改**已验收对象形态〔`ABS48` 保留〕、也**不改** ISA·ABI、也**不依赖**布局约束）。**`status` 保持 `open`** ✓（**实现未做**：lld `relocate`/`writePlt` + CodeGen GOT 3 条形态 + `DADAO.def`/向量排查 ⇒ 归 `LLVM-094t` / `INFRA-085t` 后续 `t` 任务；**待实现任务验证后**回填 `closed`）。**`resolved_by` 说明**：保持 `null`（未回填 `ADR-0028` ✗）——`check_issues.py` 断言「`open` ⇒ `resolved_by` 为 `null`」（`INFRA-080t` 门控），与「同时写 `resolved_by`」**不可兼得** ⇒ 以门控为准、设计 resolution 指针见本 notes；待实现验收回填 `closed` 时一并填 `resolved_by`。**边界**：本次**未改** `spec/`、未改 `components/**`、未改 `contracts/`（机器可读）、未开始实现。指针：`.tao/adr/adr-0028-got-plt-far-addressing.md`（`Accepted`）、`.tao/adr/adr-0019-dadao-relocation-types.md §D11`、`.tao/adr/adr-0026-dynamic-linking-behavior.md` `D5`/`D7` 修订。 **【`LLVM-094t` 侧已结（2026-10-16，architect 现场核）】** `LLVM-094t` 的剩余交付项（阶段 D「与契约逐条对齐」+ 阶段 C ①「两段式」）**均已结、且本条实现面全部前移**：D 随 `ADR-0028` 的契约同步完成（提交 `c893b61`：`ADR-0019` 就地新增 `D11` + `ADR-0026` 就地修订 `D5`/`D7` + `.tao/contracts/contract-elf.md §2.2` + `.tao/contracts/contract-dynlink.md §2.2`/`§3`/`§4.3`/`§4.4`/`§10④`/附录 A 逐节同步；与契约的两处实现差〔`R_DADAO_REL32` GOT 取址、PLT 内联 `16` B〕依 `ADR-0028 Consequences ④⑤` 归实现任务）；阶段 C ①（两段式 `ABS48` + `ldm.o_rrri_rb`）已由 `ADR-0028` 取代、**不再是 `LLVM-094t` 的交付项** ⇒ **实现归 `LLVM-095t`**（`.tao/tasks/llvm/LLVM-095t-REL32与PLT内联.md`；含 `DADAO.def` 编号 `REL32`=14 / `NUM`=15 与既有产物·向量排查）。本项 `status` **保持 `open`**（实现未做）——**待 `LLVM-095t` 实现验收后**回填 `closed` + `resolved_by: LLVM-095t`。 **【改线（2026-10-16，用户裁定）`ADR-0028` → `Superseded`】**：改走**恢复 `rela.si`**（含义参照 RISC-V `auipc`、编码 `0x5A`；用户原话「**现在就换！rela.si rbHA, imms18，含义参照risc-v的auipc，编码0x5A；刚才所作的任务回退**」）——`LLVM-095t` 阶段 A（`REL32`）已 `git revert`（提交 `f98f1d5`；阶段 B 未提交产出留档 `.work/log/llvm/LLVM-095t-B-reverted.diff`）、`ADR-0019 D11` 加「已撤」就地修订注记（`NUM` 回 `14`）、`.tao/contracts/` 契约回退、任务书改线（阶段划分 = **提案**，待**后继 ADR** 逐条确认后细化）。本项 `status` **保持 `open`** ✓（实现仍未做；`resolved_by` 仍 `null`；`ADR-0028` 已转 `Superseded`、后继 ADR 待起草）。**【跨模块时序红（2026-10-16，`SPEC-145t` 提交现场核）】**：`SPEC-145t` 恢复 `rela.si` 后 `make check`(L1) **rc=2**、**唯一红 = `check-instrinfo`**（`155/156` 条 M1 记录匹配 `.td` def —— 恰缺 `rela.si_riii_rb`），`check_lit_gen`（L2/`check-lit-full` 载体）同因缺该正例而红；性质同 `ISS-215`（契约先行 × 后端滞后、门控**未放宽**）⇒ **归 `LLVM-095t`**（其交付含该 `.td` def 与 lit 正例）；其余 L1 目标逐条 rc=0。 **【关闭（2026-10-17，architect 收尾）】**：2026-10-17：由 `ADR-0029` 定案 + `LLVM-095t` 实现验收 ⇒ 关闭。**据**：① **设计层** = `ADR-0029`（**`Accepted`**，2026-10-16 用户逐条确认）把 GOT/PLT 远距离取址收敛为「只动发射形态」——`aip.si`（`0x5A`）+ `ld.o` 两条形态、新增静态类型 `R_DADAO_PCREL_HI`=`14`/`R_DADAO_PCREL_LO`=`15`（`NUM`=`16`）、PLT 3 条/12 B 去槽、**取消「`.got` 贴 ±2 KiB」布局义务** ⇒ 本条原「无链接器可用 `rd` / 无宽相对重定位类型」的前置不可满足**不复存在**（不再需要把偏移算进 `rd`）；② **实现层** = `LLVM-095t`（`aip.si` 全链：MC/CodeGen 取址 2 条 + lld 消费 hi 舍入/lo 残差/配对回查/4 类硬失败 + PLT 12 B）**已由 reviewer `Accepted`**（三册收尾 2026-10-17），现场：默认布局 `ld.lld -shared` **rc=0**（原报 `R_DADAO_REL12 out of range: 65596`）、静态路径逐字节不回归。③ **门控/契约一致**：`check-patch-tree` 147 patches rc=0、L1 rc=0、`DADAO.def` PCREL_HI=14/PCREL_LO=15/NUM=16 ↔ `contract-elf.md §2.2` 逐行一致。⇒ `closed`、`resolved_by: LLVM-095t`（`check_issues.py` 断言：`closed` ⇒ `resolved_by` 非空，已满足）。"

