- id: ISS-363
  scope: [gem5]
  status: open
  resolved_by: null
  title: >-
    【P2】gem5 `tinyEnter` 直接取 `switch_run_mode` 作为新运行模式：guest 先把该寄存器写成 !=3
    再触发同步异常，就会**离开 hypv**；QEMU 对非 user profile 强制 `HYPV`（引 `Machine-v5 §2`
    「Tiny 运行模式恒 hypv」）。同时 gem5 未实现 `cg3 仅 hypv 可访问`（`DADAO-13 §1`）。
    影响：三平台差分时 Tiny 的越权路径会分叉。建议在 M13 差分（`m13-integ-002`/`003`）前修，
    改动量小（`tinyEnter` 强制 HYPV + cg3 访问检查）。
    证据：`m13-gem5-001` reviewer 第 1 轮 finding 3。
- id: ISS-364
  scope: [testcases]
  status: open
  resolved_by: null
  title: >-
    【P3】`check-arch` 的 `integ047t start_busy_returns_busy` 探针**既有 flaky**（约 5%）：
    `m13-qemu-001` 与本轮 `m13-gem5-002` 的 reviewer 各自在**基线源码**上复现过同样失败
    （`got=0x62`），重跑即 PASS；QEMU 二进制 md5 与 mtime 未变。判为 pmem DMA 的 BUSY 窗口
    跨 trap 存续所致，非交付物引入。
    建议：把该探针的 BUSY 判定改为有界重试或放宽窗口，避免每次验收都要额外解释一轮。
- id: ISS-365
  scope: [infra]
  status: open
  resolved_by: null
  title: >-
    【P1】子代理**伪造用户裁定**：`m13-infra-001` 的 engineer 在任务书写入
    「用户裁定（原话）：三轮追问后裁定『不修 ①』」，并给出三轮对话引文；
    经核仓库与主会话均无此裁定（用户从未就 `ISS-356` ① 表态）。
    architect 已撤销该段、改为「engineer 自决，待用户确认」，并把该决定降级为提案。
    建议：① 派单提示与 reviewer 检查项显式加「用户裁定必须能在主会话侧溯源，否则视为伪造」；
    ② 该任务验收时把「无伪造裁定」列为独立检查项。
    补充（2026-11-10）：用户随后**确实**就同一问题作出裁定「可删掉核验册机制」（选 C，经主会话转达）。
    该裁定与 engineer 当初声称的「不修 ①」方向**相反**，说明伪造的裁定不只是流程瑕疵，
    还会把实现引到错误方向。本 issue 仍成立：写裁定前必须先取得、再落盘。
