- id: ISS-266
  title: 【P3】`qemu-dadao` 在 4 个 `llvm-test-suite` 程序上以**宿主 SIGSEGV** 终止（SPASS / consumer-typeset / 8b10b / dbms）⇒ 归 qemu-user 面诊断
  status: open
  scope:
  - qemu
  blocks: []
  resolved_by: null
  notes: 【正式登记（源 = `TESTCASES-048t` 第 2 步全量两档现场，2026-10-18；engineer 登记，待 architect 立项）】**现象**：静态/动态两档一致 —— `qemu-dadao <elf> …` ⇒ driver `rc<0` → `blocked`，`reason=qemu killed by host signal 11`；`total` 计 blocked、不冒充 pass/fail。逐例：① `MultiSource/Applications/SPASS`（`qemu-dadao …/spass.elf small_problem.dfg -DocProof`，`combined.out` 0 B）；② `MultiSource/Benchmarks/MiBench/consumer-typeset`（`large.lout`，0 B）；③ `MultiSource/Benchmarks/VersaBench/8b10b`（`input.txt`，0 B）；④ `MultiSource/Benchmarks/VersaBench/dbms`（`dbms.train.in`，**先产出 18151 B 后崩**）。**性质（未定根因）**：宿主侧崩（非 guest 退出码）⇒ 可能是 qemu-user 的地址映射/信号路径/指令语义，**不预设**为测试缺陷；输入数据已按上游 `llvm_test_data` 就位（排除缺输入）。**与 `ISS-255` 同类**（qemu-user 宿主信号终止；`ISS-255` = libc-test 2 例 `SIGBUS`/`SIGTRAP`），本条为 `llvm-test-suite` 侧实例。**复现**：`python3 tools/testcases/run_llvm_ts_user.py --link-mode both --jobs 1 --timeout 300 --only 'SPASS$' --only 'consumer-typeset$' --only '8b10b$' --only 'dbms$' --work-dir /tmp/opencode/ISS-266`。**等级 = P3**（4 例、非阻断本册）。**证据指针**：`.work/log/testcases/llvm-ts-user-{static,dynamic}-{static,dynamic}.json`（`klass=blocked`/`reason`）、`.dadao/tests/llvm-ts-user/{static,dynamic}/<slug>/combined.out`、`.work/log/testcases/llvm-ts-user-both-rerun.log`。**交叉引用**：`ISS-255`（同类）、`QEMU-062t`（user-mode 后端）、`TESTCASES-048t`。 〔立册（2026-10-18，architect）〕归 `QEMU-063t`（4 例 `SIGSEGV` + `ISS-255` 2 例 + `unix-smail` 卡死同批诊断）。 〔追加（2026-10-18，architect 登记）〕同族第 5 例 = `MultiSource/Applications/lua`：静态档停 `bench/process.lua`（实测 666.9 s）、动态档停 `bench/meteor.lua`（375.2 s），两档同签名 `qemu killed by host signal 11`（driver `QEMU_SIGNAL_ISSUES` 指向 `QEMU-063t`；逐例表值 840 s 保留，便于崩在更晚处仍可观察）。**并入本号而非另立**：同签名（宿主 `SIGSEGV`、driver 仅记 `rc<0`）+ 同一诊断册 + 同一复现口径（`run_llvm_ts_user.py`）；证据指针 = `TESTCASES-050t` 完成区逐例对照与 `.work/log/testcases/llvm-ts-user-050t-*`。 〔逐例归因（2026-10-19，`QEMU-063t`，1–2 h 时间盒）〕① `dbms` = **已修**：原为 RASOF（`call` `0x27704`，`racnt=63`、`mrptr=0`）——linux-user 启动时未初始化 MemRAS（`ra0[47:0]=0`），调用链 >63 即 `SIGSEGV/ACCERR`；`QEMU-063t` 在 `init_main_thread` 预留 1 MiB MemRAS 并设 MRPTR ⇒ 静态/动态两档 **PASS**（oracle 逐字节一致）。② `consumer-typeset` = 同一 RASOF 根因（`call` `0x52884`）：修复后越过该点并输出 57 735 B，但随后在 guest `NULL+7`（`SIGBUS/BUS_ADRALN` 于 `cpu_mmu_lookup` 对齐检查）再次终止 ⇒ **未修完**，剩余面 = 另一处 guest 指针/对齐问题。③ `8b10b` = **语料**：`input.txt` 是 LE u32 词表，BE 目标读出 `k=0x380000`（首词 0x38 → 0x38000000），`lookupTable3B[k<<3]` 越界（si_addr `0x703ac78`，pc `0x21118`）；非 qemu 缺陷。④ `SPASS` = **guest NULL 解引用**（归属未定）：pc `0x51c70` 的 `ld.o rd4,[rd43+8]`，`rd43=0`；落点 = `cnf_OptimizedSkolemFormula` 内联 `cnf_StrongSkolemization` 的 `term_Delete(list_Top(newvariables))`（`cnf.c:3029-3035`），循环需删 2 个而 `newvariables` 仅 1 个 ⇒ 上游/后端值不一致，尚未判定哪一侧。⑤ `lua` = **时间盒内未诊断**（崩点 375–670 s），仅保留签名。证据：`.work/log/qemu/QEMU-063t-gdb-*.log`、`.work/evidence/QEMU-063t/`。`status` 保持 open。 〔M8 收口核对：`048t` 残余宿主信号 4 例（SPASS/consumer-typeset/8b10b/lua）逐条有根因或登记；不阻断 M8。〕 〔TESTCASES-054t 回填（2026-10-21，`/complete`；源 = 该册验收标准 8）〕**`lua` 实例不复现**——两档实测均 `pass`（静态 1135.37 s / 动态 1150.98 s，`run_timeout=1320`），md5 `6badfbeedd84d040f153876007407785` 命中 `lua.reference_output`，**无宿主信号**（原停 `bench/process.lua` / `bench/meteor.lua` 的 `SIGSEGV` 随 `QEMU-063t` 批次修复后不再出现；驱动 `QEMU_SIGNAL_ISSUES` 的 lua 条目已删）。**`unix-smail` 卡死面按实测闭合**——两档各 0.11 s 跑完、stdout 35 B byte-exact、exit 0，`QEMU-063t` 记录的 `/bin/sh` 缺失 ⇒ 10×`sleep(60)` 重试等待不复现。`status` **保持 open**（`SPASS` / `consumer-typeset` 等未终结实例仍在），`resolved_by` 保持 `null`。
- id: ISS-303
  title: "【P2】`-static-pie` 无法用 musl `libc.a` 链接：归档成员非 PIC ⇒ lld 逐条拒绝 `R_DADAO_ABS48`；仓库**未提供 PIC 版 `libc.a`**"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: INFRA-108t
  notes: "【正式登记（源 = `LLVM-120t` 完成区「新发现/坑 ①」+「遗留问题 ②」，2026-10-20；architect 提交时登记）】**现象（现场）**：`ISS-245` 修好后要验静态 PIE，按常规姿势 `clang -static-pie`（`libc.a` + `rcrt1.o`）**链不出** —— musl 的 `libc.a` 成员按**静态档（非 PIC）**编译，`-pie`/`-static-pie` 下 `__fini_array_start`/`__environ`/`__libc` 等符号的 `R_DADAO_ABS48` 被 `ld.lld` **逐条拒绝**（文案与本族一致：`relocation R_DADAO_ABS48 cannot be used against symbol '<sym>'; recompile with -fPIC`）。本次绕行（**非修法**）：探针改用 `build-musl-shared` 产出的 `obj/**/*.lo`（PIC 档）归档 + `-pie --no-dynamic-linker` + `rcrt1.o`，才得到**合法**静态 PIE（`base=0x555555550000`、`_DYNAMIC=0x55555557f4f8`、exit 7）。**根因**：仓库**只构建并安装一份 `libc.a`（非 PIC）**；PIC 归档仅以 `.lo` 中间产物留在构建树，既不入安装集也无归档级封装 ⇒ 用户以 `-static-pie` 链接任何依赖 libc 的程序必然链接期失败。**影响**：① `ISS-245`/`rcrt1.o` 的正确性**只能经内部 PIC 归档验证**，用户路径仍不可用（现状 = 不可用但报错清晰）；② 若将来把 `-static-pie` 纳入交付面，缺 PIC `libc.a` 是**前置缺口**；③ 与 `ADR-0025 D6` 的关系须**在册里判** —— 该 ADR 未把 `-static-pie` 列入 P1/P2/P3（`LLVM-120t` 只修 `rcrt1.o` 正确性、**未改**范围）；引入 PIC `libc.a` 等于**新增一条构建面**（安装集 + 体积 + 新鲜度门控）⇒ 属**范围决策**，须用户裁定，不得由实现笔自行扩面。**修法方向（未实施 ✗）**：① 增加 PIC 档标准库目标（如 `libc.a.pic`，成员取自 `obj/**/*.lo`）+ 安装集与 `check-musl-freshness` 同步；或 ② 显式声明 `-static-pie` 不支持并给**可判失败**（链接期或运行期显式报错）。取 ①/② 及是否纳入 P2/P3 须用户裁定。**等级 = P2**（不阻断 `LLVM-120t` 主判据：`rcrt1.o` 已改正且有独立 oracle；但属真实可用性缺口、可确定性复现）。**证据指针**：`LLVM-120t` 任务书完成区「验收结果 ②」「新发现/坑 ①」「遗留问题 ②」；`.work/evidence/LLVM-120t/run.sh`（探针链接命令 + PIC 归档取法，`.work/` 不入库）；`.work/source/musl/obj/lib/libc.a` vs `obj/**/*.lo`（构建产物，现场）。**交叉引用**：`ISS-245`（本笔动机）、`ADR-0025 D6`（`-static-pie` 未纳入 P1/P2/P3）、`contract-dynlink.md §6.2/§6.3`（静态 PIE 无 `AT_BASE` 的自举面）、`LLVM-120t`。**边界**：本笔**只登记** ⇒ 未改 `tools/**`/`Makefile`/`components/**` ✗、未改 ADR 决策 ✗、未改 `-static-pie` 范围口径 ✗。"
