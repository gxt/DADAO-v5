  resolved_by: null
  notes: "【正式登记（源 = `QEMU-066t` 完成区「遗留问题 ③」，2026-10-20；architect 提交时登记）】**现象**：`QEMU-066t` 未跑 `make install-host`（派单明令禁），engineer 改为把 `.work/build/qemu/{qemu-dadao,qemu-system-dadao}` 原子 `cp` 到安装根（只替换二进制、不重建/重装 LLVM），并核对安装根 md5 == 构建树 md5（`5e252eb736755ddc2ef8e502f29946ca`）后才跑门控。**风险**：`ISS-210` 的假绿形状是「门控读**旧安装根**、与旧生成物自洽」——绕过 `install-host` 即绕过其新鲜度保证；本次靠 md5 比对人工兜住，但该比对**不在 `install-host` 的机械门控里**，换人或换册易漏 ⇒ 假绿。**修法方向**：① 正常路径一律 `make install-host`（含 qemu 两步）；② 确需例外时，把「安装根 md5 == 构建树 md5」做成可复用检查（如 `tools/infra/check_install_freshness.py` 或并入既有新鲜度门控），使例外也机械可判；③ 在 `docs/Process-07` 门控分层里指明该检查的层级。**等级 = P3**（非本次缺陷；本次 md5 已实测一致、门控结论有效）。**证据指针**：`.tao/tasks/qemu/QEMU-066t-qemu-user线程缺口PI-futex-robust-取消.md` 完成区「验收结果」「遗留问题 ③」；`.work/evidence/QEMU-066t/run.sh` 的 `check_install_root`。**交叉引用**：`ISS-210`（门控读旧安装根假绿）、`INFRA-096t`（新鲜度门控）。**边界**：只登记；未改 `install-host` / 门控脚本。"
- id: ISS-301
  title: "【P2】`build-builtins` 的 re-stage 路径与 `check-builtins-freshness` 读取路径不一致（`Makefile:415` vs `383/384`）⇒ 重建后门控必红、须手工 `cp`；另 builtins 归档跨构建非字节确定"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: INFRA-098t
  notes: "【正式登记（源 = `LLVM-100t` 完成区「新发现/坑 ②③」+ engineer 自审 `F7`，2026-10-20；architect 提交时登记）】**现象①（路径不一致，确定可复现）**：`make build-builtins` 的 re-stage 目标是 `$(LLVM_BUILD)/$(BUILTINS_RESOURCE_PATH)`（`Makefile:415`）⇒ 实测落 `.work/build/llvm/lib/dadao-unknown-unknown-elf/libclang_rt.builtins.a`；而 `check-builtins-freshness`（`tools/infra/check_builtins_freshness.py:342`）与 `install-host`（`BUILTINS_ARCHIVE_DST` = `CLANG_RESOURCE_DIR`，`Makefile:364`/`384`）读/写 `.work/build/llvm/lib/clang/23/lib/dadao-unknown-unknown-elf/libclang_rt.builtins.a`。⇒ **重建 clang 后跑 `build-builtins` 不会刷新 clang 真正读的那份**，门控「build-tree clang copy」项**必红**（属必红、非假绿）。**本次处置 = 手工 `cp`** 两份（构建树资源目录 + 安装根）后才使 `check-builtins-freshness`/`check-musl-freshness` rc=0。**现象②（跨构建非字节确定）**：同一源码重建两次归档 sha256 不同（engineer 现场记录 `c96e…` → `fb1b…`，**未留日志**；本轮现盘 `cb77…`，三副本一致）⇒ 无法以「归档 sha 未变」判定不必重链 `libc.so`；成因未查（候选：`.comment`/成员时间戳/成员顺序/`llvm-ar` deterministic 模式/构建路径）。**影响**：①每次重建 clang 都需人工 `cp`，换人易漏（与 `ISS-300` 同类例外手法）；②确定性缺失使 builtins→`libc.so` 的重链判据只能靠 mtime/戳记而非内容。**修法方向**：① `Makefile:415` 改为 stage 到 `$(LLVM_BUILD)/lib/clang/$(CLANG_RESOURCE_VER)/$(BUILTINS_RESOURCE_PATH)`（与 `BUILTINS_ARCHIVE_DST`、checker 共用同一派生），或抽一个公共变量供三处引用；② 归档产出口径查成字节确定（先比两次重建的成员级 diff，定位 `.comment`/时间戳/顺序）。**等级 = P2**（不阻断本次验收：门控能抓住、本次已兜底；但每次改编译输入都会复发）。**证据指针**：`Makefile:364/383/384/415`；`tools/infra/check_builtins_freshness.py:342`；`check-builtins-freshness` 实跑（现盘 build product/build-tree clang/install root 三副本 sha256 = `cb7771e555112ab85ae54e223bf6819f195ffb128a2041acd1f8e87b172c7cf5`）；任务书 `.tao/tasks/llvm/LLVM-100t-__thread用户变量TLS-codegen.md` 自审 `F7` + 完成区「新发现/坑 ②③」。**交叉引用**：`ISS-293`（本门控立项源）、`ISS-210`（安装根新鲜度假绿）、`ISS-300`（例外手法应收编）、`INFRA-096t`（`build-builtins`/门控实现）。**边界**：只登记；未改 `Makefile`、未改门控脚本、未复跑重建（本轮按派单禁 `build-*`）。 〔INFRA-098t 收口（2026-10-21）〕① 路径：`make -n build-builtins` 与 `make -n install-host` 实测同源 —— stage dst = 构建树 `lib/clang/23/lib/dadao-unknown-unknown-elf/libclang_rt.builtins.a`、install dst = 安装根同一相对路径、checker 由同一 `-print-libgcc-file-name` 探测拆分（`BUILTINS_BUILD_DST` / `BUILTINS_ARCHIVE_DST` / checker）；不手工 `cp`，直接 `make build-builtins` 后 `check-builtins-freshness` rc=0（三份 sha 全等）⇒ 本项已在 `INFRA-096t`/`LLVM-121t` 轮收口，本轮只复核。② 确定性：连续 4 次「`ninja -t clean` + `make build-builtins`」归档 sha256 全为 `288bd83ef93fcd179a457d51eada2335c0f14eb6b5da479287e68c391ccf7c1e`（262082 B，r2↔r4 `cmp` 逐字节相同；成员头时间戳全为 1970、147 成员）⇒ 现行 clang/ar 组合下**可字节确定**；历史 `c96e→fb1b` 不可复现，未改 `ar`/编译参数。证据 `.work/evidence/INFRA-098t/`（`determinism.tsv` + `r2/r3/r4.a` + `run.sh` S7/S8/S11）。"

- id: ISS-303
  title: "【P2】`-static-pie` 无法用 musl `libc.a` 链接：归档成员非 PIC ⇒ lld 逐条拒绝 `R_DADAO_ABS48`；仓库**未提供 PIC 版 `libc.a`**"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `LLVM-120t` 完成区「新发现/坑 ①」+「遗留问题 ②」，2026-10-20；architect 提交时登记）】**现象（现场）**：`ISS-245` 修好后要验静态 PIE，按常规姿势 `clang -static-pie`（`libc.a` + `rcrt1.o`）**链不出** —— musl 的 `libc.a` 成员按**静态档（非 PIC）**编译，`-pie`/`-static-pie` 下 `__fini_array_start`/`__environ`/`__libc` 等符号的 `R_DADAO_ABS48` 被 `ld.lld` **逐条拒绝**（文案与本族一致：`relocation R_DADAO_ABS48 cannot be used against symbol '<sym>'; recompile with -fPIC`）。本次绕行（**非修法**）：探针改用 `build-musl-shared` 产出的 `obj/**/*.lo`（PIC 档）归档 + `-pie --no-dynamic-linker` + `rcrt1.o`，才得到**合法**静态 PIE（`base=0x555555550000`、`_DYNAMIC=0x55555557f4f8`、exit 7）。**根因**：仓库**只构建并安装一份 `libc.a`（非 PIC）**；PIC 归档仅以 `.lo` 中间产物留在构建树，既不入安装集也无归档级封装 ⇒ 用户以 `-static-pie` 链接任何依赖 libc 的程序必然链接期失败。**影响**：① `ISS-245`/`rcrt1.o` 的正确性**只能经内部 PIC 归档验证**，用户路径仍不可用（现状 = 不可用但报错清晰）；② 若将来把 `-static-pie` 纳入交付面，缺 PIC `libc.a` 是**前置缺口**；③ 与 `ADR-0025 D6` 的关系须**在册里判** —— 该 ADR 未把 `-static-pie` 列入 P1/P2/P3（`LLVM-120t` 只修 `rcrt1.o` 正确性、**未改**范围）；引入 PIC `libc.a` 等于**新增一条构建面**（安装集 + 体积 + 新鲜度门控）⇒ 属**范围决策**，须用户裁定，不得由实现笔自行扩面。**修法方向（未实施 ✗）**：① 增加 PIC 档标准库目标（如 `libc.a.pic`，成员取自 `obj/**/*.lo`）+ 安装集与 `check-musl-freshness` 同步；或 ② 显式声明 `-static-pie` 不支持并给**可判失败**（链接期或运行期显式报错）。取 ①/② 及是否纳入 P2/P3 须用户裁定。**等级 = P2**（不阻断 `LLVM-120t` 主判据：`rcrt1.o` 已改正且有独立 oracle；但属真实可用性缺口、可确定性复现）。**证据指针**：`LLVM-120t` 任务书完成区「验收结果 ②」「新发现/坑 ①」「遗留问题 ②」；`.work/evidence/LLVM-120t/run.sh`（探针链接命令 + PIC 归档取法，`.work/` 不入库）；`.work/source/musl/obj/lib/libc.a` vs `obj/**/*.lo`（构建产物，现场）。**交叉引用**：`ISS-245`（本笔动机）、`ADR-0025 D6`（`-static-pie` 未纳入 P1/P2/P3）、`contract-dynlink.md §6.2/§6.3`（静态 PIE 无 `AT_BASE` 的自举面）、`LLVM-120t`。**边界**：本笔**只登记** ⇒ 未改 `tools/**`/`Makefile`/`components/**` ✗、未改 ADR 决策 ✗、未改 `-static-pie` 范围口径 ✗。"
