  notes: 【正式登记（源 = `TESTCASES-048t` 第 2 步全量两档现场，2026-10-18；engineer 登记，待 architect 立项）】**现象**：静态/动态两档一致 —— `qemu-dadao <elf> …` ⇒ driver `rc<0` → `blocked`，`reason=qemu killed by host signal 11`；`total` 计 blocked、不冒充 pass/fail。逐例：① `MultiSource/Applications/SPASS`（`qemu-dadao …/spass.elf small_problem.dfg -DocProof`，`combined.out` 0 B）；② `MultiSource/Benchmarks/MiBench/consumer-typeset`（`large.lout`，0 B）；③ `MultiSource/Benchmarks/VersaBench/8b10b`（`input.txt`，0 B）；④ `MultiSource/Benchmarks/VersaBench/dbms`（`dbms.train.in`，**先产出 18151 B 后崩**）。**性质（未定根因）**：宿主侧崩（非 guest 退出码）⇒ 可能是 qemu-user 的地址映射/信号路径/指令语义，**不预设**为测试缺陷；输入数据已按上游 `llvm_test_data` 就位（排除缺输入）。**与 `ISS-255` 同类**（qemu-user 宿主信号终止；`ISS-255` = libc-test 2 例 `SIGBUS`/`SIGTRAP`），本条为 `llvm-test-suite` 侧实例。**复现**：`python3 tools/testcases/run_llvm_ts_user.py --link-mode both --jobs 1 --timeout 300 --only 'SPASS$' --only 'consumer-typeset$' --only '8b10b$' --only 'dbms$' --work-dir /tmp/opencode/ISS-266`。**等级 = P3**（4 例、非阻断本册）。**证据指针**：`.work/log/testcases/llvm-ts-user-{static,dynamic}-{static,dynamic}.json`（`klass=blocked`/`reason`）、`.dadao/tests/llvm-ts-user/{static,dynamic}/<slug>/combined.out`、`.work/log/testcases/llvm-ts-user-both-rerun.log`。**交叉引用**：`ISS-255`（同类）、`QEMU-062t`（user-mode 后端）、`TESTCASES-048t`。 〔立册（2026-10-18，architect）〕归 `QEMU-063t`（4 例 `SIGSEGV` + `ISS-255` 2 例 + `unix-smail` 卡死同批诊断）。 〔追加（2026-10-18，architect 登记）〕同族第 5 例 = `MultiSource/Applications/lua`：静态档停 `bench/process.lua`（实测 666.9 s）、动态档停 `bench/meteor.lua`（375.2 s），两档同签名 `qemu killed by host signal 11`（driver `QEMU_SIGNAL_ISSUES` 指向 `QEMU-063t`；逐例表值 840 s 保留，便于崩在更晚处仍可观察）。**并入本号而非另立**：同签名（宿主 `SIGSEGV`、driver 仅记 `rc<0`）+ 同一诊断册 + 同一复现口径（`run_llvm_ts_user.py`）；证据指针 = `TESTCASES-050t` 完成区逐例对照与 `.work/log/testcases/llvm-ts-user-050t-*`。 〔逐例归因（2026-10-19，`QEMU-063t`，1–2 h 时间盒）〕① `dbms` = **已修**：原为 RASOF（`call` `0x27704`，`racnt=63`、`mrptr=0`）——linux-user 启动时未初始化 MemRAS（`ra0[47:0]=0`），调用链 >63 即 `SIGSEGV/ACCERR`；`QEMU-063t` 在 `init_main_thread` 预留 1 MiB MemRAS 并设 MRPTR ⇒ 静态/动态两档 **PASS**（oracle 逐字节一致）。② `consumer-typeset` = 同一 RASOF 根因（`call` `0x52884`）：修复后越过该点并输出 57 735 B，但随后在 guest `NULL+7`（`SIGBUS/BUS_ADRALN` 于 `cpu_mmu_lookup` 对齐检查）再次终止 ⇒ **未修完**，剩余面 = 另一处 guest 指针/对齐问题。③ `8b10b` = **语料**：`input.txt` 是 LE u32 词表，BE 目标读出 `k=0x380000`（首词 0x38 → 0x38000000），`lookupTable3B[k<<3]` 越界（si_addr `0x703ac78`，pc `0x21118`）；非 qemu 缺陷。④ `SPASS` = **guest NULL 解引用**（归属未定）：pc `0x51c70` 的 `ld.o rd4,[rd43+8]`，`rd43=0`；落点 = `cnf_OptimizedSkolemFormula` 内联 `cnf_StrongSkolemization` 的 `term_Delete(list_Top(newvariables))`（`cnf.c:3029-3035`），循环需删 2 个而 `newvariables` 仅 1 个 ⇒ 上游/后端值不一致，尚未判定哪一侧。⑤ `lua` = **时间盒内未诊断**（崩点 375–670 s），仅保留签名。证据：`.work/log/qemu/QEMU-063t-gdb-*.log`、`.work/evidence/QEMU-063t/`。`status` 保持 open。 〔M8 收口核对：`048t` 残余宿主信号 4 例（SPASS/consumer-typeset/8b10b/lua）逐条有根因或登记；不阻断 M8。〕
