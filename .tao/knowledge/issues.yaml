  notes: "【正式登记（源 = `QEMU-060t` `/complete` 收尾现场，主会话实跑留档；architect 提交/文件集审核时立项，2026-10-16）】**现象（假 FAIL，现场）**：`/complete` 收尾时 **`L2`（`make check-modules`）与 `L3`（`make check-full`）在同一工作树内并发运行**（留档 mtime 重叠 = `QEMU-060t-complete-L3-run1-FAIL.log` 00:12:44、`QEMU-060t-complete-L2.log` 00:13:14）⇒ `L3` 首跑 **`L3_EXIT=2`**、Embench **`Results: 37/38 passed, 1 failed`**；**现场观察**失败例 = `matmult-int (-O0)` 编译报 **`stddef.h not found`**（**口径披露**：该逐例明细**未落入留档日志** —— 留档 `QEMU-060t-complete-L3-run1-FAIL.log` 只保全量汇总行 + 末尾 5 条 PASS；`matmult-int` 明细来自现场观察、**重跑不可复现**）⇒ 判**环境竞争所致的假 FAIL**，非产品缺陷。**排除证据（与 `L2` 错开后单跑）**：单跑 `L3` ⇒ **`L3_EXIT=0`**、**`Results: 38/38 passed, 0 failed`**（`QEMU-060t-complete-L3.log`，00:16:15）⇒ 38 例逐例命中、无残留失败；同轮 `L2` 独立 **`L2_EXIT=0`**（`picolibc-tests: stage=fast total=20 pass=18 fail=0 excluded=2`）、`L1b` = `repository checks (L1): PASS`。**根因**：`L1`/`L2`/`L3` 与 `install-host` 共用同一工作树的 `.work/build/*`、安装根（`install-host` 写入 `$(HOST_TOOLCHAIN_BIN)`/`$(HOST_TOOLS_BIN)`，即 `.dadao/cross-toolchain/bin`）与 SDK 产物目录 ⇒ 并发时一方正在写入，另一方的编译**读到瞬态不完整的安装根**（缺内置头文件）⇒ 假 FAIL。**归因依据（既有文字，非本次新发现）**：`Makefile:307-311` 的 `NOTE (concurrency)` 已明写 —— 只有 `install-host` 的**写入**被做成 race-safe（`INFRA-053t`，源自 `ISS-172`）；而在一个工作树内并发跑 **gate** targets（`test-elf`/`test-semihost`/`check`/…）**仍 UNSUPPORTED**（它们共享 build trees 与 SDK artifact dirs；参见 `AGENTS.md`「并行任务上限」；**Run them serially**）⇒ **本 issue = 该 UNSUPPORTED 留白的现场命中**（`ISS-172` 修的是**写侧**竞争，本次暴露的是**读侧**竞争）。**对策（建议，不阻塞）**：明确纪律 —— **同一时间只运行一个会写 `.work/build` / 安装根（`.dadao/`）/ SDK 产物目录的门控**（`L1`/`L2`/`L3` 与 `install-host` 互斥；亦与 `AGENTS.md`「长任务一次只跑一个」一致）⇒ **落点 = 把该纪律写入门控文档**：`AGENTS.md`（「长任务」或「并行任务上限」条）**或** `docs/Process-07-门控分层规范.md`（现状仅由 `Makefile` 注释承载，不构成可执行约束）。可选强化（另议）：对该类 target 加 `flock` 互斥（可机械判）。**`status` 取 `open`（architect 判断）**：① 缺口**仍在**（纪律未入门控文档）；② **可复发**（任一并发跑门控的场景，尤其多子代理并行 ⇒ 与 `AGENTS.md`「并行任务上限 ≤8」现实叠加）；③ **部分可判**（`flock` 可机械判；文档纪律靠评审）。**性质** = 门控/流程缺口（**非**交付物功能缺陷；`QEMU-060t` 判据内已由单跑复验闭环）。**边界**：本笔**未改** `tools/**`、未改 `Makefile`、未改 `AGENTS.md`、未改 `docs/**`（只登记 + 给落点建议）。证据指针：`.work/log/qemu/QEMU-060t-complete-{L3-run1-FAIL.log,L3-run1-FAIL.EXIT,L3.log,L3.EXIT,L2.log,L2.EXIT}`、`.work/log/qemu/QEMU-060t-complete-L1b.log`（本机留档，不入库）；`Makefile:307-311`（NOTE concurrency）、`Makefile:298-305`（`atomic-install`/`ISS-172`）；`AGENTS.md`「长任务（长构建 / 长命令）」「并行任务上限」。**交叉引用**：`ISS-210`（同属「安装根 × 构建树一致性」面，但那条是**同步缺失**、本条是**并发竞争**）、`ISS-172`（已归档闭环：`install-host` **写侧**竞争；`.tao/archive/M6/issues-closed.md`）、`docs/Process-07`（建议落点）、`QEMU-060t`（现场）。"
