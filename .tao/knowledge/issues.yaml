  notes: "【正式登记（源 = `ADR-0029` 起草笔的 `docs/Process-01 §7` 重放现场；architect 独立复现后立项，2026-10-16）】**现象（现场，只读；仓库根 `master` = `05792c4`、工作树干净）**：`python3 tools/infra/apply_series.py` ⇒ rc = **1**；输出依次 = `llvm-project` / `qemu` / `embench-iot` / `picolibc` 四行 `apply-series: <name> already applied (base+1, matches patches); skipped`，随后 `Traceback (most recent call last): ... File \"tools/infra/apply_series.py\", line 108, in main / patches_dir = ROOT / component[\"patch_dir\"] / KeyError: 'patch_dir'`。**根因**：`tools/infra/apply_series.py` 的 `main()`（行 101 起）**无条件**读 `component[\"patch_dir\"]` / `component[\"patch_series\"]`（行 108/109），**未处理 `patchless = true`**；而 `manifests/components.lock.toml` 现行有 **4 个 `enabled = true` 的 patchless 组件**（`chipyard` / `linux` / `llvm-test-suite` / `libc-test`），其中 `chipyard` 的源已 fetch（`.work/source/chipyard/.git` 存在 ⇒ 不走行 105 的 `missing source` 分支）⇒ 行 108 直接 `KeyError`。**同仓其它工具已正确处理 `patchless`（⇒ 本项是 `apply_series.py` 的单点漏）**：`tools/infra/manifest_check.py:45-52`（并断言「`patchless` 组件**不得**声明 `patch_dir`/`patch_series`」）、`tools/infra/check_patch_tree.py:310/360`（`patchless; skipped`）。**影响**：① `make apply-series`（`Makefile:151`）与 `make prepare`（`= fetch apply-series`，`Makefile:154`）在**当前 lock 下确定性失败**；② 中断点在 `chipyard`，而 `musl`（carries 补丁集）在 manifest 中**位于其后** ⇒ 该轮 `musl` 补丁集**不会被应用**（干净环境下 `make fetch && make apply-series` 后 `musl` 补丁集缺失，连带影响依赖它的构建目标）；③ 现状被「源树已收敛为 `base+1`」掩盖（四行 `skipped` 之后的 `KeyError` 不改变已收敛结果）⇒ 易漏看。**修法建议（未实施 ✗）**：`main()` 循环内在访问 `patch_dir`/`patch_series` **之前**加 `if component.get(\"patchless\"): print(f\"apply-series: {name} patchless; skipped\"); continue`（与 `check_patch_tree.py` 用词对齐）；可选配套「`patchless` ⇒ 两字段必须缺席」断言（复述 `manifest_check.py:52` 既有约束）。**边界**：**非本线引入** ✗（与 `rela.si` / `REL32` 改线无关，只是在 `ADR-0029` 起草笔的 `Process-01 §7` 重放中**现场触发**）；本项**只登记** —— 未改 `tools/**`、未改 `manifests/**`；`status` 取 `open` 的依据 = 缺陷仍在、`make apply-series` 可确定性复发、需改工具（`resolved_by` 保持 `null`，`open` 时不得填非空）。**现场留存**：复现命令 `python3 tools/infra/apply_series.py`（rc=1）；原生日志 = `/tmp/opencode/ADR-0029/apply_series-repro.log`（临时目录；单条命令可复现）。**复现前提（写清以免误判）**：`chipyard` 源存在（`.work/source/chipyard/.git`）且该组件 `enabled = true`；各 patch 组件均已 `base+1`（否则会先走 `refusing to apply` / 应用补丁分支，不走到本 `KeyError`）。"

- id: ISS-232
  title: "【P3】`llvm-mc --show-encoding` 对低半 `%pcrel_lo`（`rbha ≥ 4`）命中上游断言 ⇒ SIGABRT（rc=134）；**仅显示模式**（`-filetype=obj` 不受影响）；修法触及被 `check_mc` A7 与契约 §2.2 钉住的 fixup 元数据表 ⇒ **须裁定**"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `LLVM-095t`「遗留① 修复」完成区「新发现②」+ 收尾复核块 ②；architect 提交/文件集审核时立项并**现场复现复核**，2026-10-16）】**现象（现场复现，rc=134）**：`echo 'ld.o rb4, [rb4, %pcrel_lo(.Lhi0)]' | llvm-mc --triple=dadao-unknown-elf --show-encoding` ⇒ **SIGABRT**（signal=6，**rc=134**）；文案**逐字** = `llvm-mc: …/llvm/lib/MC/MCAsmStreamer.cpp:134: void llvm::MCAsmBaseStreamer::addEncodingComment(…): Assertion `Bit == 0 && \"Encoder wrote into fixed up bit!\"' failed.`。**触发条件**：低半（`%pcrel_lo`）且目的 `rbha ≥ 4`（`clang` 默认的 `rb4` 即命中）；同文本换 `rb1`（`rbha < 4`）⇒ **rc=0** 且正常打印 `… fixup A - offset: 0, value: %pcrel_lo(.Lhi0), kind: DADAO_FK_PCREL_LO`。**只影响该显示模式** ✗：`-filetype=obj` 同内容 **rc=0**，且 `llvm-readobj -r --expand-relocs` 得**两条**记录（`R_DADAO_PCREL_HI (14)` @`0x0` + `R_DADAO_PCREL_LO (15)` @`0x4`，LO symbol = `.text` 节符号）⇒ 目标文件产出**不受影响**。**根因（现场判据）**：`MCFixupKindInfo` 的 `{Offset 0, TargetSize 12}` 与 streamer 在**大端**下的 **MSB-first** `FixupMap` 位序不符 —— 映射落到 opcode / `rbha` 位（需在已设 `Bit` 处再写 ⇒ 断言）。**修法触及被钉住的载体**：须动 `components/llvm-project/patches/…/DADAOAsmBackend.cpp` 的 fixup 元数据表，而该表被 `check_mc.py` 的 `A7`（「字段宽 18/12」）与 `.tao/contracts/contract-elf.md §2.2` 引用同时钉住 ⇒ **须架构师 / 用户裁定**（可能连带改 `A7` 断言与契约叙述），**不擅自改** ✗。**`status` 取 `open`（architect 判断）**：① 缺陷**仍在**（现场 rc=134 复现）；② **可复发**（任一 `rbha ≥ 4` 的低半 `--show-encoding`，含 `clang -S` 打印文本回流）；③ **须裁定**（修法跨 `A7` 门控 + 契约引用）。**性质** = 显示模式缺陷（**非** `LLVM-095t` 交付面缺陷 —— 其交付判据 = `%pcrel_*` 可解析 + 文本往返逐字节 + 对象两条记录，均已交付并留证；本项为**同笔发现、按裁定不修**）。**边界**：本笔**未改** `components/**`、未改 `contracts/`、未改 `.tao/contracts/**`（只登记 + 给触发条件 / 影响面 / 修法边界）。证据指针：`.tao/tasks/llvm/LLVM-095t-REL32与PLT内联.md`「遗留① 修复 完成记录」→「新发现/坑 ②」+「遗留问题 ②」+「收尾遗留处置 完成记录」§②；`.tao/tasks/qemu/QEMU-061t-rela-si解码与语义.md`「收尾遗留处置…」§④；`.work/log/llvm/QEMU-061t-show-encoding-recheck.log`（本机留档，不入库）；`tests/llvm/lit/MC/DADAO/pcrel-specifier.s` L19–24（注释明写该显示模式缺陷 + 低半改走 `-filetype=obj`）；现场工具 = `.dadao/cross-toolchain/bin/llvm-mc`（md5 `59f5b7f20780bcc0618880aaebcb0b75`）。**交叉引用**：`ISS-210`（安装根 × 构建树一致性：本项判定以**已安装根**为准）、`LLVM-095t`（发现者）、`contract-elf.md §2.2`（`14`/`15` 两行 + `imms18`/`imms12` 字段）。"

