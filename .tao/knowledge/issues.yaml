- id: ISS-222
  title: "【P2】musl 静态移植暴露的 LLVM 后端缺口 4 类（`INFRA-082t` A2+A3 实测）：`%N` 无法代入 inline asm / 任何 `\"m\"` 操作数 ⇒ ISel 崩（同根因已登记 `ISS-197`）/ 缺 `rotl`·`rotr`·`bswap` 的 ISel 选择（ISA 侧 `rev`·`ctlz`/`cttz`/`ctpop` 已在）/ `dynamic_stackalloc` 缺失"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `INFRA-082t` 阶段 A2+A3 完成区「新发现/坑」①②③ + 「遗留问题 ②」= 现场实测；architect 提交/文件集审核时立项，2026-10-15）】**性质 = 后端缺能力的消费侧暴露**（`INFRA-082t` = musl 静态最小集移植，本项在其范围外 ⇒ **未并入该任务** ✗；`P2`）。**逐条（引 engineer 现场）**：**① `%N` 无法代入 inline asm** —— clang 的 DADAO target 代入结果为空串（现场：`rb2rd %0, rb3, 1` → `rb2rd , rb3, 1`）⇒ 本端口 inline asm **一律只写字面寄存器名** + C 侧「局部寄存器变量」绑定（`register … __asm__(\"rd8\")` + `\"=r\"(x)`）。**缺能力，非静默错码**。**② 任何 `\"m\"`/`\"+m\"` 操作数 ⇒ 后端 ISel 崩**（`Could not match memory address. Inline asm failure!`；最小复现 `void f(void){int x;__asm__(\"\" : \"+m\"(x));}`）—— **⚠ 严重性最高**（musl 内联汇编常见）。`INFRA-082t` 现场：全树唯一用户 `ldso/dlstart.c` 的 `GETFUNCSYM` **必须** arch 覆盖（musl 给 arch 留的口子，12 个 arch 均如此），否则整树编不过；且 `--disable-shared` 下 `crt/rcrt1.o` 仍必编（含 `dlstart.c`）。**同根因者已登记 = `ISS-197`**（`LLVM-086t` reviewer 第 1 轮发现 + architect 独立复现；`rc=134`(SIGABRT) + core，`clang -c` 驱动 rc=1）⇒ **本条不重复立案**，仅作 **musl 视角的再确认 + 消费侧量化**（`ISS-197` 记的暴露面 = 「picolibc 源 0 处用 `\"m\"`、无 test 暴露」；musl 侧出现**真实用户** `dlstart.c`）。**③ 缺 `rotl`/`rotr`·`bswap` 的 ISel 选择** ⇒ `Cannot select`，musl 侧 13 个源不可编译（排除面见 `ISS-223`）。**⚠ 与 `INFRA-078t` 的缺口清单区分**：**ISA 侧能力已存在**（`rev.{o,t,w,b}` = `ADR-0012 D10`，已由 `SPEC-142t` 落地；`ctlz`/`cttz`/`ctpop` = `D11`，已由 `SPEC-143t` 落地）⇒ 本项属**后端未接**（ISel / 指令选择未注册），**不是** ISA 缺指令、也不是 compiler-rt builtins 的 libcall 面。`bswap` 面与 `ISS-193(c)`（i64 `bswap`，picolibc 侧 1 源）**同根因**（`INFRA-078t` 把 `bswap` 归「后端发不出」）。**④ `dynamic_stackalloc` 缺失**（`alloca`/VLA）⇒ `Cannot select`；musl 侧 `exec*` 族 / `getcwd` / `res_msend` 等由此受阻。**阻塞性（如实）**：**未阻塞阶段 A3** —— A3 已**编出静态 ELF**（`ELF64 / ELFDATA2MSB / ET_EXEC / e_machine=0x0DA0 / 无 PT_INTERP`、反汇编含 `trap cfx0, 0`）；但 **阶段 B（`hello`/`exit` E2E + 独立 oracle + 大端例）若触发上述任一项 ⇒ 阻塞**。**处置建议**：由**后续 LLVM 模块任务**承接（修掉即可**解锁 13 源** + 简化 `GETFUNCSYM`），**不并入 `INFRA-082t`** ✗。证据指针：`.tao/archive/M8/infra/INFRA-082t-musl静态最小集移植.md`「完成区·阶段 A2+A3」新发现/坑①②③ + 遗留② + 「## 阶段 A2+A3 遗留」；`components/musl/README.md`（§后端缺口过滤 / §inline asm 口径）；`.work/log/musl/`、`.work/evidence/INFRA-082t/run-a23.sh`（本机留档，不入库）。**交叉引用**：`ISS-197`（`\"m\"` ISel 崩）、`ISS-193`（`bswap`/谓词等消费侧剩余面）、`INFRA-078t`（builtins 缺口预研，**清单区分见 ③**）。**〔P2 消费侧再确认（2026-10-17，`INFRA-085t` 阶段 A1）〕**：本条 **④（`dynamic_stackalloc` 缺失）**又新增**第 14 个消费侧实例**，且**比静态档更硬**——`ldso/dynlink.c`（**共享库必需**）在 `__dls2` 里有 **VLA** `size_t addends[symbolic_rel_cnt+1]`（现场 `ldso/dynlink.c:1752`；上界由 `ADDEND_LIMIT`（L133 = `4096`）+ L1751 的 `a_crash()` 保证）⇒ `clang -c` 直接 **rc≠0**：`fatal error: error in backend: Cannot select: t66: ch = stackrestore t65, t5`（`t5: i64,ch = stacksave t0`）——**加不加 `-fPIC` 都失败**（现场两轮实测：`-fPIC` 走 `.lo`、无 `-fPIC` 走 `.o`，**同签名**）⇒ 它**不只挡 `INFRA-085t` 阶段 A1 的 `libc.so`，也挡阶段 C1 的 `ldso` 真接入**（`ldso/dynlink.c` 是 `LDSO_OBJS` 的唯一来源；`_dlstart_c`/`__dls2`/`__dls3` 的**唯一定义处**，`ldso/dlstart.c:161` 只做 `GETFUNCSYM(&dls2, __dls2, …)`）。**⚠ 与 ③ 同族的排除法在此不可用**：静态档的 13 源排除（`ISS-223`）是把源**从库中剔除**；`dynlink.c` 一旦剔除即**没有 ldso**（且 `__syscall_cp_asm` 等另有缺口，见 `ISS-242`）⇒ 只能**修后端**（或按「有界 VLA ⇒ 定长数组」走**语义裁定**，本笔**未动** ✗）。**证据指针**：`.work/log/infra/INFRA-085t-evidence/s3-shared-build.log`（`make build-musl-shared` 的 `make[1]: *** [Makefile:159: obj/ldso/dynlink.lo] Error 1` + 上述签名）、`/tmp/opencode/INFRA-085t/dynlink.nopic.o`（无 `-fPIC` 复现）。**交叉引用**：`INFRA-085t`（登记源）、`ADR-0025 D3`（`ld.so` = musl 自带 ldso ⇒ 该源不可绕）。〔2026-10-17：③ 的 `bswap` 面已从 `INFRA-079t` 大排期中**提前抽册**（阻断 `INFRA-085t` 阶段 A1 的 `-O1` 以上出口判据；四档 `-O1`/`-Og`/`-Os`/`-O2` 现场均 `Cannot select: i64 = bswap`）⇒ 落点 = **`LLVM-097t`**（`status` 不变）〕"
- id: ISS-223
  title: "【P3】musl 移植**显式排除 13 个源文件**（`arch/dadao/arch.mak`）⇒ `crypt()`/`crypt_r()`、`exec*` 族、`getcwd`、`sigdelset`、`.mo` 本地化、`getgr*`、resolver 在**链接期显式失败**（不静默）"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `INFRA-082t` 阶段 A2+A3 完成区「新发现/坑 ③」+「遗留问题 ③」+ `components/musl/patches/arch/dadao/arch.mak.patch` = 现场实测；architect 提交/文件集审核时立项，2026-10-15）】**事实**：musl 端口用 **per-arch Makefile 钩子** `arch/dadao/arch.mak`（musl 的 `-include $(srcdir)/arch/$(ARCH)/arch.mak` 在 `BASE_SRCS` 之后，**上游认可位、无需改上游 `Makefile`**）以 `BASE_SRCS := $(filter-out …)` **显式排除 13 个源文件**，并每次构建 `$(info …)` 打印 ⇒ 排除**从不隐形**。**根因** = **LLVM 后端缺 ISel 能力**（`rotl`/`rotr`、`bswap`、`dynamic_stackalloc` ⇒ `Cannot select`），**非 libc 端口问题**（后端缺口见 `ISS-222`）；形态与 picolibc 端口的后端受阻源过滤**同源**（`INFRA-066t` / `ISS-193`）。**13 源（现场，按 `arch.mak` 注释的失败节点分组）**：`rotl`/`rotr` = `src/crypt/crypt_sha512.c`、`src/signal/sigdelset.c`；`bswap` = `src/locale/__mo_lookup.c`、`src/locale/dcngettext.c`、`src/passwd/getgrouplist.c`、`src/passwd/nscd_query.c`；`dynamic_stackalloc`（alloca/VLA）= `src/process/{execl,execle,execlp,execvp}.c`、`src/unistd/getcwd.c`、`src/network/res_msend.c`；**另 1 条** `src/passwd/getgr_a.c`（在过滤变量与 README 的 13 条之列，但 **`arch.mak` 注释未标注其失败节点**）。**⚠ 现场计数不一致（如实登记，非阻断）**：`arch.mak` 注释块 = **12** 条 `src/…`（`grep -c` 现场），过滤变量 `DADAO_BACKEND_BLOCKED_SRCS` = **13** 条，README 述 **13** ⇒ **注释少 1 条（`getgr_a.c`）**；影响面 = 「逐条复检/移除」时该条**无失败签名可依**（其余 12 条可据注释直接重跑核验）。**影响面（显式失败，非静默）**：这些文件**不在** `libc.a` ⇒ 用到即**链接期失败**：`crypt()`/`crypt_r()`（`crypt_r.o` 引用被排除的 `__crypt_sha512`，`nm` 实测 `U __crypt_sha512`）、`exec*` 族、`getcwd`、`sigdelset`、`.mo` 本地化（`__mo_lookup`/`dcngettext`）、`getgrouplist`/`getgr_a`、`nscd_query`、resolver（`res_msend`）。**均不可达 `P1` 静态最小集**（`write` + `exit`）⇒ **未阻塞阶段 A3**（已编出静态 ELF）。**处置建议**：① 待 `ISS-222` 的后端缺口（`rotl`/`rotr`/`bswap`/`dynamic_stackalloc` 的 ISel 选择）收口后**逐条删排除项**（注释已带失败节点，便于复检与移除；重建 + `check-patch-tree` 核对）；② **或**对确不适用者（如 resolver / `nscd_query` 在「无内核」下本无服务）**明确声明不支持**（写入 `components/musl/README.md`「已知边界」）—— **二者择一，勿悬空**；③ **建议落点 = `infra` 侧小任务**（`ISS-222` 收口后触发）。**`status` 取 `open`（architect 判断）**：① 排除面**仍在**（未补齐、未声明不支持）；② **可复发语境** = 后端补上能力后需回删该表；③ **无机械门控可判**（「源被排除」= 构建编排的显式选择，非可测断言）。证据指针：`.tao/archive/M8/infra/INFRA-082t-musl静态最小集移植.md`「完成区·阶段 A2+A3」坑③ + 遗留③ + 「## 阶段 A2+A3 遗留」；`components/musl/patches/arch/dadao/arch.mak.patch`（注释块 12 条 vs 过滤变量 13 条）；`components/musl/README.md`（§后端缺口过滤 / §已知边界）；`.work/log/musl/`（构建期 `$(info …)` 输出）。**交叉引用**：`ISS-222`（后端缺口 4 类，本条之根因）、`ISS-193`（picolibc 侧同类过滤表）、`INFRA-066t`（过滤表形态先例）。"
- id: ISS-224
  title: "【P3】`make apply-series` 对 `patchless` 组件报 `KeyError: 'patch_dir'`（rc=2；既有缺陷）"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `QEMU-060t` 完成区「新发现/坑 ①」；architect 提交/文件集审核时立项并**现场复跑复核**，2026-10-15）】**现象（现场复现，rc=2）**：`tools/infra/apply_series.py` 的组件循环**先取补丁路径、后无 `patchless` 判断**，而 `patchless` 组件按 `manifests/components.lock.toml` 约定**只许缺省 `patch_dir`/`patch_series`**（`tools/infra/manifest_check.py:45-53` 显式拒绝二者与该标记并存）⇒ 循环走到**首个 enabled 的 `patchless` 组件（现场 = `chipyard`；`linux`/`llvm-test-suite`/`libc-test` 同类）**时 `component['patch_dir']` 抛 `KeyError`（**现场定位 = `tools/infra/apply_series.py:108`**；紧随的第 109 行 `patch_series` 同病）。**rc=2**；`make` 报错点 = `Makefile:151` 目标 `apply-series`（依赖 `manifest-check`），现场报 `make: *** [Makefile:151: apply-series] Error 1`。**复现命令（现场，2026-10-15）**：`make apply-series` ⇒ 前 4 个非 `patchless` 组件（llvm-project/qemu/embench-iot/picolibc）打印 `already applied (base+1, matches patches); skipped`（**幂等无副作用**）后即崩于 `chipyard`，traceback 终点 `KeyError: 'patch_dir'`、**rc=2**（输出留 `.work/log/qemu/QEMU-060t-apply-series.log`）；**隔离复现**（`LLVM-091t` 已做）= 仅 `chipyard` 的临时 manifest ⇒ 同一 `KeyError`（rc=1）。**首次有记录遇到 = 2026-10-14（`LLVM-091t` 升级期间）**：其任务书「完成区·遗留问题①」与「第 1 轮 reviewer 验收」已如实登记（该脚本不在改动集 ⇒ 判**既有缺陷、与本升级无关**，并给修法建议）；现场日志 `.work/log/llvm/LLVM-091t-apply-series.log`（2026-10-14 12:13）与 `.work/log/llvm/apply-series.log`（2026-10-14 17:22）为同一 traceback。**旁证（非「首次」）**：更早的 `QEMU-040t`/`QEMU-053t`/`LLVM-064t` apply-series 日志**无**该 traceback（当时 enabled 集内尚无 `patchless` 组件）⇒ 缺陷随 `patchless` 组件进入 enabled 集而暴露。**影响**：① 组件按序落补丁的**统一入口**（`make apply-series`）在**任一** `patchless` 组件 enabled 时**不可用**；② `make prepare` = `fetch apply-series`（`Makefile:154`）⇒ **同崩**，从零准备源树的主路径须绕过（`docs/Process-01 §7` 文档化恢复步骤）；③ **但不阻断** —— `patchless` 组件**本就无补丁可应用**（`ADR-0024 D1`），绕过无损失：现场重放（`git -C .work/source/qemu reset --hard <base>` → `make apply-series` → 36 项全落地 → `--source-state` 绿）已闭环。**同型对照（修复样板，均已带守卫）**：`tools/infra/check_patch_tree.py:359-364`（`if component.get('patchless'): continue` 后 `continue`）与 `:310`（`--source-state` 路径同判）⇒ **`apply_series.py` 是唯一缺该守卫者**（现场逐文件核：`check_index_blobs.py` / `make_patch.py` 用 `.get()`，`manifest_check.py` 已判 `patchless`）。**处置建议**：在组件循环首部加 `if component.get('patchless'): continue`（对齐 `check_patch_tree.py:360` 样板；可附一行 `print` 说明跳过原因，与 `--source-state` 的 `patchless; skipped` 形态一致）⇒ 修后对纯 `patchless` 集 `make apply-series` 应 rc=0。**性质 = 既有缺陷（非本任务引入、非交付物缺陷）+ 纯 `infra` 修复面（`tools/infra/apply_series.py` 单文件）+ 不涉契约语义** ⇒ **不经用户语义裁定**、可另立 `infra` 小任务（**本笔只登记、不改代码**）。**`status` 取 `open`（architect 判断）**：① 缺陷**仍在**（现场 `make apply-series` rc=2 复现）；② **可复发**（任一含 `patchless` 的 enabled 集 × 任一走 `apply-series`/`prepare` 的任务）；③ **有机械门控可判** ⇒ 修复后可直接以 `make apply-series` 的 rc 作判据。**边界**：本笔**未改** `tools/**`、未改 `manifests/**`、未改 `Makefile`。证据指针：`.tao/archive/M8/qemu/QEMU-060t-回退dadao-m1-syscall服务.md`「完成区·新发现/坑 ①」；`.tao/archive/M8/llvm/LLVM-091t-llvm-project23.1.3升级.md`「完成区·遗留问题①」+「第 1 轮 reviewer 验收」；`.work/log/qemu/QEMU-060t-apply-series.log`、`.work/log/llvm/LLVM-091t-apply-series.log`、`.work/log/llvm/LLVM-091t-reviewer-apply-series.log`、`.work/log/llvm/apply-series.log`（本机留档，不入库）；`tools/infra/apply_series.py:108`；`tools/infra/check_patch_tree.py:310,360`；`manifests/components.lock.toml`（`chipyard`/`linux`/`llvm-test-suite`/`libc-test` = `patchless`）。"
