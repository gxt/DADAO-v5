scripts/run_qemu_smoke.py::GATE_VECTORS` 早已含之）。现场：`make check-qemu-semantics` **rc=0**、计数 **149 → 161**（= 113+36+12，现场统计、不写死）；`make check-full`(**L3**) **rc=0**（`CHECK_FULL_EXIT=0`）；`make check-modules`(**L2**) rc=0（`check-qemu-smoke` 90/90）。**`aip` 命中（真值 / 分档披露）**：① 门控**默认摘要档**日志 `.work/log/qemu/check-qemu-semantics.log` 仅 3 行（`Results: 161 total, 161 passed`）⇒ `grep -c aip` = **0**（**非**静默：该档非 verbose、**不**逐例打印 —— 与 `check-qemu-smoke` 的逐例/自证风格不同）；② 同载体集 / 同命令 / 同安装根二进制 + `-v` 的 **verbose 镜像** `.work/log/qemu/QEMU-061t-L3-semantics-verbose.log` ⇒ `grep -c 'aip-si.yaml'` = **12**（12/12 PASS）；③ **注入态真门控**日志 `grep -c aip` = **1**（`FAIL aip-si.yaml[7]`；`make check-qemu-semantics` rc=1 / make rc=2），`cp` 还原后回绿 ⇒ 门控**确实消费** `aip-si.yaml`（**可达 FAIL**）。⇒ `closed`、`resolved_by: QEMU-061t`。"

