  notes: "【正式登记（源 = `QEMU-065t` 完成区「新发现/坑 ②」+「遗留问题 ①」，2026-10-20；architect 提交时登记）】**现象**：qemu-user 线程语义验证中，除「并发互斥计数 == N×M」外全部符合（动态 `__get_tp()-pthread_self()==200`、`exit(7)` 结束整进程 vs `pthread_exit` 只结束线程、per-thread altstack/mask/`tgkill`）；并发项 **5/5 轮 rc=124**（`timeout 120`，4×250000 互斥计数，无输出）。**根因 = musl `a_cas` 为假原子**（**非 qemu 缺陷**）：`components/musl` 端口 `arch/dadao/atomic_arch.h` 的 `a_cas` 是**普通 load / compare / store** 三步，文件头明写 `SINGLE-THREADED, NOT REAL ATOMICS` 与「多线程可达后必须替换」；**ISA 侧无可用原语**——无 LR/SC、无 `cas`，`fence` 的 `scope: excluded`（`contract-isa §14`）⇒ 无法在 musl/qemu 内最小修复。**实测规模效应**（`.work/log/qemu/QEMU-065t-atomicity-probe.log`）：`1×200000` 3/3 精确；`2×2000` 3/3 侥幸精确；**`3×2000` → `5999/5992/5999`（3/3 丢更新）**；`4×2000` → 3/3 rc=124；`4×250000` → 5/5 rc=124。旁证：4×250000 时**各线程自有槽**求和 `sum=1000000` 正确（丢更新只发生在共享原子计数器），condvar `signal 1/1 + broadcast 2/2` 正常。**待用户裁定（二选一，勿悬空）**：**(A)** ISA 增原子原语（`lr`/`sc` 对 或 `cas`），并调整 `fence`/`scope` 语义 ⇒ 跨 `spec/` + `contracts/` + LLVM 后端 + qemu 的完整链（须 `spec/` 改动前逐条确认 + 授权原话落纸）；**(B)** 以 ADR 声明「M9 单核 / 无并发语义」假设 ⇒ musl `a_cas` 保留假原子但须文档化边界，T3 的互斥/锁类并发条目相应**降级或显式排除**（不得静默按 pass 计）。**阻塞关系**：阻断 **T3 `TESTCASES-052t`** 的并发/互斥条目与 **T4/T5**（若涉及原子操作）；`QEMU-065t` 验收项 2（并发 == N×M）据此未达。**等级 = P1**（跨模块、阻塞 M9 线程链收尾）。**证据指针**：`.tao/tasks/qemu/QEMU-065t-qemu-user线程语义.md` 完成区「新发现/坑 ②」与「遗留问题 ①」；`.work/evidence/QEMU-065t/run.sh`；`.work/log/qemu/QEMU-065t-atomicity-probe.log`；`components/musl/patches/arch/dadao/atomic_arch.h`。**交叉引用**：`ISS-292`（M9 线程链）、`ISS-252`（T3 关）、`contract-isa §14`（LR/SC 与 fence scope）、`ADR-0025 D5`。**边界**：只登记；未改 `spec/`/`contracts/`/musl/qemu；未选 (A)/(B)。 〔`QEMU-065t` 第 1 轮必改闭合（2026-10-20）〕证据脚本按**严格签名**分类：仅「`timeout` 124 + 无 `counter=` + 旁证（private-slot 求和、condvar）全绿」打印 `[GAP]`（**不是** `[PASS]`），任何其它红仍 `[FAIL]`；`--strict` 把 gap 恢复 `[FAIL]` + rc=1（现场 `ROUNDS=1`：1 `[FAIL]`、rc=1）。**未放宽**，本项仍 `open`、仍待裁定 (A)/(B)。 〔收尾裁定（2026-10-20，`QEMU-065t` /complete，主会话裁决）〕`[GAP]`/`--strict` 口径已由册内「收尾裁定（architect）」确认：`[GAP]` 须逐条带 issue 号 + `--strict` 硬红 + 不得吸收新失败；**不做** `issues.yaml` 联动（缺口修好后探针自然转 PASS，按 issue 状态联动会把 (B) 单核假设结案判成永久假红）。`status` 保持 `open`，仍待用户裁定 (A)/(B)。 〔**已裁定（2026-10-20 用户，经主会话派单转达；2026-10-21 architect 落纸）**〕选 **(A) ISA 增原子原语**，且**限定 LR/SC-only 路线（不加 AMO）** —— 与 `ADR-0034 D5` 选「A」（`lr`/`sc` 各 12 条、24 条编码一次排满）一致，`op=0x77` OPC-MISC 子表**不新增** AMO 记录；(B)「M9 单核 / 无并发语义」**未采用**。**`status` 仍 `open`**（裁定只定路线，`a_cas` 仍是假原子 —— 实现面 = `ISS-307` 的 4 册，其中 ③ musl 真原子 落 `arch/dadao/atomic_arch.h` 的 `a_cas`/`a_cas_p`/`a_barrier`；本 issue 待 ③ 落地并 `4×250000` 精确后随 `ISS-307` 一并关）。**【链路落纸（2026-10-21，architect 立册）】**实现落 **③ `INFRA-100t`**（`components/musl/patches/arch/dadao/atomic_arch.h.patch`：`a_cas`/`a_cas_p`/`a_barrier` 改 `lr/sc` 环 + `fence`），验证落 **④ `TESTCASES-056t`**（C11 全类型 / `__atomic_*` / 并发计数 / ABA 探针，两档）；`resolved_by` 待 ④ 验收后由 `/complete` 落（本笔只落纸，`status` 保持 `open`）。"
- id: ISS-295
  title: "【P1】musl 端口 `__clone` 无条件把变参 `tls` 写进子侧 `rb3` ⇒ `posix_spawn` 的 vfork 子进程 TP 为垃圾 ⇒ `__execvpe` 里写 `errno` 即 SIGSEGV（`functional/spawn` 两档、动态 `functional/popen`）"
  status: closed
  scope: [infra, qemu]
  blocks: []
  resolved_by: INFRA-095t-rework
  notes: "【正式登记（源 = `TESTCASES-052t` 完成区「新发现/坑 ①」，2026-10-20；T3 实测）】**现象**：`functional/spawn` 静态/动态均 `FAIL`（`spawn.c:38 read(p[0],...) got 0 want 6`）；动态 `functional/popen` 子进程 `0x8b`(139 SIGSEGV)、`pclose` 失败，qemu 自身随后宿主 `SIGPIPE`(13)。**根因**：`src/thread/dadao/clone.s` 子侧无条件 `rb2rb {rb3}, {rb20}`（把第 7 个 C 参数 `tls` 装进 TP），而 `src/process/posix_spawn.c:198` 只传 4 个实参 `__clone(child, stack, CLONE_VM|CLONE_VFORK|SIGCHLD, &args)` ⇒ `ptid/tls/ctid` 是**未指定的变参**（rb19/rb20/rb21 残留）⇒ 子进程 TP 为垃圾。`posix_spawnp` 经 `__execvpe`，其第一条语句就写 `errno`（TP 相对）⇒ 子进程在 `execve` 之前 SIGSEGV；静态 `popen` 用的直接 `execve` 不碰 `errno`，故静态过、动态（惰性绑定/ldso 触 `errno`）崩。**证据**：探针 `/tmp/opencode/TESTCASES-052t/probe-clone4b.c`（4 参 `__clone`）子侧 TP=`0xffffffffffff38ff`、父=`0x5bb38`，子写 `errno` 即 SIGSEGV(139)；`qemu-dadao -strace functional/spawn` 子侧 `dup3` 后 `SIGSEGV si_code=1 si_addr=NULL`、**无 execve**；动态 `popen` 同形。**修法方向**：仅当 `flags & CLONE_SETTLS` 才装 `rb3`，否则保持父侧 TP（内核语义）——属 `components/musl` 改动，须另立任务。**证据指针**：`.work/evidence/TESTCASES-052t/run.sh`、`/tmp/opencode/TESTCASES-052t/{sub-static,sub-dynamic}.json`、`spawn.strace.err`、`dyn-popen.strace.err`。**交叉引用**：`INFRA-095t`（T1 引入）、`ISS-252`、`ISS-294`（不同根因）。**【修复（2026-10-20，`INFRA-095t-rework`）】** `src/thread/dadao/clone.s` 子侧改为先判 `flags & CLONE_SETTLS`（`0x00080000`，`include/sched.h:64`）：`set.zw rd9, wp1, 8` + `and.o rd9, rd16, rd9` + `br.z`，置位才 `rb2rb {rb3},{rb20}`，未置位完全不碰 `rb3`（子进程继承父 TP，即内核/qemu `if (flags & CLONE_SETTLS) cpu_set_tls(...)` 语义）。实测：4 参无 `CLONE_SETTLS` 探针（`CLONE_VM|CLONE_VFORK|SIGCHLD`，与 `posix_spawn` 同形）子进程 `child_tp == parent_tp` 且写 `errno` 不崩；`functional/spawn`+`popen` 静态/动态各 2/2 pass；T3 上轮 14 个 static pass 逐例复跑 14/14；T1 带 `CLONE_SETTLS` 的静态常量探针 `child_tp=0x5a5a0000`、动态 `TP-self=200`。**status = `closed`**（`resolved_by = INFRA-095t-rework`）。"
- id: ISS-296
  title: "【P2】qemu-user `FUTEX_LOCK_PI` 对 guest 线程返回 `ESRCH`（owner TID 未做 guest↔host 翻译）⇒ PI 互斥的 EDEADLK 语义失效，`functional/pthread_mutex_pi` 报 deadlock"
  status: closed
  scope: [qemu]
  blocks: []
  resolved_by: QEMU-066t
  notes: "【正式登记（源 = `TESTCASES-052t` 完成区「新发现/坑 ②」，2026-10-20）】**现象**：`functional/pthread_mutex_pi` 两档均 `pthread_mutex_pi.c:148: PTHREAD_MUTEX_ERRORCHECK relock did not return EDEADLK, got deadlock`。**根因**：该用例给 mutex 设 `PTHREAD_PRIO_INHERIT`，musl 走 `pthread_mutex_timedlock_pi()`（内核 `FUTEX_LOCK_PI`，靠内核返回 `EDEADLK` 判自死锁）；qemu-user 下 `futex(...,FUTEX_LOCK_PI,...) = -1 errno=3 (ESRCH)` —— PI futex 的 owner 是 guest TID，宿主找不到该 TID；musl 对 `ESRCH` 落到 `__timedwait` 兜底 ⇒ 等到超时 ⇒ 用例判 deadlock。**证据**：`qemu-dadao -strace functional/pthread_mutex_pi`（子线程 `FUTEX_LOCK_PI` → ESRCH；父 `sem_timedwait` 100 ms 超时）。**修法方向**：qemu 的 futex PI 路径做 guest↔host TID 翻译（或明确不支持、返回 `ENOSYS`/`EINVAL` 让 musl 早失败而非挂起）。**等级 = P2**（1 例；PI 互斥在 Linux 上常用）。**交叉引用**：`QEMU-065t`（futex 面）、`ISS-252`、`ISS-294`（不同根因）。 〔落点（2026-10-20，architect 立册）〕**落点 = `QEMU-066t`**（`M9`、`待开始`）：先以最小探针确认 `ESRCH` 的真实根因（`uaddr` 值 vs 宿主 tid vs `/proc/<tid>` 存在性），再按内核 `futex_lock_pi` 语义修 PI 分支；验收 = `pthread_mutex_pi` 两档 pass。注意本端口 `gettid`/`set_tid_address` 直接返回宿主 tid（`linux-user/syscall.c:13212`/`:13535`）⇒ 原登记的「guest TID 未翻译」**须先被探针证实**，不得当结论。 〔✅ 已修（2026-10-20，`QEMU-066t`）〕**根因（探针实测，推翻原「guest TID 未翻译」假设）**：本端口 `gettid`/`set_tid_address` 直返宿主 tid（探针实测 `_m_lock` 存的值 == 子线程 `gettid()` == 宿主 tid 3758043），**TID 无需翻译**；真因是 **PI futex 字存的就是 owner TID，而 DADAO 大端 / 宿主小端** —— qemu 把 guest 地址原样交给宿主内核，内核按小端读到的「tid」是字节颠倒值（`0x00395754` → 内核见 `0x54573900`），查不到该 pid ⇒ `FUTEX_LOCK_PI` 恒 `ESRCH`。**修法**：`linux-user/syscall.c::do_futex` 对 `LOCK_PI`/`LOCK_PI2`/`TRYLOCK_PI`/`UNLOCK_PI` 在宿主调用前后做**保值的整字字节序转换**（`pi_futex_word_to_host`/`pi_futex_word_to_target`）；`WAIT_REQUEUE_PI`/`CMP_REQUEUE_PI` 不动（musl `src/` 0 处使用）并有注释说明理由。**复验**：探针 `pi_probe2` ERRORCHECK 重锁得 `35 EDEADLK`（修前 `ETIMEDOUT`+ESRCH）；`functional/pthread_mutex_pi` 静态/动态均 `pass`；T3 19 例两档 19/19。**已知边界**：真正阻塞在 `LOCK_PI` 期间字面处于宿主序（补丁注释已显式登记）。证据：`.work/evidence/QEMU-066t/`、`.work/log/qemu/QEMU-066t-*.log`。`status` → `closed`。"
- id: ISS-297
  title: "【P3】qemu-user 对 `set_robust_list`/`get_robust_list` 恒返回 `TARGET_ENOSYS`（上游设计）⇒ musl robust mutex 不可用；`functional/pthread_robust` 60 s 超时、`regression/pthread-robust-detach` 报 EOWNERDEAD≠ETIMEDOUT"
  status: closed
  scope: [qemu]
  blocks: []
  resolved_by: QEMU-066t
  notes: "【正式登记（源 = `TESTCASES-052t` 完成区「新发现/坑 ③」，2026-10-20）】**现象**：`pthread_mutexattr_setrobust()` 返回 `38 (ENOSYS)`（两档、两例一致）；`pthread_robust` 继续用非 robust mutex 走到 `pthread_mutex_lock` 等 EOWNERDEAD，**挂到 60 s 用例超时**；`pthread-robust-detach` 报 `pthread_mutex_timedlock ... got 110 (ETIMEDOUT) want 130 (EOWNERDEAD)`。**根因**：musl 1.2.6 的 `pthread_mutexattr_setrobust()` 先 `SYS_get_robust_list` 探测内核支持；`components/qemu` 的 `linux-user/syscall.c`（`case TARGET_NR_set_robust_list/get_robust_list`）**按设计**直接 `-TARGET_ENOSYS`（注释：robust 链表在 host 侧不可拦截线程死亡）——**所有 qemu-user 目标共有的限制**，非本端口引入。**证据**：该 case 源码注释 + 上述 run JSON `first_error`；`-strace` 显示 `set_robust_list/get_robust_list` ENOSYS。**处置候选**：(a) 接受为环境限制 —— 047t 分类把这两例标 `blocked` 且 reason 写明 `get_robust_list ENOSYS`（不得再写成 `no __clone`）；(b) 实现 robust 链表转发（成本高）。**等级 = P3**（2 例、非阻断）。**交叉引用**：`ISS-252`、`ISS-299`（分类文案）、`QEMU-065t`。 〔落点（2026-10-20，architect 立册）〕**落点 = `QEMU-066t`**：实现 `set_robust_list`/`get_robust_list` 的注册-查询一致（per-thread 存 `TaskState`，`head==0` 注销、`len` 校验）；musl 已在用户态处理 robust 链表（`src/thread/pthread_create.c:120-137`）⇒ **不需**内核式死亡拦截；验收 = `pthread_robust` + `pthread-robust-detach` 两档 pass。 〔✅ 已修（2026-10-20，`QEMU-066t`）〕**落地**：`TaskState.robust_list_head`（per-thread，`g_new0` 零初始化，线程销毁即随之回收）+ `TARGET_NR_set_robust_list`/`get_robust_list` 的注册-查询一致（内核 ABI 形状：`len != 3*sizeof(long)` ⇒ `EINVAL`、`head==0` 注销、`get` 返回同一 `{head,len}`；`pid ∉ {0, 自身 tid}` ⇒ `ESRCH` 的**显式口径**，不伪造跨线程列表）。**不做**内核式死亡遍历：探针/源码已证 musl 在 `__pthread_exit` 用户态自走 robust 链表（`src/thread/pthread_create.c:119-137`，含 non-pshared 与 detached 两场景）。**复验**：`robust_probe` 六项断言全对（`set(24)→get` 同 head、`len=32` ⇒ `EINVAL`、`pid=8` ⇒ `ESRCH`、`head=0` 注销后 `get` 得 0、musl 探测得 0）；`functional/pthread_robust`（pshared×pi 四组合）与 `regression/pthread-robust-detach`（pshared 0/1）两档均 `pass`。证据：`.work/evidence/QEMU-066t/`。`status` → `closed`。"
- id: ISS-298
  title: "【P2】阻塞在 futex 的线程收到 SIGCANCEL 后系统调用被重启、取消丢失 ⇒ `regression/pthread_cond_wait-cancel_ignored` 线程正常退出（rv=0）"
  status: closed
  scope: [infra, qemu, spec]
  blocks: []
  resolved_by: QEMU-066t
  notes: "【正式登记（源 = `TESTCASES-052t` 完成区「新发现/坑 ④」，2026-10-20）】**现象**：该例两档均 `pthread_cond_wait did not act on cancellation`（join 得到 rv=0，线程正常 return）。**现场**：`qemu-dadao -strace` 显示取消信号**已投递**、handler 已运行（`rt_sigreturn`），随后同一 futex **被重新 `FUTEX_WAIT`（无 EINTR）**，最终线程 `exit(0)`。**对照**：`functional/pthread_cancel`（`sleep(3)` 上取消）、`functional/pthread_cancel-points`（`sem_wait`/`sem_timedwait`）、`regression/pthread_exit-cancel` 均 pass ⇒ 取消机制整体可用，缺的是「阻塞在 futex 时的取消」。**根因方向**：musl `pthread_cancel.c` 的取消 handler 靠改写 `ucontext.MC_PC` 到 `__cp_cancel`（`__cp_begin/__cp_end` 区间）生效；该改写未生效时 syscall 被 `SA_RESTART` 重启。`arch/dadao/bits/signal.h` 的 `mcontext_t` 仍是 `[OPEN] PROVISIONAL`（文件头：无 DADAO 信号帧 ABI）；`src/thread/dadao/syscall_cp.s` 头注释已登记该边界。**待办**：用「阻塞在 `read()` / futex 的线程 + `pthread_cancel`」最小探针区分「MC_PC 改写未生效」与「EINTR 路径未触发」。**证据**：`/tmp/opencode/TESTCASES-052t/cw.strace`、`.work/evidence/TESTCASES-052t/`。**等级 = P2**（1 例；T1/T2 信号-取消面）。**交叉引用**：`QEMU-065t`（信号语义）、`INFRA-095t`、`ISS-242`（musl 端口缺口族）。 〔落点（2026-10-20，architect 立册）〕**落点 = `QEMU-066t`**：重启判定须与 Linux 一致（handler 改写 PC ⇒ 不得重启）；现状 `linux-user/dadao/cpu_loop.c:425-428` 对 `-QEMU_ERESTARTSYS` 无条件重放 trap、`linux-user/signal.c:1249-1251` 把 `TARGET_SA_RESTART` 直传宿主 action；验收 = `pthread_cond_wait-cancel_ignored` 两档 pass 且四个取消用例（`pthread_cancel`/`pthread_cancel-points`/`pthread_cancel-sem_wait`/`pthread_exit-cancel`）不回归。 〔✅ 已修（2026-10-20，`QEMU-066t`）〕**根因（探针实测，非 `SA_RESTART` 传播）**：DADAO 的 `struct target_ucontext` 给 `uc_mcontext` 加了 `QEMU_ALIGNED(16)` ⇒ 帧内 `uc_mcontext` 落在 **176**，而 musl `ucontext_t`（`uc_flags`8+`uc_link`8+`uc_stack`24+`sigset_t`128）期望 **168** ⇒ handler 读 `uc_mcontext.__gregs[0]`（`MC_PC`）读到的是对齐填充 **恒 0**（探针 `pc_probe2`：`gregs[0]=0`、真 PC 出现在 `gregs[1]`）⇒ `[__cp_begin,__cp_end)` 判定永假 ⇒ `cancel_handler` 走 `tkill` 重投分支、取消被吞。**修法**：删掉该对齐属性（`linux-user/dadao/signal.c`），帧与 guest `ucontext_t` 逐字节一致；`-QEMU_ERESTARTSYS` 的 trap 重放**无需改**（`process_pending_signals` 在重放后同一轮内取帧，PC = trap，handler 改写 `MC_PC` 经 `sigreturn` 生效即覆盖重放）。**复验**：`cancel_probe` 帧内 `pc=0x289e8`、`in_range=1`（修前 `pc=0`、`in_range=0`）；`cancel_probe2` join 得 `PTHREAD_CANCELED`（修前 rc=124 挂死）；`regression/pthread_cond_wait-cancel_ignored` 两档 `pass`；四个取消用例（`pthread_cancel`/`pthread_cancel-points`/`pthread_cancel-sem_wait`/`pthread_exit-cancel`）两档不回归。证据：`.work/evidence/QEMU-066t/`。`status` → `closed`。"
- id: ISS-299
  title: "【P2】libc-test 驱动 `attribute_port_gaps()` 仍按 T1 前口径把**任何** `uses_thread` 的失败降级为 `blocked` 并写「musl port has no __clone」⇒ 掩盖真实根因（`__clone` 已落地）"
  status: closed
  scope: [testcases]
  blocks: []
  resolved_by: TESTCASES-052t-rerun
  notes: "【正式登记（源 = `TESTCASES-052t` 完成区「新发现/坑 ⑤」，2026-10-20）】**现象**：`__clone` 落地后，凡 `uses_thread` 的 `fail/blocked` 都被改写成 `blocked` + 固定文案「musl port has no __clone (... INFRA-082t single-thread boundary)」，真实观测被塞进 `Observed:` 之后：本册 4 例（`pthread_mutex_pi`/`pthread_robust`/`pthread-robust-detach`/`pthread_cond_wait-cancel_ignored`）两档 8 次运行全部命中。**根因**：`tools/testcases/run_libc_test_user_suite.py` `attribute_port_gaps()` 末尾的 `if case.uses_thread: klass = blocked` 兜底（其为 T1 前「无线程」时代的判据），未随 `INFRA-095t` 退场。**影响**：判据可读性与后续 `KNOWN_FAIL`/`GAP_SIGNATURES` 口径；本册按任务约束**未改驱动**，改用 `Observed:` 载荷 + 独立签名断言定性。**修法方向**：删掉 `uses_thread` 兜底，只保留 `GAP_SIGNATURES` 的精确匹配（`pthread_create(...failed: Resource temporarily unavailable)` 等），并给 `blocked` reason 加稳定的机器可读 cause 字段。**证据**：`.work/evidence/TESTCASES-052t/check_thread_truth.py` 的 `INFO stale_driver_label` 行（两档各 4 例）、`sub-static.json`/`sub-dynamic.json`。**交叉引用**：`ISS-252`、`ISS-295`~`ISS-298`（被掩盖的真实根因）、`TESTCASES-047t`。 〔✅ 已修（2026-10-20，`TESTCASES-052t-rerun`）〕按本册授权删除 `attribute_port_gaps()` 的 `if case.uses_thread: klass='blocked'` 兜底，`fail` 不再被降级；`blocked` 只剩「无判定」实况（编译/链接失败、超时、宿主信号、以及 `GAP_SIGNATURES` 精确签名）。判据**未放宽**：`GAP_SIGNATURES` 签名保留并改注为「`__clone` 缺失回归检查」，模块 docstring 同步订正。**复验**：同批 20 例在两档由「4 blocked（假因）」变为 3 fail + 1 blocked（`pthread_robust` 60 s 超时），pass 集合不变；`.work/evidence/TESTCASES-052t-rerun/check_rerun.py` 的 `iss299_no_stale_demotion` 断言两档均 `[]`（修前必红）。〔/complete 复核（2026-10-20）〕现场：证据脚本 default/`--inject` 均 rc=0、两档 19 目标 19/19 `pass`、`iss299_no_stale_demotion` 两档 `[]`、驱动 `attribute_port_gaps()` 已无 `uses_thread → blocked` 兜底 ⇒ **`status = closed`**（`resolved_by = TESTCASES-052t-rerun`）。"
- id: ISS-300
  title: "【P3】安装根新鲜度：`make install-host` 之外的二进制替换（手工 `cp`）属例外手法，应尽量走 `install-host`"
  status: open
