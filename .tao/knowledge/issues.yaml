iB MemRAS 并设 MRPTR ⇒ 静态/动态两档 **PASS**（oracle 逐字节一致）。② `consumer-typeset` = 同一 RASOF 根因（`call` `0x52884`）：修复后越过该点并输出 57 735 B，但随后在 guest `NULL+7`（`SIGBUS/BUS_ADRALN` 于 `cpu_mmu_lookup` 对齐检查）再次终止 ⇒ **未修完**，剩余面 = 另一处 guest 指针/对齐问题。③ `8b10b` = **语料**：`input.txt` 是 LE u32 词表，BE 目标读出 `k=0x380000`（首词 0x38 → 0x38000000），`lookupTable3B[k<<3]` 越界（si_addr `0x703ac78`，pc `0x21118`）；非 qemu 缺陷。④ `SPASS` = **guest NULL 解引用**（归属未定）：pc `0x51c70` 的 `ld.o rd4,[rd43+8]`，`rd43=0`；落点 = `cnf_OptimizedSkolemFormula` 内联 `cnf_StrongSkolemization` 的 `term_Delete(list_Top(newvariables))`（`cnf.c:3029-3035`），循环需删 2 个而 `newvariables` 仅 1 个 ⇒ 上游/后端值不一致，尚未判定哪一侧。⑤ `lua` = **时间盒内未诊断**（崩点 375–670 s），仅保留签名。证据：`.work/log/qemu/QEMU-063t-gdb-*.log`、`.work/evidence/QEMU-063t/`。`status` 保持 open。 〔M8 收口核对：`048t` 残余宿主信号 4 例（SPASS/consumer-typeset/8b10b/lua）逐条有根因或登记；不阻断 M8。〕 〔TESTCASES-054t 回填（2026-10-21，`/complete`；源 = 该册验收标准 8）〕**`lua` 实例不复现**——两档实测均 `pass`（静态 1135.37 s / 动态 1150.98 s，`run_timeout=1320`），md5 `6badfbeedd84d040f153876007407785` 命中 `lua.reference_output`，**无宿主信号**（原停 `bench/process.lua` / `bench/meteor.lua` 的 `SIGSEGV` 随 `QEMU-063t` 批次修复后不再出现；驱动 `QEMU_SIGNAL_ISSUES` 的 lua 条目已删）。**`unix-smail` 卡死面按实测闭合**——两档各 0.11 s 跑完、stdout 35 B byte-exact、exit 0，`QEMU-063t` 记录的 `/bin/sh` 缺失 ⇒ 10×`sleep(60)` 重试等待不复现。`status` **保持 open**（`SPASS` / `consumer-typeset` 等未终结实例仍在），`resolved_by` 保持 `null`。
