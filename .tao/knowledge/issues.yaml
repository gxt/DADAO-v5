  notes: "【正式登记（源 = `QEMU-061t` L3 载体补齐笔「新发现/坑 ③」+ 本笔**现场复核**；architect 立项，2026-10-17）】**现象（现场复核，只读；未重跑门控）**：① L3 门控 `check-qemu-semantics`（`Makefile:878`）的**载体清单** = `Makefile:881` 的 `for v in reg-shift-extend.yaml reg-compare.yaml aip-si.yaml; do`（**3 册**）；`check-full`(**L3**) = `check-qemu-semantics` + `test-m6`（`Makefile:508`）⇒ 语义执行面**只有这 3 册**。② 同处注记（`Makefile:866-867`）现称 `Runs all cases in reg-shift-extend + reg-compare + aip-si`；而 `tests/vectors/isa/` 现场 `ls *.yaml | wc -l` = **16** 册（`aip-si`/`ctrl-br`/`ctrl-call`/`ctrl-jump`/`ctrl-ret`/`mem-ra`/`mem-rb`/`mem-rd`/`misc`/`reg-arith`/`reg-compare`/`reg-cond-assign`/`reg-imm-block`/`reg-logic`/`reg-shift-extend`/`reserved`）⇒ 门控覆盖 **3/16**（现场派生）。③ 其余 **13 册**在 L1/L2/L3 **零门控消费**（逐册 `grep -n '<name>.yaml' Makefile` ⇒ **仅上述 3 册命中**；L2 `check-qemu-smoke` 的载体 `GATE_VECTORS`〔`tests/scripts/run_qemu_smoke.py:40`〕= **同样 3 册** ⇒ L2/L3 **同载体、不互补**）；这 13 册现由**生成器 / 探针 / 手跑脚本**消费（`tools/testcases/generate_*.py`、`tools/qemu/check_005t_coverage.py`、`tests/scripts/run_qemu_test.py`），**无 Makefile 门控目标**。④ **口径漂移实例（既有，非本笔引入）**：`tests/scripts/run_qemu_smoke.py:4-5` 与 `:37` 称「**全量** 161 用例」「**全量**留在 L3」「**不**把全部 ISA 向量塞进来（那是 **L3 的规模**）」⇒ 该「全量」只指**载体集内**的全量、**非** `tests/vectors/isa/` 全集 —— 后来者据门控日志 `Results: 161 total` 易推断「ISA 语义向量已全量跑过」，而 13 册（含 `ctrl-*`/`mem-*`/`misc`/`reserved`）**未进门控** ✗。**判据** = 门控自称「全量」而载体与 `tests/vectors/isa/` 全集不符 ⇒ 覆盖声明与载体脱钩。**建议（未实施 ✗；本笔刻意**不**扩张载体以免连带打红）**：二选一须裁定 —— **(甲)** 扩张 L3 载体至全集（**须先**现场验 13 册能否全绿，再改 `Makefile`；否则计数一变即可能大红）；**(乙)** 收窄措辞 + 显式登记（「全量」改为「载体集三册」，并在 `tests/vectors/inventory.md` 增「门控覆盖（L2/L3）」列，逐册标「进门控 / 未进门控」）。**`status` 取 `open`（architect 判断）**：① 偏离**仍在**（13 册未进门控）；② **可复发**（新增 ISA 向量册默认不进 L3 载体 —— `aip.si` 即先例 = `ISS-233`）；③ **有机械判据可加**（如断言「载体集 ⊇ 登记的执行面册清单」或「docstring 措辞 ↔ 载体数一致」）。**性质** = 门控覆盖口径偏离（**非** `QEMU-061t` 交付面缺陷 —— 其 L3 判据 = rc=0，已达成）。**边界**：本笔**只登记** —— **未改** `Makefile` 载体清单 ✗、**未改** `tests/vectors/**` ✗、**未改**门控代码 ✗；本笔另订正 `tests/scripts/run_qemu_smoke.py:4` 的**陈旧计数**（`149` → `161`，独立授权项）但**未动**该处/`L37` 的「全量」措辞（其处置归本项裁定）✗。证据指针：`Makefile:508`/`Makefile:866-881`；`tests/scripts/run_qemu_smoke.py:4`/`:37`/`:40`；`.work/log/qemu/check-qemu-semantics.log`（`Results: 161 total, 161 passed`）；`.work/log/qemu/QEMU-061t-L3-semantics-verbose.log`（`grep -c 'aip-si.yaml'` = **12** ⇒ 载体命中须另起 verbose 档才可见）。**交叉引用**：`ISS-233`（**已 closed**：`aip-si.yaml` 纳入 L3 载体 —— 本项是其**同类遗留面**）、`ISS-236`（同门控默认档日志不可观测）、`docs/Process-07`（L2/L3 分层）、`QEMU-061t`（登记源）。"
- id: ISS-236
  title: "【P3】`check-qemu-semantics` **默认档日志仅 3 行摘要**（非 verbose）⇒ 无法从门控日志直接证明某向量的**覆盖 / 命中**；本轮取证被迫用 verbose 镜像 + 定点注入替代"
  status: open
  scope: [qemu, infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `QEMU-061t` L3 载体补齐笔「新发现/坑 ①」+ 本笔**现场复核**；architect 立项，2026-10-17）】**现象（现场复核，只读；未重跑门控）**：门控默认档日志 `.work/log/qemu/check-qemu-semantics.log` 现场 `wc -l` = **3** 行（`Running batch tests from <gate dir>...` / 空行 / `Results: 161 total, 161 passed, 0 failed, 0 deferred, 0 errors`）⇒ `grep -c aip .work/log/qemu/check-qemu-semantics.log` = **0** —— **非**静默，而是该档**不逐例打印** ✗。**对比面（同门控族的自证风格）**：`check-qemu-smoke` 现场打印载体名（`源: reg-shift-extend.yaml + reg-compare.yaml + aip-si.yaml`）与源 / 代表集计数（`tests/scripts/run_qemu_smoke.py:103-107`，并注明「计数现场统计，不写死」）⇒ **同族两档留证风格不一致**。**影响**：门控默认日志是「一能力一向量」在 **L3** 层的**唯一默认留档** ⇒ 判定「某向量是否被门控消费」**不能**只看该日志，只能间接推断；本轮取证因此被迫三件套：① **计数差**（`149 → 161`，现场统计）；② **定点注入**（注入 `aip-si.yaml` case[7] 期望值 ⇒ 真门控 `make check-qemu-semantics` rc=1 / make rc=2、日志 `FAIL aip-si.yaml[7]`；`cp` 还原 + `cmp` 一致后回绿）；③ **另做 verbose 镜像**（同载体集 / 同命令 / 同安装根二进制 + `-v` ⇒ `grep -c 'aip-si.yaml'` = **12**，12/12 PASS）。**建议（评估，未实施 ✗）**：在**不改 rc 语义**的前提下让门控默认档输出**覆盖计数 / 载体清单**（最低 = 打印载体名，或「载体 N 册 × 用例 M 条（现场派生）」一句，形如 L2 的自证风格；或加 `-v` opt-in 档并在默认档注明镜像路径）⇒ 使「门控日志可自证覆盖」，免去每次另做镜像。**`status` 取 `open`（architect 判断）**：① 可观测性缺口**仍在**（默认档无法自证覆盖）；② **可复发**（每次新增载体都要另做 verbose 镜像才留证 —— `ISS-233` 一轮即如此）；③ **可机械判**（可断言默认日志含载体清单 / 计数与载体现场派生自洽）。**性质** = 门控可观测性 / 留证形态缺口（**非**功能缺陷，**亦非**假绿 —— 门控 rc 语义正确、注入态**可达 FAIL** 已证）。**边界**：本笔**只登记** —— **未改** `tests/scripts/run_qemu_test.py` ✗、**未改** `Makefile` 门控 ✗、**未改**任何日志档 ✗。证据指针：`.work/log/qemu/check-qemu-semantics.log`（3 行；`grep -c aip` = 0）；`.work/log/qemu/QEMU-061t-L3-semantics-verbose.log`（12 命中）；`.work/log/qemu/QEMU-061t-L3carrier-runsh-inject.log`（注入态 `FAIL aip-si.yaml[7]`）；`.work/evidence/QEMU-061t-L3carrier/run.sh`（C3 逐例镜像 / C4 默认档说明 / C5 注入 + `cp` 还原）。**交叉引用**：`ISS-233`（**已 closed**：载体纳入 ⇒ 本项为其取证副产物）、`ISS-235`（载体 ≠ 全量）、`lessons §2.20`（自证命中）、`docs/Process-07`（L2/L3 分层）。"
- id: ISS-237
  title: "【P3】`QEMU-061t` 证据脚本 `smoke_derive.py` 的 L2 派生逻辑**已过时**（`GATE_VECTORS` 已含 `aip-si.yaml` ⇒ 再「追加 aip 文件」无增量 ⇒ 断言 `k[0]==\"aip-si.yaml\"` 永不命中、脚本 rc=1）——**脚本 stale，非功能缺陷**（真 L2 门控 90/90 且 `aip.si present: True`）"
  status: open
  scope: [qemu]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `QEMU-061t` 第 1 轮 reviewer「finding」条 + 本笔**现场复核**；architect 立项，2026-10-17）】**现象（现场复核，只读）**：`python3 .work/evidence/QEMU-061t/smoke_derive.py` ⇒ **rc=1**、末行 `derivation-with-aip.si: FAIL`；全文三行现场输出 = `gate carriers (GATE_VECTORS) : reg-shift-extend.yaml, reg-compare.yaml, aip-si.yaml` / `representative set, as gated : 90 cases (aip.si present: True)` / `representative set, aip file added: 90 cases`。**根因（脚本旧前提失效 ⇒ 逻辑过时）**：该脚本按「`GATE_VECTORS` **不含** `aip-si.yaml`」写就；`tests/scripts/run_qemu_smoke.py:40` 现场已为 `GATE_VECTORS = (\"reg-shift-extend.yaml\", \"reg-compare.yaml\", \"aip-si.yaml\")`（`ISS-233` 收尾补入）⇒ 脚本 L40 `derive(list(GATE_VECTORS) + [\"aip-si.yaml\"])` 对 `aip-si.yaml` 走 `name in GATE_VECTORS == True` 分支 ⇒ 组键取 `(class, mnemonic)`、**不带**文件名前缀 ⇒ L41 的 `k[0] == \"aip-si.yaml\"` **永不命中** ⇒ `aip = {}` ⇒ L49 `len(aip) == 4` 为假 ⇒ FAIL。**真相（功能面无缺陷）**：同一次输出的第 2 行即自证真 L2 门控 = **90 代表用例全绿 + `aip.si present: True`** ⇒ 该 rc=1 **只反映脚本自身断言过时**，**不是** `aip.si` 未入门控。**等级 = 非阻断（P3）**：① 该脚本属 `.work/evidence/**`（`.gitignore`、**非门控**、不入 git）；② 交付面判据（L2/L3 门控 rc=0 + 语义 oracle 独立）均已达成并经 reviewer 独立重跑。**建议（未实施 ✗）**：二选一 —— 改写为「按 `GATE_VECTORS` 现场派生 → 断言其中含 `aip.si` 组（用带文件名前缀的键）」；或直接删除该过时脚本（其「L2 不含 aip」的结论已由 `ISS-233` closed 取代）。**性质** = 历史证据脚本随载体变更而过时（与 `ISS-234` 同族：历史产物卫生，**非**功能缺陷）。**边界**：本笔**未改** `tests/scripts/**` ✗、**未改** `.work/evidence/**` ✗。证据指针：`.work/evidence/QEMU-061t/smoke_derive.py`（L39/L40/L41/L49）；`tests/scripts/run_qemu_smoke.py:40`；`.work/log/qemu/QEMU-061t-smoke-derive-recheck-architect.log`（本笔复核 rc=1）；`.tao/archive/M8/qemu/QEMU-061t-rela-si解码与语义.md`「第 1 轮 reviewer 验收」finding 条。**交叉引用**：`ISS-233`（**已 closed**：L2/L3 载体纳入 `aip-si.yaml` ⇒ 本脚本旧前提失效）、`QEMU-061t`（登记源）。"
