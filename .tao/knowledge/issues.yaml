  notes: "【正式登记（源 `LLVM-092t`「第 3 轮 reviewer 验收」非阻断 finding `F-R1`；architect `/complete` 收尾登记，2026-10-15）】**现象**：`LLVM-092t` 证据脚本（`.work/evidence/LLVM-092t/run.sh`，gitignored、非交付物）以裸 `git diff`（= 工作树 vs `HEAD`）判定「本次变更」，故 engineer/reviewer 在**提交前**跑得「默认 106/106、`--inject` 134/134」，而 architect 提交 `fb74615` 后 `HEAD` 已含改动 ⇒ reviewer 提交后重跑只得「默认 PASS=30、`--inject` PASS=58」（rc 均 = 0），diff 类断言（②③④ 部分）**静默退化**为恒真 / 空跑。**判据**：两组数字**均为真实输出**（提交前日志 `/tmp/opencode/LLVM-092t/final-{default,inject}.log` + reviewer 对 `557446c` 的独立计数复核一致 ⇒ **非伪造、非凑绿**）；缺陷在于**断言基线随 `HEAD` 移动** ⇒ 「提交后仍应回绿」自检**表面通过、实则空跑**，交付证据**不可复现**（换基线即换总数）。**根因**：脚本未锚定**任务基线** `557446c`（该任务开工 base）。**建议（择一）**：ⓐ diff / 计数类 git 调用一律带**任务基线**（`git diff <BASE>..HEAD -- <path>`，`BASE` 可经环境变量覆盖，默认 = 开工 base）；ⓑ 或把口径改为**相对基线**（「相对开工 base 的净变更」）并在完成区写明该口径。既有判据 = `lessons §2.14`（证据脚本对已提交变更的断言须带提交范围 `BASE..HEAD`）。**性质 = 证据脚本口径**（非交付物缺陷、非阻断）；该脚本在 `.work/**`、不入库 ⇒ 本任务**不改**，登记待后续同类脚本沿用判据。证据指针：`.tao/archive/M8/llvm/LLVM-092t-llvm-changelog历史补录.md`「第 3 轮 reviewer 验收」§数字差异（`F-R1`）+ 完成区「测试结果」；`.work/log/llvm/LLVM-092t-review3-run-*.log`。"
