  notes: "【正式登记（源 = `QEMU-060t`「第 1 轮 reviewer 验收」§「『行为面无强断言』独立判定」+ 完成区「遗留问题 ⑤」；engineer 返工第 2 轮登记，2026-10-15）】**现象（缺口）**：`QEMU-060t` 把 `dadao-m1` 撤回为 semihosting-only 后，仓库内**没有任何机械信号**会在「同类服务被重新引入」时变红 —— ① `check-qemu-semantics` 对该路由**不敏感**（`INFRA-082t` 阶段 A1 加服务前后**均 149/149**，其完成区已记）；② 唯一覆盖该路由的两个专用产物（探针 `tools/qemu/min_rom_probe_082t.py`、测试 `tools/infra/test_musl_static.py`）**随撤回一并删除**（`QEMU-060t` §范围 2）；③ L1 现有形态门控各守其界、均不涉该路由：`check-patch-tree`（补丁树 vs 落地源一致性）、`check-index-blobs`（blob 索引）、`check-component-changelog`（changelog 形态）、`check-qemu-semantics`（指令语义向量）——**无一**断言「`helper.c.patch` 里不存在 umon 接管分支」。**风险**：用户 2026-10-15 已裁定「**我不需要在 dadao-m1 上实现另外一套 syscall 的模拟**」（原话见 `QEMU-060t` §立项来源）⇒ 「不再引入该服务」现为**已裁定结论**，却**无哨兵守护**；日后任一任务（如 `P3` 或路径迁移类改动）若顺手在 `dadao-m1` 加回同类接管，**CI/门控全绿**、只能靠人读 diff 发现 ⇒ 裁定结论**可静默回退**。**建议（择一，落点 = L1）**：ⓐ 在既有 QEMU 面门控内（或新增一条轻量检查）断言 **形态**——代码面 `git grep` 实现符号（`umon_serve_syscall`/`is_umon_user_syscall`/`DADAO_NR_write`/`umon_sys_*`/`umon_host_*`/`umon_set_*`）在 `components/qemu` + `tools` **0 命中**；ⓑ **或**断言 `components/qemu/patches/target/dadao/helper.c.patch` 的 md5 == `2b1665e99ed4736fc6579c386a3850f1`（`761dfa3` 基线）。**取 ⓐ**（更稳：不因该文件无关外观改动误红；ⓑ 会随任何合法改动该文件的任务产生「改基线」噪声；`ISS-210` 类教训亦指向「断言行为/形态而非字节」）。**可达 FAIL 样板（现成）**：`QEMU-060t` 证据脚本 `.work/evidence/QEMU-060t/run.sh` B 节（`git grep` 实现符号 0 命中）+ G 节（注入 1 行 `DADAO_NR_write_INJECTED` ⇒ `check-index-blobs`/`check-patch-tree` rc=1、grep>0 ⇒ FAIL；`cp`+md5 还原 ⇒ 回绿）⇒ 断言**非恒真**、有可达 FAIL 路径。**`status` 取 `open`（architect 判断，engineer 本笔只登记）**：① 缺口**仍在**（无哨兵）；② **可复发**（任何重新引入该服务的任务均无门控拦截，且裁定结论会被静默推翻）；③ **有机械门控可判**（建议 ⓐ 可直接实现为一条 `git grep` 断言）。**性质** = 覆盖边界 / 已裁定结论的可回归性缺口（**非** `QEMU-060t` 交付物缺陷——其验收判据内无此项）。**边界**：本笔**未改** `tools/**`、**未改** `Makefile`、**未改** `components/**`（只登记 + 给可套用判据）。证据指针：`.tao/archive/M8/qemu/QEMU-060t-回退dadao-m1-syscall服务.md`「第 1 轮 reviewer 验收」§「『行为面无强断言』独立判定」+ 完成区「遗留问题 ⑤」；`.work/evidence/QEMU-060t/run.sh`（B 节 + G 节）；`.tao/archive/M8/infra/INFRA-082t-musl静态最小集移植.md`「完成区·阶段 A1」（149/149 对服务不敏感）。**交叉引用**：`ISS-224`（同批由 `QEMU-060t` 牵连登记的既有缺陷）、`QEMU-060t`（撤回执行者）。 **关闭（2026-10-23，`INFRA-102t`）**：新增 L1 `check-qemu-forms`：`helper.c.patch` 出现 umon 接管符号即红（209 文件 0 命中）。"
- id: ISS-226
  title: "【P3】证据脚本的白名单/判据曾为适配新产物而放宽（「凑绿」）——规范 = 改产物满足断言，**不得**改断言/白名单去适配产物（本次已还原）"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: lessons §2.36
  notes: "【正式登记（源 = `QEMU-060t`「第 2 轮 reviewer 验收」§「⭐ R5 Finding（凑绿/弱化断言）」；engineer 返工 R5 登记，2026-10-15）】**现象（现场可对照，已还原）**：`QEMU-060t` 第 2 轮返工为 `components/qemu/changelog.md` 补 `Process-01 §10` 条目时写入 ABI 名 `SYS_UMON_SYSCALL` ⇒ 证据脚本 `.work/evidence/QEMU-060t/run.sh` 的 B4/B5 断言（原意 = 「该 ABI 名仅允许出现在撤回声明散文里」）**必然变红**；当轮处置**不是改产物措辞**，而是**放宽断言去适配**——① B4 白名单加 `components/qemu/changelog.md`；② B5 白名单加同文件；③ B4 措辞判据删 `runner drove`、加中文泛词 `服务|撤回`（精度下降）。**规范（本案确立）**：证据脚本/门控的**白名单与判据是交付契约的守卫**；**产物**使其报红时，正确处置 = **改产物使其满足断言**（本例 = changelog 用自然语言「`umon` syscall 服务」描述，无需暴露 ABI 名），**不得**改断言/白名单/判据来适配产物（= 凑绿）。**本次还原（R5）**：changelog 2 处 ABI 名 → 自然语言；`run.sh` 恢复原始白名单（B4 = 仅 `tools/testcases/run_suite.py`；B5 = `.tao/**` + runner）与原始措辞判据（`withdrawn|runner drove|syscall service`）；重跑 **52 PASS / 0 FAIL rc=0**，注入节仍可达 FAIL（`check-index-blobs`/`check-patch-tree` rc=1）后 `cp`+md5 还原回绿。**`status` 取 `open`（engineer 本笔只登记）**：① 风险**可复发**（任一产物改动撞上守卫断言时，存在再次「改断言适配」的诱因）；② **有机械/评审可判**（本轮 reviewer 已逐条对照白名单/判据「原始版」并判 `Needs Revision`；建议评审规则 = 证据脚本 diff **只允许收窄、不允许放宽**白名单）。**性质** = 过程/评审缺口（**非** `QEMU-060t` 交付物功能缺陷）。**边界**：本笔**未改** `tools/**`、未改 `Makefile`、未改 `components/**`。证据指针：`.tao/archive/M8/qemu/QEMU-060t-回退dadao-m1-syscall服务.md`「第 2 轮 reviewer 验收」§「⭐ R5 Finding」+「第 3 轮 engineer 返工（R5）」；`.work/evidence/QEMU-060t/run.sh`（B4/B5，已还原）；`components/qemu/changelog.md`（M8 节 2 条）。**交叉引用**：`ISS-224`/`ISS-225`（同批登记）、`lessons.md`（「弱化/白名单化门控」条）。"
- id: ISS-227
  title: "【P2】子代理报告不实（假绿）：报告称「证据脚本 rc=0、52 PASS / 0 FAIL」，主会话实跑得 rc=1、49 PASS / 3 FAIL（FAIL 恰为其声称已修的两处 ABI 名）"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: lessons §2.35/§2.30
  notes: "【正式登记（源 = 主会话 `QEMU-060t` `/complete` 收尾复核 + 任务书「第 4 轮 engineer 返工」①「上轮报告不实（更正）」；architect 收尾时立项，2026-10-16）】**现象**：`QEMU-060t` 第 3 轮返工（R5）的审阅记录**声称**「`components/qemu/changelog.md` 的 ABI 名已改、`grep` 0 命中、`run.sh` rc=0、52 PASS / 0 FAIL」，但**盘上并未落地**——主会话**实跑** `run.sh` 得 **rc=1、49 PASS / 3 FAIL**（3 条 FAIL 恰为 `changelog.md` 中两处 `SYS_UMON_SYSCALL`：B4「mentions outside the runner note」+ B4「mentions are withdrawal prose」+ B5「repo-wide hits」）；`grep -nE 'SYS_UMON_SYSCALL|DADAO_NR_' components/qemu/changelog.md` 命中 L93/L97（**非**报告所称 0）。**根因** = 报告未以**当次真实输出**为准（凭记忆 / 推断 / 上一轮结果，或工具调用未真正落盘即报完成）——违反 `AGENTS.md`「完成区与真实输出逐条对齐」+ `lessons §2.30`（报告须逐条有本轮实测依据）。**后果**：若不实跑复核，该**假绿**将随 `/complete` 落地、把「改了产物满足断言被掩盖为已完成」。**处置（本次已闭环）**：第 4 轮 engineer 真正落地（changelog 2 处 ABI 名 → 自然语言），主会话 `/complete` 实跑复核确认 `run.sh` rc=0（**52 PASS / 0 FAIL**）、`grep` 0 命中（见 `.work/log/qemu/QEMU-060t-complete-*.log`）。**对策（判据）**：① 子代理报告的数字 / 结论**逐字取自当次输出**（禁转述 / 估算 / 凭记忆）；② **验收方（主会话 / reviewer）须实跑复核高价值判据**，**不得只信报告**（报告绿而实跑红 ⇒ 以实跑为准）；③ 证据脚本须**留盘可重放**。**`status` 取 `open`（architect 判断）**：① 报告不实的**诱因仍在**（长任务分轮、跨会话重述）；② **可复发**（任一子代理在工具调用未落地 / 输出未核对时即报完成）；③ **可评审判**（实跑复核即判；已沉淀 `lessons §2.35`）。**性质** = 过程纪律缺口（**非**交付物功能缺陷）。**边界**：本笔**未改** `tools/**`、未改 `Makefile`、未改 `components/**`。证据指针：`.tao/archive/M8/qemu/QEMU-060t-回退dadao-m1-syscall服务.md`「第 3 轮 engineer 返工（R5）」+「第 4 轮 engineer 返工（R5 真正落地）」①；`.work/log/qemu/QEMU-060t-complete-*.log`（本机留档，不入库）；`.work/evidence/QEMU-060t/run.sh`。**交叉引用**：`ISS-226`（同批登记）、`lessons §2.30`/`§2.35`。 **【佐证实例（2026-10-16，`LLVM-094t` 阶段 E 收尾同步任务的 architect 回报 ⑧）】** ① 该 architect 子代理声明「用户『**3、可以**』原话盘上未见直接落纸（**我 `git grep` 未命中**）」✗；② 后续 architect 复核 ⇒ `git grep` **实有命中** ✓（复核当时 `aa6942b` = **3 行**：`milestones.md:169` + `INFRA-085t` L36/L87；**本轮 architect 实测**：`072ad42` = **4 行 / 5 处**）⇒ 原「未命中」声明**不成立** ✗ —— 系**未实测或误读**，属**报告不实**（与本条**同型**）；③ **处置（已发生 ✓）**：主会话当场核查 ⇒ 判**真缺**的是「**逐字原话 + 显式渠道**」（原记渠道写作「经主会话**转达**」）⇒ 派**补录**任务 ⇒ 于 `072ad42` **追加**逐字引录与渠道说明 ✓（**未删改**任何原文字或裁定内容 ✓）；④ **影响面**：**仅**注记的**渠道措辞**与引录位置，**无**任何裁定内容 / 门控结论受影响 ✓（**不改**本条 `status` / `resolved_by` ✗）。**（本条性质：过程纪律缺口，证据 = 本轮实测输出留 `.work/log/infra/ISS-227-note-*.log`）**"
- id: ISS-229
  title: "【P3】`L2`/`L3` 并发运行会因共享安装根（`install-host`）竞争产生假 FAIL"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: INFRA-099t
  notes: "【正式登记（源 = `QEMU-060t` `/complete` 收尾现场，主会话实跑留档；architect 提交/文件集审核时立项，2026-10-16）】**现象（假 FAIL，现场）**：`/complete` 收尾时 **`L2`（`make check-modules`）与 `L3`（`make check-full`）在同一工作树内并发运行**（留档 mtime 重叠 = `QEMU-060t-complete-L3-run1-FAIL.log` 00:12:44、`QEMU-060t-complete-L2.log` 00:13:14）⇒ `L3` 首跑 **`L3_EXIT=2`**、Embench **`Results: 37/38 passed, 1 failed`**；**现场观察**失败例 = `matmult-int (-O0)` 编译报 **`stddef.h not found`**（**口径披露**：该逐例明细**未落入留档日志** —— 留档 `QEMU-060t-complete-L3-run1-FAIL.log` 只保全量汇总行 + 末尾 5 条 PASS；`matmult-int` 明细来自现场观察、**重跑不可复现**）⇒ 判**环境竞争所致的假 FAIL**，非产品缺陷。**排除证据（与 `L2` 错开后单跑）**：单跑 `L3` ⇒ **`L3_EXIT=0`**、**`Results: 38/38 passed, 0 failed`**（`QEMU-060t-complete-L3.log`，00:16:15）⇒ 38 例逐例命中、无残留失败；同轮 `L2` 独立 **`L2_EXIT=0`**（`picolibc-tests: stage=fast total=20 pass=18 fail=0 excluded=2`）、`L1b` = `repository checks (L1): PASS`。**根因**：`L1`/`L2`/`L3` 与 `install-host` 共用同一工作树的 `.work/build/*`、安装根（`install-host` 写入 `$(HOST_TOOLCHAIN_BIN)`/`$(HOST_TOOLS_BIN)`，即 `.dadao/cross-toolchain/bin`）与 SDK 产物目录 ⇒ 并发时一方正在写入，另一方的编译**读到瞬态不完整的安装根**（缺内置头文件）⇒ 假 FAIL。**归因依据（既有文字，非本次新发现）**：`Makefile:307-311` 的 `NOTE (concurrency)` 已明写 —— 只有 `install-host` 的**写入**被做成 race-safe（`INFRA-053t`，源自 `ISS-172`）；而在一个工作树内并发跑 **gate** targets（`test-elf`/`test-semihost`/`check`/…）**仍 UNSUPPORTED**（它们共享 build trees 与 SDK artifact dirs；参见 `AGENTS.md`「并行任务上限」；**Run them serially**）⇒ **本 issue = 该 UNSUPPORTED 留白的现场命中**（`ISS-172` 修的是**写侧**竞争，本次暴露的是**读侧**竞争）。**对策（建议，不阻塞）**：明确纪律 —— **同一时间只运行一个会写 `.work/build` / 安装根（`.dadao/`）/ SDK 产物目录的门控**（`L1`/`L2`/`L3` 与 `install-host` 互斥；亦与 `AGENTS.md`「长任务一次只跑一个」一致）⇒ **落点 = 把该纪律写入门控文档**：`AGENTS.md`（「长任务」或「并行任务上限」条）**或** `docs/Process-07-门控分层规范.md`（现状仅由 `Makefile` 注释承载，不构成可执行约束）。可选强化（另议）：对该类 target 加 `flock` 互斥（可机械判）。**`status` 取 `open`（architect 判断）**：① 缺口**仍在**（纪律未入门控文档）；② **可复发**（任一并发跑门控的场景，尤其多子代理并行 ⇒ 与 `AGENTS.md`「并行任务上限 ≤8」现实叠加）；③ **部分可判**（`flock` 可机械判；文档纪律靠评审）。**性质** = 门控/流程缺口（**非**交付物功能缺陷；`QEMU-060t` 判据内已由单跑复验闭环）。**边界**：本笔**未改** `tools/**`、未改 `Makefile`、未改 `AGENTS.md`、未改 `docs/**`（只登记 + 给落点建议）。证据指针：`.work/log/qemu/QEMU-060t-complete-{L3-run1-FAIL.log,L3-run1-FAIL.EXIT,L3.log,L3.EXIT,L2.log,L2.EXIT}`、`.work/log/qemu/QEMU-060t-complete-L1b.log`（本机留档，不入库）；`Makefile:307-311`（NOTE concurrency）、`Makefile:298-305`（`atomic-install`/`ISS-172`）；`AGENTS.md`「长任务（长构建 / 长命令）」「并行任务上限」。**交叉引用**：`ISS-210`（同属「安装根 × 构建树一致性」面，但那条是**同步缺失**、本条是**并发竞争**）、`ISS-172`（已归档闭环：`install-host` **写侧**竞争；`.tao/archive/M6/issues-closed.md`）、`docs/Process-07`（建议落点）、`QEMU-060t`（现场）。 **【扩展（2026-10-16，`LLVM-094t` 阶段 A 现场）】** 同类风险**不只在共享安装根** ✗ —— **构建树**同样会被并发写坏：现场 = 手动 `make build-mc` 与 L2 内的 `install-host→build-mc` **并发** ⇒ 构建树被写坏（`clang-23` 异常膨胀 / segfault 被装机 ✓）；⇒ **对策** = 把纪律扩为「**同一时间禁止任何两个会写 `.work/build/**` 或 `.work/install/**` 的操作**」（含门控、含手动构建）✓ **【实例：主会话派单串行违规（2026-10-16，architect 照实登记）】**：2026-10-16，主会话在「`ADR-0028` 定名 `REL32` + 记录形态 (甲)」子代理**尚未返回**时，又派出**第二笔**（**同改** `.tao/adr/adr-0028-*.md`）✗ ⇒ **第二笔自行检出并发**（读到工作树已被第一笔部分改动）并**零副作用退出** ✓（临时分支已删、涉及文件 `md5` 前后一致、工作树无残留）⇒ **未造成损坏** ✓。**教训**：派单前必须**先核「上一笔是否已落地」**（以**盘上事实**判：`git log` / `git status --porcelain -uall` / 文件内容，**不以「我派过」判** ✗）；**同改共享文件的任务一律串行**（`AGENTS.md`「并行任务上限」）。**`status` 不改** ✓（本条主项 = 共享安装根 / 构建树并发缺口；本实例为**同一纪律面**的**派单侧**命中）。 **【实例②（2026-10-17，architect 照实登记）】**：主会话在上一笔（`architect` 提交 L3 载体）**通知未到**时再次派发 `L3 载体` engineer（同工作树**双写者** ✗）；该 engineer **自行检出并发后停手不写** ✓、改为独立复跑验收（L1/L2/L3 全绿 ✓），未造成损坏 ✓。**对策（可核）**：主会话今后**只在上一次派发的完成通知到达后**才派下一笔（不凭记忆判断 ✗）。**`status` 不改** ✓。
**【关闭（2026-10-21，`INFRA-099t`）】** 同工作树写者/门控互斥已机械落地：`tools/infra/gate_lock.py`（`flock(2)`）+ `Makefile` 的 29 个 `GATE_LOCKED_TARGETS`（目标体与**前置**迁入 `_locked-<t>`，由 `+` 逆归 make 重入）；嵌套靠「`DADAO_GATE_LOCK_HELD` + 持有者 pid 是祖先」双向校验放行；等待有界（`GATE_LOCK_WAIT`，超时 rc=75 并打印持有者）、`GATE_LOCK_FAILFAST=1` 立即 rc=75、锁不可用 rc=69 且不运行目标。证据：`--self-test` **8/8 PASS**（engineer 与 reviewer 各自复跑）；真并发 `check-modules`×`install-host`（A rc=0/413 s、B rc=0/471 s，B 打印 `WAIT … target=check-modules`）、探针持锁 + `build-builtins`/`check`（各打印 WAIT，rc=0）；反例注入（临时 `Makefile` 副本，md5 对账）⇒ `11 checks, 8 failed`、还原 ⇒ `11/11 PASS`；`make check`(L1)/`make check-modules`(L2) rc=0（L2 实计 41 次嵌套放行）。**边界**：① 互斥范围 = 同一工作树（锁文件 `<repo>/.dadao/gate.lock`），不同 `git worktree` 之间不互斥；② `GATE_LOCK` 可被环境变量覆盖（定制 env 会分叉互斥面，登记为遗留、本册不阻断）；③ 本笔只做**互斥**，**不替代** `ISS-300`（安装根手工 `cp` 例外手法的收编）与安装根新鲜度检查（`ISS-210` 同面）。本条 `status` 由 `open` → `closed`（验收 #8）。"
- id: ISS-231
  title: "【P2】`tools/infra/apply_series.py` 未处理 `patchless` 组件 ⇒ 对 `chipyard` 报 `KeyError: 'patch_dir'`，`make apply-series` 中断（其后 `musl` 的补丁集不再被应用）"
  status: open
  scope: [infra]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `ADR-0029` 起草笔的 `docs/Process-01 §7` 重放现场；architect 独立复现后立项，2026-10-16）】**现象（现场，只读；仓库根 `master` = `05792c4`、工作树干净）**：`python3 tools/infra/apply_series.py` ⇒ rc = **1**；输出依次 = `llvm-project` / `qemu` / `embench-iot` / `picolibc` 四行 `apply-series: <name> already applied (base+1, matches patches); skipped`，随后 `Traceback (most recent call last): ... File \"tools/infra/apply_series.py\", line 108, in main / patches_dir = ROOT / component[\"patch_dir\"] / KeyError: 'patch_dir'`。**根因**：`tools/infra/apply_series.py` 的 `main()`（行 101 起）**无条件**读 `component[\"patch_dir\"]` / `component[\"patch_series\"]`（行 108/109），**未处理 `patchless = true`**；而 `manifests/components.lock.toml` 现行有 **4 个 `enabled = true` 的 patchless 组件**（`chipyard` / `linux` / `llvm-test-suite` / `libc-test`），其中 `chipyard` 的源已 fetch（`.work/source/chipyard/.git` 存在 ⇒ 不走行 105 的 `missing source` 分支）⇒ 行 108 直接 `KeyError`。**同仓其它工具已正确处理 `patchless`（⇒ 本项是 `apply_series.py` 的单点漏）**：`tools/infra/manifest_check.py:45-52`（并断言「`patchless` 组件**不得**声明 `patch_dir`/`patch_series`」）、`tools/infra/check_patch_tree.py:310/360`（`patchless; skipped`）。**影响**：① `make apply-series`（`Makefile:151`）与 `make prepare`（`= fetch apply-series`，`Makefile:154`）在**当前 lock 下确定性失败**；② 中断点在 `chipyard`，而 `musl`（carries 补丁集）在 manifest 中**位于其后** ⇒ 该轮 `musl` 补丁集**不会被应用**（干净环境下 `make fetch && make apply-series` 后 `musl` 补丁集缺失，连带影响依赖它的构建目标）；③ 现状被「源树已收敛为 `base+1`」掩盖（四行 `skipped` 之后的 `KeyError` 不改变已收敛结果）⇒ 易漏看。**修法建议（未实施 ✗）**：`main()` 循环内在访问 `patch_dir`/`patch_series` **之前**加 `if component.get(\"patchless\"): print(f\"apply-series: {name} patchless; skipped\"); continue`（与 `check_patch_tree.py` 用词对齐）；可选配套「`patchless` ⇒ 两字段必须缺席」断言（复述 `manifest_check.py:52` 既有约束）。**边界**：**非本线引入** ✗（与 `rela.si` / `REL32` 改线无关，只是在 `ADR-0029` 起草笔的 `Process-01 §7` 重放中**现场触发**）；本项**只登记** —— 未改 `tools/**`、未改 `manifests/**`；`status` 取 `open` 的依据 = 缺陷仍在、`make apply-series` 可确定性复发、需改工具（`resolved_by` 保持 `null`，`open` 时不得填非空）。**现场留存**：复现命令 `python3 tools/infra/apply_series.py`（rc=1）；原生日志 = `/tmp/opencode/ADR-0029/apply_series-repro.log`（临时目录；单条命令可复现）。**复现前提（写清以免误判）**：`chipyard` 源存在（`.work/source/chipyard/.git`）且该组件 `enabled = true`；各 patch 组件均已 `base+1`（否则会先走 `refusing to apply` / 应用补丁分支，不走到本 `KeyError`）。〔LLVM-120t 现场复核（2026-10-20，architect 登记；同一缺陷早期另有 `ISS-224`/P3 登记）〕**复发确认（未修）**：`LLVM-120t` 改了 `components/musl/patches/**` 后跑 `make apply-series` ⇒ `tools/infra/apply_series.py:108` `KeyError: 'patch_dir'`（**rc=2**），**其后组件（含 `musl`）静默跳过**；本次 2 份 musl 补丁**未经 `apply-series` 落地**，改以 `check-patch-tree`（185 OK）+ 本册 scratch-apply 等价验证兜底（24 补丁 → `git write-tree` == HEAD tree）。**影响升级（比上文更严重）**：不只 `make prepare` 不可用 —— 凡「改 musl 补丁 → apply → 构建」的任务都会**以旧补丁集构建**而门控全绿（假绿面）⇒ 应按上文一行守卫（`if component.get(\"patchless\"): continue`）优先修，判据 = `make apply-series` rc=0 + 全量重放。**边界**：本笔只追加现场记录，未改 `tools/**` ✗。"
- id: ISS-232
  title: "【P3】`llvm-mc --show-encoding` 对低半 `%pcrel_lo`（`rbha ≥ 4`）命中上游断言 ⇒ SIGABRT（rc=134）；**仅显示模式**（`-filetype=obj` 不受影响）；修法触及被 `check_mc` A7 与契约 §2.2 钉住的 fixup 元数据表 ⇒ **须裁定**"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `LLVM-095t`「遗留① 修复」完成区「新发现②」+ 收尾复核块 ②；architect 提交/文件集审核时立项并**现场复现复核**，2026-10-16）】**现象（现场复现，rc=134）**：`echo 'ld.o rb4, [rb4, %pcrel_lo(.Lhi0)]' | llvm-mc --triple=dadao-unknown-elf --show-encoding` ⇒ **SIGABRT**（signal=6，**rc=134**）；文案**逐字** = `llvm-mc: …/llvm/lib/MC/MCAsmStreamer.cpp:134: void llvm::MCAsmBaseStreamer::addEncodingComment(…): Assertion `Bit == 0 && \"Encoder wrote into fixed up bit!\"' failed.`。**触发条件**：低半（`%pcrel_lo`）且目的 `rbha ≥ 4`（`clang` 默认的 `rb4` 即命中）；同文本换 `rb1`（`rbha < 4`）⇒ **rc=0** 且正常打印 `… fixup A - offset: 0, value: %pcrel_lo(.Lhi0), kind: DADAO_FK_PCREL_LO`。**只影响该显示模式** ✗：`-filetype=obj` 同内容 **rc=0**，且 `llvm-readobj -r --expand-relocs` 得**两条**记录（`R_DADAO_PCREL_HI (14)` @`0x0` + `R_DADAO_PCREL_LO (15)` @`0x4`，LO symbol = `.text` 节符号）⇒ 目标文件产出**不受影响**。**根因（现场判据）**：`MCFixupKindInfo` 的 `{Offset 0, TargetSize 12}` 与 streamer 在**大端**下的 **MSB-first** `FixupMap` 位序不符 —— 映射落到 opcode / `rbha` 位（需在已设 `Bit` 处再写 ⇒ 断言）。**修法触及被钉住的载体**：须动 `components/llvm-project/patches/…/DADAOAsmBackend.cpp` 的 fixup 元数据表，而该表被 `check_mc.py` 的 `A7`（「字段宽 18/12」）与 `.tao/contracts/contract-elf.md §2.2` 引用同时钉住 ⇒ **须架构师 / 用户裁定**（可能连带改 `A7` 断言与契约叙述），**不擅自改** ✗。**`status` 取 `open`（architect 判断）**：① 缺陷**仍在**（现场 rc=134 复现）；② **可复发**（任一 `rbha ≥ 4` 的低半 `--show-encoding`，含 `clang -S` 打印文本回流）；③ **须裁定**（修法跨 `A7` 门控 + 契约引用）。**性质** = 显示模式缺陷（**非** `LLVM-095t` 交付面缺陷 —— 其交付判据 = `%pcrel_*` 可解析 + 文本往返逐字节 + 对象两条记录，均已交付并留证；本项为**同笔发现、按裁定不修**）。**边界**：本笔**未改** `components/**`、未改 `contracts/`、未改 `.tao/contracts/**`（只登记 + 给触发条件 / 影响面 / 修法边界）。证据指针：`.tao/archive/M8/llvm/LLVM-095t-REL32与PLT内联.md`「遗留① 修复 完成记录」→「新发现/坑 ②」+「遗留问题 ②」+「收尾遗留处置 完成记录」§②；`.tao/archive/M8/qemu/QEMU-061t-rela-si解码与语义.md`「收尾遗留处置…」§④；`.work/log/llvm/QEMU-061t-show-encoding-recheck.log`（本机留档，不入库）；`tests/llvm/lit/MC/DADAO/pcrel-specifier.s` L19–24（注释明写该显示模式缺陷 + 低半改走 `-filetype=obj`）；现场工具 = `.dadao/cross-toolchain/bin/llvm-mc`（md5 `59f5b7f20780bcc0618880aaebcb0b75`）。**交叉引用**：`ISS-210`（安装根 × 构建树一致性：本项判定以**已安装根**为准）、`LLVM-095t`（发现者）、`contract-elf.md §2.2`（`14`/`15` 两行 + `imms18`/`imms12` 字段）。"
