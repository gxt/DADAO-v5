- id: ISS-267
  title: "【P3】`llvm-test-suite` 暴露的 LLVM/DADAO 后端缺口：clang 崩溃 2（`lencod`/`obsequi`，rc=-6）+ `brind` Cannot select + varargs 未支持 + f80 `flog` libcall 缺"
  status: open
