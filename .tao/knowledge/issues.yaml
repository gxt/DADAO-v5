  notes: '【正式登记（源 `INFRA-066t`，2026-10-12；删 `INFRA-057t` 过滤表后逐源实测）】**性质 = 消费侧缺口的剩余面，非 `INFRA-066t` 引入**。方法：以 `.work/build/picolibc/compile_commands.json` 的**全部 1120 条**编译项逐条重编（**全量、非抽样**）⇒ `non-OK = 41`（现场统计），据此把 `meson.build` 的 DADAO 过滤表**最小化到 41 条**（原表 = 整目录 `libm/` + 20 条 libc 源；现仅 41 条、无目录级排除）。六类根因（每类给失败签名 + 代表源）：**(a) FP 谓词 `SETO`/`SETUO`/`SETUNO` 缺 lowering（30 源，最大类）**——`error in backend: DADAO: unsupported floating-point branch condition`（`libm/math/s_pow.c`、`s_hypot.c`、`s_acos.c`、`s_j0.c` 等）与 `... unsupported floating-point select/setcc condition`（`libm/common/s_fma.c`）；同根因亦解释 FP 探针 `isnan_d`/`isfinite_d`=`ERROR` 与 `test/testsuite/newlib.math/dcvt.c`=`BACKEND_OTHER`（`LLVM-079t` 已覆盖 10 个有序/无序谓词，**缺的正是 `SETO`/`SETUO`/`SETUNO`**，见 `DADAOISelLowering.cpp` 的 `default: report_fatal_error`）。**(b) f32 libcall 缺（5 源）**——`no libcall available for frint`（`libm/math/sf_scalb.c`、`sf_tgamma.c`、`common/sf_nearbyint.c`）、`ftrunc`（`srf_lgamma.c`）、`flog`（`sf_log10.c`）；与 `LLVM-080t`「P1 仅双精度」口径一致（f32 未纳入）。**(c) i64 `bswap`（1 源）**——`Cannot select: t45: i64 = bswap`（`libc/search/hash_page.c`）。**(d) 截断存储（2 源）**——`Cannot select: ... store<(store (s32) ..., trunc to f32>`（`libc/stdio/vfscanf.c`、`vfwscanf.c`）。**(e) `"r"` 内联汇编约束不收指针（2 源）**——`could not allocate input reg for constraint ''r''`（`libc/string/memset_explicit.c`、`memset_s.c` ⇒ `memset_s`/`memset_explicit` 不可用）。**(f) `long double` strtod libcall（1 源）**——`unsupported library call operation`（`libc/stdio/atold_engine.c`）。**影响**：`pow`/`hypot`/`j0`/`y0`/复数函数/`scanf` 族/`memset_s` 仍不可链接；**`libm` 主体（f64 三角/指数/对数/取整/fmin-fmax）已恢复**（8 符号 `nm` 全命中，见 `INFRA-066t` 完成区）。**建议**：(a) 单独立 LLVM 任务（预计一次改动即可删 30/41 条），(b)(c)(d)(e)(f) 视 M7 需要分批。**只登记**。证据指针：`.tao/tasks/infra/INFRA-066t-*.md` 完成区 + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（全量扫描 TSV 与逐源日志）。 **【picolibc test 使用量化（`TESTCASES-042t` 现场，2026-10-12）】**本 6 类缺口对应 picolibc 自带 test **blocked 85 条中的 57 条**（余 28 = 另立 issue 的 REL26 弱符号 26 + `setjmp` 桩 1 + QEMU softfloat 1）：**(a) 33**（harness 直接标记 29 + 经（a）过滤源符号 `_pow`×2 / `fma`×1 / `hypotl`×1）、**(b) 8**（直接 4 + `log10f` / `lgammaf_r` / `tgammaf` / `nearbyintf`）、**(d) 14**（`vfscanf`×11 / `vfwscanf`×3，经过滤源符号）、**(e) 2**（`memset_s` / `memset_explicit`）；**(c) `bswap` 当前无对应 test（0 条）**。计数取自 `full-report.json` 逐条 `reason` 机械分桶（`TESTCASES-042t` 完成区 blocker 溯源）。 **【收口进展（`LLVM-084t`，2026-10-12）】(a) 类已收口**——后端补 `SETUO`/`SETO`/`SETONE`/`SETUEQ` 与 6 个整型 don''t-care 码 lowering（`components/llvm-project/patches/llvm/lib/Target/DADAO/**`），过滤表 **41→11**（删 30、逐条可编、未多删）。**计数更正**：上文「(a) 33」为估算 ⇒ 实测解锁 **20**（`picolibc-tests-full` pass 132→152 / blocked 85→65 / fail 0 / excluded 18），余 13 条移因其它缺口（`__muldc3` 6〔新立 `ISS-196`〕、QEMU 2-NaN 4〔`ISS-195`〕、(b) 2、REL26 1〔`ISS-194`〕）；**(b) 计数 8→10**（现直接 5 + `log10f` / `lgammaf_r`×2 / `tgammaf` / `nearbyintf`）；(d) 14 / (e) 2 不变。证据：`.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`（full-after 报告逐条 reason）；`.tao/tasks/llvm/LLVM-084t-*.md`。 **【收口进展（`LLVM-086t`，2026-10-12）】(e) 类已收口**——后端补 `DADAOTargetLowering::getRegForInlineAsmConstraint`（`components/llvm-project/patches/llvm/lib/Target/DADAO/**`），**只**把单字母 `"r"` 映射到**数据寄存器类** `GPRD`（指针类参数经 `rb2rd` 桥接 GPRB→GPRD），其余约束回落基类；**未**新增 `"b"`/`"f"`（用户 2026-10-12 裁定 C「只解锁，不立约定」）。消费侧同步：`components/picolibc/patches/meson.build.patch` 删 (e) 两条（`memset_explicit.c`/`memset_s.c`）⇒ 过滤表 11→**9**（= (b)5+(c)1+(d)2+(f)1）。实测 `picolibc-tests-full` **pass 174→176 / blocked 39→37 / fail 0 / excluded 22**（total 235），解锁 = `test-malloc`、`test-memset_s`。**本 issue 保持 `open`**（六类未全清 ⇒ 依字段约束「open 时 `resolved_by` null」不回填），(e) 的 `resolved_by` = `LLVM-086t` 记于此；剩余 **(b)/(c)/(d)/(f) 仍开放**（architect 复核：过滤表仍 9 条、`full-after` 逐条分桶与上文一致 ⇒ 口径准确）。证据：`.tao/tasks/llvm/LLVM-086t-*.md` + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`。 **【收口进展（LLVM-087t，2026-10-12）】(b) 类 f32 取整/极值已收口**——后端 `initLibcallLoweringInfo` 补 f32 八条 `RTLIB::{FLOOR,CEIL,TRUNC,ROUND,RINT,NEARBYINT,FMIN,FMAX}_F32`（与 f64 块逐字对称；符号 `floorf`/`ceilf`/`truncf`/`roundf`/`rintf`/`nearbyintf`/`fminf`/`fmaxf`），消费侧 `components/picolibc/patches/meson.build.patch` 删 (b) 四条（`sf_nearbyint`/`sf_scalb`/`sf_tgamma`/`srf_lgamma`）⇒ 过滤表 **9→5**。实测 `picolibc-tests-full` **pass 176→182 / blocked 37→31 / fail 0 / excluded 22**（total 235；`newly_blocked=∅`），解锁 **6** = `test-ceil`/`test-floor`/`test-round`/`test-lgamma`/`test-rounding-mode`/`test-tgamma`。**(b) 计数 10→0**（6 条解锁 + 4 条移因：`test-math-funcs`/`math_test` ⇒ (d)〔`LLVM-088t`〕、`test-log10`/`test-math-errhandling` ⇒ 缺 `log10f`）。**`FLOG_F32`（`log10f`）是否纳入「f32 全族」待用户裁定**（`sf_log10.c` 调 public `logf` ⇒ `llvm.log.f32`；engineer 未擅自扩范围、正确；architect 追认/待裁落点见 `.tao/tasks/llvm/LLVM-087t-*.md`「architect 追认」+「遗留问题①」）。nm 复核：sysroot `libc.a` 8 f32 符号全 `T` 命中。**本 issue 保持 `open`**（(b) 收口、(c)/(d)/(f) 仍开放 ⇒ `resolved_by` 不回填），(b) 的 `resolved_by` = `LLVM-087t` 记于此（architect 复核：过滤表现 5 条、`full-after` 逐条分桶一致）。证据：`.tao/tasks/llvm/LLVM-087t-*.md` + `.work/evidence/<任务ID>/run.sh` + `.work/log/<模块>/`。 **【(f) 复现形态（2026-10-19，architect 只读核对）】**binary128 落地后 (f) 不再以编译错误暴露，而是**链接期 `undefined symbol: __atold_engine`**：`strtold.c:67` 含 `conv_flt.c` ⇒ `dtoa.h:60-77` 的 `_NEED_IO_FLOAT_LARGE` ⇒ `conv_flt.c:579-584` 调 `__atold_engine`；定义唯一在 `libc/stdio/atold_engine.c:108`，该 TU 仍在 meson 过滤表（`components/picolibc/patches/meson.build.patch`）。落点 = **`LLVM-115t`**（llvm，`待开始`）；`ISS-287` 登记现场，本 issue `status` 保持 `open`，待该册验收后按六类剩余面统一回填。证据：`.work/log/testcases/LLVM-109t-leftover-picolibc.log`、`.dadao/dadao-unknown-elf/lib/libc.a` 的 `nm`（`libc_stdio_strtold.c.o U __atold_engine`）。 〔M8 收口核对：六类后端缺口均已由 M7/M8 任务解；picolibc 过滤表仍留 1 条 stale `hash_page.c`（无害）；保留 open 待清理。〕 **【收口（LLVM-118t，2026-10-20）】**现场重枚举后六类**全清**、过滤表 **1 → 0**。方法（全量、非抽样）：把 `.work/source/picolibc` 复制到 `/tmp/opencode/LLVM-118t/picolibc-src` 并将 `_dadao_backend_blocked` 置空，`meson setup` 得**全集 1120 个编译项**（现行带过滤表构建为 1119 条 ⇒ 等式 1120 = 1119 + 1），逐条真实 `-c` 重编 ⇒ **non_ok = 0**（TSV：`.work/log/llvm/LLVM-118t-enum-tsv.txt`，日志 `LLVM-118t-enum-all.log`）。归属：**(a)** `LLVM-084t`、**(e)** `LLVM-086t`、**(b)** `LLVM-087t`/`LLVM-089t`、**(d)** `LLVM-088t`、**(c)** `LLVM-097t`（`bswap i64` 走 `Expand`，非 `rev.o` 单指令）、**(f)** `LLVM-115t`。据此删最后一条 `hash_page.c`：`make build-picolibc` rc=0、`libc.a` 2,028,044 → **2,041,338 B**，`llvm-nm` 中 `__hash_open`/`__delpair`/`__addel`/`__get_page`/`__put_page`/`__ibitmap`/`__split_page`/`__add_ovflpage`/`__free_ovflpage`/`__get_buf`/`__call_hash` 全 **`T`**；`dbm_open` 探针链接 rc=0、guest exit 0（改前链接失败于 `undefined symbol: __delpair` 等 9 条）。`series` **14 不变**。证据：`.tao/tasks/llvm/LLVM-118t-*.md` 完成区 + `.work/evidence/LLVM-118t/run.sh`。〔旁注（同次现场，非本 issue 面）：`test-printf`/`test-printf-int` 的 `%p` 用例（277/278）在**改前改后同一对象文件**下输出逐字节相同（`cp` 归档删 `hash_page.c.o` 的 A/B 对照），与本 issue 无关 ⇒ 另行登记。〕'
- id: ISS-197
  title: "内联汇编 `\"m\"` 约束触发后端 ISel 硬崩溃（`Could not match memory address.  Inline asm failure!` + core）——对照 `\"f\"` 为优雅失败；既有问题，非 LLVM-086t 引入"
  status: closed
  scope: [llvm]
  blocks: []
  resolved_by: LLVM-119t
  notes: "【正式登记（源 `LLVM-086t` reviewer 第 1 轮非阻断发现 + architect 独立复现，2026-10-12）】**现象**：内联汇编**内存操作数**约束 `\"m\"` ⇒ 后端 `SelectionDAGISel::SelectInlineAsmMemoryOperands` 落 `report_fatal_error(\"Could not match memory address.  Inline asm failure!\")` ⇒ **硬崩溃**（`llc` rc=**134**（SIGABRT / core dumped）+ stack dump；`clang -c` 驱动 rc=1 + `fatal error: error in backend` + crash dump，同一 `report_fatal_error`）。**既有问题、非 `LLVM-086t` 引入**：以变更**前** llc 快照（`getRegForInlineAsmConstraint` hook 缺席）跑**纯** `\"m\"` 用例（`\"=*m,0\"`、无 `\"r\"`）⇒ **同样 rc=134 + 同一 fatal error**（before/after 同签名 ⇒ 非本次引入）。**对照（优雅失败）**：`\"f\"` **未**在 DADAO 约束集 ⇒ `clang` frontend `error: invalid input constraint 'f' in asm`（rc=1）、`llc` 验证期 `error: unknown asm constraint 'f'`（rc=1），**无崩溃、无 core**。**性质 = 健壮性缺陷**（应显式报错或明确「暂不支持内存操作数 inline asm」，不应 `report_fatal_error` + core）。**暴露面**：DADAO 构建的 picolibc 源 **0 处**使用 `\"m\"` 约束（`\"=*m\"` 仅见 `libc/machine/{sparc,…}` 目标专属目录、未编译）⇒ 无 test 暴露（**非阻塞**）。**登记，不建任务**。证据：`.tao/tasks/llvm/LLVM-086t-*.md`（architect 复核节）+ `.work/log/<模块>/`。 【收口（LLVM-119t，2026-10-20）】**已修**。**根因（现场 `file:line`）**：`DADAODAGToDAGISel` 未覆写 `SelectionDAGISel::SelectInlineAsmMemoryOperand`（基类默认 `return true`，`llvm/include/llvm/CodeGen/SelectionDAGISel.h:118-127`）⇒ `SelectionDAGISel::SelectInlineAsmMemoryOperands`（`llvm/lib/CodeGen/SelectionDAG/SelectionDAGISel.cpp:2354-2356`）落 `report_fatal_error`；即使选出来，`DADAOAsmPrinter` 也未覆写 `AsmPrinter::PrintAsmMemoryOperand`（`llvm/lib/CodeGen/AsmPrinter/AsmPrinterInlineAsm.cpp:511` 默认 `return true`）⇒ `$0` 印成空串。**修法**：① ISel 侧按 DADAO `[rb, imms12]` 地址形态复用 `SelectAddr` 产出 (GPRB base, simm12 off) 两操作数，支持 `m`/`o` 两码，基址非指针 bank 者经 `COPY_TO_REGCLASS` 强制到 GPRB（RA 落 `rd2rb`）；② AsmPrinter 侧新增 `PrintAsmMemoryOperand` 打印 `[rb, off]`。**验证**：最小复现 `llc` rc=134→0、`clang -c` rc=1（backend fatal）→0；运行期 12 探针（`m`/`=m`/`+m`/`=&m`/`rm`/`=rm`，栈/全局/数组元素（常量+变量下标）/结构体字段/解引用指针/大端字节序）guest exit 0（独立 oracle 手算）；musl 默认 `GETFUNCSYM`（`+m`）`clang -c`/`llc` 均 rc=0；新增 lit `tests/llvm/lit/CodeGen/DADAO/inline-asm-m.ll`（8 函数、`-verify-machineinstrs`），MC+CodeGen lit **109/109**。**边界（如实）**：`V`（not-offsetable）在上游 `InlineAsm::ConstraintCode` 无枚举值 ⇒ 前端断言（**既存上游行为、非本册引入、未改**）；`Q`/`R`/`S`/`T` 等 target 专属内存码仍按 C_Unknown 优雅报错（不崩）。证据：`.tao/tasks/llvm/LLVM-119t-*.md` 完成区 + `.work/evidence/LLVM-119t/run.sh`（default 13/13 rc=0；`--inject` 2 处可达 FAIL 红→绿）+ `.work/log/llvm/LLVM-119t-*.log`。"
