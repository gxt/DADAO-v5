  notes: "【正式登记（源 `LLVM-086t` reviewer 第 1 轮非阻断发现 + architect 独立复现，2026-10-12）】**现象**：内联汇编**内存操作数**约束 `\"m\"` ⇒ 后端 `SelectionDAGISel::SelectInlineAsmMemoryOperands` 落 `report_fatal_error(\"Could not match memory address.  Inline asm failure!\")` ⇒ **硬崩溃**（`llc` rc=**134**（SIGABRT / core dumped）+ stack dump；`clang -c` 驱动 rc=1 + `fatal error: error in backend` + crash dump，同一 `report_fatal_error`）。**既有问题、非 `LLVM-086t` 引入**：以变更**前** llc 快照（`getRegForInlineAsmConstraint` hook 缺席）跑**纯** `\"m\"` 用例（`\"=*m,0\"`、无 `\"r\"`）⇒ **同样 rc=134 + 同一 fatal error**（before/after 同签名 ⇒ 非本次引入）。**对照（优雅失败）**：`\"f\"` **未**在 DADAO 约束集 ⇒ `clang` frontend `error: invalid input constraint 'f' in asm`（rc=1）、`llc` 验证期 `error: unknown asm constraint 'f'`（rc=1），**无崩溃、无 core**。**性质 = 健壮性缺陷**（应显式报错或明确「暂不支持内存操作数 inline asm」，不应 `report_fatal_error` + core）。**暴露面**：DADAO 构建的 picolibc 源 **0 处**使用 `\"m\"` 约束（`\"=*m\"` 仅见 `libc/machine/{sparc,…}` 目标专属目录、未编译）⇒ 无 test 暴露（**非阻塞**）。**登记，不建任务**。证据：`.tao/tasks/llvm/LLVM-086t-*.md`（architect 复核节）+ `.work/log/<模块>/`。"


