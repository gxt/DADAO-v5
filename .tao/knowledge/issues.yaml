- id: ISS-271
  title: "【P2】musl 变参封装在 ADR-0031 三 bank 下把指针实参按整数取：`fcntl`/`syscall()` 两处 ⇒ `047t functional/fcntl` 两档 EFAULT"
  status: closed
  scope: [infra]
  blocks: []
  resolved_by: INFRA-092t
  notes: "【正式登记（源 = 用户 2026-10-18 裁定「检查musl中的所有系统调用的封装函数，凡是类似情况都修改封装函数，va_arg改为正确的数据类型」；architect 立项）】**根因**：`ADR-0031 D1/D3/D5` 把指针送 RB、整数送 RD，而 musl 封装沿用旧 ABI 的「实现内类型双关」——`components/musl/src/fcntl/fcntl.c:12` 用 `va_arg(ap, unsigned long)` 读第三参（POSIX：指针类 cmd 传 `struct flock *`），`src/misc/syscall.c:13-18` 一律按 `syscall_arg_t`（`long`）读（实参按各自 syscall 原型，含大量指针）。**现场（architect 探针，2026-10-18，静态链 + `qemu-dadao`，rc=0）**：`ptr-read-as-long = 0`；`syscall(SYS_uname,&u) = -1 errno=14`；`fcntl(fd,F_SETLK,&flk) = -1 errno=14`，而 `fcntl(F_SETFD)` 等整型类命令正常。**语料**：`.work/log/testcases/libc-test-user-static.log:14` / `-dynamic.log:13` 两档一致 `FAIL functional/fcntl ... fcntl.c:27: fcntl(fd, 6, &fl) == 0 failed: errno = Bad address`。**范围（初判）**：全量审计 `va_arg` 81 处（79 处参与本 target 编译）⇒ 需改 2 文件 / 7 个 `va_arg` 表达式（`syscall.c` 6 + `fcntl.c` 1）+ 2 个 `syscall()` 调用点（`fcntl.c:44` 指针落 mask 0 槽、`getrlimit.c:9` 整型 0 落地址槽）；`semctl`（`union semun`）/`prctl`/`open*`/`execl*`/`printf` 族判定为同 bank 不改。**残留（如实）**：用户代码在变参里自做指针/整数双关（标准 UB）不覆盖；`ioctl` 整型类请求（`TIOCSCTTY` 等）需 request→类型表，另立；`syscall()` 未登记号仍按全 RD。**落点** = `.tao/tasks/infra/INFRA-092t-musl封装va_arg类型面.md`（`待开始`）。**依赖**：`LLVM-102t` B 段（三游标 ABI 落到安装根，本缺陷由该 ABI 暴露）、`TESTCASES-047t`（验收载体）。**交叉引用**：`ADR-0031`、`LLVM-101t A`（`union semun` 编译器侧取法，与本册「`semctl` 不改」互为印证）、`ISS-249`（argmask 三载体，本册新增「调用点类型须与 mask 一致」约束）。**边界**：本笔只立册 + 登记；未改 musl 源码、未改任务状态、未跑重编。 〔收口（2026-10-18，`INFRA-092t` 实现完成、待验收）〕改法 = `src/fcntl/fcntl.c` 第三参按 `cmd` 三分支（指针类 `va_arg(ap, void *)`、`F_NOTIFY` 取 `long`、其余取 `int`；补漏 `F_GETOWNER_UIDS`）+ `src/misc/syscall.c` 六槽按 `__dadao_argmask(n)` 逐槽选 `void *`/`syscall_arg_t`（6 条独立赋值，避同表达式多次 `va_arg` 的未定义求值顺序）+ `src/misc/getrlimit.c` 槽 2 传 `(void *)0`；调用点 `fcntl.c` 尾改传 `arg`（mask 0）。**真值**：探针 A–I 中 E（`syscall(SYS_uname)`）/I（`fcntl(F_SETLK,&flk)`）**转绿**；`047t functional/fcntl` 静态 1/1、动态 1/1 pass；10 例小样本两档 10/10；补丁 177→180；可达 FAIL 两条（读回 `unsigned long` / 六槽全 `syscall_arg_t`）注入红→还原绿。**残留**：`ioctl` 整型请求（需 request→类型表）另立；用户代码自做指针/整数双关不覆盖；`syscall()` 未登记号仍全 RD。**证据**：`INFRA-092t` 完成区 + `.work/evidence/INFRA-092t/run.sh`（45/45 PASS）。"

- id: ISS-272
  title: "【P3】`LLVM-101t` 证据脚本 `asm-semctl-vaarg-direct` 检查方法有误（在汇编里查 `rd2rb`，应查 IR）⇒ 后续修正，本笔不改脚本"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `LLVM-101t` 第 1 轮 reviewer 验收，2026-10-18；architect 登记）】**现象**：`.work/evidence/LLVM-101t/run.sh:92-108` 以汇编块内 `grep -c 'rd2rb {rb4}, {rd5}'` 判「va_arg 是否间接解引用」。该模式实为 DADAO 后端「地址 → 指针寄存器」的正常取址转换（`load` 需要 RB 寄存器），**修后仍会出现** ⇒ 断言把正确代码判成 `FAIL`（现场 `semctl.new.s` 命中）。**正确判据（reviewer 独立复核）**：在 LLVM IR 层检查 `vaarg.cont` 的 `%vaarg.addr = phi [va.next, vaarg.in_reg], [va.stack, vaarg.on_stack]` + `load ptr, ptr %vaarg.addr`（直接从槽读取、无二次解引用）；修前形态为对槽值的间接解引用。**影响**：本次 reviewer 已用 IR + 汇编独立确认语义修复，该项 `FAIL` 不影响 `Accepted` 判决；属脚本 stale（连同 10 FAIL 中的 artifact staleness）。**处置**：后续证据脚本维护批次修正 `asm-semctl-vaarg-direct`（改查 IR 层，并保留**可达 FAIL**：注入修前 IR/对象须转红）；**本笔不改脚本**（`LLVM-101t` 任务书/完成区/审阅记录一字不改）。**等级 = P3**（1 条断言误报、非阻断）。**证据指针**：`.work/evidence/LLVM-101t/run.sh:92-108`、`.work/evidence/LLVM-101t/run.log:3`、`LLVM-101t` 审阅记录「第 1 轮 reviewer 验收」。**交叉引用**：`LLVM-101t`、`LLVM-101t` 完成区「新发现/坑」。**边界**：只登记；未改脚本、未改任务状态。"

