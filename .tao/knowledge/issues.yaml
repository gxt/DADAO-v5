  notes: "QEMU-045t 新发现②（verification-only 任务、无组件补丁改动；architect 交叉复核判定需跟踪）。`spec/DADAO-12-SEE-主管系统运行环境.md §5`『异常退出流程』：伪代码 `⟨cfxname⟩` 明确定义为 `inner_cfx_code`（**当前**执行 escape 的 cfx），步骤 1/2 恢复**当前 cfx** 的 `excp_prev_cfx_mask`/`excp_prev_run_mode`、步骤 4 返回地址用**当前 cfx** 的 `excp_cause_ip`（`excp_cause_ip + (imms18<<2)`，L830/L853）；而同节 prose（L674）称跨 cfx escape 时『硬件直接恢复到 A 的 prev 现场，B 的现场被静默丢弃』——与伪代码（以当前 cfx 为 `⟨cfxname⟩`）存在**措辞张力**。**判据：伪代码为权威**（`DADAO-12 §5` 伪代码为硬件语义权威）；QEMU 实现按伪代码，QEMU-045t 探针 `escape_cross_allowed` 验证『跨 cfx 允许时恢复当前 cfx 的非复位 prev 值』（`escape cfx0` 于 cfx63 执行 ⇒ 恢复 cfx63 的 `prev_run_mode`/`prev_cfx_mask`，非复位值 0xDEADBEEF/`USER`）。**处置：本任务未改 spec/**（`DADAO-12` 为上游只读册，`manifests/spec-readonly.lock.toml` 锁定；改它须用户**事先**授权，见 lessons §8.5 / spec/Process-06）——建议**另立 spec 任务**（经用户授权）厘清 §5 prose 措辞以消张力；若授权改动，须在**同一变更**内同步该册 `sha256` 锁。**附带（同类不同处置）**：QEMU-045t 新发现①（§5 退出流程**不恢复 `inner_cfx_code`**，只恢复 `inner_cfx_mask`/`inner_run_mode`）属『**澄清**』类（实现与伪代码一致、仅易误解）⇒ 已沉淀 `lessons §7.18`，**不立** spec 任务。教训见 `lessons §7.18`、规范见 `§8.12`。【INTEG-022t（2026-10-08，`Process-04 §3` 步骤 2/4）】**scope 归属待裁定**：M5 已达成；本项为 `DADAO-12 §5` prose/伪代码张力（**须用户授权方可收口上游只读册**；建议另立 spec 任务）⇒ 归属里程碑**未定**、**未获收口授权** ⇒ 依「不确定处提问」纪律**保持原 scope（含 M5）、标「待裁定」**，**未关闭、未擅自定为 M6**；提请用户裁定。"

- id: ISS-168
  title: "M6 待办（自 M5 范围简化转入）：『-bios』+ELF 组合加载/入口语义 + ELF loader 扩展（dadao_load_regions[]+RAM@0）+ 组合加载 ADR 决策待定"
  status: open
  scope: [qemu, integ, spec, M6]
  blocks: []
  resolved_by: null
  notes: "用户 2026-10-08 裁定（原话逐字见 INTEG-019k §第 8 轮）：「用bios的时候，直接接bin，也就是objdump后的测试程序；而用elf的时候，则不需要bootrom，只需要semihosting即可……只做bootrom+bin的情况；elf加载放在M6，与完整LLVM的任务一起进行」。⇒ M5 范围简化：M5 只做 bootrom(-bios)+bin；以下随 M6（与完整 LLVM 任务一并）：① 「-bios bootrom + ELF 应用」组合加载/入口语义（复位 PC=0xffff_ffff_0000 → bootrom 初始化 → 跳 ELF e_entry；须定 e_entry 传递方式）；② ELF loader 扩展（hw/dadao/dadao-machine.c 的 dadao_load_regions[] 现仅含旧 RAM 段+ROM、未含 RAM@0 ⇒ 组合路径需扩表 + 验证）；③ 组合加载语义的 ADR 决策（属加载模型/外部契约变更 ⇒ 须 ADR 并逐条经用户确认；M5 阶段不立 ADR）。背景：QEMU-047t 落地时的「前置风险」（见 INTEG-020t 审阅记录『architect 前置风险评估』；lessons §7.21/§8.15），architect 与 reviewer 曾倾向选项 A（另立任务）；用户裁定采纳『bootrom+bin』口径（与 ADR-0004 R1『-bios bootrom 与 M4 ELF 路径并存、非替代』自洽），该缺口不再是 M5 门槛前置。关联：ISS-165（RAM@0 C1 step2，随 M6）。"

- id: ISS-169
  title: "TESTCASES-034t 披露例外：6 个 M1/M2 期 QEMU 探针（006t/008t/009t/010t/012t/013t）仍以 exit-port 为退出通道，未随迁 SYS_EXIT"
  status: open
  scope: [qemu, testcases, M6]
  blocks: []
  resolved_by: null
  notes: "TESTCASES-034t（exit-port → SYS_EXIT 迁移）逐条披露的例外（默认全迁；此 6 个因架构/实现原因保留 exit-port）。**共同原因**：这些是 M1/M2 期的手写 `.py` ROM 探针，其测试用例是**手排字面指令表**，退出写成**单条 `st.o rdN, [rb16,0]`（rb16=exit port）**，且与**手算的 PC 相对分支偏移交错**（PASS/FAIL 臂、跳转目标）；改为多指令 `SYS_EXIT` 序列会改变字长、使手算偏移失效——而分支偏移正是其中 012t 的被测对象。逐条：① `006t` —— 显式测**保留的 exit-port MMIO 访问矩阵**（T22/T23/T28–T34：非 8B/multi 写 ⇒ ILLI、对齐优先级 ⇒ MALIGN；ADR-0004 D5.6），是**设备测试**而非退出通道；② `009t` —— 文件头标注 **OBSOLETE / DO NOT RUN**（rela.si 已删，op=0x5A 现为 UNDI），保留为历史物；③ `008t`/`010t`/`012t`/`013t` —— 用例内退出与分支偏移交错（PASS/FAIL 臂、跳过臂），展开会破坏手算偏移。**证据**：TESTCASES-034t `.work/evidence/TESTCASES-034t/run.sh` 第 1 步（acceptance 1）把残留 grep 集合**显式断言**为这 6 个文件 + `tools/integ/check_interface_alignment.py`（后者仅校验 QEMU 保留的 exit-port 设备常量）。**建议**：另立(或随 M6)任务把这 6 个探针的退出通道重写为 SYS_EXIT（含按新字长重算分支偏移），届时可移除本例外与 `check_interface_alignment.py` 的注释例外。**不影响 M5 门槛**：迁移面中所有进入 `make` 门控的向量/harness/驱动（`tests/e2e/*`、`tests/scripts/{codegen_crt0.s,build_test_binary.py,run_qemu_test.py}`、`tools/integ/run_{codegen,elf}_e2e.py`、`tests/llvm/codegen/*`）**均已迁 SYS_EXIT**且门控全绿。"
