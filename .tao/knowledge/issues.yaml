  notes: "【正式登记（源 = `INFRA-085t` 完成区「阶段 A(C1 本体) + C + E」遗留② + 本笔现场复核；architect 立项，2026-10-17）】**源记录（逐字）**：『**静态 PIE（`crt/rcrt1.c`）的 `_DYNAMIC` 仍是链接期绝对地址**（本笔按门控保留原形态，`crt1.o` 逐字节未变）——属**既有边界、非本笔回归**，`-static-pie` 未纳入 P2/P3 范围；建议随 `P3` 或另立任务登记。』**本笔复核（现场，真实输出）**：`$TC/llvm-readobj --relocations .work/source/musl/obj/crt/rcrt1.o` ⇒ `Section (3) .rela.text` = **3 条** `R_DADAO_ABS48 _DYNAMIC 0x0`（偏移 `0x4/0x8/0xC`）；同对象 `Section (9) .rela.got` = 1×`R_DADAO_ABS48 __dls2` + 1×`R_DADAO_ABS48 main`（**可写节** ⇒ 装载期 `RELATIVE`，允许）、`Section (7) .rela.text._start_c` = 1×`R_DADAO_PCREL_HI .got`（C1 已 PC 相对化）。**根因（现场读源）**：`arch/dadao/crt_arch.h:93-96` 的 `DADAO_DYNV_ASM` 分两态 —— `#ifdef DL_DYNAMIC_FROM_LOAD_BASE` ⇒ `rd2rb {rb17},{rd0}`（运行期 dynv，**本轮 C1 落地**），否则 ⇒ `set.rb rb17, _DYNAMIC`（**链接期绝对**）；而 `ldso/dlstart.c:5` 的 `#ifndef START` 才定义 `DL_DYNAMIC_FROM_LOAD_BASE`（L19）⇒ `crt/rcrt1.c:1` 定义 `START \"_start\"` ⇒ 走**绝对地址**分支。⇒ C1 只覆盖 **ldso 自身入口（`_dlstart`）的动态自举**，**静态 PIE 的 `_start` 未改**（`crt1.o`/`rcrt1.o` 的形态差异见上）。**影响（如实，不夸大）**：`-static-pie` **不在 P2/P3 交付范围**（`ADR-0025 D6`）⇒ **当前不阻断任何在役判据**；但 `rcrt1.o` 随 crt 安装集发布 ⇒ 一旦有人用 `-static-pie` 链接，lld 对 PIC 对象里的**局部绝对地址**同样拒绝（文案与本族一致：`relocation R_DADAO_ABS48 cannot be used against symbol ...; recompile with -fPIC`，见 `ISS-241`/`ISS-244` 现场），**或**（若链接器放行）装载基址 ≠ 0 时 `rb17` 指向错误地址 ⇒ 属**静默错**面，须显式登记。**等级 = P3**（非阻断：不在 P2/P3 范围 ⇒ 不影响 `INFRA-085t` 主判据；但属真缺口）。**建议修法（未实施 ✗，本笔只登记）**：(a) 按 C1 同法把 `START` 分支也改为**运行期求** `_DYNAMIC`（static PIE 无 `AT_BASE` 时可用 `AT_PHDR & -4096`/自身 phdr 同法，`_dlstart_c` 已有该启发式）；**或** (b) 显式声明 `-static-pie` 不支持并给出**可判失败**（不得静默）—— 取 (a)/(b) 须**用户语义裁定**。**证据指针**：`.work/source/musl/obj/crt/rcrt1.o`（构建产物，`llvm-readobj --relocations` 现场）、`arch/dadao/crt_arch.h:69-96`、`ldso/dlstart.c:5/19`、`crt/rcrt1.c:1`；`INFRA-085t` 任务书「阶段 A(C1 本体) + C + E」完成区「遗留问题 ②」。**边界**：本笔**未改** `components/**` ✗、**未改** `spec/`·`contracts/`·`.tao/contracts/**` ✗、**未改** 任何任务书 `**状态**` ✗。**交叉引用**：`INFRA-085t`（登记源 + C1 落点）、`LLVM-098t`（clean 复核结论：`.rodata` 类 = 陈旧对象假红）、`ISS-241`/`ISS-244`（同文案，不同机制）、`ADR-0025 D6`（P1/P2/P3 分期）、`ADR-0026`（动态链接行为）、`contract-dynlink.md §6.2/§6.3`（`AT_BASE` 语义）。"
- id: ISS-246
  title: "【P2】`__thread` 用户变量不可用：clang `TLSSupported=false` + 后端无 `GlobalTLSAddress` lowering ⇒ 影响 `libc-test` TLS 用例与部分程序（**不阻塞 `P3`**）"
  status: open
  scope: [llvm]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `INFRA-085t` 阶段 `B1+D1` 完成区「已知限制」+ `D1-⑤`/`D1-⑥②`；architect 收尾时立项，2026-10-17）】**现象（诊断原文，两条独立缺口）**：① 源码级（Sema）：`clang --target=dadao-unknown-elf -O1 -c …` ⇒ `error: thread-local storage is not supported for the current target`（`clang/lib/Basic/Targets/DADAO.h` 的 `TLSSupported = false`）⇒ **任何 `__thread` 声明都编不过**；② 绕过 Sema 直接给 IR（`llc`）⇒ `Cannot select: … GlobalTLSAddress`（`llvm/lib/Target/DADAO/**` **零 TLS 代码**，无 `GlobalTLSAddress` lowering）⇒ 即便放开 ① 也发不出访问序列。**已就位、不重做**（同一现场核对）：MC 接受 `.tdata`/`.tbss`（`SHF_TLS` + `STT_TLS`）、lld 在**无 scripted `PHDRS`** 时**自动**生成 `PT_TLS`（实测 `p_filesz`=8/`p_memsz`=16/`p_align`=8）、musl arch 宏已定值（`TP=rb3`〔`contract-abi §1.3`〕/`TLS_ABOVE_TP`/`GAP_ABOVE_TP=0`/`TP_OFFSET=0`/`DTP_OFFSET=0`）、重定位类型 10/11/12/13 已映射且 `lld/ELF/Arch/DADAO.cpp` 对 10/11/12 **显式 `Err`**（遇即报错、非静默）。**影响**：`libc-test` 的 TLS 用例、以及依赖 `__thread` 的程序在本 target 上**编不过**（显式诊断）；`libc.so` 自身不依赖 `__thread`（musl 线程态走 `struct pthread` 字段）⇒ 共享库与 `P2` 动态可执行**不受影响**；**不阻塞 `P3`**（`QEMU-062t` 的装载面：auxv/`PT_INTERP`/装载基址与 TLS 用户变量无耦合）。**归属**：`LLVM-100t`（`__thread` 与 TLS codegen；阶段 0 先判 `local-exec` 的 TPOFF 载体，涉新类型即按 `ADR-0019 D10`「编号冻结」停下留问）；`status` 取 `open` 的依据 = ①② 两缺口**仍在**、可确定性复发、需改 `components/llvm-project/**`（**须 `install-host`**）；`resolved_by` 保持 `null`（`check_issues.py`：`open` ⇒ `null`），**待 `LLVM-100t` 验收后**回填 `closed` + `resolved_by: LLVM-100t`。**边界**：本笔**未改** `components/**`、`spec/`、`contracts/`、`.tao/contracts/**`（只登记）。证据指针：`.tao/archive/M8/infra/INFRA-085t-动态链接musl-ldso接入.md`「已知限制（2026-10-17，阶段 B1 + D1 之后）」+ 完成区 `D1-⑤`/`D1-⑥②` +「新发现/坑 ④」；探针 `.work/evidence/INFRA-085t/b1d1/run.sh`（`D1.13`/`D1.14` = `BLOCKED`，rc=2 显式区分、不冒充绿灯）。**交叉引用**：`LLVM-100t`（承接任务）、`INFRA-085t`（登记源）、`ADR-0019 D10`/`D12`（类型号冻结）、`contract-abi §1.3`（`rb3` = `rbtp`）、`contract-dynlink §7`（TLS 口径）、`P3` = `QEMU-062t`（不受阻）。"
- id: ISS-247
  title: "【P2】`qemu-user`（`qemu-dadao`）无法装载按 `dadao.lds` 基址（`0xFC00_0000_0000`）链接的静态 ELF（47 位宿主 VA ⇒ `Unable to find a guest_base`）⇒ 静态/动态测试需在 lld 默认基址链接"
  status: open
  scope: [qemu]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `QEMU-062t` 完成区「新发现/坑 ①」；architect 立项，2026-10-17）】**现象（现场，逐字）**：`qemu-dadao ./<静态 ELF>`（该 ELF 按 `tests/scripts/dadao.lds` 链接）⇒ `error_report` 原文 = `<image>: Unable to find a guest_base to satisfy all guest address mapping requirements`（源码 `.work/source/qemu/common-user/probe-guest-base.c:311`）⇒ `exit(EXIT_FAILURE)`，**未能进入 guest**。**根因（两层，现场）**：① `tests/scripts/dadao.lds` 的 `MEMORY { RAM (rwx) : ORIGIN = 0xFC0000000000, LENGTH = 16M }` ⇒ 首个 `PT_LOAD` 落在 `0xFC00_0000_0000`（M4 测试机 RAM 基址；该脚本属 M4 裸机 ELF 口径，见 `contract-elf.md §5`/`ADR-0004`）；② 宿主 = Linux x86-64（**47 位用户 VA**，上限 `0x7FFF_FFFF_FFFF`）⇒ 宿主 `mmap(0xFC00_0000_0000)` = `ENOMEM`，而 QEMU user-mode 的 `guest_base` 探测（`common-user/probe-guest-base.c`：`pgb_find_itree` 从 `1 GiB` 起**只向上**搜索、`pgb_find_fallback` 同样从 `skip` 递增）**不搜索负平移** ⇒ 该镜像需要的 `guest_base = 0`（identity）在宿主上不可能成立；`-B`（`pgb_fixed`）只校验对齐 + 在该基址可 `mmap`，**负偏移形态不在支持范围**。**影响面（触发面）**：**任何**用 `dadao.lds` 链接的产物（含三套测试 `embench-iot` / `libc-test` / `llvm-test-suite` 若沿用该脚本的静态/动态档）在本宿主上**全部不可装载**；`QEMU-062t` 的静态/动态验收因此改用 **P1 的 `crt1.o` + `libc.a` 在 lld 默认基址**链接的程序（**P1 产物与 `dadao.lds` 均未改** ✗）。**在役绕行（已用）**：测试程序按 lld **默认基址**链接（非 `-T dadao.lds`）⇒ 可装载、可跑（`QEMU-062t` 两档 E2E 即此口径）。**待裁定（不擅改 ✗）**：(a) `qemu-user` 侧支持「guest VA 高于宿主 VA 上限」的装载（需 `guest_base` 负平移 / `reserved_va` 类改造，属 qemu 补丁面）；(b) 测试侧统一改用默认基址（约定层，不改 `dadao.lds`）；(c) 改 `dadao.lds` 的 `RAM ORIGIN`（属 `tests/scripts/` 与 `contract-elf.md §5` 契约口径 ⇒ **须用户授权**）。**证据指针**：`.tao/archive/M8/qemu/QEMU-062t-qemu-user的dadao后端.md` 完成区「新发现/坑 ①」；`tests/scripts/dadao.lds:28`（`RAM ORIGIN`）；`.work/source/qemu/common-user/probe-guest-base.c:120-322`（向上搜索 / `pgb_fixed`）；本笔**无**落盘失败日志（该探测为 `QEMU-062t` 执行期的一次性现场，未留存）——如实标注。**交叉引用**：`QEMU-062t`（登记源）、`QEMU-061t`、`contract-elf.md §5`/`§6.1.2`、`ADR-0004`（M4 RAM 基址）、`ADR-0025 D6`（`P3` 范围）。**〔用户裁定（2026-10-17 深夜，渠道 = 经主会话问答；本笔据其原话落纸）〕** 用户原话（**逐字**）：「**ISS-260:1；ISS-247：用户模式，用0x10000**」⇒ **裁定 = 候选 (b) 的显式化**：**用户态（`qemu-user`）链接基址用 `0x10000`；`dadao.lds` 不动**（仍为 M4 裸机口径）。**落地口径**：测试脚本/驱动按 lld 默认基址（最低 `PT_LOAD=0x10000`）链接，禁 `-T dadao.lds`；`dadao.lds` 与 qemu 装载面均不改。`status` **保持 `open`**（口径已定、落实在测试脚本；本笔未改脚本）、`resolved_by` 保持 `null`。"
- id: ISS-252
  title: "【M9】musl 端口无 `clone.s`（`src/thread/clone.c` 返回 `-ENOSYS`）⇒ 线程 / `posix_spawn` / `popen` 全不可用；`libc-test` 静态档 20 例 blocked"
  status: open
  scope: [infra, qemu]
  blocks: []
  resolved_by: null
  notes: "【正式登记（源 = `TESTCASES-047t` 静态档现场，2026-10-17；architect 立项）】**现象**：静态档 `blocked=25` 中 **20 例**同根因 —— 18 条线程用例 + `popen`/`spawn`（经 `posix_spawn → __clone` 得 `ENOSYS`）。**根因**：musl 端口无 `src/thread/dadao/clone.s`，`src/thread/clone.c` 直接返回 `-ENOSYS`（`INFRA-082t` 的单线程边界）。**归口 = `M9`**（线程/TLS 同批；用户 2026-10-17 已把 TLS 推到 M9，落点 `LLVM-100t`），`M8` 不要求线程。**等级 = P2**（不阻断 `M8` 判据；阻断线程面用例）。**证据指针**：`TESTCASES-047t` 完成区 blocked 段。**交叉引用**：`INFRA-082t`、`LLVM-100t`、`M9`。"
- id: ISS-255
  title: 【P3】`qemu-dadao` 上两条 `libc-test` 回归用例以宿主 `SIGBUS`/`SIGTRAP` 终止（`regression/flockfile-list`、`regression/setenv-oom`）⇒ 归 qemu 面诊断
  status: open
  scope:
  - qemu
  blocks: []
  resolved_by: null
  notes: '【正式登记（源 = `TESTCASES-047t` 静态档现场，2026-10-17；architect 立项）】**现象**：`regression/flockfile-list`、`regression/setenv-oom` 两例在 `qemu-dadao` 上以宿主 `SIGBUS`/`SIGTRAP` 终止（非 guest 退出码），归 `blocked`。**性质（未定根因）**：可能是 qemu-user 的 guest 栈/内存映射或 `setenv` OOM 路径的宿主侧故障；**不预设**为测试缺陷。**等级 = P3**（2 例、非阻断）。**处置**：qemu 面诊断（宿主信号来源 / guest 地址映射 / 是否 `setenv-oom` 依赖内存上限），给出「guest 可判失败」或修 qemu。**证据指针**：`TESTCASES-047t` 完成区 blocked 段。**交叉引用**：`QEMU-062t`（user-mode 后端）、`ISS-247`（装载基址）。**〔追加（2026-10-17，architect）〕** 同类 flake 另见 **`ISS-257`**（`regression/pthread_create-oom`：一次 `pass`、其后 5/5 pilot + 8/8 单跑全 `BLOCKED`；同属 guest `setrlimit(RLIMIT_AS)` 直通宿主）。 〔立册（2026-10-18，architect）〕归 `QEMU-063t`（与 `ISS-266` 同批；诊断时间盒 1–2 h，超时归因 + 保留现场）。 〔逐例归因（2026-10-19，`QEMU-063t`）〕① `regression/flockfile-list`：宿主 `SIGBUS`（`BUS_ADRALN`，si_addr `0x394fc`）由 `cpu_mmu_lookup` 的对齐检查在 `do_st8_mmu` 处触发 —— 该 8 B store 地址为 4 mod 8；根因 = 语料自带的 interpose `malloc` 从 `static unsigned char buf[1<<20]` 里按字节切块、不保证 8 B 对齐（`libc-test/src/regression/flockfile-list.c`），而 DADAO 8 B 访问要求 8 B 对齐 ⇒ **负载自身问题**，非 qemu 缺陷。② `regression/setenv-oom`：**qemu 限制**（家族同 `ISS-257`）——`setrlimit(RLIMIT_AS)` 直通宿主，随后 GLib 分配 512 B 失败并 `g_error` ⇒ `qemu-dadao: QEMU internal SIGTRAP`；需 linux-user 侧虚拟化 `RLIMIT_AS`，本册时间盒内未实现。证据：`.work/log/qemu/QEMU-063t-gdb-flockfile-list.log`、`.work/log/qemu/QEMU-063t-setenv-oom.log`、`.work/evidence/QEMU-063t/`。`status` 保持 open。 〔M8 收口核对：两例归因已完成（语料 8 B 对齐 / `RLIMIT_AS` 直通宿主）；qemu 侧虚拟化未做；不阻断 M8。〕'
- id: ISS-257
  title: 【P3】`libc-test` 静态档 `regression/pthread_create-oom` 不稳定：一次记 `pass`、其后全 `blocked`（guest `setrlimit(RLIMIT_AS)` 直通宿主 ⇒ qemu 侧分配失败 / 宿主 `SIGTRAP`；与 `ISS-255` 同类）
  status: open
  scope:
  - qemu
  blocks: []
  resolved_by: null
  notes: '【正式登记（源 = `TESTCASES-047t` 静态档第 3/4 轮现场，2026-10-17；architect 立项）】**现象**：`regression/pthread_create-oom` 在一次全量中记 `pass`（计数 `304/24`），随后 **5/5 套件 pilot + 8/8 单跑**均 `BLOCKED` —— 落盘现场如 `.work/log/testcases/INFRA-087t-static.log:342`「`Observed: qemu killed by host signal 5`」。（那次 `pass` 的 stdout 未落盘，取自 engineer 自审记录；可复核的落盘现场均为 `BLOCKED`。）**根因方向（未定根因，不预设修法）**：该用例自身 `setrlimit(RLIMIT_AS)` 在 qemu-user 下作用于**宿主 qemu 进程**（guest rlimit 直通宿主；同因见 `regression/setenv-oom`，`INFRA-087t-static.log:361-362`）⇒ 其后 qemu 内部分配失败（pilot stderr 报 `GLib failed to allocate 512 bytes`，未落盘）⇒ 宿主 `SIGTRAP`（信号 5），用例未达判定。注意该用例在 `pthread_create → EAGAIN` 路径上**可合法 pass**（musl 端口无 `__clone`，`ISS-252`），故计数在 `303/25` 与 `304/24` 间抖动。**处置**：**不改标签**（保持 runner 实况分类，`blocked` 计入静态档 `blocked`，`fail=0` 结论不受影响）；诊断落 qemu 面（guest rlimit 是否应与宿主隔离 / 分配失败应报 guest `ENOMEM` 而非宿主信号），与 `ISS-255` 同批。**等级 = P3**（1 例、非阻断）。**证据指针**：`.work/log/testcases/INFRA-087t-static.log:342`、`TESTCASES-047t` 第 3/4 轮完成区。**交叉引用**：`ISS-255`（同类宿主信号 / RLIMIT_AS）、`ISS-252`（无 `__clone`）、`QEMU-062t`、`TESTCASES-047t`。 〔M8 收口核对：与 `ISS-255` 同族（`RLIMIT_AS` 直通），随线程面 `M9`；不阻断 M8。〕'
