# contracts/fp_semantics.yaml — DADAO SimRISC 0.5.4 FP 语义投影（scope: fp，60 条）
#
# 来源（Spec-first，不从 LLVM/QEMU 反推）：
#   spec/SimRISC-00 §浮点寄存器 / §浮点状态寄存器
#   spec/SimRISC-07 §格式转换指令 / §S2D1 / §S1D1 / §浮点符号位操作指令 /
#                   §浮点比较指令 / §浮点分类指令
#   spec/SimRISC-01 §存取RF寄存器
#   spec/SimRISC-02 §寄存器组之间块赋值 / §浮点条件赋值
#   spec/SimRISC-03 §立即数常数赋值：Immediate constant
#
# 说明：
#   * 本文件**不含编码**（编码唯一真源 = contracts/opcodes.yaml）。
#   * 本文件**不含任何期望值**（oracle 方案见 docs/fp-oracle-design.md，本任务不实现）。
#   * 叙述合约 = .tao/knowledge/contract-fp.md；semantics_ref 指向其族锚点。
#   * 合法性规则 = contracts/legality_rules.yaml；legality_refs 引用其 id。
#   * 每次指令记录必须含其族声明的 required_keys（由 tools/spec/check_fp_contract.py 门控）。

version: "0.5.4"
scope: fp
count: 60

# ── FCSR（rf0）环境 ─────────────────────────────────────────────────────────
fcsr:
  register: rf0
  width: 64
  spec_cite: "SimRISC-00 §浮点状态寄存器"
  fields:
    - name: qnan_fo
      bits: "[63:51]"
      access: read-only
    - name: sbz_hi
      bits: "[50:34]"
      access: sbz
    - name: rounding_mode
      bits: "[33:32]"
      access: read-write
    - name: qnan_ft
      bits: "[31:22]"
      access: read-only
    - name: sbz_lo
      bits: "[21:5]"
      access: sbz
    - name: accrued_flags
      bits: "[4:0]"
      access: read-write
  write_mask: ["[33:32]", "[4:0]"]
  rounding_modes:
    "00": RNE
    "01": RTZ
    "10": RDN
    "11": RUP
  accrued_flags:
    "0": NV
    "1": DZ
    "2": OF
    "3": UF
    "4": NX
  no_trap: true

