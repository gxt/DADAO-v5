    semantics_ref: "contract-fp.md#cs_rf"
    required_keys: [family, spec_cite, semantics_ref, legality_refs]
  rf_mem:
    spec_cite: "SimRISC-01 §存取RF寄存器"
    semantics_ref: "contract-fp.md#rf_mem"
    required_keys: [family, spec_cite, semantics_ref, legality_refs]
