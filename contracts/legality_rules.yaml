# DADAO SimRISC 0.5.4 — 合法性规则目录（M1）
#
# 来源：spec/ 规范文档（SimRISC-00~04）经 .tao/knowledge/contract-isa.md 归一化投影，
#       不从实现反推；M1 范围见 contract-isa.md §6/§7.4/§7.5 与附录 A。
#
# 每条规则：
#   id          : 稳定标识符
#   fault       : 异常类型（ILLI/UNDI/MALIGN/IALIGN/RASOF/RASUF）
#   kind        : 检查类型（static/dynamic）
#   spec_cite   : 规范引用（只写章节号，不写行号）
#   status      : active/deferred（deferred = 该特性属 M1 范围外，留后续阶段）
#   description : 规则描述
#
# 字段引用约定：description 中引用的寄存器字段名与 contracts/opcodes.yaml 的
#   fields[].name 一致（例如块赋值目的字段为 rdhb/rbhb/rahb，而非 rdha/rbha）。
#
# 范围：
#   - M1 指令 = contract-isa.md 附录 A.1~A.6；编码见 contracts/opcodes.yaml（227 条：
#     152 条 M1 + 60 条 scope: fp + 15 条 scope: excluded）
#   - M1 范围外（deferred）：RF 浮点（SimRISC-03 全部）、LR-SC 原子（SimRISC-12 §LR-SC指令）、
#     特权 cfx（SimRISC-04 §特权指令）；按 ADR-0004 D5 执行这些编码触发 ILLI
#   - SBZ 非零 → ILLI 由 ADR-0004 D5.3 冻结（架构自定义；spec 未规定 fault 类型）

rules:
  # ── 目的寄存器规则 ────────────────────────────────────────────────────────────
  - id: dst_rd0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-00 §数据寄存器"
    status: active
    description: >
      写 rd0 为目的寄存器时触发 ILLI 异常。
      单目的指令不允许（丢弃唯一结果无语义）。
      例外：rrrr 双目的 add.uo/add.so/sub.uo/sub.so/mul.uo/mul.so 允许其中一个目的为 rd0
      （丢弃对应半结果），但不能同时为 rd0，也不能为同一非 rd0 寄存器（见 dst_dual_same）。
      例外：ret rd0, 0 允许（无需设置返回值）。
      st*/stm*（RD）指令中 rdha 字段是数据**源**，rd0 作为源读出 0 合法，不触发 ILLI（见 ADR-0015 D2/D3）。
      适用于 orrr（单目的 rdhb）、orri/rrii/riii/rwii（目的字段 rdha/rbha）。
      ra2rd 的目的字段 rdhb 为 rd0 时同样触发 ILLI 异常（目的不可为 rd0）；
      rd2ra 的目的为 RA 组字段，RA 组无 rd0 约束，不受此约束。

  - id: dst_rd0_nonzero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-06 §函数返回"
    status: active
    description: >
      仅 ret 适用：ret rdHA, imms18 中 rdha == rd0 且 imms18 != 0 时触发 ILLI 异常。
      ret 允许目的为 rd0（无需设置返回值），但此时 imms18 MUST 为 0；
      rdha != rd0 时无此约束（imms18 可为任意 18 位有符号立即数）。
      汇编期须硬报错（LLVM，Error 级，汇编失败、非零退出码）；
      运行期执行该非法编码触发 ILLI（测试机退出码 0x88，QEMU）。

  - id: dst_dual_same
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-04 §加减操作"
    status: active
    description: >
      add.uo/add.so/sub.uo/sub.so/mul.uo/mul.so 的 rrrr 格式有两个目的寄存器（rdha, rdhb），
      不能同时为 rd0，也不能为同一非 rd0 寄存器。

  - id: dst_rb0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-00 §基址寄存器"
    status: active
    description: >
      rb0 读出为当前指令的地址（只读），任何指令以 rb0 为**显式目的**时触发 ILLI 异常。
      rrii/riii/rwii/rrri 目的字段为 rbha（含 ldm.o-rb 的 rbha）；
      orrr/orri 目的字段为 rbhb（含块赋值 rb2rb/rd2rb 的目的 rbhb）。
      rb0 作**源**（含 st.o-rb/stm.o-rb 的 rbha、ld.*-rb/st.*-rb 的基址 rbhb）不触发 ILLI（见 ADR-0015 D1/D3/D4）。

  - id: dst_rf0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-00 §浮点寄存器"
    status: deferred
    description: >
      浮点运算指令的**目的**操作数为 rf0 时触发 ILLI 异常
      （rf0 为控制和状态寄存器 FCSR，不可作为浮点运算的目的操作数）。
      rf0 作**源**操作数合法（含 ftsgnj/fosgnj + rfHD=rf0 的 abs() 特例）。
      适用范围：SimRISC-07 浮点运算指令（家族 44 条；其中带 rf 目的字段者 30 条，加 cs.* 5 条 = 35 条触发 ILLI）。
      只读类 14 条（ftcls/focls/ft2it 等/fo2it 等/ftqcmp 等）无 rf 目的字段，不涉及。
      不在禁止清单（rf0 作目的合法）：rd2rf（含 {rf0:rf0+immu6-1}）、
      ld.o/ldm.o、ld.t/ldm.t、set.w。
      例外（合法）：rf2rd 的 rf0 作**源**、cs.*-rf 的 rf0 作**源**、st.*/stm.* 的 rf0 作**源**，
      均读出完整 64 位，不触发 ILLI。
      浮点类指令（RF）整体属 M1 范围外；M1 仅保留 rf0 的寄存器模型/复位值。

  # ── 多寄存器范围规则 ─────────────────────────────────────────────────────────
  - id: mreg_zero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §存取RD寄存器"
    status: active
    description: >
      RD/RB 多寄存器与块赋值指令 immu6=0 时触发 ILLI 异常：
      ldm.*/stm.*（RD、RB）、rd2rd/rb2rd/rd2rb/rb2rb。
      不适用于移位/扩展指令的立即数（orri）形式——其 immu6=0 是合法的移位量/起始位。
      RA 多寄存器存取与 RA↔RD 块赋值指令 immu6=0 同样触发 ILLI 异常：
      ldm.o-ra/stm.o-ra（多寄存器存取，immu6 指定寄存器个数）与
      ra2rd/rd2ra（RA↔RD 块赋值，immu6 在 hd[5:0]，有效范围 1–63）。

  - id: mreg_range_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §存取RD寄存器"
    status: active
    description: >
      RD/RB 多寄存器与块赋值指令中起始寄存器 + immu6 > 64 时触发 ILLI 异常，
      不环绕、不截断。起始寄存器为 rrri 形式的 rdha/rbha，或块赋值形式的
      目的 rdhb/rbhb 与源 rdhc/rbhc。
      RA 多寄存器/块赋值指令中起始寄存器 + immu6 > 64 时同样触发 ILLI 异常（超出 ra63）：
      ldm.o-ra/stm.o-ra 检查 raha + immu6 ≤ 64；
      ra2rd 检查目的 rdhb + immu6 ≤ 64 与源 rahc + immu6 ≤ 64；
      rd2ra 检查目的 rahb + immu6 ≤ 64 与源 rdhc + immu6 ≤ 64。

  - id: mreg_range_overlap
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-02 §寄存器组之间块赋值"
    status: active
    description: >
      同寄存器组块赋值指令中，源范围与目的范围有任何交集时触发 ILLI 异常。
      仅适用于 rd2rd（rdhb↔rdhc）与 rb2rb（rbhb↔rbhc）。
      跨组指令（ra2rd/rd2ra/rd2rb/rb2rd/rd2rf/rf2rd）不适用——结构性不可能重叠。

  # ── 异常规则 ──────────────────────────────────────────────────────────────────
  - id: excp_malign
    fault: MALIGN
    kind: dynamic
    spec_cite: "SimRISC-01 §存取RD寄存器"
    status: active
    description: >
      数据访问未对齐触发 MALIGN 异常（动态，取决于运行时有效地址）。
      ld.o/st.o 与 ld.o-rb/st.o-rb、ld.o-ra/st.o-ra 需 8 字节对齐；
      ld.st/st.t/ld.ut 需 4 字节对齐；ld.sw/st.w/ld.uw 需 2 字节对齐；
      ld.sb/st.b/ld.ub 无对齐要求。
      多寄存器指令同样适用：ldm.o/stm.o（RD/RB/RA）8 字节，ldm.st/stm.t/ldm.ut 4 字节，
      ldm.sw/stm.w/ldm.uw 2 字节，ldm.sb/stm.b/ldm.ub 无。

  - id: excp_ialign
    fault: IALIGN
    kind: dynamic
    spec_cite: "SimRISC-00 §指令设计"
    status: active
    description: >
      取指时若 PC[1:0] ≠ 00，触发 IALIGN 异常（动态，取决于控制流目标地址）。
      所有指令必须 4 字节对齐。

  # ── 编码合法性规则 ────────────────────────────────────────────────────────────
  - id: encode_sbz
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-00 §指令域说明"
    status: active
    description: >
      SBZ（Should Be Zero）字段非零时触发 ILLI 异常（静态）。
      ADR-0004 D5.3 冻结「SBZ 非零 → ILLI」（架构自定义；spec 未规定 fault 类型）。
      固定为 0 的位域非零均属此规则，包括但不限于：
      fence 的 immu18_hi/immu18_mid/immu18_lo bits[17:4]；
      移位量超过位宽限制（shl.ub/shr.sb/shr.ub: shamt > 7；shl.uw/shr.sw/shr.uw: shamt > 15；
      shl.ut/shr.st/shr.ut: shamt > 31）；
      扩展起始位超过位宽限制（ext.uo/ext.so: hd > 63；SPEC-069t: ext.ub/ext.sb、
      ext.uw/ext.sw、ext.ut/ext.st 已删除）；
      lr 指令的 hb（rdhb）固定为 rd0，手工编码时 hb ≠ 0（LR-SC 原子指令属 M1 范围外，
      M1 不提取其语义）。

  - id: excp_undi
    fault: UNDI
    kind: static
    spec_cite: "SimRISC-00 §SimRISC QFC"
    status: active
    description: >
      执行保留编码触发 UNDI 异常：QFC 主表与各 MISC 子表的空白单元格
      （未分配编码），以及保留的 opx。
      注意：32 位全零指令字是 illi 0，触发 ILLI 而非 UNDI（见 contract-isa.md §2.9）。

  - id: encode_cfx
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-11 §寄存器传输指令"
    status: deferred
    description: >
      cfxha 为 reserved 核芯功能扩展（7–14、19–61）时触发 ILLI 异常。
      特权 cfx 指令属 M1 范围外（contract-isa.md §7.5），M1 不提取其语义。

  - id: encode_fp_root_n
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-07 §S1D1"
    status: deferred
    description: >
      ftroot/foroot 指令仅支持 n=2（平方根）；其他 n 值触发 ILLI 异常。
      浮点类指令（RF）整体属 M1 范围外。

  - id: fp_mreg_zero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-07 §格式转换指令"
    status: deferred
    description: >
      FP immu6 连续个数形式的指令中 immu6=0 时触发 ILLI 异常：
      convert_ff（ft2ft/ft2fo/fo2ft/fo2fo）、
      convert_f2i（ft2it/ft2io/ft2ut/ft2uo/fo2it/fo2io/fo2ut/fo2uo）、
      convert_i2f（it2ft/io2ft/ut2ft/uo2ft/it2fo/io2fo/ut2fo/uo2fo）、
      classify（ftcls/focls）、RF 多寄存器存取（ldm.t/stm.t/ldm.o/stm.o）、
      RF↔RD 块赋值（rd2rf/rf2rd），共 28 条。
      不适用于 root 的 immu6（其含义为 n，见 encode_fp_root_n），
      也不适用于单寄存器存取（ld.t/st.t/ld.o/st.o）与 set.w。
      浮点类指令（RF）整体属 scope: fp（未实现）；规则在 FP 未实现期置 deferred。

  - id: fp_mreg_range_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-07 §格式转换指令"
    status: deferred
    description: >
      FP immu6 连续个数形式的指令中任一起始寄存器 + immu6 > 64 时触发 ILLI 异常，
      不环绕、不截断。适用范围同 fp_mreg_zero（28 条）：convert_ff/convert_f2i/
      convert_i2f 的 rfHB 或 rdHB 起始、classify 的 rdHB 起始、ldm.*/stm.* 的 rfHA 起始、
      rd2rf 的 rfHB 与 rdHC 起始、rf2rd 的 rdHB 与 rfHC 起始。
      不适用于 root 的 immu6（其含义为 n，且仅 n=2）、单寄存器存取与 set.w。
      浮点类指令（RF）整体属 scope: fp（未实现）；规则在 FP 未实现期置 deferred。

  # ── RAS 规则 ─────────────────────────────────────────────────────────────────
  - id: excp_rasof
    fault: RASOF
    kind: dynamic
    spec_cite: "SimRISC-00 §压栈流程"
    status: active
    description: >
      返回地址栈上溢触发 RASOF 异常（动态，取决于调用深度）。
      RegRAS 满且 MemRAS 不可用，或 MemRAS 引用计数溢出时触发。
      RASOF 为精确异常：RA 寄存器保持异常前状态，PC 指向 call 指令。

  - id: excp_rasuf
    fault: RASUF
    kind: dynamic
    spec_cite: "SimRISC-00 §弹栈流程"
    status: active
    description: >
      返回地址栈下溢触发 RASUF 异常（动态，取决于调用深度）。
      RegRAS 空且 MemRAS 不可用，或 MemRAS 引用计数下溢/内容无效时触发。
      RASUF 为精确异常：RA 寄存器保持异常前状态，PC 指向 ret 指令。
