# DADAO SimRISC ABI — 机器可读事实（M1 最小 ABI + M3 标量调用约定）
#
# 来源：
#   spec/DADAO-21-ABI-应用程序二进制接口.md  (0.9.2)
#   spec/DADAO-11-AEE-应用程序运行环境.md    (0.9.2)
# 归一化合约：.tao/knowledge/contract-abi.md (0.9.2)
# M3 决策：.tao/adr/adr-0018-m3-codegen-choices.md (ADR-0018, Accepted)
#
# 范围：
#   - M1 最小 ABI 事实 —— 寄存器角色 + SP + 栈方向/对齐 + call/ret 与 RegRAS。
#   - M3 标量调用约定（非变参 / 非聚合）—— 见 scalar_calling_convention：
#     参数寄存器 / 标量提升 / 栈溢出区 / 返回值 / callee-saved（CSR） /
#     栈帧布局 / prologue-epilogue / call Defs+RegMask。
#   - 高级 ABI（varargs / HFA / HPA / 聚合传参 / sret）与 i128 / RF / 动态链接-TLS
#     → M4，见 deferred_to_m4；未消解的 [OPEN] 见 open_items。

format: dadao-abi
version: "0.9.2"
source:
  - spec/DADAO-21-ABI-应用程序二进制接口.md
  - spec/DADAO-11-AEE-应用程序运行环境.md
contract: .tao/knowledge/contract-abi.md

# ── DataLayout（M1 基础事实）────────────────────────────────────────────────
data_layout:
  endianness: big
  pointer_size: 8          # 指针 = unsigned octa（8 字节）
  octa_size: 8
  llvm_datalayout: "E-m:e-p:64:64-i64:64-i128:128-n8:16:32:64-S128"   # C9（LLVM-033t 落地）
  stack_natural_alignment_bits: 128   # S128；与 call 时 SP 8B 对齐不矛盾（16B ⊃ 8B），不做 8/16 裁定
  spec_cite: "DADAO-21 §数据表示"

# ── 栈（M1 事实）─────────────────────────────────────────────────────────────
stack:
  stack_pointer: rb1
  stack_pointer_abi_name: rbsp
  frame_pointer: rb2
  frame_pointer_abi_name: rbfp
  frame_pointer_optional: true
  growth_direction: downward
  stack_alignment: 8       # call 执行时 SP 必须 8 字节对齐
  spec_cite: "DADAO-21 §函数调用规范 §The Stack Frame; §传参 §栈溢出规则"

# ── call/ret 与 RegRAS（M1 事实）─────────────────────────────────────────────
call_ret:
  ras_top: ra63
  push_on_call: true
  pop_on_ret: true
  overflow_exception: RASOF
  underflow_exception: RASUF
  detail_contract: ".tao/knowledge/contract-isa.md §5.4-§5.6"
  spec_cite: "SimRISC-06 §函数调用; SimRISC-06 §函数返回"

# ── 寄存器角色（M1 事实）─────────────────────────────────────────────────────
# 每条：range=[lo,hi]；abi_name 为区间时写作 [首,末]；callee_saved 为
# true/false/null/immutable（null = spec 栏为 '-'，未分类）。
registers:
  rd:
    - {range: [0, 0],   abi_name: rdzero, role: zero,            callee_saved: immutable}
    - {range: [1, 1],   abi_name: rderrno, role: error_number,   callee_saved: null}
    - {range: [2, 7],                      role: reserved,       callee_saved: null}
    - {range: [8, 15],  abi_name: [rdt0, rdt7],  role: temporary, callee_saved: false}
    - {range: [16, 31], abi_name: [rda0, rda15], role: temporary, callee_saved: false}
    - {range: [32, 63],                    role: callee_saved,   callee_saved: true}
  rb:
    - {range: [0, 0],   abi_name: rbip,   role: current_instruction_address, callee_saved: null}
    - {range: [1, 1],   abi_name: rbsp,   role: stack_pointer,       callee_saved: true}
    - {range: [2, 2],   abi_name: rbfp,   role: frame_pointer,       callee_saved: true}
    - {range: [3, 3],   abi_name: rbgp,   role: global_pointer,      callee_saved: null}
    - {range: [4, 4],   abi_name: rbtp,   role: thread_pointer,      callee_saved: null}
    - {range: [5, 7],                     role: reserved,            callee_saved: null}
    - {range: [8, 15],  abi_name: [rbt0, rbt7],  role: temporary,    callee_saved: false}
    - {range: [16, 31], abi_name: [rba0, rba15], role: temporary,    callee_saved: false}
    - {range: [32, 63],                   role: callee_saved,        callee_saved: true}
  rf:
    - {range: [0, 0],   role: fp_status,  callee_saved: null}    # rf0 = FCSR
    - {range: [1, 7],   role: temporary,  callee_saved: false}
    - {range: [8, 15],  abi_name: [rft0, rft7],  role: temporary, callee_saved: false}
    - {range: [16, 31], abi_name: [rfa0, rfa15], role: temporary, callee_saved: false}
    - {range: [32, 63], role: callee_saved,      callee_saved: true}
  ra:
    - {range: [0, 0],   role: ras_control,       callee_saved: null}
    - {range: [1, 62],  role: return_address_slot, callee_saved: null}
    - {range: [63, 63], abi_name: rasp, role: regras_top, callee_saved: null}

# ── M1 可分配 / 不可分配集合（保守策略）─────────────────────────────────────
allocatable:
  rd: [[8, 15], [16, 31], [32, 63]]
  rb: [[8, 15], [16, 31], [32, 63]]
  rf: []

non_allocatable:
  - {reg: rd0,        reason: hardwired_zero}
  - {reg: rd1,        reason: "reserved (C6; spec callee-saved '-')"}
  - {reg: "rd2-rd7",  reason: reserved}
  - {reg: rb0,        reason: pc}
  - {reg: rb1,        reason: stack_pointer}
  - {reg: rb2,        reason: frame_pointer}
  - {reg: rb3,        reason: "reserved (C6; spec callee-saved '-')"}
  - {reg: rb4,        reason: "reserved (C6; spec callee-saved '-')"}
  - {reg: "rb5-rb7",  reason: reserved}
  - {reg: "ra0-ra63", reason: managed_by_call_ret}
  - {reg: "rf0-rf63", reason: excluded_from_m3}

# ── 分类索引（便于消费者直接读取的派生视图）────────────────────────────────
# 语义：`callee_saved` 给出「各 bank 的通用 callee-saved 块（32–63）」。
# 对 rd/rb，该块即编译器可分配的 callee-saved 区间（与上方 `allocatable` 的 [32, 63] 一致）；
# **RF 整体 `Excluded from M3`（`allocatable.rf` 为空）**，其 32–63 仅作 spec 事实登记，M3 不可分配。
# 它**不含** SP(rb1)/FP(rb2) 等由帧管理专用的 callee-saved 寄存器
# （这些见 `non_allocatable`）；逐寄存器的权威分类以上方 `registers` 表为准
# （rb1/rb2 在表中标 `callee_saved: true`）。
callee_saved:
  rd: [32, 63]
  rb: [32, 63]   # 通用块；SP=rb1 / FP=rb2 见 registers 表（callee_saved: true）
  rf: [32, 63]
# reserved 区间（M3 口径 C6）：rd1–rd7 / rb3–rb7。rb1=SP、rb2=FP 另见 non_allocatable。
reserved_registers:
  rd: [1, 7]
  rb: [3, 7]

# ── M3 标量调用约定（非变参 / 非聚合；SPEC-097t 提取）──────────────────────
# 权威正文见 .tao/knowledge/contract-abi.md §4；决策依据 ADR-0018（C1/C4/C5/C6/C7/C9/C16）。
scalar_calling_convention:
  milestone: M3
  scope: non_variadic_scalar

  parameter_registers:
    rd: [16, 31]        # 数据参数
    rb: [16, 31]        # 地址（指针）参数
    rf: [16, 31]        # 浮点参数（M3 Excluded → M4）
    independent_counting: true
    start: 16
    shared_slots: false
    example: "read(int fd, void *buf, size_t count) -> fd=rd16, buf=rb16, count=rd17"

  scalar_argument_promotion:
    narrow_below: 8       # <8B 提升到 8B
    preserve_sign: true
    pointer_uses: rb
    extended_by: caller   # C4 D2

  stack_overflow_area:
    organization: global_declaration_order   # C4 D1：单栈区、按全局声明序
    slot_size: 8
    base: "incoming_sp + 0"
    narrow_extended_by: caller
    note: "spec §栈溢出规则 同句两读；M3 取全局声明序（用户判定 C4）"

  return_values:
    integer: rd31
    pointer: rb31
    floating_point: rf31        # M3 Excluded → M4
    pointer_direct_rb31: true   # C5 D1
    narrow_extension: callee_canonical   # C5 D2；caller 不截断

  callee_saved:                 # CSR（C6）
    csr_rd: [32, 63]
    csr_rb: [32, 63]
    sp_in_csr: false            # SP(rb1) ∉ CSR
    fp_in_csr: false            # FP(rb2) 由 prologue/epilogue 管理
    caller_saved_rd: [8, 31]
    caller_saved_rb: [8, 31]
    reserved_rd: [1, 7]
    reserved_rb: [3, 7]
    special: [rd0, rb0]

  stack_frame:
    stack_pointer: rb1
    frame_pointer: rb2
    growth_direction: downward
    frame_pointer_strategy: conditional   # C7：hasFPImpl 条件式，默认 SP-only
    has_fp_impl: "DisableFramePointerElim || hasVarSizedObjects || isFrameAddressTaken || hasStackRealignment"
    get_frame_register: "hasFP ? rb2 : rb1"
    frame_pointer_always_reserved: true
    param_overflow_base: "rbfp + 8"       # 溢出参数 0；SP-only 等价 incoming_sp + 0

  prologue_epilogue:
    variants: [sp_only, fp]
    sp_only_default: true
    symmetric_release: true
    call_sp_alignment: 8
    ra_managed_by: call_ret
    sequence_owner: [LLVM-038t, LLVM-039t]

  call_defs_regmask:            # C16
    call_defs: [rd31, rb31]
    call_preserved_mask_includes_rb_callee_saved: true
    ret_defs: []

  spec_cite: "DADAO-21 §传参 §参数寄存器 / §传参 §标量参数 / §传参 §栈溢出规则 / §返回值 §标量类型返回值 / §寄存器规范 / §函数调用规范 §The Stack Frame"
  adr_cite: "ADR-0018 (C1,C4,C5,C6,C7,C9,C16)"

# ── [OPEN]（M3 未消解；→ M4）────────────────────────────────────────────────
open_items:
  - id: multiple_return_order
    desc: "spec 多返回值声明顺序规则与示例内部冲突；M3 Excluded → M4"
    spec_cite: "DADAO-21 §返回值 §多返回值"
  - id: red_zone
    desc: "v5 spec 未提及 128B red zone；M3 不采用 → M4 确认"
    spec_cite: null
  - id: i128_convention
    desc: "spec 未规定 i128 传参/返回约定；M3 不做 i128 → M4 再议"
    spec_cite: "DADAO-21 §返回值 §标量类型返回值"

# ── Deferred to M4：M3 范围外的高级 ABI ─────────────────────────────────────
deferred_to_m4:
  items:
    - varargs
    - hfa
    - hpa
    - aggregate_arguments
    - aggregate_return_sret
    - multiple_return_values
    - i128
    - floating_point_rf
    - dynamic_linking_tls
    - system_call_convention
  spec_cite: "DADAO-21 §传参 §聚合类型参数 / §可变参数 / §返回值 §聚合类型返回值 / §返回值 §多返回值 / §系统调用规范"
